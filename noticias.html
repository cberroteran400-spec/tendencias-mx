<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noticias | TendenciasMX</title>

<meta name="description" content="Noticias de actualidad de México y el mundo en TendenciasMX.">
<meta name="keywords" content="noticias, actualidad, México, mundo, TendenciasMX">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:16px 20px;
}

.logo{
    font-size:28px;
    font-weight:800;
    color:white;
    text-decoration:none;
    display:inline-block;
    margin-bottom:14px;
}

.logo span{
    color:#22c55e;
}

nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    color:#d1d5db;
    text-decoration:none;
    padding:9px 13px;
    border-radius:8px;
    white-space:nowrap;
    font-size:14px;
    transition:.2s;
}

nav a:hover,
nav a.active{
    background:#22c55e;
    color:#052e16;
    font-weight:700;
}

main{
    max-width:1100px;
    margin:auto;
    padding:30px 20px 50px;
}

.hero{
    background:linear-gradient(135deg,#111827,#1f2937);
    color:white;
    border-radius:18px;
    padding:30px 25px;
    margin-bottom:25px;
}

.hero h1{
    font-size:34px;
    margin-bottom:10px;
}

.hero p{
    color:#d1d5db;
    line-height:1.6;
}

.search-box{
    margin:25px 0;
}

.search-box input{
    width:100%;
    padding:15px 17px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
    outline:none;
}

.search-box input:focus{
    border-color:#22c55e;
    box-shadow:0 0 0 3px rgba(34,197,94,.12);
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.card-link{
    text-decoration:none;
    color:inherit;
    display:block;
}

.card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
    transition:.2s;
    height:100%;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.news-image{
    width:100%;
    height:190px;
    background:#e5e7eb;
    overflow:hidden;
}

.news-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:18px;
}

.category{
    display:inline-block;
    background:#dcfce7;
    color:#166534;
    padding:5px 9px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    margin-bottom:10px;
}

.card h2{
    font-size:19px;
    line-height:1.35;
    margin-bottom:9px;
}

.date{
    color:#6b7280;
    font-size:13px;
    margin-bottom:10px;
}

.description{
    color:#4b5563;
    line-height:1.5;
    font-size:14px;
    margin-bottom:13px;
}

.read{
    color:#16a34a;
    font-size:14px;
    font-weight:700;
}

.empty{
    grid-column:1/-1;
    background:white;
    border-radius:15px;
    padding:35px;
    text-align:center;
    color:#6b7280;
}

footer{
    background:#111827;
    color:#9ca3af;
    text-align:center;
    padding:25px 20px;
    margin-top:20px;
}

footer strong{
    color:#22c55e;
}

@media(max-width:900px){
    .news-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .header-inner{
        padding:14px 12px;
    }

    .logo{
        font-size:25px;
    }

    nav a{
        font-size:13px;
        padding:8px 10px;
    }

    main{
        padding:20px 14px 40px;
    }

    .hero{
        padding:25px 20px;
    }

    .hero h1{
        font-size:28px;
    }

    .news-grid{
        grid-template-columns:1fr;
    }

    .news-image{
        height:210px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <a href="./index.html" class="logo">
            Tendencias<span>MX</span>
        </a>

        <nav>
            <a href="./index.html">Inicio</a>
            <a href="./noticias.html" class="active">Noticias</a>
            <a href="./deportes.html">Deportes</a>
            <a href="./entretenimiento.html">Entretenimiento</a>
            <a href="./tecnologia.html">Tecnología</a>
            <a href="./dinero.html">Dinero</a>
            <a href="./politica.html">Política</a>
            <a href="./tramites.html">Trámites</a>
            <a href="./contacto.html">Contacto</a>
            <a href="./preguntas.html">Preguntas</a>
        </nav>

    </div>
</header>

<main>

    <section class="hero">
        <h1>Noticias</h1>

        <p>
            Las noticias y temas de actualidad más relevantes de México
            y el mundo en TendenciasMX.
        </p>
    </section>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Buscar noticias..."
        >
    </div>

    <section class="news-grid" id="newsGrid"></section>

</main>

<footer>
    <p>
        © 2026 <strong>TendenciasMX</strong> · Información y actualidad
    </p>
</footer>

<script>

const grid = document.getElementById("newsGrid");
const search = document.getElementById("search");

async function cargarNoticias(){

    try{

        const respuesta = await fetch("./noticias.json");

        if(!respuesta.ok){
            throw new Error("No se pudo cargar noticias.json");
        }

        const noticias = await respuesta.json();

        mostrarNoticias(noticias);

        search.addEventListener("input", () => {

            const texto = search.value
                .toLowerCase()
                .trim();

            const filtradas = noticias.filter(noticia => {

                const contenido = `
                    ${noticia.titulo || ""}
                    ${noticia.descripcion || ""}
                    ${noticia.categoria || ""}
                `.toLowerCase();

                return contenido.includes(texto);
            });

            mostrarNoticias(filtradas);

        });

    }catch(error){

        grid.innerHTML = `
            <div class="empty">
                <h2>No se pudieron cargar las noticias</h2>
                <p>
                    Intenta actualizar la página nuevamente.
                </p>
            </div>
        `;

        console.error(error);
    }
}

function mostrarNoticias(noticias){

    if(!noticias || noticias.length === 0){

        grid.innerHTML = `
            <div class="empty">
                <h2>No encontramos noticias</h2>
                <p>
                    Prueba con otra palabra.
                </p>
            </div>
        `;

        return;
    }

    grid.innerHTML = noticias.map(noticia => {

        const titulo =
            noticia.titulo ||
            noticia.title ||
            "Noticia";

        const descripcion =
            noticia.descripcion ||
            noticia.description ||
            "";

        const imagen =
            noticia.imagen ||
            noticia.image ||
            "https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1000&q=80";

        const url =
            noticia.url ||
            noticia.link ||
            "#";

        const categoria =
            noticia.categoria ||
            noticia.category ||
            "Noticias";

        const fecha =
            noticia.fecha ||
            noticia.date ||
            "Actualidad";

        return `

            <a
                class="card-link"
                href="${url}"
                target="_blank"
                rel="noopener noreferrer"
            >

                <article class="card">

                    <div class="news-image">

                        <img
                            src="${imagen}"
                            alt="${titulo}"
                            loading="lazy"
                            onerror="this.style.display='none'"
                        >

                    </div>

                    <div class="card-content">

                        <span class="category">
                            ${categoria}
                        </span>

                        <h2>
                            ${titulo}
                        </h2>

                        <div class="date">
                            ${fecha}
                        </div>

                        <p class="description">
                            ${descripcion}
                        </p>

                        <div class="read">
                            Leer noticia completa →
                        </div>

                    </div>

                </article>

            </a>

        `;

    }).join("");
}

cargarNoticias();

</script>

</body>
</html>
