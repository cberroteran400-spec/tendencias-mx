/* ================================
   LIMPIAR TEXTO
================================ */

function limpiarTexto(texto){

    if(texto === null || texto === undefined){
        return "";
    }

    return String(texto)
        .replace(/<[^>]*>/g,"")
        .replace(/&nbsp;/gi," ")
        .replace(/&amp;/gi,"&")
        .replace(/&quot;/gi,'"')
        .replace(/&#39;/gi,"'")
        .replace(/&lt;/gi,"<")
        .replace(/&gt;/gi,">")
        .trim();
}


/* ================================
   ESCAPAR HTML
================================ */

function escaparHTML(texto){

    return String(texto || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ================================
   OBTENER VALOR
================================ */

function obtenerValor(obj, claves){

    for(const clave of claves){

        if(
            obj &&
            obj[clave] !== undefined &&
            obj[clave] !== null &&
            String(obj[clave]).trim() !== ""
        ){
            return obj[clave];
        }
    }

    return "";
}


/* ================================
   OBTENER IMAGEN
================================ */

function obtenerImagen(noticia){

    const posibles = [

        noticia.imagen,
        noticia.image,
        noticia.imagen_url,
        noticia.image_url,
        noticia.thumbnail,
        noticia.miniatura,
        noticia.foto,
        noticia.fotografia,
        noticia.urlImagen,
        noticia.url_imagen,

        noticia.media,
        noticia.media_url,
        noticia.mediaContent,
        noticia.media_content,

        noticia.enclosure,
        noticia.og_image

    ];

    for(let imagen of posibles){

        if(!imagen) continue;

        /* Si viene como objeto */
        if(typeof imagen === "object"){

            imagen =
                imagen.url ||
                imagen.href ||
                imagen.src ||
                imagen["@url"] ||
                "";

        }

        if(typeof imagen !== "string") continue;

        imagen = imagen.trim();

        if(!imagen) continue;

        /* Si viene dentro de HTML */
        const match = imagen.match(/<img[^>]+src=["']([^"']+)["']/i);

        if(match){
            return match[1];
        }

        /* Si parece una URL */
        if(
            imagen.startsWith("http://") ||
            imagen.startsWith("https://") ||
            imagen.startsWith("//")
        ){

            if(imagen.startsWith("//")){
                imagen = "https:" + imagen;
            }

            return imagen;
        }
    }

    return "";
}

/* ================================
   FECHA
================================ */

function formatearFecha(fecha){

    if(!fecha){
        return "";
    }

    try{

        const fechaObj = new Date(fecha);

        if(isNaN(fechaObj.getTime())){
            return limpiarTexto(fecha);
        }

        return fechaObj.toLocaleString("es-MX",{
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        });

    }catch(e){

        return limpiarTexto(fecha);

    }
}


/* ================================
   CARGAR NOTICIAS
================================ */

async function cargarNoticias(){

    const grid = document.getElementById("newsGrid");
    const estado = document.getElementById("estado");

    try{

        estado.textContent = "Actualizando noticias...";

        const respuesta = await fetch(
            "./noticias.json?v=" + Date.now(),
            {
                cache:"no-store"
            }
        );

        if(!respuesta.ok){
            throw new Error("No se pudo cargar noticias.json");
        }

        const datos = await respuesta.json();

        let noticias = [];

        if(Array.isArray(datos)){
            noticias = datos;
        }
        else if(Array.isArray(datos.noticias)){
            noticias = datos.noticias;
        }
        else if(Array.isArray(datos.news)){
            noticias = datos.news;
        }
        else if(Array.isArray(datos.items)){
            noticias = datos.items;
        }
        else if(Array.isArray(datos.results)){
            noticias = datos.results;
        }


        todasLasNoticias = noticias.map(noticia => {

            const titulo = limpiarTexto(
                obtenerValor(noticia,[
                    "titulo",
                    "title",
                    "nombre"
                ])
            );

            const descripcion = limpiarTexto(
                obtenerValor(noticia,[
                    "descripcion",
                    "description",
                    "resumen",
                    "summary"
                ])
            );

            const enlace = obtenerValor(
                noticia,
                [
                    "enlace",
                    "link",
                    "url",
                    "href"
                ]
            );

            const fuente = limpiarTexto(
                obtenerValor(
                    noticia,
                    [
                        "fuente",
                        "source",
                        "autor",
                        "medio",
                        "publisher"
                    ]
                )
            );

            const fecha = obtenerValor(
                noticia,
                [
                    "fecha",
                    "date",
                    "pubDate",
                    "published",
                    "publicado"
                ]
            );

            const categoria = obtenerCategoria(noticia);

            const imagen = obtenerImagen(noticia);

            return {
                titulo:titulo || "Noticia",
                descripcion:descripcion || "Consulta la noticia completa para conocer todos los detalles.",
                enlace:enlace || "#",
                fuente:fuente || "Tendencias MX",
                fecha:fecha,
                categoria:categoria,
                imagen:imagen
            };

        }).filter(noticia => noticia.titulo);


        /* Ordenar: noticias más nuevas primero */

        todasLasNoticias.sort((a,b)=>{

            const fechaA = new Date(a.fecha).getTime();
            const fechaB = new Date(b.fecha).getTime();

            if(isNaN(fechaA) && isNaN(fechaB)){
                return 0;
            }

            if(isNaN(fechaA)){
                return 1;
            }

            if(isNaN(fechaB)){
                return -1;
            }

            return fechaB - fechaA;
        });


        estado.textContent =
            todasLasNoticias.length +
            " noticias disponibles · Actualización automática";


        mostrarNoticias();

    }catch(error){

        console.error(error);

        estado.textContent = "No se pudieron cargar las noticias.";

        grid.innerHTML = `
            <div class="empty">
                <h2>No se pudieron cargar las noticias</h2>
                <p>
                    Revisa que <strong>noticias.json</strong>
                    esté en la raíz del repositorio.
                </p>
            </div>
        `;
    }
}

    const busqueda =
        document
        .getElementById("buscador")
        .value
        .trim()
        .toLowerCase();


    let noticiasFiltradas = todasLasNoticias.filter(noticia => {

        const coincideCategoria =
            categoriaActual === "todas" ||
            noticia.categoria === categoriaActual;

        const textoBusqueda =
            (
                noticia.titulo +
                " " +
                noticia.descripcion +
                " " +
                noticia.fuente
            ).toLowerCase();

        const coincideBusqueda =
            !busqueda ||
            textoBusqueda.includes(busqueda);

        return coincideCategoria && coincideBusqueda;

    });


    if(noticiasFiltradas.length === 0){

        grid.innerHTML = `
            <div class="empty">
                <h2>No hay noticias en esta categoría</h2>
                <p>
                    Prueba con otra categoría o realiza otra búsqueda.
                </p>
            </div>
        `;

        return;
    }


    grid.innerHTML = noticiasFiltradas.map(noticia => {

        const imagen = noticia.imagen;

        let imagenHTML = "";

        if(imagen){

            imagenHTML = `
                <img
                    src="${escaparHTML(imagen)}"
                    alt="${escaparHTML(noticia.titulo)}"
                    loading="lazy"
                    onerror="this.parentElement.innerHTML='<div class=&quot;news-image-fallback&quot;>${obtenerIcono(noticia.categoria)}</div>'"
                >
            `;

        }else{

            imagenHTML = `
                <div class="news-image-fallback">
                    ${obtenerIcono(noticia.categoria)}
                </div>
            `;

        }


        const enlaceSeguro =
            noticia.enlace &&
            noticia.enlace !== "#"
                ? escaparHTML(noticia.enlace)
                : "#";


        return `
            <article class="news-card">

                <div class="news-image">
                    ${imagenHTML}
                </div>

                <div class="news-content">

                    <div class="news-category">
                        ${obtenerIcono(noticia.categoria)}
                        ${nombreCategoria(noticia.categoria)}
                    </div>

                    <h2 class="news-title">
                        ${escaparHTML(noticia.titulo)}
                    </h2>

                    <p class="news-description">
                        ${escaparHTML(noticia.descripcion)}
                    </p>

                    <div class="news-meta">
                        ${escaparHTML(noticia.fuente)}
                        ${noticia.fecha ? " · " + escaparHTML(formatearFecha(noticia.fecha)) : ""}
                    </div>

                    ${
                        enlaceSeguro !== "#"
                        ?
                        `
                        <a
                            class="news-link"
                            href="${enlaceSeguro}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Leer noticia →
                        </a>
                        `
                        :
                        ""
                    }

                </div>

            </article>
        `;

    }).join("");
}


/* ================================
   BUSCAR
================================ */

function buscarNoticias(){
    mostrarNoticias();
}


/* ================================
   FILTROS
================================ */

document.querySelectorAll(".category-btn").forEach(btn => {

    btn.addEventListener("click",function(){

        document
            .querySelectorAll(".category-btn")
            .forEach(b => b.classList.remove("active"));

        this.classList.add("active");

        categoriaActual =
            this.dataset.category;

        mostrarNoticias();

    });

});


/* ================================
   BUSCAR MIENTRAS ESCRIBE
================================ */

document
    .getElementById("buscador")
    .addEventListener("input",function(){

        mostrarNoticias();

    });


/* ================================
   INICIAR
================================ */

cargarNoticias();


/* ================================
   ACTUALIZAR SIN RECARGAR
================================ */

setInterval(
    cargarNoticias,
    10 * 60 * 1000
);

</script>

</body>
</html>
