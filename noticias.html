<script>

  /* =========================================================

  const searchButton =
    document.getElementById("searchButton");

  const clearButton =
    document.getElementById("clearButton");

  const resultsText =

  const categoryButtons =
    document.querySelectorAll(".category-btn");


  /* =========================================================

  ========================================================= */

  let allNews = [];

  let currentCategory = "todas";

  /* =========================================================

  ];


  /* =========================================================
     TÉRMINOS POLÍTICOS
  ========================================================= */

  const politicaTerms = [

    "presidente",
    "presidenta",
    "presidencia",

    "gobierno",
    "gobernador",
    "gobernadora",

    "politica",
    "politico",
    "politica",

    "eleccion",
    "elecciones",

    "votacion",
    "votos",

    "congreso",
    "senado",
    "diputados",

    "diputado",
    "diputada",

    "senador",

    "morena",

    "pt",
    "pvem",

    "oposicion",

    "reforma",
    "ley",
    "decreto",

    "secretaria",
    "secretario",

    "candidata",

    "campaña",
    "campana",

    "partido politico",

    "sheinbaum",
    "claudia sheinbaum",

    "trump",
    "donald trump",

    "biden",
    "joe biden",

    "xi jinping",

    "putin",
    "vladimir putin",

    "zelensky",
    "zelenski",

    "macron",
    "emmanuel macron",

    "milei",
    "javier milei",

    "presidente de estados unidos",
    "presidente de mexico"

  ];


  /* =========================================================
     NORMALIZAR TEXTO
  ========================================================= */

  function normalizeText(value) {

    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim();

  }


  /* =========================================================
     ESCAPAR HTML
  ========================================================= */

  function escapeHTML(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================================================
     OBTENER DATOS
  ========================================================= */

  function getTitle(item) {

    return (
      item.titulo ||
      item.title ||
      item.nombre ||
      "Sin título"
    );

  }


  function getDescription(item) {

    return (
      item.descripcion ||
      item.description ||
      item.resumen ||
      item.contenidoCorto ||
      item.contenido ||
      ""
    );

  }


  function getSource(item) {

    return (
      item.fuente ||
      item.source ||
      item.medio ||
      "TendenciaMX"
    );

  }


  function getDate(item) {

    return (
      item.fecha ||
      item.date ||
      item.pubDate ||
      item.publicado ||
      item.published ||
      item.actualizado ||
      ""
    );

  }


  function getImage(item) {

    return (
      item.imagen ||
      item.image ||
      item.imageUrl ||
      item.urlImagen ||
      item.thumbnail ||
      item.url_imagen ||
      ""
    );

  }


  function getLink(item) {

    return (
      item.enlace ||
      item.link ||
      item.url ||
      item.href ||
      "#"
    );

  }


  function getOriginalCategory(item) {

    return (
      item.categoria ||
      item.category ||
      item.seccion ||
      item.section ||
      ""
    );

  }


  /* =========================================================
     TEXTO COMPLETO DE LA NOTICIA
  ========================================================= */

  function getNewsText(item) {

    return normalizeText([

      getTitle(item),
      getDescription(item),
      getSource(item),
      getOriginalCategory(item),

      item.etiquetas || "",
      item.tags || "",
      item.keywords || "",
      item.autor || "",
      item.author || "",

      getLink(item)

    ].join(" "));

  }


  /* =========================================================
     NORMALIZAR CATEGORÍA
     
     IMPORTANTE:
     Política ahora es una categoría independiente.
  ========================================================= */

  function normalizeCategory(value) {

    const c =
      normalizeText(value);


    if (
      c.includes("politica") ||
      c.includes("politico") ||
      c.includes("politica")
    ) {

      return "politica";

    }


    if (
      c.includes("mexico") ||
      c.includes("nacional")
    ) {

      return "mexico";

    }


    if (
      c.includes("mundo") ||
      c.includes("internacional") ||
      c.includes("global")
    ) {

      return "mundo";

    }


    if (
      c.includes("economia") ||
      c.includes("economico") ||
      c.includes("dinero") ||
      c.includes("finanzas") ||
      c.includes("mercados") ||
      c.includes("empresas")
    ) {

      return "economia";

    }


    if (
      c.includes("deporte") ||
      c.includes("deportes") ||
      c.includes("sport")
    ) {

      return "deportes";

    }


    if (
      c.includes("entretenimiento") ||
      c.includes("tendencias") ||
      c.includes("espectaculo") ||
      c.includes("famosos") ||
      c.includes("celebridades")
    ) {

      return "entretenimiento";

    }


    if (
      c.includes("tecnologia") ||
      c.includes("tech") ||
      c.includes("ciencia")
    ) {

      return "tecnologia";

    }


    return c || "otros";

  }


  /* =========================================================
     DETECTAR FÚTBOL
  ========================================================= */

  function isFutbolNews(item) {

    const category =
      normalizeCategory(
        getOriginalCategory(item)
      );

    const text =
      getNewsText(item);


    /*
     * Si el RSS dice que es deportes,
     * analizamos si es fútbol.
     */

    const hasFootballTerm =
      futbolTerms.some(term =>
        text.includes(
          normalizeText(term)
        )
      );


    if (!hasFootballTerm) {

      return false;

    }


    /*
     * Deportes + término futbolístico
     */

    if (
      category === "deportes"
    ) {

      return true;

    }


    /*
     * Categoría fútbol directa
     */

    if (
      category === "futbol"
    ) {

      return true;

    }


    /*
     * Sin categoría clara
     */

    if (
      category === "otros" ||
      !getOriginalCategory(item)
    ) {

      return true;

    }


    /*
     * Términos fuertes de fútbol
     */

    const strongFootballTerms = [

      "liga mx",
      "champions league",
      "premier league",
      "real madrid",
      "barcelona",
      "club america",
      "chivas",
      "cruz azul",
      "pumas",
      "seleccion mexicana",
      "mundial de futbol",
      "mundial de clubes",
      "futbolista",
      "futbolistas"

    ];


    return strongFootballTerms.some(term =>
      text.includes(
        normalizeText(term)
      )
    );

  }


  /* =========================================================
     DETECTAR POLÍTICA
  ========================================================= */

  function isPoliticalNews(item) {

    const category =
      normalizeCategory(
        getOriginalCategory(item)
      );

    const text =
      getNewsText(item);


    if (
      category === "politica"
    ) {

      return true;

    }


    return politicaTerms.some(term =>
      text.includes(
        normalizeText(term)
      )
    );

  }


  /* =========================================================
     CATEGORÍA INTELIGENTE
  ========================================================= */

  function getSmartCategory(item) {

    const original =
      getOriginalCategory(item);

    const normalized =
      normalizeCategory(original);


    /*
     * Si RSS ya trae una categoría válida,
     * la respetamos.
     */

    if (
      [
        "mexico",
        "politica",
        "mundo",
        "economia",
        "deportes",
        "entretenimiento",
        "tecnologia"
      ].includes(normalized)
    ) {

      /*
       * Dentro de deportes,
       * distinguimos fútbol visualmente.
       */

      if (
        normalized === "deportes" &&
        isFutbolNews(item)
      ) {

        return "futbol";

      }


      return normalized;

    }


    /*
     * FÚTBOL
     */

    if (
      isFutbolNews(item)
    ) {

      return "futbol";

    }


    const text =
      getNewsText(item);


    /*
     * POLÍTICA
     */

    if (
      isPoliticalNews(item)
    ) {

      return "politica";

    }


    /*
     * ECONOMÍA
     */

    if (
      text.includes("dolar") ||
      text.includes("inflacion") ||
      text.includes("peso mexicano") ||
      text.includes("banxico") ||
      text.includes("economia") ||
      text.includes("mercado") ||
      text.includes("finanzas")
    ) {

      return "economia";

    }


    /*
     * MUNDO
     */

    if (
      text.includes("trump") ||
      text.includes("putin") ||
      text.includes("xi jinping") ||
      text.includes("guerra") ||
      text.includes("onu") ||
      text.includes("internacional")
    ) {

      return "mundo";

    }


    /*
     * TECNOLOGÍA
     */

    if (
      text.includes("iphone") ||
      text.includes("android") ||
      text.includes("google") ||
      text.includes("apple") ||
      text.includes("ia ") ||
      text.includes("inteligencia artificial") ||
      text.includes("tecnologia")
    ) {

      return "tecnologia";

    }


    /*
     * MÉXICO
     */

    if (
      text.includes("mexico") ||
      text.includes("mexicano") ||
      text.includes("mexicana")
    ) {

      return "mexico";

    }


    return "otros";

  }


  /* =========================================================
     FECHA
  ========================================================= */

  function formatDate(value) {

    if (!value) {

      return "";

    }


    const date =
      new Date(value);


    if (
      Number.isNaN(
        date.getTime()
      )
    ) {

      return String(value);

    }


    return date.toLocaleDateString(
      "es-MX",
      {
        day: "2-digit",
        month: "short",
        year: "numeric"
      }
    );

  }


  /* =========================================================
     BÚSQUEDA INTELIGENTE
     
     AQUÍ ESTÁ EL CAMBIO PRINCIPAL.
     
     Si escribes:
     
     fútbol
     futbol
     
     se comprueba isFutbolNews().
     
     Si escribes:
     
     política
     politica
     
     se comprueba isPoliticalNews().
  ========================================================= */

  function getSearchTerms() {

    return normalizeText(
      currentSearch
    )
      .split(/\s+/)
      .filter(Boolean);

  }


  function termMatchesNews(item, term) {

    const normalizedTerm =
      normalizeText(term);


    const text =
      getNewsText(item);


    /*
     * FÚTBOL
     */

    if (
      normalizedTerm === "futbol" ||
      normalizedTerm === "futbolista" ||
      normalizedTerm === "futbolistas"
    ) {

      return isFutbolNews(item);

    }


    /*
     * POLÍTICA
     */

    if (
      normalizedTerm === "politica" ||
      normalizedTerm === "politico" ||
      normalizedTerm === "presidente" ||
      normalizedTerm === "presidenta"
    ) {

      if (
        normalizedTerm === "politica" ||
        normalizedTerm === "politico"
      ) {

        return isPoliticalNews(item);

      }

      return (
        text.includes(normalizedTerm) ||
        isPoliticalNews(item)
      );

    }


    /*
     * DEPORTES
     */

    if (
      normalizedTerm === "deporte" ||
      normalizedTerm === "deportes"
    ) {

      return (
        normalizeCategory(
          getOriginalCategory(item)
        ) === "deportes" ||
        isFutbolNews(item)
      );

    }


    /*
     * MÉXICO
     */

    if (
      normalizedTerm === "mexico" ||
      normalizedTerm === "mexicano" ||
      normalizedTerm === "mexicana"
    ) {

      return (
        normalizeCategory(
          getOriginalCategory(item)
        ) === "mexico" ||
        text.includes("mexico") ||
        text.includes("mexicano") ||
        text.includes("mexicana")
      );

    }


    /*
     * ECONOMÍA
     */

    if (
      normalizedTerm === "economia" ||
      normalizedTerm === "economico" ||
      normalizedTerm === "dinero"
    ) {

      return (
        normalizeCategory(
          getOriginalCategory(item)
        ) === "economia" ||
        getSmartCategory(item) === "economia" ||
        text.includes(normalizedTerm)
      );

    }


    /*
     * TECNOLOGÍA
     */

    if (
      normalizedTerm === "tecnologia" ||
      normalizedTerm === "tech"
    ) {

      return (
        normalizeCategory(
          getOriginalCategory(item)
        ) === "tecnologia" ||
        getSmartCategory(item) === "tecnologia" ||
        text.includes(normalizedTerm)
      );

    }


    /*
     * ENTRETENIMIENTO
     */

    if (
      normalizedTerm === "entretenimiento"
    ) {

      return (
        normalizeCategory(
          getOriginalCategory(item)
        ) === "entretenimiento" ||
        getSmartCategory(item) === "entretenimiento"
      );

    }


    /*
     * MUNDO
     */

    if (
      normalizedTerm === "mundo" ||
      normalizedTerm === "internacional"
    ) {

      return (
        normalizeCategory(
          getOriginalCategory(item)
        ) === "mundo" ||
        getSmartCategory(item) === "mundo"
      );

    }


    /*
     * BÚSQUEDA NORMAL
     */

    return text.includes(
      normalizedTerm
    );

  }


  function matchesSearch(item) {

    const terms =
      getSearchTerms();


    if (!terms.length) {

      return true;

    }


    /*
     * Todas las palabras deben coincidir.
     */

    return terms.every(term =>
      termMatchesNews(
        item,
        term
      )
    );

  }


  /* =========================================================
     FILTRO POR CATEGORÍA
  ========================================================= */

  function matchesCategory(item) {

    if (
      currentCategory === "todas"
    ) {

      return true;

    }


    if (
      currentCategory === "futbol"
    ) {

      return isFutbolNews(item);

    }


    if (
      currentCategory === "politica"
    ) {

      return isPoliticalNews(item);

    }


    const category =
      normalizeCategory(
        getOriginalCategory(item)
      );


    const smartCategory =
      getSmartCategory(item);


    return (
      category === currentCategory ||
      smartCategory === currentCategory
    );

  }


  /* =========================================================
     FILTRAR NOTICIAS
  ========================================================= */

  function getFilteredNews() {

    return allNews.filter(item => {

      return (
        matchesCategory(item) &&
        matchesSearch(item)
      );

    });

  }


  /* =========================================================
     IMAGEN DE RESPALDO
  ========================================================= */

  function fallbackImage() {

    return (
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="800"
          height="450"
          viewBox="0 0 800 450"
        >

          <rect
            width="800"
            height="450"
            fill="#111a2b"
          />

          <text
            x="400"
            y="225"
            text-anchor="middle"
            dominant-baseline="middle"
            fill="#65ff9a"
            font-size="44"
            font-family="Arial"
            font-weight="bold"
          >
            TendenciaMX
          </text>

        </svg>
      `)
    );

  }


  /* =========================================================
     ETIQUETA DE CATEGORÍA
  ========================================================= */

  function categoryLabel(category) {

    const labels = {

      mexico:
        "🇲🇽 México",

      politica:
        "🏛️ Política",

      mundo:
        "🌎 Mundo",

      economia:
        "💰 Economía",

      deportes:
        "🏆 Deportes",

      futbol:
        "⚽ Fútbol",

      entretenimiento:
        "🎬 Entretenimiento",

      tecnologia:
        "💻 Tecnología",

      otros:
        "📰 Noticias"

    };


    return (
      labels[category] ||
      "📰 Noticias"
    );

  }


  /* =========================================================
     RENDERIZAR
  ========================================================= */

  function renderNews() {

    const filteredNews =
      getFilteredNews();


    /*
     * TEXTO DE RESULTADOS
     */

    if (
      currentCategory === "futbol"
    ) {

      if (currentSearch) {

        resultsText.innerHTML =
          `⚽ Fútbol · <strong>${filteredNews.length}</strong> resultado(s) para "<strong>${escapeHTML(currentSearch)}</strong>"`;

      } else {

        resultsText.innerHTML =
          `⚽ Fútbol · <strong>${filteredNews.length}</strong> noticia(s)`;

      }

    }

    else if (
      currentCategory === "politica"
    ) {

      if (currentSearch) {

        resultsText.innerHTML =
          `🏛️ Política · <strong>${filteredNews.length}</strong> resultado(s) para "<strong>${escapeHTML(currentSearch)}</strong>"`;

      } else {

        resultsText.innerHTML =
          `🏛️ Política · <strong>${filteredNews.length}</strong> noticia(s)`;

      }

    }

    else if (
      currentSearch
    ) {

      resultsText.innerHTML =
        `<strong>${filteredNews.length}</strong> resultado(s) para "<strong>${escapeHTML(currentSearch)}</strong>"`;

    }

    else if (
      currentCategory !== "todas"
    ) {

      resultsText.innerHTML =
        `<strong>${filteredNews.length}</strong> noticia(s)`;

    }

    else {

      resultsText.innerHTML =
        `<strong>${filteredNews.length}</strong> noticias disponibles`;

    }


    /*
     * MOSTRAR BOTÓN LIMPIAR
     */

    clearButton.style.display =
      (
        currentSearch ||
        currentCategory !== "todas"
      )
        ? "inline-block"
        : "none";


    /*
     * SIN RESULTADOS
     */

    if (
      !filteredNews.length
    ) {

      let title =
        "No encontramos noticias";

      let message =
        "Prueba con otra palabra o categoría.";


      if (
        currentCategory === "futbol"
      ) {

        title =
          "⚽ No encontramos fútbol";

        message =
          "No hay noticias futbolísticas disponibles en este momento.";

      }


      if (
        currentCategory === "politica"
      ) {

        title =
          "🏛️ No encontramos política";

        message =
          "No hay noticias políticas disponibles en este momento.";

      }


      if (
        currentSearch
      ) {

        title =
          "No encontramos resultados";

        message =
          `No encontramos resultados para "${escapeHTML(currentSearch)}". Prueba con otra palabra.`;

      }


      newsGrid.innerHTML = `

        <div class="empty">

          <strong>
            ${title}
          </strong>

          <div>
            ${message}
          </div>

        </div>

      `;

      return;

    }


    /* =====================================================
       CREAR TARJETAS
    ===================================================== */

    newsGrid.innerHTML =
      filteredNews.map(item => {

        const title =
          escapeHTML(
            getTitle(item)
          );


        const description =
          escapeHTML(
            getDescription(item)
          );


        const source =
          escapeHTML(
            getSource(item)
          );


        const date =
          escapeHTML(
            formatDate(
              getDate(item)
            )
          );


        const link =
          getLink(item);


        const image =
          getImage(item) ||
          fallbackImage();


        let category =
          getSmartCategory(item);


        /*
         * Si estamos viendo fútbol,
         * mostramos la etiqueta fútbol.
         */

        if (
          currentCategory === "futbol" &&
          isFutbolNews(item)
        ) {

          category =
            "futbol";

        }


        /*
         * Si estamos viendo política,
         * mostramos la etiqueta política.
         */

        if (
          currentCategory === "politica" &&
          isPoliticalNews(item)
        ) {

          category =
            "politica";

        }


        return `

          <article class="news-card">

            <a
              href="${escapeHTML(link)}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <img
                class="news-image"
                src="${escapeHTML(image)}"
                alt="${title}"
                loading="lazy"
                onerror="this.onerror=null;this.src='${fallbackImage()}';"
              >

              <div class="news-content">

                <div class="news-category">
                  ${categoryLabel(category)}
                </div>


                <h2 class="news-title">
                  ${title}
                </h2>


                ${
                  description
                    ? `
                      <p class="news-description">
                        ${description}
                      </p>
                    `
                    : ""
                }


                <div class="news-meta">

                  <span>
                    ${source}
                  </span>


                  ${
                    date
                      ? `
                        <span>
                          · ${date}
                        </span>
                      `
                      : ""
                  }

                </div>

              </div>

            </a>

          </article>

        `;

      }).join("");

  }


  /* =========================================================
     CATEGORÍA ACTIVA
  ========================================================= */

  function setActiveCategory() {

    categoryButtons.forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.category ===
        currentCategory
      );

    });

  }


  /* =========================================================
     ACTUALIZAR URL
  ========================================================= */

  function updateURL() {

    const params =
      new URLSearchParams();


    if (
      currentSearch
    ) {

      params.set(
        "buscar",
        currentSearch
      );

    }


    if (
      currentCategory &&
      currentCategory !== "todas"
    ) {

      params.set(
        "categoria",
        currentCategory
      );

    }


    const query =
      params.toString();


    const newURL =
      query
        ? `${location.pathname}?${query}`
        : location.pathname;


    history.replaceState(
      {},
      "",
      newURL
    );

  }


  /* =========================================================
     LIMPIAR FILTROS
  ========================================================= */

  function clearFilters() {

    currentSearch =
      "";

    currentCategory =
      "todas";


    searchInput.value =
      "";


    setActiveCategory();

    updateURL();

    renderNews();

  }


  /* =========================================================
     LEER URL
  ========================================================= */

  function readURLParams() {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const buscar =
      params.get("buscar");


    const categoria =
      params.get("categoria");


    if (
      buscar
    ) {

      currentSearch =
        buscar.trim();

      searchInput.value =
        currentSearch;

    }


    const validCategories = [

      "todas",
      "mexico",
      "politica",
      "mundo",
      "economia",
      "deportes",
      "futbol",
      "entretenimiento",
      "tecnologia"

    ];


    if (
      categoria &&
      validCategories.includes(
        normalizeText(categoria)
      )
    ) {

      currentCategory =
        normalizeText(categoria);

    }


    setActiveCategory();

  }


  /* =========================================================
     CARGAR RSS / NOTICIAS.JSON
  ========================================================= */

  async function loadNews() {

    try {

      const response =
        await fetch(
          `./noticias.json?v=${Date.now()}`,
          {
            cache: "no-store"
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          "No se pudo cargar noticias.json"
        );

      }


      const data =
        await response.json();


      let news = [];


      /*
       * Aceptamos:
       *
       * [
       *   {...}
       * ]
       *
       * o:
       *
       * {
       *   noticias: [...]
       * }
       */

      if (
        Array.isArray(data)
      ) {

        news =
          data;

      }

      else if (
        Array.isArray(
          data.noticias
        )
      ) {

        news =
          data.noticias;

      }


      /*
       * ELIMINAR DUPLICADOS
       */

      const seen =
        new Set();


      allNews =
        news.filter(item => {

          const link =
            getLink(item);


          /*
           * Sin enlace:
           * conservamos la noticia.
           */

          if (
            !link ||
            link === "#"
          ) {

            return true;

          }


          if (
            seen.has(link)
          ) {

            return false;

          }


          seen.add(link);

          return true;

        });


      /*
       * ORDENAR POR FECHA
       */

      allNews.sort(
        (a, b) => {

          const dateA =
            new Date(
              getDate(a)
            ).getTime() || 0;


          const dateB =
            new Date(
              getDate(b)
            ).getTime() || 0;


          return dateB - dateA;

        }
      );


      /*
       * MOSTRAR
       */

      renderNews();

    }


    catch (error) {

      console.error(
        "Error cargando noticias:",
        error
      );


      resultsText.textContent =
        "Error al cargar las noticias.";


      newsGrid.innerHTML = `

        <div class="empty">

          <strong>
            ⚠️ No se pudieron cargar las noticias
          </strong>

          <div>
            Verifica que noticias.json esté en la raíz del repositorio.
          </div>

        </div>

      `;

    }

  }


  /* =========================================================
     EVENTOS DE CATEGORÍA
  ========================================================= */

  categoryButtons.forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          currentCategory =
            button.dataset.category;


          setActiveCategory();

          updateURL();

          renderNews();

        }
      );

    }
  );


  /* =========================================================
     BUSCADOR EN TIEMPO REAL
  ========================================================= */

  searchInput.addEventListener(
    "input",
    () => {

      currentSearch =
        searchInput.value.trim();


      updateURL();

      renderNews();

    }
  );


  /* =========================================================
     BOTÓN BUSCAR
  ========================================================= */

  searchButton.addEventListener(
    "click",
    () => {

      currentSearch =
        searchInput.value.trim();


      updateURL();

      renderNews();

    }
  );


  /* =========================================================
     ENTER
  ========================================================= */

  searchInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();


        currentSearch =
          searchInput.value.trim();


        updateURL();

        renderNews();

      }

    }
  );


  /* =========================================================
     LIMPIAR
  ========================================================= */

  clearButton.addEventListener(
    "click",
    clearFilters
  );


  /* =========================================================
     INICIAR
  ========================================================= */

  readURLParams();

  loadNews();


  /* =========================================================
     ACTUALIZAR CADA 10 MINUTOS
  ========================================================= */

  setInterval(
    loadNews,
    10 * 60 * 1000
  );

</script>

</body>
</html>
