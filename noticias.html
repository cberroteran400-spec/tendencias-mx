<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noticias | TendenciaMX</title>

  <meta
    name="description"
    content="Noticias de México, mundo, economía, deportes, fútbol, entretenimiento y tecnología en TendenciaMX."
  >

  <meta
    name="keywords"
    content="noticias México, noticias hoy, fútbol, Liga MX, América, Chivas, Cruz Azul, Pumas, selección, Mundial, Champions, Premier League, Barcelona, Real Madrid, economía, tecnología, deportes"
  >

  <link
    rel="canonical"
    href="https://cberroteran400-spec.github.io/tendencias-mx/noticias.html"
  >

  <meta property="og:title" content="Noticias | TendenciaMX">
  <meta
    property="og:description"
    content="Las noticias más importantes de México y el mundo."
  >
  <meta
    property="og:url"
    content="https://cberroteran400-spec.github.io/tendencias-mx/noticias.html"
  >
  <meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #17233d 0%, #0b1220 45%, #050911 100%);
      color: #ffffff;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 9, 17, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(101, 255, 154, 0.15);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 900;
      color: #65ff9a;
      white-space: nowrap;
    }

    nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    nav a {
      color: #dce5f5;
      font-size: 0.92rem;
      font-weight: 700;
      padding: 7px 4px;
    }

    nav a:hover {
      color: #65ff9a;
    }

    .container {
      width: min(1150px, calc(100% - 30px));
      margin: auto;
    }

    .hero {
      text-align: center;
      padding: 45px 0 25px;
    }

    .hero h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.05;
    }

    .hero h1 span {
      color: #65ff9a;
    }

    .hero p {
      color: #aebbd0;
      max-width: 700px;
      margin: auto;
      line-height: 1.6;
    }

    /* BUSCADOR */

    .search-box {
      max-width: 800px;
      margin: 20px auto 15px;
      display: flex;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 15px 17px;
      border-radius: 14px;
      border: 1px solid rgba(101, 255, 154, 0.25);
      background: #111a2b;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .search-box input:focus {
      border-color: #65ff9a;
      box-shadow: 0 0 0 3px rgba(101, 255, 154, 0.08);
    }

    .search-box button {
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      background: #65ff9a;
      color: #06100a;
      font-weight: 900;
      cursor: pointer;
    }

    .search-box button:hover {
      filter: brightness(1.08);
    }

    /* CATEGORÍAS */

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 15px auto 25px;
    }

    .category-btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: #111a2b;
      color: #dce5f5;
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .category-btn:hover {
      border-color: #65ff9a;
      color: #65ff9a;
    }

    .category-btn.active {
      background: #65ff9a;
      color: #06100a;
      border-color: #65ff9a;
    }

    /* RESULTADOS */

    .results-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0 18px;
      color: #aebbd0;
      font-size: 0.95rem;
      flex-wrap: wrap;
    }

    .results-info strong {
      color: #65ff9a;
    }

    .clear-btn {
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: #c9d3e4;
      padding: 7px 12px;
      border-radius: 9px;
      cursor: pointer;
      display: none;
    }

    .clear-btn:hover {
      color: white;
      border-color: #65ff9a;
    }

    /* NOTICIAS */

    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding-bottom: 50px;
    }

    .news-card {
      background: rgba(17, 26, 43, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }

    .news-card:hover {
      transform: translateY(-4px);
      border-color: rgba(101,255,154,0.35);
    }

    .news-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
      background: #0b1220;
    }

    .news-content {
      padding: 16px;
    }

    .news-category {
      display: inline-block;
      color: #65ff9a;
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .news-title {
      margin: 0 0 10px;
      font-size: 1.08rem;
      line-height: 1.35;
    }

    .news-description {
      color: #aebbd0;
      font-size: 0.9rem;
      line-height: 1.5;
      margin: 0 0 13px;
    }

    .news-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: #7f8da5;
      font-size: 0.78rem;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding-top: 10px;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 55px 20px;
      background: rgba(17,26,43,0.75);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      color: #aebbd0;
    }

    .empty strong {
      display: block;
      color: white;
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: #aebbd0;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      padding: 25px 15px;
      color: #718099;
      font-size: 0.85rem;
    }

    @media (max-width: 900px) {
      .news-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      nav {
        justify-content: flex-start;
      }

      .hero {
        padding-top: 30px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        min-height: 48px;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .news-image {
        height: 210px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a class="logo" href="index.html">TendenciaMX</a>

    <nav>
      <a href="index.html">Inicio</a>
      <a href="noticias.html">📰 Noticias</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>📰 Noticias de <span>TendenciaMX</span></h1>

    <p>
      Encuentra las noticias más importantes de México y el mundo,
      incluyendo deportes, fútbol, economía, tecnología,
      entretenimiento y más.
    </p>

    <div class="search-box">
      <input
        type="search"
        id="searchInput"
        placeholder="Buscar noticias... Ej. fútbol, dólar, México"
        autocomplete="off"
        aria-label="Buscar noticias"
      >

      <button id="searchButton" type="button">
        Buscar
      </button>
    </div>
  </section>

  <section class="categories" aria-label="Categorías">

    <button class="category-btn active" data-category="todas">
      Todas
    </button>

    <button class="category-btn" data-category="mexico">
      🇲🇽 México
    </button>

    <button class="category-btn" data-category="mundo">
      🌎 Mundo
    </button>

    <button class="category-btn" data-category="economia">
      💰 Economía
    </button>

    <button class="category-btn" data-category="deportes">
      🏆 Deportes
    </button>

    <button class="category-btn" data-category="futbol">
      ⚽ Fútbol
    </button>

    <button class="category-btn" data-category="entretenimiento">
      🎬 Entretenimiento
    </button>

    <button class="category-btn" data-category="tecnologia">
      💻 Tecnología
    </button>

  </section>

  <div class="results-info">
    <div id="resultsText">
      Cargando noticias...
    </div>

    <button
      id="clearButton"
      class="clear-btn"
      type="button"
    >
      Limpiar
    </button>
  </div>

  <section
    id="newsGrid"
    class="news-grid"
    aria-live="polite"
  >
    <div class="loading">
      Cargando noticias...
    </div>
  </section>

</main>

<footer>
  © 2026 TendenciaMX · Noticias y tendencias
</footer>

<script>
  const newsGrid = document.getElementById("newsGrid");
  const searchInput = document.getElementById("searchInput");
  const searchButton = document.getElementById("searchButton");
  const clearButton = document.getElementById("clearButton");
  const resultsText = document.getElementById("resultsText");
  const categoryButtons = document.querySelectorAll(".category-btn");

  let allNews = [];
  let currentCategory = "todas";
  let currentSearch = "";

  /*
   * Palabras que identifican una noticia de FÚTBOL.
   *
   * Importante:
   * La categoría de Fútbol busca primero dentro de DEPORTES.
   * Después revisa título, descripción, fuente y otros campos.
   */
  const futbolTerms = [
    "futbol",
    "futbolista",
    "futbolistas",
    "liga mx",
    "liga bbva mx",
    "liga mexicana",
    "america",
    "club america",
    "chivas",
    "guadalajara",
    "cruz azul",
    "pumas",
    "pumas unam",
    "seleccion",
    "seleccion mexicana",
    "mexico",
    "mundial",
    "copa mundial",
    "champions",
    "champions league",
    "uefa",
    "premier league",
    "barcelona",
    "real madrid",
    "laliga",
    "la liga",
    "liga mx",
    "liga",
    "club",
    "gol",
    "goles",
    "partido",
    "partidos",
    "cancha",
    "estadio",
    "jugador",
    "jugadores",
    "entrenador",
    "tecnico",
    "portero",
    "delantero",
    "defensa",
    "mediocampista",
    "liguilla",
    "apertura",
    "clausura",
    "mundial de clubes",
    "concacaf",
    "libertadores"
  ];

  /*
   * Convierte:
   * "Fútbol" -> "futbol"
   * "México" -> "mexico"
   * "Selección" -> "seleccion"
   */
  function normalizeText(value) {
    return String(value || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .trim();
  }

  function escapeHTML(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function normalizeCategory(value) {
    const c = normalizeText(value);

    if (
      c.includes("mexico") ||
      c.includes("nacional")
    ) {
      return "mexico";
    }

    if (
      c.includes("mundo") ||
      c.includes("internacional")
    ) {
      return "mundo";
    }

    if (
      c.includes("economia") ||
      c.includes("dinero") ||
      c.includes("finanzas")
    ) {
      return "economia";
    }

    if (
      c.includes("deporte") ||
      c.includes("deportes")
    ) {
      return "deportes";
    }

    if (
      c.includes("entretenimiento") ||
      c.includes("tendencias") ||
      c.includes("espectaculo")
    ) {
      return "entretenimiento";
    }

    if (
      c.includes("tecnologia") ||
      c.includes("tech")
    ) {
      return "tecnologia";
    }

    return c || "otros";
  }

  function getNewsText(item) {
    return normalizeText([
      item.titulo,
      item.title,
      item.descripcion,
      item.description,
      item.resumen,
      item.contenido,
      item.contenidoCorto,
      item.fuente,
      item.source,
      item.categoria,
      item.category,
      item.etiquetas,
      item.tags
    ].join(" "));
  }

  function isFutbolNews(item) {

    /*
     * Fútbol SIEMPRE parte de la categoría Deportes.
     *
     * Esto evita que una noticia de tecnología que mencione
     * "fútbol" accidentalmente aparezca en Fútbol.
     */
    const category = normalizeCategory(
      item.categoria ||
      item.category ||
      ""
    );

    if (category !== "deportes") {
      return false;
    }

    const text = getNewsText(item);

    return futbolTerms.some(term => {
      return text.includes(normalizeText(term));
    });
  }

  function getTitle(item) {
    return (
      item.titulo ||
      item.title ||
      "Sin título"
    );
  }

  function getDescription(item) {
    return (
      item.descripcion ||
      item.description ||
      item.resumen ||
      item.contenidoCorto ||
      ""
    );
  }

  function getSource(item) {
    return (
      item.fuente ||
      item.source ||
      "TendenciaMX"
    );
  }

  function getDate(item) {
    return (
      item.fecha ||
      item.date ||
      item.pubDate ||
      item.publicado ||
      item.published ||
      ""
    );
  }

  function getImage(item) {
    return (
      item.imagen ||
      item.image ||
      item.imageUrl ||
      item.urlImagen ||
      item.thumbnail ||
      item.enclosure ||
      ""
    );
  }

  function getLink(item) {
    return (
      item.enlace ||
      item.link ||
      item.url ||
      "#"
    );
  }

  function formatDate(value) {
    if (!value) {
      return "";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
      return String(value);
    }

    return date.toLocaleDateString(
      "es-MX",
      {
        day: "2-digit",
        month: "short",
        year: "numeric"
      }
    );
  }

  function getSearchTerms() {
    return normalizeText(currentSearch)
      .split(/\s+/)
      .filter(Boolean);
  }

  function matchesSearch(item) {

    const terms = getSearchTerms();

    if (!terms.length) {
      return true;
    }

    const text = getNewsText(item);

    /*
     * Todas las palabras escritas deben aparecer.
     *
     * Ejemplo:
     * "liga mx"
     *
     * encuentra una noticia que contenga:
     * liga + mx
     */
    return terms.every(term => {
      return text.includes(term);
    });
  }

  function matchesCategory(item) {

    if (currentCategory === "todas") {
      return true;
    }

    if (currentCategory === "futbol") {
      return isFutbolNews(item);
    }

    return (
      normalizeCategory(
        item.categoria ||
        item.category ||
        ""
      ) === currentCategory
    );
  }

  function getFilteredNews() {

    return allNews.filter(item => {
      return (
        matchesCategory(item) &&
        matchesSearch(item)
      );
    });
  }

  function renderNews() {

    const filteredNews = getFilteredNews();

    clearButton.style.display =
      currentSearch || currentCategory !== "todas"
        ? "inline-block"
        : "none";

    if (currentCategory === "futbol") {

      if (currentSearch) {
        resultsText.innerHTML =
          `⚽ Fútbol · <strong>${filteredNews.length}</strong> resultado(s) para "<strong>${escapeHTML(currentSearch)}</strong>"`;
      } else {
        resultsText.innerHTML =
          `⚽ Fútbol · <strong>${filteredNews.length}</strong> noticia(s) encontradas dentro de Deportes`;
      }

    } else if (currentSearch) {

      resultsText.innerHTML =
        `<strong>${filteredNews.length}</strong> resultado(s) para "<strong>${escapeHTML(currentSearch)}</strong>"`;

    } else if (currentCategory !== "todas") {

      resultsText.innerHTML =
        `<strong>${filteredNews.length}</strong> noticia(s) en ${escapeHTML(currentCategory)}`;

    } else {

      resultsText.innerHTML =
        `<strong>${filteredNews.length}</strong> noticias disponibles`;
    }

    if (!filteredNews.length) {

      let message =
        "No encontramos noticias con esos criterios.";

      if (currentCategory === "futbol") {
        message =
          "No encontramos noticias de fútbol dentro de Deportes con esos términos.";
      }

      newsGrid.innerHTML = `
        <div class="empty">
          <strong>🔎 Sin resultados</strong>
          <div>${message}</div>
        </div>
      `;

      return;
    }

    newsGrid.innerHTML = filteredNews
      .map(item => {

        const title = escapeHTML(getTitle(item));
        const description = escapeHTML(getDescription(item));
        const source = escapeHTML(getSource(item));
        const date = escapeHTML(formatDate(getDate(item)));
        const link = getLink(item);
        const image = getImage(item);

        const category =
          normalizeCategory(
            item.categoria ||
            item.category ||
            ""
          );

        const categoryLabel =
          currentCategory === "futbol"
            ? "⚽ Fútbol"
            : category.charAt(0).toUpperCase() +
              category.slice(1);

        const safeImage =
          image ||
          "data:image/svg+xml;charset=UTF-8," +
          encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="800"
                 height="450"
                 viewBox="0 0 800 450">
              <rect width="800" height="450" fill="#111a2b"/>
              <text x="400"
                    y="225"
                    text-anchor="middle"
                    dominant-baseline="middle"
                    fill="#65ff9a"
                    font-size="42"
                    font-family="Arial">
                TendenciaMX
              </text>
            </svg>
          `);

        return `
          <article class="news-card">

            <a
              href="${escapeHTML(link)}"
              target="_blank"
              rel="noopener noreferrer"
            >

              <img
                class="news-image"
                src="${escapeHTML(safeImage)}"
                alt="${title}"
                loading="lazy"
                onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(`
                  <svg xmlns="http://www.w3.org/2000/svg"
                       width="800"
                       height="450">
                    <rect width="800" height="450" fill="#111a2b"/>
                    <text x="400"
                          y="225"
                          text-anchor="middle"
                          fill="#65ff9a"
                          font-size="42"
                          font-family="Arial">
                      TendenciaMX
                    </text>
                  </svg>
                `)}';"
              >

              <div class="news-content">

                <div class="news-category">
                  ${categoryLabel}
                </div>

                <h2 class="news-title">
                  ${title}
                </h2>

                ${
                  description
                    ? `<p class="news-description">${description}</p>`
                    : ""
                }

                <div class="news-meta">
                  <span>${source}</span>
                  ${
                    date
                      ? `<span>· ${date}</span>`
                      : ""
                  }
                </div>

              </div>

            </a>

          </article>
        `;
      })
      .join("");
  }

  function setActiveCategory() {

    categoryButtons.forEach(button => {

      const category =
        button.dataset.category;

      button.classList.toggle(
        "active",
        category === currentCategory
      );
    });
  }

  function updateURL() {

    const params = new URLSearchParams();

    if (currentSearch) {
      params.set("buscar", currentSearch);
    }

    if (
      currentCategory &&
      currentCategory !== "todas"
    ) {
      params.set(
        "categoria",
        currentCategory
      );
    }

    const query =
      params.toString();

    const newURL =
      query
        ? `${location.pathname}?${query}`
        : location.pathname;

    history.replaceState(
      {},
      "",
      newURL
    );
  }

  function applyFilters() {

    currentSearch =
      searchInput.value.trim();

    setActiveCategory();
    updateURL();
    renderNews();
  }

  function clearFilters() {

    currentSearch = "";
    currentCategory = "todas";

    searchInput.value = "";

    setActiveCategory();
    updateURL();
    renderNews();
  }

  async function loadNews() {

    try {

      const response = await fetch(
        `./noticias.json?v=${Date.now()}`,
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          "No se pudo cargar noticias.json"
        );
      }

      const data =
        await response.json();

      let news = [];

      if (Array.isArray(data)) {
        news = data;
      } else if (
        Array.isArray(data.noticias)
      ) {
        news = data.noticias;
      }

      /*
       * Elimina noticias repetidas.
       */
      const seen = new Set();

      allNews = news.filter(item => {

        const link =
          getLink(item);

        if (
          !link ||
          link === "#"
        ) {
          return true;
        }

        if (seen.has(link)) {
          return false;
        }

        seen.add(link);

        return true;
      });

      /*
       * Más recientes primero.
       */
      allNews.sort((a, b) => {

        const dateA =
          new Date(getDate(a)).getTime() || 0;

        const dateB =
          new Date(getDate(b)).getTime() || 0;

        return dateB - dateA;
      });

      renderNews();

    } catch (error) {

      console.error(error);

      resultsText.textContent =
        "Error al cargar las noticias.";

      newsGrid.innerHTML = `
        <div class="empty">
          <strong>⚠️ No se pudieron cargar las noticias</strong>
          <div>
            Intenta actualizar la página en unos segundos.
          </div>
        </div>
      `;
    }
  }

  /*
   * CATEGORÍAS
   */

  categoryButtons.forEach(button => {

    button.addEventListener(
      "click",
      () => {

        currentCategory =
          button.dataset.category;

        setActiveCategory();
        updateURL();
        renderNews();

      }
    );

  });

  /*
   * BUSCADOR EN TIEMPO REAL
   */

  searchInput.addEventListener(
    "input",
    () => {

      currentSearch =
        searchInput.value.trim();

      updateURL();
      renderNews();

    }
  );

  /*
   * BOTÓN BUSCAR
   */

  searchButton.addEventListener(
    "click",
    () => {

      currentSearch =
        searchInput.value.trim();

      updateURL();
      renderNews();

    }
  );

  /*
   * ENTER PARA BUSCAR
   */

  searchInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        event.preventDefault();

        currentSearch =
          searchInput.value.trim();

        updateURL();
        renderNews();

      }

    }
  );

  /*
   * LIMPIAR
   */

  clearButton.addEventListener(
    "click",
    clearFilters
  );

  /*
   * LEER PARÁMETROS DE LA URL
   *
   * Ejemplos:
   *
   * noticias.html?buscar=futbol
   *
   * noticias.html?categoria=futbol
   *
   * noticias.html?categoria=deportes
   */

  function readURLParams() {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const buscar =
      params.get("buscar");

    const categoria =
      params.get("categoria");

    if (buscar) {

      currentSearch =
        buscar.trim();

      searchInput.value =
        currentSearch;
    }

    const validCategories = [
      "todas",
      "mexico",
      "mundo",
      "economia",
      "deportes",
      "futbol",
      "entretenimiento",
      "tecnologia"
    ];

    if (
      categoria &&
      validCategories.includes(
        normalizeText(categoria)
      )
    ) {

      currentCategory =
        normalizeText(categoria);

    }

    setActiveCategory();
  }

  /*
   * INICIO
   */

  readURLParams();
  loadNews();

  /*
   * Actualiza las noticias cada 10 minutos.
   */
  setInterval(
    loadNews,
    10 * 60 * 1000
  );
</script>

</body>
</html>
