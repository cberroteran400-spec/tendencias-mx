/* =====================================================
   LIMPIAR TEXTO
===================================================== */

function limpiarTexto(texto){

    if(
        texto === null ||
        texto === undefined
    ){
        return "";
    }

    return String(texto)

        .replace(/<script[^>]*>.*?<\/script>/gis,"")

        .replace(/<style[^>]*>.*?<\/style>/gis,"")

        .replace(/<[^>]*>/g,"")

        .replace(/&nbsp;/gi," ")

        .replace(/&amp;/gi,"&")

        .replace(/&quot;/gi,'"')

        .replace(/&#39;/gi,"'")

        .replace(/&lt;/gi,"<")

        .replace(/&gt;/gi,">")

        .replace(/\s+/g," ")

        .trim();
}


/* =====================================================
   NORMALIZAR TEXTO PARA BÚSQUEDA
===================================================== */

function normalizarTexto(texto){

    return limpiarTexto(texto)

        .toLowerCase()

        .normalize("NFD")

        .replace(/[\u0300-\u036f]/g,"")

        .trim();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto){

    return String(texto || "")

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");
}


/* =====================================================
   OBTENER VALOR
===================================================== */

function obtenerValor(obj,claves){

    for(const clave of claves){

        if(
            obj &&
            obj[clave] !== undefined &&
            obj[clave] !== null &&
            String(obj[clave]).trim() !== ""
        ){

            return obj[clave];

        }

    }

    return "";
}


/* =====================================================
   OBTENER IMAGEN
===================================================== */

function obtenerImagen(noticia){

    const posibles = [

        noticia.imagen,
        noticia.image,
        noticia.imagen_url,
        noticia.image_url,
        noticia.thumbnail,
        noticia.miniatura,
        noticia.foto,
        noticia.fotografia,
        noticia.urlImagen,
        noticia.url_imagen,
        noticia.media,
        noticia.media_url,
        noticia.mediaContent,
        noticia.media_content,
        noticia.enclosure,
        noticia.og_image

    ];


    for(let imagen of posibles){

        if(!imagen){
            continue;
        }


        if(typeof imagen === "object"){

            imagen =
                imagen.url ||
                imagen.href ||
                imagen.src ||
                imagen["@url"] ||
                "";

        }


        if(typeof imagen !== "string"){
            continue;
        }


        imagen = imagen.trim();


        if(!imagen){
            continue;
        }


        const match = imagen.match(
            /<img[^>]+src=["']([^"']+)["']/i
        );


        if(match){

            return match[1];

        }


        if(
            imagen.startsWith("http://") ||
            imagen.startsWith("https://") ||
            imagen.startsWith("//")
        ){

            if(imagen.startsWith("//")){

                imagen =
                    "https:" + imagen;

            }

            return imagen;

        }

    }


    return "";

}


/* =====================================================

===================================================== */

function normalizarCategoria(categoria){

    categoria =
        limpiarTexto(categoria)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");


    if(
        categoria.includes("mexic") ||
        categoria.includes("nacional")
    ){

    }


    if(
        categoria.includes("mundo") ||
        categoria.includes("internacional")
    ){

        return "mundo";

    }


    if(
        categoria.includes("econom") ||
        categoria.includes("finanz") ||
        categoria.includes("negocio") ||
        categoria.includes("dinero")
    ){

        return "economia";

    }


    if(
        categoria.includes("deport")

        return "deportes";

    }


    if(
        categoria.includes("entreten") ||
        categoria.includes("espectac") ||
        categoria.includes("famos") ||
        categoria.includes("cine") ||
        categoria.includes("musica") ||
        categoria.includes("television")
    ){

        return "entretenimiento";

    }


    if(
        categoria.includes("tecnolog") ||
        categoria.includes("tech") ||
        categoria.includes("ciencia")
    ){

        return "tecnologia";

    }


    return "";

}

/* =====================================================
   FECHA
===================================================== */

function formatearFecha(fecha){

    if(!fecha){
        return "";
    }


    try{

        const fechaObj =
            new Date(fecha);


        if(
            isNaN(
                fechaObj.getTime()
            )
        ){

            return limpiarTexto(fecha);

        }


        return fechaObj.toLocaleString(
            "es-MX",
            {
                day:"2-digit",
                month:"short",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    }catch(error){

        return limpiarTexto(fecha);

    }

}


/* =====================================================
   LEER PARÁMETROS DE LA URL
===================================================== */

function leerParametrosURL(){

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const busquedaURL =
        parametros.get("buscar");


    const categoriaURL =
        parametros.get("categoria");


    if(busquedaURL){

        terminoBusqueda =
            limpiarTexto(
                busquedaURL
            );

        document.getElementById(
            "buscador"
        ).value =
            terminoBusqueda;

    }


    if(categoriaURL){

        const categoriaNormalizada =
            normalizarCategoria(
                categoriaURL
            );


        const categoriasPermitidas = [

            "todas",
            "mexico",
            "mundo",
            "economia",
            "deportes",
            "entretenimiento",
            "tecnologia"

        ];


        if(
            categoriasPermitidas.includes(
                categoriaNormalizada
            )
        ){

            categoriaActual =
                categoriaNormalizada;

        }

    }


    actualizarBotonesCategoria();

}

    document

            boton.classList.toggle(
                "active",

===================================================== */

async function cargarNoticias(){

    const grid =
        document.getElementById("newsGrid");

    const estado =
        document.getElementById("estado");


    try{

        estado.textContent =
            "Actualizando noticias...";


        const respuesta =
            await fetch(
                "./noticias.json?v=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );


        if(!respuesta.ok){

            throw new Error(
                "No se pudo cargar noticias.json"
            );

        }


        const datos =
            await respuesta.json();


        let noticias = [];


        if(Array.isArray(datos)){

            noticias = datos;

        }
        else if(
            Array.isArray(datos.noticias)
        ){

            noticias = datos.noticias;

        }
        else if(
            Array.isArray(datos.news)
        ){

            noticias = datos.news;

        }
        else if(
            Array.isArray(datos.items)
        ){

            noticias = datos.items;

        }
        else if(
            Array.isArray(datos.results)
        ){

            noticias = datos.results;

        }


        const noticiasNormalizadas =
            noticias.map(
                noticia => {

                    const titulo =
                        limpiarTexto(
                            obtenerValor(
                                noticia,
                                [
                                    "titulo",
                                    "title",
                                    "nombre"
                                ]
                            )
                        );


                    const descripcion =
                        limpiarTexto(
                            obtenerValor(
                                noticia,
                                [
                                    "descripcion",
                                    "description",
                                    "resumen",
                                    "summary"
                                ]
                            )
                        );


                    const enlace =
                        limpiarTexto(
                            obtenerValor(
                                noticia,
                                [
                                    "enlace",
                                    "link",
                                    "url",
                                    "href"
                                ]
                            )
                        );


                    const fuente =
                        limpiarTexto(
                            obtenerValor(
                                noticia,
                                [
                                    "fuente",
                                    "source",
                                    "medio",
                                    "publisher"
                                ]
                            )
                        );


                    const fecha =
                        obtenerValor(
                            noticia,
                            [
                                "fecha",
                                "date",
                                "pubDate",
                                "published",
                                "publicado"
                            ]
                        );


                    const categoria =
                        obtenerCategoria(noticia);


                    const imagen =
                        obtenerImagen(noticia);


                    return {

                        titulo:
                            titulo || "Noticia",

                        descripcion:
                            descripcion ||
                            "Consulta la noticia completa para conocer todos los detalles.",

                        enlace:
                            enlace || "#",

                        fuente:
                            fuente || "Expansión",

                        fecha:
                            fecha,

                        categoria:
                            categoria,

                        imagen:
                            imagen

                    };

                }
            )
            .filter(
                noticia =>
                    noticia.titulo
            );


        const enlacesUsados =
            new Set();


        todasLasNoticias =
            noticiasNormalizadas.filter(
                noticia => {

                    if(
                        !noticia.enlace ||
                        noticia.enlace === "#"
                    ){

                        return true;

                    }


                    if(
                        enlacesUsados.has(
                            noticia.enlace
                        )
                    ){

                        return false;

                    }


                    enlacesUsados.add(
                        noticia.enlace
                    );


                    return true;

                }
            );


        todasLasNoticias.sort(
            (a,b) => {

                const fechaA =
                    new Date(
                        a.fecha
                    ).getTime();


                const fechaB =
                    new Date(
                        b.fecha
                    ).getTime();


                if(
                    isNaN(fechaA) &&
                    isNaN(fechaB)
                ){

                    return 0;

                }


                if(isNaN(fechaA)){
                    return 1;
                }


                if(isNaN(fechaB)){
                    return -1;
                }


                return fechaB - fechaA;

            }
        );


        let textoActualizacion =
            "";


        if(datos.actualizado){

            try{

                const fechaActualizacion =
                    new Date(
                        datos.actualizado
                    );


                if(
                    !isNaN(
                        fechaActualizacion.getTime()
                    )
                ){

                    textoActualizacion =
                        " · RSS actualizado " +
                        fechaActualizacion.toLocaleString(
                            "es-MX",
                            {
                                day:"2-digit",
                                month:"short",
                                hour:"2-digit",
                                minute:"2-digit"
                            }
                        );

                }

            }catch(error){}

        }


        estado.innerHTML =

            "<strong>" +
            todasLasNoticias.length +
            "</strong> noticias disponibles" +

            textoActualizacion;


        mostrarNoticias();


    }catch(error){

        console.error(error);


        estado.textContent =
            "No se pudieron cargar las noticias.";


        grid.innerHTML = `

            <div class="empty">

                <h2>
                    No se pudieron cargar las noticias
                </h2>

                <p>
                    Revisa que
                    <strong>noticias.json</strong>
                    esté en la raíz del repositorio.
                </p>

            </div>

        `;

    }

}


/* =====================================================
   MOSTRAR NOTICIAS
===================================================== */

function mostrarNoticias(){

    const grid =
        document.getElementById("newsGrid");


    const buscador =
        document.getElementById("buscador");


    const busqueda =
        normalizarTexto(
            buscador.value
        );


    terminoBusqueda =
        buscador.value.trim();


    const noticiasFiltradas =
        todasLasNoticias.filter(
            noticia => {

                const coincideCategoria =

                    categoriaActual === "todas" ||

                    noticia.categoria ===
                    categoriaActual;


                const textoBusqueda =

                    normalizarTexto(

                        noticia.titulo +
                        " " +
                        noticia.descripcion +
                        " " +
                        noticia.fuente +
                        " " +
                        nombreCategoria(
                            noticia.categoria
                        )

                    );


                const palabrasBusqueda =
                    busqueda
                    .split(/\s+/)
                    .filter(Boolean);


                const coincideBusqueda =

                    !palabrasBusqueda.length ||

                    palabrasBusqueda.every(
                        palabra =>
                            textoBusqueda.includes(
                                palabra
                            )
                    );


                return (
                    coincideCategoria &&
                    coincideBusqueda
                );

            }
        );


    actualizarInformacionBusqueda(
        noticiasFiltradas.length
    );


    if(
        noticiasFiltradas.length === 0
    ){

        grid.innerHTML = `

            <div class="empty">

                <h2>
                    🔎 No encontramos noticias
                </h2>

                <p>
                    No hay resultados para
                    <strong>
                        "${escaparHTML(
                            terminoBusqueda
                        )}"
                    </strong>
                    en esta categoría.
                </p>

                <p style="margin-top:10px;">
                    Prueba con otra palabra,
                    por ejemplo:
                    <strong>México</strong>,
                    <strong>dólar</strong>,
                    <strong>fútbol</strong>
                    o
                    <strong>tecnología</strong>.
                </p>

            </div>

        `;

        return;

    }


    grid.innerHTML =
        noticiasFiltradas
        .map(
            noticia => {


                const imagen =
                    noticia.imagen;


                let imagenHTML = "";


                if(imagen){

                    imagenHTML = `

                        <img
                            src="${escaparHTML(imagen)}"
                            alt="${escaparHTML(noticia.titulo)}"
                            loading="lazy"
                            onerror="this.style.display='none';this.parentElement.innerHTML='<div class=&quot;news-image-fallback&quot;>${obtenerIcono(noticia.categoria)}</div>'"
                        >

                    `;

                }
                else{

                    imagenHTML = `

                        <div class="news-image-fallback">

                            ${obtenerIcono(
                                noticia.categoria
                            )}

                        </div>

                    `;

                }


                const enlaceSeguro =

                    noticia.enlace &&
                    noticia.enlace !== "#"

                    ?

                    escaparHTML(
                        noticia.enlace
                    )

                    :

                    "#";


                return `

                    <article class="news-card">

                        <div class="news-image">

                            ${imagenHTML}

                        </div>


                        <div class="news-content">

                            <div class="news-category">

                                ${obtenerIcono(
                                    noticia.categoria
                                )}

                                ${nombreCategoria(
                                    noticia.categoria
                                )}

                            </div>


                            <h2 class="news-title">

                                ${escaparHTML(
                                    noticia.titulo
                                )}

                            </h2>


                            <p class="news-description">

                                ${escaparHTML(
                                    noticia.descripcion
                                )}

                            </p>


                            <div class="news-meta">

                                ${escaparHTML(
                                    noticia.fuente
                                )}

                                ${
                                    noticia.fecha
                                    ?
                                    " · " +
                                    escaparHTML(
                                        formatearFecha(
                                            noticia.fecha
                                        )
                                    )
                                    :
                                    ""
                                }

                            </div>


                            ${
                                enlaceSeguro !== "#"

                                ?

                                `

                                <a
                                    class="news-link"
                                    href="${enlaceSeguro}"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                >

                                    Leer noticia →

                                </a>

                                `

                                :

                                ""

                            }


                        </div>

                    </article>

                `;

            }
        )
        .join("");

}


/* =====================================================
   INFORMACIÓN DE BÚSQUEDA
===================================================== */

function actualizarInformacionBusqueda(
    cantidad
){

    const info =
        document.getElementById(
            "searchInfo"
        );


    const botonLimpiar =
        document.getElementById(
            "limpiarBusqueda"
        );


    if(terminoBusqueda){

        info.textContent =
            cantidad +
            (
                cantidad === 1
                ? " resultado"
                : " resultados"
            ) +
            " para: " +
            terminoBusqueda;


        botonLimpiar.style.display =
            "block";

    }
    else{

        info.textContent =

            categoriaActual === "todas"

            ?

            "Mostrando las noticias más recientes."

            :

            "Mostrando noticias de " +
            nombreCategoria(
                categoriaActual
            ) +
            ".";


        botonLimpiar.style.display =
            "none";

    }

}


/* =====================================================
   BUSCAR
===================================================== */

function buscarNoticias(){

    const buscador =
        document.getElementById(
            "buscador"
        );


    terminoBusqueda =
        buscador.value.trim();


    mostrarNoticias();


    /*
       Actualizamos la URL para que
       la búsqueda se pueda compartir.
    */

    actualizarURL();

}


/* =====================================================
   LIMPIAR BÚSQUEDA
===================================================== */

function limpiarBusqueda(){

    const buscador =
        document.getElementById(
            "buscador"
        );


    buscador.value = "";

    terminoBusqueda = "";

    mostrarNoticias();

    actualizarURL();

}


/* =====================================================
   ACTUALIZAR URL
===================================================== */

function actualizarURL(){

    const parametros =
        new URLSearchParams();


    if(terminoBusqueda){

        parametros.set(
            "buscar",
            terminoBusqueda
        );

    }


    if(
        categoriaActual &&
        categoriaActual !== "todas"
    ){

        parametros.set(
            "categoria",
            categoriaActual
        );

    }


    const nuevaURL =
        window.location.pathname +
        (
            parametros.toString()
            ?
            "?" +
            parametros.toString()
            :
            ""
        );


    window.history.replaceState(
        {},
        "",
        nuevaURL
    );

}


/* =====================================================
   FILTROS DE CATEGORÍA
===================================================== */

document
.querySelectorAll(".category-btn")
.forEach(
    boton => {

        boton.addEventListener(
            "click",

                categoriaActual =
                    this.dataset.category;


                actualizarBotonesCategoria();


                mostrarNoticias();


                actualizarURL();

            }
        );

    }
);


/* =====================================================
   BUSCAR MIENTRAS ESCRIBE
===================================================== */

document
.getElementById("buscador")
.addEventListener(
    "input",
    function(){

        terminoBusqueda =
            this.value.trim();


        mostrarNoticias();

    }
);


/* =====================================================
   BUSCAR CON ENTER
===================================================== */

document
.getElementById("buscador")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
        ){

            event.preventDefault();

            buscarNoticias();

        }

    }
);

leerParametrosURL();

cargarNoticias();

setInterval(

    10 * 60 * 1000
);
