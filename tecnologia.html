/* ==================================================
   MOSTRAR NOTICIAS
================================================== */

function mostrar(categoria, boton){

    const contenedor =
        document.getElementById("contenedor");

    if(boton){

        document
            .querySelectorAll(".filtros button")
            .forEach(btn =>
                btn.classList.remove("activo")
            );

        boton.classList.add("activo");
    }

    let lista;

    if(categoria === "todos"){

        lista = noticias;

    }else{

        lista = noticias.filter(
            noticia =>
                noticia.categoria === categoria
        );

    }

    if(lista.length === 0){

        contenedor.innerHTML = `

            <div class="vacio">

                <h2>
                    No hay noticias disponibles
                </h2>

                <p>
                    Pronto agregaremos más contenido.
                </p>

            </div>

        `;

        return;
    }


    contenedor.innerHTML = lista.map(noticia => `

        <article class="card">

            <a
                class="card-link"
                href="${noticia.url}"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="card-img">

                    <img
                        src="${noticia.imagen}"
                        alt="${escapeHTML(noticia.titulo)}"
                        loading="lazy"
                        onerror="mostrarFallback(this,'${noticia.emoji}')"
                    >

                </div>


                <div class="card-content">

                    <span class="categoria">
                        ${nombreCategoria(noticia.categoria)}
                    </span>


                    <h2>
                        ${escapeHTML(noticia.titulo)}
                    </h2>


                    <p>
                        ${escapeHTML(noticia.descripcion)}
                    </p>


                    <div class="fecha">
                        ${escapeHTML(noticia.fecha)}
                    </div>


                    <div class="leer">
                        Leer noticia completa →
                    </div>

                </div>

            </a>

        </article>

    `).join("");

}


/* ==================================================
   NOMBRES DE CATEGORÍAS
================================================== */

function nombreCategoria(categoria){

    const nombres = {

        ia:"Inteligencia artificial",

        gadgets:"Gadgets",

        apps_redes:"Apps y redes",

        ciberseguridad:"Ciberseguridad",

        mexico:"Tecnología en México"

    };

    return nombres[categoria]
        || "Tecnología";

}


/* ==================================================
   FALLBACK DE IMAGEN
================================================== */

function mostrarFallback(img, emoji){

    const contenedor =
        img.parentElement;

    img.remove();

    contenedor.innerHTML = `

        <div class="fallback">
            ${emoji || "💻"}
        </div>

    `;

}


/* ==================================================
   PROTECCIÓN DEL TEXTO
================================================== */

function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* ==================================================
   INICIAR
================================================== */

mostrar(
