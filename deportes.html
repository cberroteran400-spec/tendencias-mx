*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1913;color:#fff;font-family:Inter,system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0e2a1e;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#2cff8e} .logo span{color:#fff}
nav a{color:#9ab;text-decoration:none;margin-left:12px;font-size:12px} nav a.active{color:#2cff8e;background:#143324;padding:6px 10px;border-radius:20px}
.hero{padding:20px}
.hero h1{font-size:28px;margin:6px 0}
.search{margin-top:14px;background:#122a1e;border-radius:10px;display:flex;padding:6px}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none;padding:6px}
.search button{background:#2cff8e;border:none;padding:6px 14px;border-radius:8px;font-weight:800}
.filters{display:flex;gap:8px;overflow:auto;padding:10px 16px}
.filters button{white-space:nowrap;background:#152f20;border:none;color:#fff;padding:7px 12px;border-radius:20px;font-size:12px}
.filters button.active{background:#2cff8e;color:#000}
.grid{padding:16px;display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:#14281d;border-radius:16px;overflow:hidden;border:1px solid #1e3a28}
.card img{width:100%;height:190px;object-fit:cover;display:block;background:#0e2017}
.card-body{padding:12px}
.tag{font-size:10px;background:#1a3d2b;color:#2cff8e;padding:3px 7px;border-radius:6px;font-weight:800}
.card-body h3{font-size:14px;line-height:1.3;margin:8px 0}
.card-body p{font-size:11px;color:#8aa399;height:32px;overflow:hidden}
.card-body a{color:#2cff8e;font-size:11px;text-decoration:none;margin-top:8px;display:inline-block}
.featured{margin:16px;border-radius:20px;min-height:340px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;overflow:hidden}
.featured::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent, rgba(0,0,0,.85))}
.featured-inner{position:relative;z-index:1;padding:18px}
