<main>
  <div class="badge">DEPORTES</div><h1>Noticias de <span>Deportes</span></h1>
  <div class="tools"><input id="buscador" class="search" type="search" placeholder="🔎 Buscar noticias deportivas..."></div>
  <div id="estado" class="status">Cargando...</div>
  <div id="categorias" class="categories">
    <button class="category-btn active" data-categoria="todos">Todas</button><button class="category-btn" data-categoria="futbol">⚽ Fútbol</button><button class="category-btn" data-categoria="tenis">🎾 Tenis</button><button class="category-btn" data-categoria="beisbol">⚾ Béisbol</button><button class="category-btn" data-categoria="nfl">🏈 NFL</button><button class="category-btn" data-categoria="basquetbol">🏀 Básquetbol</button><button class="category-btn" data-categoria="boxeo">🥊 Boxeo</button><button class="category-btn" data-categoria="formula1">🏎️ Fórmula 1</button><button class="category-btn" data-categoria="otros">🏅 Otros</button>
  </div>

  <section><div id="noticias" class="news-grid"></div></section>
  <section><div id="tendencias" class="trends"></div></section>
</main>
<script>
let todasLasNoticias=[];let categoriaActual="todos";let busquedaActual="";const ARCHIVO_DATOS="noticias.json";

/* =========================================================
   BLOQUE DE IMÁGENES
   ========================================================= */

const fallbackImagenesPorCategoria={
futbol:[
"https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=800",
"https://images.unsplash.com/photo-1579952363873-27f3bfad9c0d?w=800",

],
tenis:[

"https://images.unsplash.com/photo-1622279457486-62dcc4a431d6?w=800",
"https://images.unsplash.com/photo-1554068865-24cecd4e34b8?w=800",

"https://images.unsplash.com/photo-1560012057-4372e14c5085?w=800"
],
beisbol:[
"https://images.unsplash.com/photo-1566577739112-5180d4bf9390?w=800",
"https://images.unsplash.com/photo-1471295253337-3ceaaedca402?w=800",
"https://images.unsplash.com/photo-1508344928928-7165b67de128?w=800",
"https://images.unsplash.com/photo-1464047736614-af63643285bf?w=800",
"https://images.unsplash.com/photo-1579952363873-27f3bfad9c0d?w=800"
],
nfl:[
"https://images.unsplash.com/photo-1504450758481-7338eba7524a?w=800",
"https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800",
"https://images.unsplash.com/photo-1566577739112-5180d4bf9390?w=800",
"https://images.unsplash.com/photo-1521412644187-c49fa049e84d?w=800"
],
basquetbol:[
"https://images.unsplash.com/photo-1546519638-68e109498ffc?w=800",
"https://images.unsplash.com/photo-1519861531473-9200262188bf?w=800",
"https://images.unsplash.com/photo-1504450758481-7338eba7524a?w=800",
"https://images.unsplash.com/photo-1579952363873-27f3bfad9c0d?w=800"
],
boxeo:[
"https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?w=800",
"https://images.unsplash.com/photo-1593352216894-289989e3f2ee?w=800",
"https://images.unsplash.com/photo-1583473848882-8c6a6f3f0a90?w=800",
"https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?w=800"
],
formula1:[
"https://images.unsplash.com/photo-1511910849309-0dffb8785146?w=800",
"https://images.unsplash.com/photo-1504215680853-026ed2a45def?w=800",
"https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?w=800",
"https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=800"
],
otros:[
"https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=800",
"https://images.unsplash.com/photo-1552674605-db6ffd4facb5?w=800",
"https://images.unsplash.com/photo-1538805060514-97d9cc17730c?w=800",
"https://images.unsplash.com/photo-1530549387789-4c1017266635?w=800"
]
};

function esImagenBasura(url){
  if(!url) return true;

  const u=String(url).toLowerCase().trim();

  if(u.startsWith("data:")) return true;

  if(
    u.includes("gstatic.com/images/branding") ||
    u.includes("googlelogo") ||
    u.includes("branding/googlelogo") ||
    u.includes("favicon")
  ) return true;

  return false;
}

function normalizarImagen(url){
  if(!url) return "";

  let u=String(url).trim();

  if(u.startsWith("//")) u="https:"+u;

  try{
    const x=new URL(u);

    /*
      Quitamos parámetros que pueden hacer que una misma imagen
      aparezca como URLs diferentes.
    */
    x.searchParams.delete("w");
    x.searchParams.delete("width");
    x.searchParams.delete("auto");
    x.searchParams.delete("q");
    x.searchParams.delete("quality");
    x.searchParams.delete("fit");
    x.searchParams.delete("crop");

    return x.href.toLowerCase();
  }catch(e){
    return u.toLowerCase();
  }
}

function imagenesDisponiblesDeCategoria(cat){
  return fallbackImagenesPorCategoria[cat]||fallbackImagenesPorCategoria.otros;
}

function indiceImagenPorTitulo(titulo,longitud){
  let hash=0;
  const texto=String(titulo||"");

  for(let i=0;i<texto.length;i++){
    hash=(hash*31+texto.charCodeAt(i))>>>0;
  }

  return longitud ? hash%longitud : 0;
}

function obtenerImagenReal(noticia){
  let img=(noticia.imagen||"").trim();

  if(img.startsWith("//")) img="https:"+img;

  if(img && !esImagenBasura(img)){
    return img;
  }

  const cat=obtenerCategoriaDeportiva(noticia);
  const lista=imagenesDisponiblesDeCategoria(cat);

  if(!lista.length) return "";

  const indice=indiceImagenPorTitulo(noticia.titulo,lista.length);

  return lista[indice];
}

function obtenerImagenAlternativa(noticia,imagenActual){
  const cat=obtenerCategoriaDeportiva(noticia);
  const lista=imagenesDisponiblesDeCategoria(cat);

  if(!lista.length) return "";

  const actual=normalizarImagen(imagenActual);
  const indiceBase=indiceImagenPorTitulo(noticia.titulo,lista.length);

  /*
    Busca otra imagen diferente a la que falló.
  */
  for(let i=1;i<=lista.length;i++){
    const indice=(indiceBase+i)%lista.length;
    const candidata=lista[indice];

    if(normalizarImagen(candidata)!==actual){
      return candidata;
    }
  }

  return lista[indiceBase];
}

/* =========================================================
   FIN DEL BLOQUE DE IMÁGENES
   ========================================================= */

async function cargarNoticias(){
  try{
    const r=await fetch(ARCHIVO_DATOS+"?"+Date.now(),{
      cache:"no-store"
    });

    const datos=await r.json();

    todasLasNoticias=Array.isArray(datos)?datos:datos.noticias;

    mostrarNoticias();

    document.getElementById("estado").textContent=
      todasLasNoticias.length+" noticias";

  }catch(e){
    document.getElementById("estado").textContent=
      "Error cargando noticias";
  }
}

function normalizar(t){
  return String(t||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();
}

function obtenerCategoriaDeportiva(n){
  const t=normalizar(
    (n.categoria||"")+" "+
    (n.subcategoria||"")+" "+
    (n.titulo||"")
  );

  if(t.includes("futbol")||t.includes("liga mx")) return "futbol";
  if(t.includes("tenis")) return "tenis";
  if(t.includes("beisbol")) return "beisbol";
  if(t.includes("nfl")) return "nfl";
  if(t.includes("nba")||t.includes("basquetbol")) return "basquetbol";
  if(t.includes("boxeo")||t.includes("ufc")) return "boxeo";
  if(t.includes("formula 1")||t.includes("f1")) return "formula1";

  return "otros";
}

function mostrarNoticias(){
  const cont=document.getElementById("noticias");
  const texto=normalizar(busquedaActual);

  const res=todasLasNoticias.filter(n=>{
    const c=
      categoriaActual==="todos"||
      obtenerCategoriaDeportiva(n)===categoriaActual;

    const txt=normalizar(
      (n.titulo||"")+
      (n.descripcion||"")
    );

    return c&&(!texto||txt.includes(texto));
  });

  cont.innerHTML=res.map(n=>{
    const img=obtenerImagenReal(n);
    const cat=obtenerCategoriaDeportiva(n);

    const segundo=obtenerImagenAlternativa(n,img);

    const tercer=obtenerImagenAlternativa(n,segundo);

    return `<article class="news-card">
      <a href="${n.url}" target="_blank">
        <img
          class="news-image"
          src="${img}"
          alt=""
          loading="lazy"
          onerror="
            this.onerror=function(){
              this.onerror=null;
              this.src='${tercer}';
            };
            this.src='${segundo}';
          "
        >
      </a>

      <div class="news-content">
        <div class="news-meta">
          <span class="news-category">${cat}</span>
        </div>

        <h3 class="news-title">${n.titulo||""}</h3>

        <p class="news-description">
          ${(n.descripcion||"").substring(0,120)}...
        </p>

        <a
          class="read-more"
          href="${n.url}"
          target="_blank"
        >Leer →</a>
      </div>
    </article>`;
  }).join("");

  if(res.length) mostrarDestacada(res[0]);
}

function mostrarDestacada(n){
  const c=document.getElementById("destacada");

  const img=obtenerImagenReal(n);
  const alternativa=obtenerImagenAlternativa(n,img);

  c.innerHTML=`
    <a
      class="featured-card"
      href="${n.url}"
      target="_blank"
    >
      <img
        src="${img}"
        alt=""
        onerror="
          this.onerror=null;
          this.src='${alternativa}';
        "
      >

      <div
        class="featured-overlay"
        style="
          position:absolute;
          inset:0;
          display:flex;
          flex-direction:column;
          justify-content:flex-end;
          padding:25px;
          background:linear-gradient(
            transparent,
            rgba(0,0,0,.88)
          )
        "
      >
        <h2 style="margin:0">${n.titulo}</h2>
      </div>
    </a>
  `;
}

document.getElementById("buscador").addEventListener(
  "input",
  e=>{
    busquedaActual=e.target.value;
    mostrarNoticias();
  }
);

document.querySelectorAll(".category-btn").forEach(b=>{
  b.addEventListener("click",()=>{
    document
      .querySelectorAll(".category-btn")
      .forEach(x=>x.classList.remove("active"));

    b.classList.add("active");

    categoriaActual=b.dataset.categoria;

    mostrarNoticias();
  });
});

cargarNoticias();
</script>
