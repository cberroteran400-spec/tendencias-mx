.destacada::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.15) 55%)}

.grid{padding:0 16px 80px;display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* =====================================================
   CREACIÓN DE NOTICIAS
===================================================== */

let TODAS=[];

Object.keys(TITULOS).forEach(cat=>{

  for(let i=0;i<500;i++){

    let tmpl=TITULOS[cat][i % TITULOS[cat].length];

    let e1=EQUIPOS[(i*7) % EQUIPOS.length];
    let e2=EQUIPOS[(i*13+5) % EQUIPOS.length];

    let titulo=tmpl
      .replace("{0}",e1)
      .replace("{1}",e2);

    let desc=cat.toUpperCase()+" - Noticia "+(i+1)+" - "+e1+" vs "+e2;

    /*
      IMPORTANTE:
      Se usa una imagen diferente según la posición.
      No se agrega ?sig porque eso NO cambia la foto.
    */

    let listaImagenes=IMGS[cat];

    let img=listaImagenes[
      i % listaImagenes.length
    ];

    TODAS.push({
      t:titulo,
      d:desc,
      c:cat,
      i:img,
      l:"#"
    });

  }

});


/* =====================================================
   MEZCLA
===================================================== */

TODAS.sort(()=>Math.random()-0.5);


let filtradas=[];
let mostrando=0;
const POR_PAGINA=100;


/* =====================================================
   PINTAR LISTA
===================================================== */

function pintarLista(lista,reset=true){

  if(reset){

    filtradas=lista;
    mostrando=0;

    document.getElementById('grid').innerHTML='';

  }

  document.getElementById('count').innerText=
    filtradas.length+
    ' noticias en '+
    document.querySelector('.tab.active').innerText;


  if(!filtradas.length){

    document.getElementById('grid').innerHTML=
      "<p style='padding:20px;color:#888'>No hay noticias</p>";

    return;

  }


  let dest=filtradas[0];

  document.getElementById('d-t').innerText=dest.t;

  document.getElementById('d-desc').innerText=dest.d;

  document.getElementById('d-badge').innerText=
    dest.c.toUpperCase();

  document.getElementById('destacada').style.backgroundImage=
    "url('"+dest.i+"')";


  let fin=Math.min(
    mostrando+POR_PAGINA,
    filtradas.length
  );


  let html=document.getElementById('grid').innerHTML;


  for(
    let k=(reset?1:mostrando);
    k<fin;
    k++
  ){

    let n=filtradas[k];

    html+=`

    <div class="card">

      <img
        src="${n.i}"
        loading="lazy"
        alt="${n.t}"
      >

      <div class="card-body">

        <span class="badge">
          ${n.c.toUpperCase()}
        </span>

        <h3>${n.t}</h3>

        <p>${n.d}</p>

      </div>

    </div>

    `;

  }


  document.getElementById('grid').innerHTML=html;

  mostrando=fin;


  document.getElementById('btnMore').style.display=
    (mostrando>=filtradas.length)
    ?'none'
    :'inline-block';

}


/* =====================================================
   FILTROS
===================================================== */

function filtrar(tipo,btn){

  document
    .querySelectorAll('.tab')
    .forEach(b=>b.classList.remove('active'));

  btn.classList.add('active');


  if(tipo==='todos'){

    pintarLista(TODAS,true);

    return;

  }


  let f=TODAS.filter(x=>x.c===tipo);

  pintarLista(f,true);

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}


/* =====================================================
   CARGAR MÁS
===================================================== */

function cargarMas(){

  pintarLista(
    filtradas,
    false
  );

}


/* =====================================================
   INICIO
===================================================== */

pintarLista(
  TODAS,
  true
);
