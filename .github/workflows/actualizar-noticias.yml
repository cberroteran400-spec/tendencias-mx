          # ============================================================
          # TEXTO
          # ============================================================

          def limpiar_html(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              for tag in soup.find_all(
                  ["script", "style"]
              ):
                  tag.decompose()

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              return re.sub(
                  r"\s+",
                  " ",
                  texto
              ).strip()


          # ============================================================
          # URL ORIGINAL
          # ============================================================

          def obtener_url_original(url):

              if not url:
                  return ""

              url = str(url).strip()

              if "news.google.com" not in url:
                  return url

              try:

                  parsed = urlparse(url)

                  qs = parse_qs(
                      parsed.query
                  )

                  for clave in [
                      "url",
                      "u",
                      "q"
                  ]:

                      if clave in qs:

                          for valor in qs[clave]:

                              valor = unquote(
                                  valor
                              )

                              if valor.startswith(
                                  "http"
                              ):
                                  return valor

                  encontrado = re.search(
                      r"https?://[^&]+",
                      url
                  )

                  if encontrado:

                      posible = unquote(
                          encontrado.group(0)
                      )

                      if posible.startswith(
                          "http"
                      ):
                          return posible

              except Exception:
                  pass

              return url


          # ============================================================
          # NORMALIZAR URL
          # ============================================================

          def normalizar_url(url):

              if not url:
                  return ""

              url = obtener_url_original(
                  url
              )

              try:

                  p = urlparse(url)

                  return (
                      p.scheme.lower()
                      + "://"
                      + p.netloc.lower()
                      + p.path.rstrip("/")
                  )

              except Exception:

                  return url.lower().strip()


          # ============================================================
          # VALIDAR EXPANSIÓN
          # ============================================================

          def es_expansion(url):

              try:

                  dominio = (
                      urlparse(
                          url
                      ).netloc.lower()
                  )

                  return (
                      "expansion.mx"
                      in dominio
                  )

              except Exception:

                  return False


          # ============================================================
          # VALIDAR DEPORTES
          #
          # MUY IMPORTANTE:
          #
          # Una noticia NO es deportiva solo porque
          # mencione NFL, balón, equipo, etc.
          #
          # Tiene que estar realmente dentro de:
          #
          # lifeandstyle.expansion.mx/deportes/
          # ============================================================

          def es_articulo_deportivo(url):

              if not es_expansion(url):
                  return False

              try:

                  dominio = (
                      urlparse(
                          url
                      ).netloc.lower()
                  )

                  ruta = (
                      urlparse(
                          url
                      ).path.lower()
                  )

                  return (
                      dominio
                      == "lifeandstyle.expansion.mx"
                      and
                      "/deportes/" in ruta
                  )

              except Exception:

                  return False


          # ============================================================
          # IMAGEN DEL FEED
          # ============================================================

          def validar_imagen(url):

              if not url:
                  return False

              url = str(
                  url
              ).strip()

              if not url.startswith(
                  (
                      "http://",
                      "https://"
                  )
              ):
                  return False

              texto = url.lower()

              prohibidas = [
                  "favicon",
                  "logo",
                  "avatar",
                  "sprite",
                  "tracking",
                  "pixel",
                  "analytics",
                  "advert",
                  "icon"
              ]

              if any(
                  palabra in texto
                  for palabra in prohibidas
              ):
                  return False

              return True


          def imagen_absoluta(
              imagen,
              pagina
          ):

              if not imagen:
                  return ""

              return urljoin(
                  pagina,
                  str(imagen).strip()
              )


          def imagen_desde_feed(entry):

              candidatos = []

              for clave in [
                  "media_content",
                  "media_thumbnail",
                  "enclosures"
              ]:

                  datos = entry.get(
                      clave,
                      []
                  )

                  if isinstance(
                      datos,
                      dict
                  ):
                      datos = [datos]

                  if not isinstance(
                      datos,
                      list
                  ):
                      continue

                  for item in datos:

                      if not isinstance(
                          item,
                          dict
                      ):
                          continue

                      for campo in [
                          "url",
                          "href"
                      ]:

                          valor = item.get(
                              campo
                          )

                          if valor:
                              candidatos.append(
                                  valor
                              )

              html = (
                  entry.get(
                      "summary",
                      ""
                  )
                  or
                  entry.get(
                      "description",
                      ""
                  )
              )

              soup = BeautifulSoup(
                  str(html),
                  "html.parser"
              )

              for img in soup.find_all(
                  "img"
              ):

                  for campo in [
                      "src",
                      "data-src",
                      "data-original",
                      "data-lazy-src"
                  ]:

                      valor = img.get(
                          campo
                      )

                      if valor:
                          candidatos.append(
                              valor
                          )

              for imagen in candidatos:

                  if validar_imagen(
                      imagen
                  ):
                      return imagen

              return ""


          # ============================================================
          # IMAGEN REAL DEL ARTÍCULO
          # ============================================================

          def obtener_imagen_real(url):

              if not url:
                  return ""

              try:

                  respuesta = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  if respuesta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      respuesta.text,
                      "html.parser"
                  )

                  pagina = respuesta.url


                  # OG IMAGE

                  for attrs in [

                      {
                          "property":
                          "og:image"
                      },

                      {
                          "property":
                          "og:image:url"
                      },

                      {
                          "name":
                          "twitter:image"
                      },

                      {
                          "name":
                          "twitter:image:src"
                      }

                  ]:

                      meta = soup.find(
                          "meta",
                          attrs=attrs
                      )

                      if not meta:
                          continue

                      imagen = meta.get(
                          "content"
                      )

                      imagen = imagen_absoluta(
                          imagen,
                          pagina
                      )

                      if validar_imagen(
                          imagen
                      ):
                          return imagen


                  # JSON-LD

                  scripts = soup.find_all(
                      "script",
                      type="application/ld+json"
                  )

                  for script in scripts:

                      try:

                          texto = (
                              script.string
                              or
                              script.get_text()
                          )

                          datos = json.loads(
                              texto
                          )

                      except Exception:

                          continue

                      objetos = []

                      if isinstance(
                          datos,
                          dict
                      ):
                          objetos.append(
                              datos
                          )

                      elif isinstance(
                          datos,
                          list
                      ):
                          objetos.extend(
                              datos
                          )

                      for obj in objetos:

                          if not isinstance(
                              obj,
                              dict
                          ):
                              continue

                          imagen = obj.get(
                              "image"
                          )

                          if isinstance(
                              imagen,
                              str
                          ):

                              imagen = imagen_absoluta(
                                  imagen,
                                  pagina
                              )

                              if validar_imagen(
                                  imagen
                              ):
                                  return imagen

                          elif isinstance(
                              imagen,
                              list
                          ):

                              for item in imagen:

                                  if isinstance(
                                      item,
                                      str
                                  ):

                                      item = imagen_absoluta(
                                          item,
                                          pagina
                                      )

                                      if validar_imagen(
                                          item
                                      ):
                                          return item

                                  elif isinstance(
                                      item,
                                      dict
                                  ):

                                      item = item.get(
                                          "url"
                                      )

                                      item = imagen_absoluta(
                                          item,
                                          pagina
                                      )

                                      if validar_imagen(
                                          item
                                      ):
                                          return item


                  # IMÁGENES DEL ARTÍCULO

                  selectores = [

                      "article img",
                      "main img",
                      "[itemprop='image']",
                      ".article img",
                      ".article-content img",
                      ".content img"

                  ]

                  for selector in selectores:

                      for img in soup.select(
                          selector
                      ):

                          src = (

                              img.get("src")
                              or
                              img.get("data-src")
                              or
                              img.get("data-original")
                              or
                              img.get("data-lazy-src")
                          )

                          if not src:
                              continue

                          src = imagen_absoluta(
                              src,
                              pagina
                          )

                          if validar_imagen(
                              src
                          ):
                              return src

              except Exception as error:

                  print(
                      "Error imagen:",
                      error
                  )

              return ""


          # ============================================================
          # FECHA
          # ============================================================

          def obtener_fecha(entry):

              for campo in [
                  "published",
                  "updated",
                  "created"
              ]:

                  valor = entry.get(
                      campo
                  )

                  if not valor:
                      continue

                  try:

                      fecha = dateparser.parse(
                          valor
                      )

                      if fecha.tzinfo is None:

                          fecha = fecha.replace(
                              tzinfo=timezone.utc
                          )

                      return fecha.isoformat()

                  except Exception:
                      pass

              return datetime.now(
                  timezone.utc
              ).isoformat()


          # ============================================================
          # LEER RSS GENERAL
          # ============================================================

          def leer_fuente(
              nombre,
              url,
              categoria
          ):

              resultado = []

              print(
                  "RSS:",
                  nombre
              )

              try:

                  feed = feedparser.parse(
                      url
                  )

                  for entry in feed.entries:

                      titulo = limpiar_html(
                          entry.get(
                              "title",
                              ""
                          )
                      )

                      link = obtener_url_original(
                          entry.get(
                              "link",
                              ""
                          )
                      )

                      if not titulo or not link:
                          continue

                      if not es_expansion(link):
                          continue

                      # Si el artículo general realmente
                      # pertenece a Deportes, lo mandamos
                      # a Deportes y no a Economía/Noticias.

                      if es_articulo_deportivo(
                          link
                      ):
                          categoria_final = "Deportes"
                      else:
                          categoria_final = categoria

                      descripcion = limpiar_html(
                          entry.get(
                              "summary",
                              ""
                          )
                          or
                          entry.get(
                              "description",
                              ""
                          )
                      )

                      imagen = imagen_desde_feed(
                          entry
                      )

                      resultado.append({

                          "titulo":
                              titulo,

                          "descripcion":
                              descripcion[:700],

                          "url":
                              link,

                          "imagen":
                              imagen,

                          "categoria":
                              categoria_final,

                          "subcategoria":
                              "",

                          "fuente":
                              nombre,

                          "fecha":
                              obtener_fecha(
                                  entry
                              )

                      )

              except Exception as error:

                  print(
                      "ERROR RSS:",
                      error
                  )

              return resultado[
                  :MAX_POR_FUENTE
              ]


          # ============================================================
          # GOOGLE NEWS RSS
          # ============================================================

