              "inter de milan",

              "ac milan",

              "juventus",

              "napoli",

              "roma",

              "sevilla",

              "betis",

              "liguilla",

              "apertura",
              "clausura",

              "gol",
              "goles",

              "marcador",

              "jugador",
              "jugadores",

              "entrenador",

              "director tecnico",

              "portero",

              "delantero",

              "defensa",

              "mediocampista",

              "fichaje",
              "fichajes",

              "mercado de fichajes",

              "arbitro",
              "arbitraje",

              "penal",
              "penaltis",

              "tarjeta roja",
              "tarjeta amarilla"

          ]


          # ============================================================
          # OTROS DEPORTES
          # ============================================================

          OTROS_DEPORTES_TERMS = [

              "nba",
              "nfl",
              "mlb",
              "nhl",

              "tenis",
              "atp",
              "wta",

              "boxeo",
              "box",

              "beisbol",
              "béisbol",

              "basquetbol",
              "baloncesto",

              "formula 1",
              "formula1",
              "f1",

              "gran premio",
              "piloto",
              "pilotos",

              "red bull",
              "ferrari",
              "mclaren",
              "mercedes",

              "checo perez",

              "super bowl",

              "olimpico",
              "olimpicos",

              "medalla",
              "atleta",
              "atletismo",

              "lucha libre",
              "wwe",
              "ufc",

              "deporte",
              "deportes",

              "mundialista"

          ]


          # ============================================================
          # POLÍTICA
          # ============================================================

          POLITICA_TERMS = [

              "presidente",
              "presidenta",
              "presidencia",

              "gobierno",

              "gobernador",
              "gobernadora",

              "politica",
              "politico",
              "politica",

              "eleccion",
              "elecciones",

              "votacion",
              "votos",

              "congreso",

              "senado",

              "diputado",
              "diputada",

