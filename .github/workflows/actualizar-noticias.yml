name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml

      - name: Actualizar noticias
        run: |
          cat > actualizar.py <<'PY'
          import os
          import re
          import json
          import hashlib
          import html
          import unicodedata
          from datetime import datetime, timezone, timedelta
          from urllib.parse import quote_plus, urlparse, urljoin

          import feedparser
          import requests
          from bs4 import BeautifulSoup

          ARCHIVO = "noticias.json"

          MAX_TOTAL = 1200
          MAX_POR_FEED = 30

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/140.0 Safari/537.36"
          )

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept-Language": "es-MX,es;q=0.9,en;q=0.8"
          }

          AHORA = datetime.now(timezone.utc)
          LIMITE_DIAS = 14

          # =========================================================
          # FUENTES GENERALES
          # =========================================================

          FUENTES_GENERALES = {
              "Expansión": [
                  ("Noticias", "https://expansion.mx/rss"),
                  ("Mundo", "https://expansion.mx/rss/internacional"),
                  ("Dinero", "https://expansion.mx/rss/economia"),
                  ("Tecnologia", "https://expansion.mx/rss/tecnologia"),
                  ("Tendencias", "https://expansion.mx/rss/tendencias"),
                  ("Empresas", "https://expansion.mx/rss/empresas"),
                  ("Politica", "https://expansion.mx/rss/politica")
              ]
          }

          # =========================================================
          # FUENTES DEPORTIVAS
          # Todo sigue entrando al mismo noticias.json
          # =========================================================

          FUENTES_DEPORTIVAS = {
              "futbol": [
                  ("ESPN", "https://www.espn.com/espn/rss/soccer/news"),
                  ("Google News", "fútbol México Liga MX Selección Mexicana"),
                  ("Google News", "Champions League fútbol")
              ],

              "tenis": [
                  ("ESPN", "https://www.espn.com/espn/rss/tennis/news"),
                  ("Google News", "tenis ATP WTA")
              ],

              "beisbol": [
                  ("ESPN", "https://www.espn.com/espn/rss/mlb/news"),
                  ("Google News", "MLB béisbol")
              ],

              "nfl": [
                  ("ESPN", "https://www.espn.com/espn/rss/nfl/news")
              ],

              "basquetbol": [
                  ("ESPN", "https://www.espn.com/espn/rss/nba/news")
              ],

              "boxeo": [
                  ("ESPN", "https://www.espn.com/espn/rss/boxing/news"),
                  ("Google News", "Canelo boxeo")
              ],

              "formula1": [
                  ("ESPN", "https://www.espn.com/espn/rss/rpm/news"),
                  ("Google News", "Fórmula 1 F1 Checo Pérez")
              ],

              "otros": [
                  ("ESPN", "https://www.espn.com/espn/rss/golf/news")
              ]
          }

          PALABRAS_DEPORTIVAS = {
              "futbol": [
                  "fútbol",
                  "futbol",
                  "liga mx",
                  "selección mexicana",
                  "champions",
                  "premier league",
                  "la liga",
                  "liga española",
                  "mundial de clubes"
              ],

              "tenis": [
                  "tenis",
                  "atp",
                  "wta",
                  "roland garros",
                  "wimbledon",
                  "us open",
                  "australian open"
              ],

              "beisbol": [
                  "béisbol",
                  "beisbol",
                  "mlb",
                  "grand slam",
                  "home run",
                  "jonrón"
              ],

              "nfl": [
                  "nfl",
                  "super bowl"
              ],

              "basquetbol": [
                  "nba",
                  "basquetbol",
                  "baloncesto"
              ],

              "boxeo": [
                  "boxeo",
                  "canelo",
                  "peleador",
                  "pelea de boxeo"
              ],

              "formula1": [
                  "fórmula 1",
                  "formula 1",
                  "f1",
                  "checo pérez",
                  "gran premio"
              ]
          }

          # =========================================================
          # TEXTO
          # =========================================================

          def normalizar(t):
              if not t:
                  return ""

              t = html.unescape(str(t))
              t = unicodedata.normalize("NFKD", t)

              t = "".join(
                  c for c in t
                  if not unicodedata.combining(c)
              )

              t = t.lower()

              return re.sub(
                  r"\s+",
                  " ",
                  t
              ).strip()


          def limpiar_html(t):
              if not t:
                  return ""

              soup = BeautifulSoup(
                  str(t),
                  "html.parser"
              )

              return re.sub(
                  r"\s+",
                  " ",
                  html.unescape(
                      soup.get_text(
                          " ",
                          strip=True
                      )
                  )
              ).strip()


          def fecha_entry(e):
              try:
                  if getattr(
                      e,
                      "published_parsed",
                      None
                  ):
                      import calendar

                      return datetime.fromtimestamp(
                          calendar.timegm(
                              e.published_parsed
                          ),
                          timezone.utc
                      )

                  if getattr(
                      e,
                      "updated_parsed",
                      None
                  ):
                      import calendar

                      return datetime.fromtimestamp(
                          calendar.timegm(
                              e.updated_parsed
                          ),
                          timezone.utc
                      )

              except Exception:
                  pass

              return AHORA


          def fecha_iso(f):
              return f.astimezone(
                  timezone.utc
              ).isoformat()


          def hash_noticia(t, u):
              return hashlib.sha256(
                  (
                      normalizar(t)[:500]
                      + "|"
                      + normalizar(u)
                  ).encode(
                      "utf-8"
                  )
              ).hexdigest()


          def url_valida(u):
              try:
                  p = urlparse(str(u))

                  return (
                      p.scheme in ("http", "https")
                      and bool(p.netloc)
                  )

              except Exception:
                  return False

          # =========================================================
          # IMÁGENES
          # =========================================================

          def es_imagen_invalid(u):
              if not u:
                  return True

              l = str(u).lower()

              bloqueadas = [
                  "gstatic.com/images/branding/googlelogo",
                  "news.google.com/rss",
                  "favicon",
                  "1x1.gif",
                  "spacer.gif",
                  "pixel.gif",
                  "transparent.gif",
                  "data:image",
                  "googleusercontent.com/img/b"
              ]

              return any(
                  x in l
                  for x in bloqueadas
              )


          def normalizar_imagen(u):
              if not u:
                  return ""

              u = str(u).strip()

              if u.startswith("//"):
                  u = "https:" + u

              try:
                  p = urlparse(u)

                  if not p.scheme or not p.netloc:
                      return ""

                  return (
                      p.scheme.lower()
                      + "://"
                      + p.netloc.lower()
                      + p.path.rstrip("/")
                  )

              except Exception:
                  return ""


          def agregar_candidato(lista, url, base_url=""):
              if not url:
                  return

              url = str(url).strip()

              if url.startswith("//"):
                  url = "https:" + url

              if base_url:
                  url = urljoin(
                      base_url,
                      url
                  )

              if not url_valida(url):
                  return

              if es_imagen_invalid(url):
                  return

              normalizada = normalizar_imagen(
                  url
              )

              if not normalizada:
                  return

              existentes = {
                  normalizar_imagen(x)
                  for x in lista
              }

              if normalizada not in existentes:
                  lista.append(url)


          def obtener_imagenes_entry(entry):
              candidatos = []

              # -----------------------------------------------------
              # summary / description
              # -----------------------------------------------------

              for campo in [
                  "summary",
                  "description",
                  "content"
              ]:

                  contenido = entry.get(
                      campo,
                      ""
                  )

                  if isinstance(
                      contenido,
                      list
                  ):
                      for item in contenido:
                          if isinstance(
                              item,
                              dict
                          ):
                              contenido_html = (
                                  item.get(
                                      "value",
                                      ""
                                  )
                              )
                          else:
                              contenido_html = str(
                                  item
                              )

                          soup = BeautifulSoup(
                              contenido_html,
                              "html.parser"
                          )

                          for img in soup.find_all(
                              "img"
                          ):
                              agregar_candidato(
                                  candidatos,
                                  img.get("src"),
                                  ""
                              )

                  else:
                      soup = BeautifulSoup(
                          str(contenido),
                          "html.parser"
                      )

                      for img in soup.find_all(
                          "img"
                      ):
                          agregar_candidato(
                              candidatos,
                              img.get("src"),
                              ""
                          )

              # -----------------------------------------------------
              # media_content
              # -----------------------------------------------------

              for key in [
                  "media_content",
                  "media_thumbnail"
              ]:

                  for item in entry.get(
                      key,
                      []
                  ):

                      if not isinstance(
                          item,
                          dict
                      ):
                          continue

                      for campo in [
                          "url",
                          "href"
                      ]:

                          agregar_candidato(
                              candidatos,
                              item.get(
                                  campo,
                                  ""
                              )
                          )

              # -----------------------------------------------------
              # enclosure
              # -----------------------------------------------------

              for item in entry.get(
                  "enclosures",
                  []
              ):

                  if not isinstance(
                      item,
                      dict
                  ):
                      continue

                  agregar_candidato(
                      candidatos,
                      item.get(
                          "href",
                          ""
                      )
                  )

                  agregar_candidato(
                      candidatos,
                      item.get(
                          "url",
                          ""
                      )
                  )

              return candidatos


          def obtener_imagenes_pagina(
              url_noticia
          ):
              candidatos = []

              url_a_scrapear = url_noticia

              if (
                  "news.google.com"
                  in url_noticia
              ):

                  url_a_scrapear = resolver_url_real(
                      url_noticia
                  )

                  if (
                      "news.google.com"
                      in url_a_scrapear
                  ):
                      return candidatos

              try:
                  resp = requests.get(
                      url_a_scrapear,
                      headers=HEADERS,
                      timeout=8,
                      allow_redirects=True
                  )

                  if resp.status_code != 200:
                      return candidatos

                  soup = BeautifulSoup(
                      resp.text,
                      "lxml"
                  )

                  # -------------------------------------------------
                  # Open Graph / Twitter
                  # -------------------------------------------------

                  for meta in soup.find_all(
                      "meta"
                  ):

                      prop = str(
                          meta.get(
                              "property",
                              ""
                          )
                      ).lower()

                      name = str(
                          meta.get(
                              "name",
                              ""
                          )
                      ).lower()

                      if (
                          prop in [
                              "og:image",
                              "og:image:url",
                              "og:image:secure_url"
                          ]
                          or name in [
                              "twitter:image",
                              "twitter:image:src"
                          ]
                      ):

                          agregar_candidato(
                              candidatos,
                              meta.get(
                                  "content"
                              ),
                              url_a_scrapear
                          )

                  # -------------------------------------------------
                  # Imágenes del HTML
                  # -------------------------------------------------

                  for img in soup.find_all(
                      "img"
                  ):

                      for atributo in [
                          "src",
                          "data-src",
                          "data-original",
                          "data-lazy-src",
                          "data-image",
                          "data-url"
                      ]:

                          agregar_candidato(
                              candidatos,
                              img.get(
                                  atributo
                              ),
                              url_a_scrapear
                          )

                      srcset = img.get(
                          "srcset"
                      )

                      if srcset:
                          partes = srcset.split(",")

                          for parte in partes:
                              url_img = (
                                  parte.strip()
                                  .split(" ")[0]
                              )

                              agregar_candidato(
                                  candidatos,
                                  url_img,
                                  url_a_scrapear
                              )

              except Exception:
                  return candidatos

              return candidatos


          def resolver_url_real(
              url_google
          ):
              try:
                  r = requests.get(
                      url_google,
                      headers=HEADERS,
                      timeout=8,
                      allow_redirects=True
                  )

                  final = r.url

                  if (
                      "news.google.com"
                      not in final
                      and url_valida(final)
                  ):
                      return final

              except Exception:
                  pass

              return url_google


          def obtener_imagen_unica(
              entry,
              url,
              imagenes_usadas
          ):

              # =====================================================
              # AQUÍ ESTÁ LA CORRECCIÓN PRINCIPAL
              #
              # Antes:
              #   primera imagen repetida -> imagen=""
              #
              # Ahora:
              #   primera imagen repetida -> busca otra
              #   segunda repetida -> busca otra
              #   tercera válida -> la utiliza
              # =====================================================

              candidatos = []

              # Primero imágenes entregadas por el RSS.
              candidatos.extend(
                  obtener_imagenes_entry(
                      entry
                  )
              )

              # Después imágenes de la página.
              if url:
                  candidatos.extend(
                      obtener_imagenes_pagina(
                          url
                      )
                  )

              revisadas = set()

              for imagen in candidatos:

                  normalizada = normalizar_imagen(
                      imagen
                  )

                  if not normalizada:
                      continue

                  if normalizada in revisadas:
                      continue

                  revisadas.add(
                      normalizada
                  )

                  # Imagen ya utilizada:
                  # probar la siguiente.
                  if normalizada in imagenes_usadas:
                      continue

                  imagenes_usadas.add(
                      normalizada
                  )

                  return imagen

              # No hubo ninguna imagen disponible
              # y única.
              return ""

          # =========================================================
          # NOTICIAS
          # =========================================================

          def obtener_fuente_entry(
              entry,
              default
          ):
              try:
                  s = entry.get(
                      "source"
                  )

                  if (
                      isinstance(
                          s,
                          dict
                      )
                      and s.get("title")
                  ):

                      return limpiar_html(
                          s.get(
                              "title"
                          )
                      )

              except Exception:
                  pass

              return default


          def clasificar_deporte(
              t,
              d="",
              c=""
          ):

              tx = normalizar(
                  f"{t} {d} {c}"
              )

              for dep, pals in PALABRAS_DEPORTIVAS.items():

                  for p in pals:

                      if normalizar(p) in tx:
                          return dep

              return None


          def limpiar_titulo(t):

              t = limpiar_html(
                  t
              )

              t = re.sub(
                  r"\s+\|\s+[^|]{2,60}$",
                  "",
                  t
              )

              return t.strip()


          def construir_noticia(
              entry,
              fuente,
              categoria,
              subcat=None
          ):

              titulo = limpiar_titulo(
                  entry.get(
                      "title",
                      ""
                  )
              )

              url = (
                  entry.get(
                      "link"
                  )
                  or entry.get(
                      "id"
                  )
                  or ""
              )

              if (
                  not titulo
                  or not url_valida(url)
              ):
                  return None

              desc = limpiar_html(
                  entry.get(
                      "summary"
                  )
                  or entry.get(
                      "description"
                  )
                  or ""
              )[:500]

              fecha = fecha_entry(
                  entry
              )

              if (
                  AHORA - fecha
                  > timedelta(
                      days=LIMITE_DIAS
                  )
              ):
                  return None

              if subcat:

                  cat_final = "Deportes"
                  sub_final = subcat

              else:

                  cat_final = categoria
                  sub_final = ""

              if cat_final == "Deportes":

                  det = clasificar_deporte(
                      titulo,
                      desc,
                      sub_final
                  )

                  if det:
                      sub_final = det

              return {
                  "id": hash_noticia(
                      titulo,
                      url
                  ),

                  "titulo": titulo,

                  "descripcion": desc,

                  "url": url,

                  "imagen": "",

                  "fecha": fecha_iso(
                      fecha
                  ),

                  "fuente": fuente,

                  "categoria": cat_final,

                  "subcategoria": sub_final
              }


          def descargar_feed(
              url
          ):

              try:

                  r = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=20
                  )

                  if r.status_code != 200:
                      print(
                          "Feed HTTP",
                          r.status_code,
                          url
                      )

                      return None

                  return feedparser.parse(
                      r.content
                  )

              except Exception as e:

                  print(
                      "Error feed:",
                      url,
                      e
                  )

                  return None


          def construir_google_news_url(
              q
          ):

              return (
                  "https://news.google.com/rss/search?"
                  + "q="
                  + quote_plus(q)
                  + "&hl=es-419"
                  + "&gl=MX"
                  + "&ceid=MX:es-419"
              )


          # =========================================================
          # CARGAR JSON EXISTENTE
          # =========================================================

          def cargar_json():

              if not os.path.exists(
                  ARCHIVO
              ):

                  return {
                      "actualizado": "",
                      "total": 0,
                      "imagenes": {},
                      "noticias": []
                  }

              try:

                  with open(
                      ARCHIVO,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      d = json.load(
                          f
                      )

                  if isinstance(
                      d,
                      list
                  ):

                      return {
                          "actualizado": "",
                          "total": len(d),
                          "imagenes": {},
                          "noticias": d
                      }

                  if not isinstance(
                      d,
                      dict
                  ):

                      return {
                          "actualizado": "",
                          "total": 0,
                          "imagenes": {},
                          "noticias": []
                      }

                  if not isinstance(
                      d.get(
                          "noticias"
                      ),
                      list
                  ):

                      d["noticias"] = []

                  return d

              except Exception:

                  return {
                      "actualizado": "",
                      "total": 0,
                      "imagenes": {},
                      "noticias": []
                  }


          datos = cargar_json()

          mapa = {}

          imagenes_usadas = set()

          # =========================================================
          # CONSERVAR TODO LO EXISTENTE
          # =========================================================

          for n in datos.get(
              "noticias",
              []
          ):

              if not isinstance(
                  n,
                  dict
              ):
                  continue

              nid = (
                  n.get(
                      "id"
                  )
                  or hash_noticia(
                      n.get(
                          "titulo",
                          ""
                      ),
                      n.get(
                          "url",
                          ""
                      )
                  )
              )

              n["id"] = nid

              mapa[nid] = n

              imagen_existente = normalizar_imagen(
                  n.get(
                      "imagen",
                      ""
                  )
              )

              if (
                  imagen_existente
                  and not es_imagen_invalid(
                      n.get(
                          "imagen",
                          ""
                      )
                  )
              ):

                  imagenes_usadas.add(
                      imagen_existente
                  )


          # =========================================================
          # COMPROBAR SI LA NOTICIA YA EXISTE
          # =========================================================

          def ya_existe(
              entry
          ):

              t = limpiar_titulo(
                  entry.get(
                      "title",
                      ""
                  )
              )

              u = (
                  entry.get(
                      "link"
                  )
                  or entry.get(
                      "id"
                  )
                  or ""
              )

              if (
                  not t
                  or not url_valida(u)
              ):

                  return True

              return (
                  hash_noticia(
                      t,
                      u
                  )
                  in mapa
              )


          nuevas = 0

          # =========================================================
          # FUENTES GENERALES
          # =========================================================

          for fuente, feeds in FUENTES_GENERALES.items():

              for cat, url in feeds:

                  feed = descargar_feed(
                      url
                  )

                  if not feed:
                      continue

                  for entry in feed.entries[
                      :MAX_POR_FEED
                  ]:

                      # ------------------------------------------------
                      # MUY IMPORTANTE:
                      # primero comprobar si ya existe.
                      # ------------------------------------------------

                      if ya_existe(
                          entry
                      ):
                          continue

                      notic = construir_noticia(
                          entry,
                          fuente,
                          cat
                      )

                      if not notic:
                          continue

                      # ------------------------------------------------
                      # Solamente una noticia NUEVA busca imagen.
                      # ------------------------------------------------

                      notic["imagen"] = (
                          obtener_imagen_unica(
                              entry,
                              notic["url"],
                              imagenes_usadas
                          )
                      )

                      mapa[
                          notic["id"]
                      ] = notic

                      nuevas += 1

          # =========================================================
          # DEPORTES
          # =========================================================

          for deporte, feeds in FUENTES_DEPORTIVAS.items():

              for fuente, ref in feeds:

                  if fuente == "Google News":

                      url = construir_google_news_url(
                          ref
                      )

                  else:

                      url = ref

                  feed = descargar_feed(
                      url
                  )

                  if not feed:
                      continue

                  for entry in feed.entries[
                      :MAX_POR_FEED
                  ]:

                      # ------------------------------------------------
                      # No tocar noticias existentes.
                      # ------------------------------------------------

                      if ya_existe(
                          entry
                      ):
                          continue

                      notic = construir_noticia(
                          entry,
                          obtener_fuente_entry(
                              entry,
                              fuente
                          ),
                          "Deportes",
                          deporte
                      )

                      if not notic:
                          continue

                      # ------------------------------------------------
                      # Buscar imagen solamente para noticias nuevas.
                      # ------------------------------------------------

                      notic["imagen"] = (
                          obtener_imagen_unica(
                              entry,
                              notic["url"],
                              imagenes_usadas
                          )
                      )

                      mapa[
                          notic["id"]
                      ] = notic

                      nuevas += 1

          # =========================================================
          # ORDENAR
          # =========================================================

          noticias = list(
              mapa.values()
          )

          noticias.sort(
              key=lambda n: n.get(
                  "fecha",
                  ""
              ),
              reverse=True
          )

          # =========================================================
          # ELIMINAR DUPLICADOS POR URL
          # =========================================================

          vistos = set()

          resultado = []

          for n in noticias:

              u = str(
                  n.get(
                      "url",
                      ""
                  )
              ).split(
                  "#"
              )[0].strip().lower()

              if not u:
                  continue

              if u in vistos:
                  continue

              vistos.add(
                  u
              )

              resultado.append(
                  n
              )

          # =========================================================
          # MÁXIMO DE NOTICIAS
          # =========================================================

          resultado = resultado[
              :MAX_TOTAL
          ]

          # =========================================================
          # ESTADÍSTICAS
          # =========================================================

          con = sum(
              1
              for n in resultado
              if n.get(
                  "imagen"
              )
          )

          sin = (
              len(resultado)
              - con
          )

          # Contar imágenes únicas
          imagenes_finales = set()

          for n in resultado:

              img = normalizar_imagen(
                  n.get(
                      "imagen",
                      ""
                  )
              )

              if img:
                  imagenes_finales.add(
                      img
                  )

          # =========================================================
          # SALIDA FINAL
          # =========================================================

          salida = {
              "actualizado": datetime.now(
                  timezone.utc
              ).isoformat(),

              "total": len(
                  resultado
              ),

              "imagenes": {
                  "con_imagen": con,
                  "sin_imagen": sin,
                  "imagenes_unicas": len(
                      imagenes_finales
                  )
              },

              "noticias": resultado
          }

          with open(
              ARCHIVO,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  salida,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "========================================"
          )

          print(
              f"Nuevas: {nuevas}"
          )

          print(
              f"Final: {len(resultado)}"
          )

          print(
              f"Con imagen: {con}"
          )

          print(
              f"Sin imagen: {sin}"
          )

          print(
              f"Imagenes únicas: {len(imagenes_finales)}"
          )

          print(
              "========================================"

          )

          PY

          python actualizar.py

