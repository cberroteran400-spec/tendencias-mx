​def normalizar_texto(texto):
if not texto:
return ""
texto = re.sub(r'<[^>]+>', '', texto)
texto = urllib.parse.unquote(texto)
return re.sub(r'\s+', ' ', texto).strip()
​def resolver_url_google(url_google):
"""Resuelve redirecciones de Google News a la URL final del portal."""
if "news.google.com" not in url_google:
return url_google
try:
res = SESSION.head(url_google, allow_redirects=True, timeout=6)
final_url = res.url
if "news.google.com" not in final_url and "expansion.mx" in final_url:
return final_url.split('?')[0]
except Exception:
pass
try:
res = SESSION.get(url_google, timeout=6)
soup = BeautifulSoup(res.text, 'html.parser')
for a in soup.find_all('a', href=True):
href = a['href']
if "expansion.mx" in href and "google.com" not in href:
return href.split('?')[0]
except Exception:
pass
return None
​def determinar_categoria_y_subcategoria(url, titulo, descripcion):
"""Clasifica categóricamente respetando las reglas de aislamiento estricto."""
url_lower = url.lower()
texto_full = f"{titulo} {descripcion}".lower()
​es_deportes_domain = "/deportes/" in url_lower or "lifeandstyle.expansion.mx/deportes" in url_lower
​if es_deportes_domain:
# Subclasificación de Deportes
if any(w in texto_full for w in ["nfl", "super bowl", "game pass", "touchdown", "quarterback", "futbol americano", "49ers", "chiefs", "cowboys", "bills", "patriots", "packers", "eagles", "ravens", "steelers", "vikings", "broncos", "dolphins"]):
return "Deportes", "NFL"
if any(w in texto_full for w in ["liga mx", "club américa", "américa vs", "chivas", "cruz azul", "pumas", "tigres", "rayados", "monterrey fútbol", "toluca", "atlas", "santos laguna", "necaxa", "pachuca", "león", "querétaro", "mazatlán", "san luis", "juárez", "xolos", "tijuana fútbol"]):
return "Deportes", "Liga MX"
if any(w in texto_full for w in ["f1", "fórmula 1", "checo pérez", "checo perez", "verstappen", "hamilton", "leclerc", "norris", "alonso", "red bull racing"]):
return "Deportes", "Fórmula 1"
if any(w in texto_full for w in ["mlb", "yankees", "dodgers", "ohtani", "diablos rojos", "béisbol", "beisbol"]):
return "Deportes", "Béisbol"
if any(w in texto_full for w in ["nba", "wnba", "fiba", "lakers", "warriors", "celtics", "básquetbol", "basquetbol", "baloncesto"]):
return "Deportes", "Básquetbol"
if any(w in texto_full for w in ["atp", "wta", "wimbledon", "us open", "alcaraz", "sinner", "djokovic", "nadal", "tenis"]):
return "Deportes", "Tenis"
if any(w in texto_full for w in ["canelo", "pitbull cruz", "ryan garcia", "gervonta", "boxeo", "boxer", "box"]):
return "Deportes", "Boxeo"
if any(w in texto_full for w in ["motogp", "nascar", "indycar", "rally", "wrc", "automovilismo", "motociclismo", "motor"]):
return "Deportes", "Motor"
if any(w in texto_full for w in ["fútbol", "futbol", "champions league", "premier league", "laliga", "serie a", "bundesliga", "ligue 1", "mundial", "copa del mundo", "mundial de clubes", "selección mexicana", "mls", "inter miami", "real madrid", "barcelona", "manchester united", "manchester city", "liverpool", "arsenal", "bayern", "psg", "messi", "mbappé", "cristiano ronaldo", "haaland"]):
return "Deportes", "Fútbol"
return "Deportes", "Otros"
​# REGLA ABSOLUTA: Si no está en /deportes/, NUNCA es Deportes
if "/economia/" in url_lower or "expansion.mx/economia" in url_lower:
return "Dinero", "Economía"
if "/finanzas/" in url_lower or "/mercados/" in url_lower:
return "Dinero", "Finanzas"
if "/tecnologia/" in url_lower:
return "Tecnologia", "General"
if "/empresas/" in url_lower:
return "Empresas", "Negocios"
if "/politica/" in url_lower:
return "Politica", "Nacional"
if "/mundo/" in url_lower or "/internacional/" in url_lower:
return "Mundo", "Internacional"
if "lifeandstyle.expansion.mx" in url_lower or "/tendencias/" in url_lower:
return "Tendencias", "Estilo de Vida"
​# Palabras clave por texto si la URL es genérica
if any(w in texto_full for w in ["inflación", "inflacion", "banxico", "peso mexicano", "t-mec", "tmec", "gasolina", "impuestos", "tarifa"]):
return "Dinero", "Economía"
if any(w in texto_full for w in ["trump", "reforma", "diputados", "senado", "elecciones", "gobierno"]):
return "Politica", "Nacional"
​return "Noticias", "General"
​def extraer_imagen_real(url, imagen_rss=None):
"""Extrae la imagen principal real priorizando metadatos del artículo."""
if imagen_rss and not any(bad in imagen_rss.lower() for bad in ["logo", "default", "placeholder", "icon"]):
return imagen_rss
​try:
res = SESSION.get(url, timeout=7)
if res.status_code != 200:
return ""
​soup = BeautifulSoup(res.text, 'html.parser')
​# 1. Open Graph image
og_img = soup.find('meta', property='og:image')
if og_img and og_img.get('content'):
img_url = og_img['content'].strip()
if not any(bad in img_url.lower() for bad in ["logo", "default", "placeholder", "icon"]):
return img_url
​# 2. Twitter image
tw_img = soup.find('meta', attrs={'name': 'twitter:image'})
if tw_img and tw_img.get('content'):
img_url = tw_img['content'].strip()
if not any(bad in img_url.lower() for bad in ["logo", "default", "placeholder", "icon"]):
return img_url
​# 3. JSON-LD
scripts = soup.find_all('script', type='application/ld+json')
for script in scripts:
if script.string:
try:
data = json.loads(script.string)
if isinstance(data, list):
data = data[0]
if isinstance(data, dict):
img = data.get('image')
if isinstance(img, dict) and img.get('url'):
return img['url']
elif isinstance(img, list) and len(img) > 0:
return img[0]
elif isinstance(img, str):
return img
except Exception:
pass
​# 4. Primera imagen del cuerpo del artículo
for img in soup.find_all('img'):
src = img.get('src') or img.get('data-src')
if src and "http" in src and not any(bad in src.lower() for bad in ["logo", "default", "avatar", "icon"]):
return src
​except Exception:
pass
​return ""
​def recolectar_noticias():
raw_items = []
seen_urls = set()
seen_titles = set()
​print("=== INICIANDO RECOLECCIÓN DE FEEDS RSS OFICIALES ===")
for cat_default, rss_url in RSS_FEEDS:
try:
feed = feedparser.parse(rss_url)
for entry in feed.entries:
url = entry.get('link', '').split('?')[0]
titulo = normalizar_texto(entry.get('title', ''))
desc = normalizar_texto(entry.get('summary', entry.get('description', '')))
fecha = entry.get('published', datetime.now().isoformat())
​img_rss = ""
if 'media_content' in entry and len(entry.media_content) > 0:
img_rss = entry.media_content[0].get('url', '')
elif 'enclosures' in entry and len(entry.enclosures) > 0:
img_rss = entry.enclosures[0].get('href', '')
​if url and "expansion.mx" in url and url not in seen_urls and titulo not in seen_titles:
seen_urls.add(url)
seen_titles.add(titulo)
raw_items.append({
'url': url,
'titulo': titulo,
'descripcion': desc,
'fecha': fecha,
'imagen_rss': img_rss
})
except Exception as e:
print(f"Error procesando feed {rss_url}: {e}")
​print(f"Noticias obtenidas de RSS oficiales: {len(raw_items)}")
​print("=== INICIANDO BÚSQUEDAS EN GOOGLE NEWS RSS ===")
for query in SEARCH_QUERIES:
encoded_q = urllib.parse.quote(query)
gnews_url = f"https://news.google.com/rss/search?q={encoded_q}&hl=es-MX&gl=MX&ceid=MX:es-419"
try:
feed = feedparser.parse(gnews_url)
for entry in feed.entries:
g_url = entry.get('link', '')
titulo = normalizar_texto(entry.get('title', ''))
desc = normalizar_texto(entry.get('summary', entry.get('description', '')))
fecha = entry.get('published', datetime.now().isoformat())
​if titulo in seen_titles:
continue
​real_url = resolver_url_google(g_url)
if real_url and "expansion.mx" in real_url and real_url not in seen_urls:
seen_urls.add(real_url)
seen_titles.add(titulo)
raw_items.append({
'url': real_url,
'titulo': titulo,
'descripcion': desc,
'fecha': fecha,
'imagen_rss': ""
})
except Exception as e:
print(f"Error en búsqueda '{query}': {e}")
​print(f"Total de noticias únicas deduplicadas recolectadas: {len(raw_items)}")
return raw_items
​def procesar_imagenes_y_clasificacion(noticias_raw):
print("=== INICIANDO PROCESAMIENTO PARALELO DE IMÁGENES Y CLASIFICACIÓN ===")
noticias_finales = []
​def procesar_item(item):
cat, subcat = determinar_categoria_y_subcategoria(item['url'], item['titulo'], item['descripcion'])
img_final = extraer_imagen_real(item['url'], item['imagen_rss'])
​return {
"titulo": item['titulo'],
"descripcion": item['descripcion'],
"url": item['url'],
"imagen": img_final,
"fecha": item['fecha'],
"fuente": "Expansión",
"categoria": cat,
"subcategoria": subcat
}
​with ThreadPoolExecutor(max_workers=10) as executor:
futures = [executor.submit(procesar_item, item) for item in noticias_raw]
for future in as_completed(futures):
try:
res = future.result()
if res:
noticias_finales.append(res)
except Exception as e:
print(f"Error procesando noticia individual: {e}")
​return noticias_finales
​def main():
items_raw = recolectar_noticias()
noticias = procesar_imagenes_y_clasificacion(items_raw)
​# Contadores estadísticos
cat_counts = {}
subcat_counts = {}
con_imagen = 0
sin_imagen = 0
imagenes_set = set()
​deportes_count = 0
​for n in noticias:
c = n['categoria']
sc = n['subcategoria']
cat_counts[c] = cat_counts.get(c, 0) + 1
subcat_counts[sc] = subcat_counts.get(sc, 0) + 1
​if c == "Deportes":
deportes_count += 1
​if n['imagen']:
con_imagen += 1
imagenes_set.add(n['imagen'])
else:
sin_imagen += 1
​resultado_json = {
"actualizado": datetime.now().isoformat(),
"fuente": "Expansión + Life & Style",
"total": len(noticias),
"imagenes": {
"con_imagen": con_imagen,
"sin_imagen": sin_imagen,
"imagenes_unicas": len(imagenes_set)
},
"categorias": cat_counts,
"subcategorias": subcat_counts,
"fuentes": {"Expansión": len(noticias)},
"noticias": noticias
}
​with open("noticias.json", "w", encoding="utf-8") as f:
json.dump(resultado_json, f, ensure_ascii=False, indent=2)
​print("\n================ RESUMEN DE EJECUCIÓN ")
print(f"TOTAL NOTICIAS : {len(noticias)}")
print(f"DEPORTES       : {deportes_count}")
print(f"CON IMAGEN     : {con_imagen}")
print(f"SIN IMAGEN     : {sin_imagen}")
print(f"IMÁGENES ÚNICAS: {len(imagenes_set)}")
print("======================================\n")
​if name == "main":
main()
PY
​- name: Ejecutar recolección de noticias
run: python actualizar_noticias.py
​- name: Verificación automática de noticias.json
run: |
python -c "
import json, sys
​try:
with open('noticias.json', 'r', encoding='utf-8') as f:
data = json.load(f)
except Exception as e:
print(f'ERROR CRÍTICO: JSON inválido: {e}')
sys.exit(1)
​if 'noticias' not in data or not isinstance(data['noticias'], list):
print('ERROR CRÍTICO: Estructura de noticias.json incorrecta')
sys.exit(1)
​noticias = data['noticias']
urls = set()
titulos = set()
​for i, n in enumerate(noticias):
url = n.get('url', '')
titulo = n.get('titulo', '')
cat = n.get('categoria', '')
​if 'news.google.com' in url:
print(f'ERROR CRÍTICO: Noticia {i} contiene URL de Google News: {url}')
sys.exit(1)
​if cat == 'Deportes' and '/deportes/' not in url.lower():
print(f'ERROR CRÍTICO: Noticia deportiva sin /deportes/ en URL: {url}')
sys.exit(1)
​if url in urls:
print(f'ERROR CRÍTICO: URL duplicada detectada: {url}')
sys.exit(1)
urls.add(url)
​if titulo in titulos:
print(f'ERROR CRÍTICO: Título duplicado detectado: {titulo}')
sys.exit(1)
titulos.add(titulo)
​print('¡VERIFICACIÓN CORRECTA! noticias.json cumple con todas las reglas de integridad.')
"
​- name: Commit y Push de cambios
run: |
git config --global user.name "github-actions[bot]"
git config --global user.email "github-actions[bot]@users.noreply.github.com"
git add noticias.json
if git diff --staged --quiet; then
echo "No hay cambios en noticias.json para publicar."
else
git commit -m "bot: actualización de noticias.json [skip ci]"
git push
fi