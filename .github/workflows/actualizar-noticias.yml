name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 python-dateutil

      - name: Crear actualizador
        run: |
          cat > actualizar_noticias.py <<'PY'
          import json
          import re
          import time
          from datetime import datetime, timezone
          from urllib.parse import urlparse, parse_qs, unquote, urljoin, quote_plus
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from dateutil import parser as dateparser


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          ARCHIVO = "noticias.json"

          # Cantidad máxima final de noticias.
          MAX_NOTICIAS = 5000

          # Máximo de artículos leídos por cada RSS oficial.
          MAX_POR_RSS = 500

          # Máximo de resultados por búsqueda de Google News.
          # Se mantiene bajo para que GitHub no se quede esperando.
          MAX_RESULTADOS_BUSQUEDA = 15

          # Solo buscamos imágenes de una cantidad razonable
          # de noticias que todavía no tengan imagen.
          MAX_IMAGENES = 150

          # Tiempo máximo de cada conexión.
          TIMEOUT = 8

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept-Language": "es-MX,es;q=0.9,en;q=0.8"
          }

          session = requests.Session()
          session.headers.update(HEADERS)


          # ============================================================
          # RSS OFICIALES DE EXPANSIÓN
          # ============================================================

          FUENTES = [
              (
                  "Expansión - Portada",
                  "https://expansion.mx/rss",
                  "Noticias"
              ),
              (
                  "Expansión - Mundo",
                  "https://expansion.mx/rss/internacional",
                  "Mundo"
              ),
              (
                  "Expansión - Economía",
                  "https://expansion.mx/rss/economia",
                  "Dinero"
              ),
              (
                  "Expansión - Tecnología",
                  "https://expansion.mx/rss/tecnologia",
                  "Tecnología"
              ),
              (
                  "Expansión - Tendencias",
                  "https://expansion.mx/rss/tendencias",
                  "Tendencias"
              ),
              (
                  "Expansión - Empresas",
                  "https://expansion.mx/rss/empresas",
                  "Dinero"
              ),
              (
                  "Expansión - Política",
                  "https://expansion.mx/rss/politica",
                  "Política"
              )
          ]


          # ============================================================
          # BÚSQUEDAS DEPORTIVAS
          # ============================================================
          #
          # Son deliberadamente específicas.
          # Después verificamos que el artículo REALMENTE esté en:
          #
          # lifeandstyle.expansion.mx/deportes/
          #
          # Esto evita que inflación, Banxico, T-MEC, etc.
          # terminen convertidos accidentalmente en NFL o básquetbol.
          # ============================================================

          BUSQUEDAS_DEPORTES = {

              "Fútbol": [
                  "futbol",
                  "Champions League",
                  "Premier League",
                  "Mundial 2026",
                  "selección mexicana"
              ],

              "Liga MX": [
                  "Liga MX",
                  "América",
                  "Chivas",
                  "Cruz Azul",
                  "Pumas",
                  "Tigres",
                  "Rayados",
                  "Toluca"
              ],

              "NFL": [
                  "NFL",
                  "Super Bowl",
                  "touchdown",
                  "quarterback",
                  "Kansas City Chiefs",
                  "Dallas Cowboys"
              ],

              "Básquetbol": [
                  "NBA",
                  "WNBA",
                  "basquetbol",
                  "Lakers",
                  "Warriors",
                  "Celtics",
                  "FIBA"
              ],

              "Béisbol": [
                  "MLB",
                  "béisbol",
                  "Yankees",
                  "Dodgers",
                  "Ohtani",
                  "Diablos Rojos"
              ],

              "Tenis": [
                  "tenis",
                  "Wimbledon",
                  "Carlos Alcaraz",
                  "Jannik Sinner",
                  "Djokovic"
              ],

              "Boxeo": [
                  "boxeo",
                  "Canelo",
                  "Pitbull Cruz",
                  "Ryan Garcia",
                  "Gervonta Davis"
              ],

              "Fórmula 1": [
                  "Fórmula 1",
                  "Formula 1",
                  "Checo Pérez",
                  "Verstappen",
                  "Lewis Hamilton",
                  "Charles Leclerc"
              ],

              "Motor": [
                  "MotoGP",
                  "NASCAR",
                  "rally",
                  "automovilismo",
                  "motociclismo"
              ]
          }


          # ============================================================
          # ENTRETENIMIENTO
          # ============================================================

          BUSQUEDAS_ENTRETENIMIENTO = {
              "Entretenimiento": [
                  "entretenimiento",
                  "famosos",
                  "celebridades"
              ],
              "Cine": [
                  "cine",
                  "películas"
              ],
              "Series": [
                  "series",
                  "Netflix",
                  "Disney"
              ],
              "Música": [
                  "música",
                  "musica",
                  "conciertos"
              ]
          }


          # ============================================================
          # UTILIDADES
          # ============================================================

          def limpiar(texto):
              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              for tag in soup.find_all(["script", "style"]):
                  tag.decompose()

              texto = soup.get_text(" ", strip=True)

              return re.sub(r"\s+", " ", texto).strip()


          def normalizar_texto(texto):
              return limpiar(texto).lower()


          def es_expansion(url):
              if not url:
                  return False

              try:
                  dominio = urlparse(url).netloc.lower()

                  return (
                      dominio == "expansion.mx"
                      or dominio.endswith(".expansion.mx")
                  )

              except Exception:
                  return False


          def es_deporte_url(url):
              if not es_expansion(url):
                  return False

              try:
                  p = urlparse(url)

                  return (
                      p.netloc.lower() == "lifeandstyle.expansion.mx"
                      and "/deportes/" in p.path.lower()
                  )

              except Exception:
                  return False


          # ============================================================
          # OBTENER RSS CON TIMEOUT REAL
          # ============================================================

          def descargar_rss(url):
              try:
                  respuesta = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  if respuesta.status_code != 200:
                      print(
                          "RSS HTTP",
                          respuesta.status_code,
                          url
                      )
                      return None

                  return feedparser.parse(
                      respuesta.content
                  )

              except Exception as error:
                  print(
                      "RSS ERROR:",
                      url,
                      "-",
                      error
                  )
                  return None


          # ============================================================
          # RESOLVER GOOGLE NEWS
          # ============================================================

          def url_original(url):
              if not url:
                  return ""

              url = str(url).strip()

              if "news.google.com" not in url:
                  return url

              # Primer intento: URL contenida en los parámetros.
              try:
                  parsed = urlparse(url)
                  qs = parse_qs(parsed.query)

                  for clave in ("url", "u", "q"):
                      for valor in qs.get(clave, []):
                          valor = unquote(valor)

                          if (
                              valor.startswith("http")
                              and es_expansion(valor)
                          ):
                              return valor

              except Exception:
                  pass

              # Segundo intento: seguir redirección.
              try:
                  respuesta = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  final = respuesta.url

                  if final and es_expansion(final):
                      return final

              except Exception:
                  pass

              return ""


          def normalizar_url(url):
              if not url:
                  return ""

              try:
                  p = urlparse(url)

                  return (
                      p.scheme.lower()
                      + "://"
                      + p.netloc.lower()
                      + p.path.rstrip("/")
                  )

              except Exception:
                  return url.lower().strip()


          # ============================================================
          # FECHAS
          # ============================================================

          def fecha_entry(entry):
              for campo in (
                  "published",
                  "updated",
                  "created"
              ):
                  valor = entry.get(campo)

                  if not valor:
                      continue

                  try:
                      fecha = dateparser.parse(valor)

                      if fecha.tzinfo is None:
                          fecha = fecha.replace(
                              tzinfo=timezone.utc
                          )

                      return fecha.isoformat()

                  except Exception:
                      pass

              return datetime.now(
                  timezone.utc
              ).isoformat()


          # ============================================================
          # IMÁGENES
          # ============================================================

          def imagen_valida(url):
              if not url:
                  return False

              url = str(url).strip()

              if not url.startswith(
                  ("http://", "https://")
              ):
                  return False

              bloqueadas = (
                  "favicon",
                  "tracking",
                  "pixel",
                  "analytics",
                  "sprite",
                  "avatar"
              )

              return not any(
                  palabra in url.lower()
                  for palabra in bloqueadas
              )


          def imagen_feed(entry):
              candidatos = []

              for campo in (
                  "media_content",
                  "media_thumbnail",
                  "enclosures"
              ):
                  datos = entry.get(campo, [])

                  if isinstance(datos, dict):
                      datos = [datos]

                  if not isinstance(datos, list):
                      continue

                  for item in datos:
                      if not isinstance(item, dict):
                          continue

                      for clave in ("url", "href"):
                          valor = item.get(clave)

                          if valor:
                              candidatos.append(
                                  valor
                              )

              html = (
                  entry.get("summary", "")
                  or entry.get("description", "")
              )

              soup = BeautifulSoup(
                  str(html),
                  "html.parser"
              )

              for img in soup.find_all("img"):
                  for clave in (
                      "src",
                      "data-src",
                      "data-original",
                      "data-lazy-src"
                  ):
                      valor = img.get(clave)

                      if valor:
                          candidatos.append(
                              valor
                          )

              for imagen in candidatos:
                  if imagen_valida(imagen):
                      return imagen.strip()

              return ""


          def imagen_articulo(url):
              try:
                  respuesta = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  if respuesta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      respuesta.text,
                      "html.parser"
                  )

                  pagina = respuesta.url

                  # OG image.
                  for attrs in (
                      {"property": "og:image"},
                      {"property": "og:image:url"},
                      {"name": "twitter:image"},
                      {"name": "twitter:image:src"}
                  ):
                      meta = soup.find(
                          "meta",
                          attrs=attrs
                      )

                      if not meta:
                          continue

                      imagen = meta.get(
                          "content",
                          ""
                      )

                      imagen = urljoin(
                          pagina,
                          imagen
                      )

                      if imagen_valida(imagen):
                          return imagen

                  # JSON-LD.
                  scripts = soup.find_all(
                      "script",
                      type="application/ld+json"
                  )

                  for script in scripts:
                      try:
                          datos = json.loads(
                              script.string
                              or script.get_text()
                          )
                      except Exception:
                          continue

                      objetos = []

                      if isinstance(datos, dict):
                          objetos.append(datos)

                      elif isinstance(datos, list):
                          objetos.extend(datos)

                      for obj in objetos:
                          if not isinstance(obj, dict):
                              continue

                          imagen = obj.get("image")

                          if isinstance(imagen, str):
                              imagen = urljoin(
                                  pagina,
                                  imagen
                              )

                              if imagen_valida(imagen):
                                  return imagen

                          elif isinstance(imagen, list):
                              for item in imagen:
                                  if isinstance(item, str):
                                      item = urljoin(
                                          pagina,
                                          item
                                      )

                                      if imagen_valida(item):
                                          return item

                                  elif isinstance(item, dict):
                                      item = item.get(
                                          "url",
                                          ""
                                      )

                                      item = urljoin(
                                          pagina,
                                          item
                                      )

                                      if imagen_valida(item):
                                          return item

                  # Último intento.
                  for selector in (
                      "article img",
                      "main img",
                      "[itemprop='image']"
                  ):
                      for img in soup.select(
                          selector
                      ):
                          src = (
                              img.get("src")
                              or img.get("data-src")
                              or img.get("data-original")
                              or img.get("data-lazy-src")
                          )

                          if not src:
                              continue

                          src = urljoin(
                              pagina,
                              src
                          )

                          if imagen_valida(src):
                              return src

              except Exception:
                  return ""

              return ""


          # ============================================================
          # CLASIFICACIÓN DEPORTIVA
          # ============================================================

          def clasificar_deporte(
              titulo,
              descripcion,
              sugerida=""
          ):
              texto = normalizar_texto(
                  titulo + " " + descripcion
              )

              # Específicas primero.
              reglas = [

                  (
                      "Liga MX",
                      [
                          "liga mx",
                          "america",
                          "américa",
                          "chivas",
                          "cruz azul",
                          "pumas",
                          "tigres",
                          "rayados",
                          "monterrey",
                          "toluca",
                          "pachuca",
                          "atlas"
                      ]
                  ),

                  (
                      "NFL",
                      [
                          "nfl",
                          "super bowl",
                          "touchdown",
                          "quarterback",
                          "futbol americano",
                          "49ers",
                          "chiefs",
                          "cowboys",
                          "bills",
                          "ravens",
                          "eagles",
                          "packers",
                          "steelers",
                          "patriots"
                      ]
                  ),

                  (
                      "Básquetbol",
                      [
                          "nba",
                          "wnba",
                          "basquetbol",
                          "básquetbol",
                          "basketball",
                          "baloncesto",
                          "lakers",
                          "warriors",
                          "celtics",
                          "knicks",
                          "bulls",
                          "heat",
                          "spurs",
                          "suns",
                          "nuggets",
                          "bucks",
                          "mavericks",
                          "fiba",
                          "euroleague"
                      ]
                  ),

                  (
                      "Béisbol",
                      [
                          "mlb",
                          "beisbol",
                          "béisbol",
                          "yankees",
                          "dodgers",
                          "ohtani",
                          "jonron",
                          "jonrón",
                          "diablos rojos",
                          "sultanes"
                      ]
                  ),

                  (
                      "Tenis",
                      [
                          "tenis",
                          "wimbledon",
                          "roland garros",
                          "us open",
                          "australian open",
                          "alcaraz",
                          "sinner",
                          "djokovic",
                          "swiatek",
                          "sabalenka"
                      ]
                  ),

                  (
                      "Boxeo",
                      [
                          "boxeo",
                          "boxeador",
                          "canelo",
                          "pitbull cruz",
                          "ryan garcia",
                          "gervonta davis",
                          "tyson fury",
                          "oleksandr usyk",
                          "knockout"
                      ]
                  ),

                  (
                      "Fórmula 1",
                      [
                          "fórmula 1",
                          "formula 1",
                          "checo pérez",
                          "checo perez",
                          "sergio pérez",
                          "sergio perez",
                          "verstappen",
                          "lewis hamilton",
                          "charles leclerc",
                          "fernando alonso",
                          "lando norris",
                          "mclaren f1",
                          "ferrari f1"
                      ]
                  ),

                  (
                      "Motor",
                      [
                          "motogp",
                          "moto gp",
                          "nascar",
                          "rally",
                          "automovilismo",
                          "motociclismo",
                          "indycar",
                          "wrc"
                      ]
                  ),

                  (
                      "Fútbol",
                      [
                          "futbol",
                          "fútbol",
                          "soccer",
                          "champions league",
                          "premier league",
                          "la liga",
                          "mundial 2026",
                          "copa del mundo",
                          "concacaf",
                          "mls",
                          "selección mexicana"
                      ]
                  )
              ]

              for categoria, palabras in reglas:
                  for palabra in palabras:
                      if palabra in texto:
                          return categoria

              if sugerida in BUSQUEDAS_DEPORTES:
                  return sugerida

              return "Otros"


          # ============================================================
          # URL GOOGLE NEWS
          # ============================================================

          def google_rss(consulta):
              consulta = (
                  "site:lifeandstyle.expansion.mx/deportes "
                  + consulta
              )

              return (
                  "https://news.google.com/rss/search?q="
                  + quote_plus(consulta)
                  + "&hl=es-419&gl=MX&ceid=MX:es-419"
              )


          def google_rss_general(consulta):
              consulta = (
                  "site:lifeandstyle.expansion.mx "
                  + consulta
              )

              return (
                  "https://news.google.com/rss/search?q="
                  + quote_plus(consulta)
                  + "&hl=es-419&gl=MX&ceid=MX:es-419"
              )


          # ============================================================
          # RSS GENERAL
          # ============================================================

          def leer_rss(
              nombre,
              url,
              categoria
          ):
              noticias = []

              print(
                  "RSS:",
                  nombre
              )

              feed = descargar_rss(url)

              if not feed:
                  return noticias

              for entry in feed.entries[
                  :MAX_POR_RSS
              ]:

                  titulo = limpiar(
                      entry.get("title", "")
                  )

                  link = url_original(
                      entry.get("link", "")
                  )

                  if not titulo or not link:
                      continue

                  if not es_expansion(link):
                      continue

                  descripcion = limpiar(
                      entry.get("summary", "")
                      or entry.get("description", "")
                  )

                  # Si el propio RSS contiene un artículo
                  # deportivo real, se manda a Deportes.
                  if es_deporte_url(link):
                      categoria_final = "Deportes"

                      subcategoria = clasificar_deporte(
                          titulo,
                          descripcion
                      )

                  else:
                      categoria_final = categoria
                      subcategoria = ""

                  noticias.append({
                      "titulo": titulo,
                      "descripcion": descripcion[:700],
                      "url": link,
                      "imagen": imagen_feed(entry),
                      "categoria": categoria_final,
                      "subcategoria": subcategoria,
                      "fuente": nombre,
                      "fecha": fecha_entry(entry)
                  })

              return noticias


          # ============================================================
          # DEPORTES
          # ============================================================

          def leer_deporte(
              categoria,
              consulta
          ):
              noticias = []

              print(
                  "DEPORTE:",
                  categoria,
                  "|",
                  consulta
              )

              feed = descargar_rss(
                  google_rss(consulta)
              )

              if not feed:
                  return noticias

              for entry in feed.entries[
                  :MAX_RESULTADOS_BUSQUEDA
              ]:

                  titulo = limpiar(
                      entry.get("title", "")
                  )

                  google_link = entry.get(
                      "link",
                      ""
                  )

                  if not titulo or not google_link:
                      continue

                  link = url_original(
                      google_link
                  )

                  # Solamente noticias deportivas reales
                  # de Expansión.
                  if not es_deporte_url(link):
                      continue

                  descripcion = limpiar(
                      entry.get("summary", "")
                      or entry.get("description", "")
                  )

                  categoria_real = clasificar_deporte(
                      titulo,
                      descripcion,
                      categoria
                  )

                  noticias.append({
                      "titulo": titulo,
                      "descripcion": descripcion[:700],
                      "url": link,
                      "imagen": imagen_feed(entry),
                      "categoria": "Deportes",
                      "subcategoria": categoria_real,
                      "fuente": "Expansión - Deportes",
                      "fecha": fecha_entry(entry)
                  })

              return noticias


          # ============================================================
          # ENTRETENIMIENTO
          # ============================================================

          def leer_entretenimiento(
              categoria,
              consulta
          ):
              noticias = []

              print(
                  "ENTRETENIMIENTO:",
                  categoria,
                  "|",
                  consulta
              )

              feed = descargar_rss(
                  google_rss_general(consulta)
              )

              if not feed:
                  return noticias

              for entry in feed.entries[
                  :MAX_RESULTADOS_BUSQUEDA
              ]:

                  titulo = limpiar(
                      entry.get("title", "")
                  )

                  link = url_original(
                      entry.get("link", "")
                  )

                  if not titulo or not link:
                      continue

                  if not es_expansion(link):
                      continue

                  if es_deporte_url(link):
                      continue

                  descripcion = limpiar(
                      entry.get("summary", "")
                      or entry.get("description", "")
                  )

                  noticias.append({
                      "titulo": titulo,
                      "descripcion": descripcion[:700],
                      "url": link,
                      "imagen": imagen_feed(entry),
                      "categoria": "Entretenimiento",
                      "subcategoria": categoria,
                      "fuente": "Expansión - Life & Style",
                      "fecha": fecha_entry(entry)
                  })

              return noticias


          # ============================================================
          # LEER NOTICIAS ANTERIORES
          # ============================================================

          anteriores = []

          try:
              with open(
                  ARCHIVO,
                  "r",
                  encoding="utf-8"
              ) as f:
                  datos = json.load(f)

              if isinstance(datos, dict):
                  anteriores = datos.get(
                      "noticias",
                      []
                  )

              elif isinstance(datos, list):
                  anteriores = datos

          except Exception as error:
              print(
                  "No hay JSON anterior:",
                  error
              )

          if not isinstance(
              anteriores,
              list
          ):
              anteriores = []

          print(
              "ANTERIORES:",
              len(anteriores)
          )


          # ============================================================
          # DESCARGAR NUEVAS
          # ============================================================

          nuevas = []

          for nombre, url, categoria in FUENTES:
              nuevas.extend(
                  leer_rss(
                      nombre,
                      url,
                      categoria
                  )
              )


          for categoria, consultas in BUSQUEDAS_DEPORTES.items():
              for consulta in consultas:
                  nuevas.extend(
                      leer_deporte(
                          categoria,
                          consulta
                      )
                  )


          for categoria, consultas in BUSQUEDAS_ENTRETENIMIENTO.items():
              for consulta in consultas:
                  nuevas.extend(
                      leer_entretenimiento(
                          categoria,
                          consulta
                      )
                  )


          print(
              "NUEVAS:",
              len(nuevas)
          )


          # ============================================================
          # UNIR
          # ============================================================

          todas = anteriores + nuevas

          limpias = []

          for noticia in todas:

              if not isinstance(
                  noticia,
                  dict
              ):
                  continue

              titulo = limpiar(
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              url = noticia.get(
                  "url",
                  ""
              )

              if not titulo or not url:
                  continue

              # No guardar Google News.
              if "news.google.com" in url:
                  url = url_original(url)

              if not es_expansion(url):
                  continue

              descripcion = limpiar(
                  noticia.get(
                      "descripcion",
                      ""
                  )
              )

              # ========================================================
              # CORRECCIÓN FUNDAMENTAL DE DEPORTES
              # ========================================================

              if es_deporte_url(url):

                  categoria = "Deportes"

                  subcategoria = clasificar_deporte(
                      titulo,
                      descripcion,
                      noticia.get(
                          "subcategoria",
                          ""
                      )
                  )

              else:

                  categoria = noticia.get(
                      "categoria",
                      "Noticias"
                  )

                  # Ninguna noticia fuera de /deportes/
                  # puede quedarse como Deportes.
                  if categoria == "Deportes":
                      categoria = "Noticias"

                  subcategoria = ""

              imagen = noticia.get(
                  "imagen",
                  ""
              )

              if not imagen_valida(imagen):
                  imagen = ""

              fecha = noticia.get(
                  "fecha",
                  ""
              )

              if not fecha:
                  fecha = datetime.now(
                      timezone.utc
                  ).isoformat()

              limpias.append({
                  "titulo": titulo,
                  "descripcion": descripcion[:700],
                  "url": url,
                  "imagen": imagen,
                  "categoria": categoria,
                  "subcategoria": subcategoria,
                  "fuente": noticia.get(
                      "fuente",
                      "Expansión"
                  ),
                  "fecha": fecha
              })


          # ============================================================
          # DUPLICADOS POR URL
          # ============================================================

          vistos = set()
          unicas = []

          for noticia in limpias:

              clave = normalizar_url(
                  noticia["url"]
              )

              if not clave:
                  continue

              if clave in vistos:
                  continue

              vistos.add(clave)
              unicas.append(noticia)

          noticias = unicas


          # ============================================================
          # DUPLICADOS POR TÍTULO
          # ============================================================

          vistos = set()
          unicas = []

          for noticia in noticias:

              clave = normalizar_texto(
                  noticia["titulo"]
              )

              if not clave:
                  continue

              if clave in vistos:
                  continue

              vistos.add(clave)
              unicas.append(noticia)

          noticias = unicas


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          def fecha_segura(noticia):
              try:
                  fecha = dateparser.parse(
                      noticia.get(
                          "fecha",
                          ""
                      )
                  )

                  if fecha.tzinfo is None:
                      fecha = fecha.replace(
                          tzinfo=timezone.utc
                      )

                  return fecha

              except Exception:
                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )


          noticias.sort(
              key=fecha_segura,
              reverse=True
          )


          # ============================================================
          # IMÁGENES FALTANTES
          # ============================================================

          pendientes = [
              noticia
              for noticia in noticias
              if not imagen_valida(
                  noticia.get(
                      "imagen",
                      ""
                  )
              )
          ]

          pendientes = pendientes[
              :MAX_IMAGENES
          ]

          print(
              "IMÁGENES A BUSCAR:",
              len(pendientes)
          )


          def buscar_imagen(noticia):
              return (
                  noticia["url"],
                  imagen_articulo(
                      noticia["url"]
                  )
              )


          # Solo 8 conexiones simultáneas.
          with ThreadPoolExecutor(
              max_workers=8
          ) as executor:

              tareas = [
                  executor.submit(
                      buscar_imagen,
                      noticia
                  )
                  for noticia in pendientes
              ]

              for futuro in as_completed(tareas):

                  try:
                      url, imagen = futuro.result()

                      if not imagen:
                          continue

                      clave = normalizar_url(
                          url
                      )

                      for noticia in noticias:

                          if (
                              normalizar_url(
                                  noticia["url"]
                              )
                              == clave
                          ):
                              noticia["imagen"] = imagen
                              break

                  except Exception:
                      pass


          # ============================================================
          # LIMITE FINAL
          # ============================================================

          noticias = noticias[
              :MAX_NOTICIAS
          ]


          # ============================================================
          # ESTADÍSTICAS
          # ============================================================

          categorias = {}
          subcategorias = {}
          fuentes = {}

          imagenes_unicas = set()

          for noticia in noticias:

              categoria = noticia.get(
                  "categoria",
                  "Noticias"
              )

              subcategoria = noticia.get(
                  "subcategoria",
                  ""
              )

              fuente = noticia.get(
                  "fuente",
                  ""
              )

              categorias[categoria] = (
                  categorias.get(
                      categoria,
                      0
                  ) + 1
              )

              if subcategoria:
                  subcategorias[subcategoria] = (
                      subcategorias.get(
                          subcategoria,
                          0
                      ) + 1
                  )

              if fuente:
                  fuentes[fuente] = (
                      fuentes.get(
                          fuente,
                          0
                      ) + 1
                  )

              imagen = noticia.get(
                  "imagen",
                  ""
              )

              if imagen_valida(imagen):
                  imagenes_unicas.add(
                      normalizar_url(imagen)
                  )


          con_imagen = sum(
              1
              for noticia in noticias
              if imagen_valida(
                  noticia.get(
                      "imagen",
                      ""
                  )
              )
          )

          sin_imagen = (
              len(noticias)
              - con_imagen
          )


          # ============================================================
          # JSON FINAL
          # ============================================================

          resultado = {
              "actualizado": datetime.now(
                  timezone.utc
              ).isoformat(),

              "fuente": (
                  "Expansión + "
                  "Life & Style"
              ),

              "total": len(noticias),

              "imagenes": {
                  "con_imagen": con_imagen,
                  "sin_imagen": sin_imagen,
                  "imagenes_unicas": len(
                      imagenes_unicas
                  )
              },

              "categorias": categorias,

              "subcategorias": subcategorias,

              "fuentes": fuentes,

              "noticias": noticias
          }


          with open(
              ARCHIVO,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # RESULTADO
          # ============================================================

          print("")
          print("======================================")
          print(" ACTUALIZACIÓN TERMINADA")
          print("======================================")
          print("TOTAL:", len(noticias))
          print("CON IMAGEN:", con_imagen)
          print("SIN IMAGEN:", sin_imagen)
          print(
              "IMÁGENES ÚNICAS:",
              len(imagenes_unicas)
          )
          print(
              "CATEGORÍAS:",
              categorias
          )
          print(
              "SUBCATEGORÍAS:",
              subcategorias
          )
          print("======================================")


          # ============================================================
          # COMPROBACIÓN FINAL DE DEPORTES
          # ============================================================

          deportes_malos = []

          for noticia in noticias:

              if noticia.get(
                  "categoria"
              ) != "Deportes":
                  continue

              if not es_deporte_url(
                  noticia.get(
                      "url",
                      ""
                  )
              ):
                  deportes_malos.append(
                      noticia
                  )

          print(
              "DEPORTES FUERA DE SECCIÓN:",
              len(deportes_malos)
          )

          if deportes_malos:
              print(
                  "ADVERTENCIA: se encontraron",
                  len(deportes_malos),
                  "artículos deportivos incorrectos."
              )

          PY

      - name: Ejecutar actualizador
        timeout-minutes: 5
        run: |
          python actualizar_noticias.py

      - name: Verificar resultado
        run: |
          python - <<'PY'
          import json

          with open(
              "noticias.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          noticias = data.get(
              "noticias",
              []
          )

          print("")
          print("========== VERIFICACIÓN ==========")
          print("TOTAL:", len(noticias))
          print(
              "IMÁGENES:",
              data.get("imagenes")
          )
          print(
              "CATEGORÍAS:",
              data.get("categorias")
          )
          print(
              "SUBCATEGORÍAS:",
              data.get("subcategorias")
          )

          google = [
              n
              for n in noticias
              if "news.google.com" in n.get(
                  "url",
                  ""
              )
          ]

          print(
              "ENLACES GOOGLE NEWS:",
              len(google)
          )

          if google:
              raise SystemExit(
                  "ERROR: existen enlaces de Google News."
              )

          deportes_malos = []

          for noticia in noticias:

              if noticia.get(
                  "categoria"
              ) != "Deportes":
                  continue

              if "/deportes/" not in noticia.get(
                  "url",
                  ""
              ):
                  deportes_malos.append(
                      noticia
                  )

          print(
              "DEPORTES FUERA DE SECCIÓN:",
              len(deportes_malos)
          )

          if deportes_malos:
              raise SystemExit(
                  "ERROR: hay noticias marcadas como Deportes "
                  "que no pertenecen a /deportes/."
              )

          print("")
          print("OK: verificación completada.")
          print("=================================")
          PY

