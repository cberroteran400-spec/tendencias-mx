name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml googlenewsdecoder pillow

      - name: Actualizar noticias
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat > actualizar.py <<'PYTHON'
          import json
          import os
          import re
          import time
          import hashlib
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urlparse

          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from PIL import Image

          try:
              from googlenewsdecoder import gnewsdecoder
          except Exception:
              gnewsdecoder = None

          ARCHIVO = "noticias.json"

          MAX_TOTAL = 1200
          MAX_POR_FEED = 30
          LIMITE_DIAS = 14

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Linux; Android 10) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120.0 Mobile Safari/537.36"
              )
          }

          FUENTES = [
              ("Noticias", "https://expansion.mx/rss"),
              ("Mundo", "https://expansion.mx/rss/internacional"),
              ("Dinero", "https://expansion.mx/rss/economia"),
              ("Tecnología", "https://expansion.mx/rss/tecnologia"),
              ("Tendencias", "https://expansion.mx/rss/tendencias"),
              ("Empresas", "https://expansion.mx/rss/empresas"),
              ("Política", "https://expansion.mx/rss/politica"),

              ("Futbol", "https://www.espn.com/espn/rss/soccer/news"),
              ("Futbol", "https://news.google.com/rss/search?q=futbol+Mexico+Liga+MX+Seleccion+Mexicana&hl=es-419&gl=MX&ceid=MX:es-419"),
              ("Futbol", "https://news.google.com/rss/search?q=Champions+League+futbol&hl=es-419&gl=MX&ceid=MX:es-419"),

              ("Tenis", "https://www.espn.com/espn/rss/tennis/news"),
              ("Tenis", "https://news.google.com/rss/search?q=tenis+ATP+WTA&hl=es-419&gl=MX&ceid=MX:es-419"),

              ("Beisbol", "https://www.espn.com/espn/rss/mlb/news"),
              ("Beisbol", "https://news.google.com/rss/search?q=MLB+beisbol&hl=es-419&gl=MX&ceid=MX:es-419"),

              ("NFL", "https://www.espn.com/espn/rss/nfl/news"),

              ("Basquetbol", "https://www.espn.com/espn/rss/nba/news"),

              ("Boxeo", "https://www.espn.com/espn/rss/boxing/news"),
              ("Boxeo", "https://news.google.com/rss/search?q=Canelo+boxeo&hl=es-419&gl=MX&ceid=MX:es-419"),

              ("Formula 1", "https://www.espn.com/espn/rss/rpm/news"),
              ("Formula 1", "https://news.google.com/rss/search?q=Formula+1+F1+Checo+Perez&hl=es-419&gl=MX&ceid=MX:es-419"),

              ("Otros", "https://www.espn.com/espn/rss/golf/news"),
          ]

          SUBCATEGORIAS = {
              "Futbol": "futbol",
              "Tenis": "tenis",
              "Beisbol": "beisbol",
              "NFL": "nfl",
              "Basquetbol": "basquetbol",
              "Boxeo": "boxeo",
              "Formula 1": "formula1",
              "Otros": "otros",
          }

          SESION = requests.Session()
          SESION.headers.update(HEADERS)

          def ahora():
              return datetime.now(timezone.utc)

          def normalizar_texto(texto):
              if not texto:
                  return ""
              return re.sub(r"\s+", " ", str(texto)).strip()

          def imagen_rechazada(url):
              if not url:
                  return True

              url = str(url).strip()

              if not url.startswith(("http://", "https://")):
                  return True

              u = url.lower()

              host = urlparse(u).netloc
              ruta = urlparse(u).path

              hosts_google = [
                  "google.com",
                  "www.google.com",
                  "images.google.com",
                  "news.google.com",
                  "googleusercontent.com",
                  "lh3.googleusercontent.com",
                  "lh4.googleusercontent.com",
                  "lh5.googleusercontent.com",
                  "lh6.googleusercontent.com",
                  "gstatic.com",
                  "googleapis.com",
                  "ggpht.com",
              ]

              for host_google in hosts_google:
                  if host == host_google or host.endswith("." + host_google):
                      return True

              palabras_prohibidas = [
                  "googlelogo",
                  "logo-google",
                  "google-logo",
                  "google_logo",
                  "google-news",
                  "googlenews",
                  "googleusercontent",
                  "gstatic",
                  "favicon",
                  "fav-icon",
                  "apple-touch-icon",
                  "placeholder",
                  "default-image",
                  "default_image",
                  "defaultimage",
                  "no-image",
                  "no_image",
                  "noimage",
                  "image-placeholder",
                  "img-placeholder",
                  "thumbnail-placeholder",
                  "spacer",
                  "pixel.gif",
                  "blank.gif",
                  "blank.png",
                  "blank.jpg",
                  "transparent.gif",
                  "avatar",
                  "generic",
                  "fallback",
                  "sin-imagen",
                  "sin_imagen",
                  "not-found",
                  "notfound",
              ]

              for palabra in palabras_prohibidas:
                  if palabra in u:
                      return True

              nombre_archivo = os.path.basename(ruta)

              palabras_logo = [
                  "logo",
                  "brand",
                  "branding",
                  "favicon",
                  "icon",
                  "sprite",
              ]

              for palabra in palabras_logo:
                  if palabra in nombre_archivo:
                      return True

              return False

          def comprobar_imagen_real(url):
              """
              Comprueba que la URL realmente entregue una imagen
              y que no sea una imagen diminuta, favicon o placeholder.
              """

              if imagen_rechazada(url):
                  return False

              try:
                  respuesta = SESION.get(
                      url,
                      timeout=12,
                      stream=True,
                      allow_redirects=True
                  )

                  if respuesta.status_code >= 400:
                      return False

                  tipo = (
                      respuesta.headers.get(
                          "Content-Type",
                          ""
                      ).lower()
                  )

                  if "image/" not in tipo:
                      return False

                  contenido = respuesta.content

                  if len(contenido) < 5000:
                      return False

                  try:
                      from io import BytesIO

                      imagen = Image.open(
                          BytesIO(contenido)
                      )

                      ancho, alto = imagen.size

                      if ancho < 250 or alto < 150:
                          return False

                      if ancho * alto < 50000:
                          return False

                  except Exception:
                      return False

                  return True

              except Exception:
                  return False

          def imagen_valida(url):
              return (
                  bool(url)
                  and not imagen_rechazada(url)
              )

          def limpiar_url(url):
              if not url:
                  return ""

              url = str(url).strip()

              if url.startswith("//"):
                  url = "https:" + url

              return url

          def resolver_google_news(url):
              if not url:
                  return ""

              if "news.google.com" not in url.lower():
                  return url

              if gnewsdecoder is None:
                  return ""

              try:
                  resultado = gnewsdecoder(
                      url,
                      interval=0.5,
                      timeout=15
                  )

                  if isinstance(resultado, dict):
                      for clave in (
                          "decoded_url",
                          "url",
                          "link",
                          "article_url"
                      ):
                          valor = resultado.get(clave)

                          if valor:
                              valor = str(valor).strip()

                              if (
                                  valor.startswith("http://")
                                  or valor.startswith("https://")
                              ):
                                  return valor

                  if isinstance(resultado, str):
                      resultado = resultado.strip()

                      if (
                          resultado.startswith("http://")
                          or resultado.startswith("https://")
                      ):
                          return resultado

              except Exception as e:
                  print(
                      "No se pudo resolver Google News:",
                      e
                  )

              return ""

          def candidato_es_logo(candidato, elemento=None):
              """
              Rechaza imágenes cuyo propio HTML indique
              que son logos, iconos, avatares o imágenes genéricas.
              """

              texto = candidato.lower()

              palabras = [
                  "google",
                  "favicon",
                  "logo",
                  "branding",
                  "brand-logo",
                  "site-logo",
                  "header-logo",
                  "icon",
                  "avatar",
                  "placeholder",
                  "no-image",
                  "default-image",
              ]

              for palabra in palabras:
                  if palabra in texto:
                      return True

              if elemento is not None:
                  atributos = [
                      elemento.get("alt", ""),
                      elemento.get("title", ""),
                      elemento.get("class", ""),
                      elemento.get("id", ""),
                  ]

                  texto_html = " ".join(
                      str(x)
                      for x in atributos
                  ).lower()

                  for palabra in palabras:
                      if palabra in texto_html:
                          return True

              return False

          def imagen_hash(url):
              """
              Obtiene un hash del archivo para evitar que
              el mismo logo genérico aparezca repetido.
              """

              try:
                  respuesta = SESION.get(
                      url,
                      timeout=12
                  )

                  if respuesta.status_code >= 400:
                      return ""

                  contenido = respuesta.content

                  if not contenido:
                      return ""

                  return hashlib.sha256(
                      contenido
                  ).hexdigest()

              except Exception:
                  return ""

          def extraer_imagen(url_articulo):
              if not url_articulo:
                  return ""

              url_articulo = resolver_google_news(
                  url_articulo
              )

              if not url_articulo:
                  return ""

              if "news.google.com" in url_articulo.lower():
                  return ""

              try:
                  respuesta = SESION.get(
                      url_articulo,
                      timeout=15,
                      allow_redirects=True
                  )

                  if respuesta.status_code >= 400:
                      return ""

                  soup = BeautifulSoup(
                      respuesta.text,
                      "lxml"
                  )

                  candidatos = []

                  # -----------------------------------------
                  # 1. OPEN GRAPH
                  # -----------------------------------------

                  for meta in soup.find_all("meta"):

                      prop = (
                          meta.get("property")
                          or meta.get("name")
                          or ""
                      ).lower()

                      content = (
                          meta.get("content")
                          or ""
                      ).strip()

                      if not content:
                          continue

                      if prop in (
                          "og:image",
                          "og:image:url",
                          "og:image:secure_url",
                      ):
                          candidatos.append(
                              (content, meta)
                          )

                  # -----------------------------------------
                  # 2. TWITTER
                  # -----------------------------------------

                  for meta in soup.find_all("meta"):

                      prop = (
                          meta.get("property")
                          or meta.get("name")
                          or ""
                      ).lower()

                      content = (
                          meta.get("content")
                          or ""
                      ).strip()

                      if prop in (
                          "twitter:image",
                          "twitter:image:src",
                      ):
                          candidatos.append(
                              (content, meta)
                          )

                  # -----------------------------------------
                  # 3. JSON-LD
                  # -----------------------------------------

                  for script in soup.find_all(
                      "script",
                      type="application/ld+json"
                  ):

                      texto = (
                          script.string
                          or script.get_text()
                          or ""
                      )

                      if not texto:
                          continue

                      encontrados = re.findall(
                          r'"image"\s*:\s*"([^"]+)"',
                          texto,
                          flags=re.I
                      )

                      for encontrado in encontrados:
                          candidatos.append(
                              (encontrado, script)
                          )

                  # -----------------------------------------
                  # 4. IMAGENES DEL ARTICULO
                  # -----------------------------------------

                  for img in soup.find_all("img"):

                      # Revisar primero el contexto HTML
                      if candidato_es_logo(
                          "",
                          img
                      ):
                          continue

                      for atributo in (
                          "src",
                          "data-src",
                          "data-lazy-src",
                          "data-original",
                          "data-image",
                          "data-url",
                      ):

                          valor = img.get(
                              atributo
                          )

                          if valor:
                              candidatos.append(
                                  (valor, img)
                              )

                  base = respuesta.url

                  # -----------------------------------------
                  # PROBAR CANDIDATOS
                  # -----------------------------------------

                  vistos = set()

                  for candidato, elemento in candidatos:

                      candidato = limpiar_url(
                          candidato
                      )

                      if not candidato:
                          continue

                      if candidato in vistos:
                          continue

                      vistos.add(candidato)

                      if candidato.startswith("/"):
                          dominio = (
                              urlparse(base).scheme
                              + "://"
                              + urlparse(base).netloc
                          )

                          candidato = (
                              dominio
                              + candidato
                          )

                      if candidato.startswith("//"):
                          candidato = (
                              "https:"
                              + candidato
                          )

                      if candidato_es_logo(
                          candidato,
                          elemento
                      ):
                          continue

                      if imagen_rechazada(
                          candidato
                      ):
                          continue

                      # -------------------------------------
                      # COMPROBACION REAL
                      # -------------------------------------

                      if not comprobar_imagen_real(
                          candidato
                      ):
                          continue

                      print(
                          "Imagen REAL encontrada:",
                          candidato
                      )

                      return candidato

              except Exception as e:
                  print(
                      "Error buscando imagen:",
                      e
                  )

              return ""

          def fecha_item(entry):

              try:
                  if getattr(
                      entry,
                      "published_parsed",
                      None
                  ):
                      return datetime.fromtimestamp(
                          time.mktime(
                              entry.published_parsed
                          ),
                          tz=timezone.utc
                      )

              except Exception:
                  pass

              try:
                  if getattr(
                      entry,
                      "updated_parsed",
                      None
                  ):
                      return datetime.fromtimestamp(
                          time.mktime(
                              entry.updated_parsed
                          ),
                          tz=timezone.utc
                      )

              except Exception:
                  pass

              return ahora()

          def categoria_general(categoria):

              categoria = normalizar_texto(
                  categoria
              )

              mapa = {
                  "Noticias": "Noticias",
                  "Mundo": "Mundo",
                  "Dinero": "Dinero",
                  "Tecnología": "Tecnología",
                  "Tendencias": "Tendencias",
                  "Empresas": "Empresas",
                  "Política": "Política",
                  "Futbol": "Deportes",
                  "Tenis": "Deportes",
                  "Beisbol": "Deportes",
                  "NFL": "Deportes",
                  "Basquetbol": "Deportes",
                  "Boxeo": "Deportes",
                  "Formula 1": "Deportes",
                  "Otros": "Deportes",
              }

              return mapa.get(
                  categoria,
                  categoria or "Noticias"
              )

          def subcategoria(categoria):

              return SUBCATEGORIAS.get(
                  categoria,
                  ""
              )

          # =================================================
          # CARGAR NOTICIAS EXISTENTES
          # =================================================

          if os.path.exists(ARCHIVO):

              try:
                  with open(
                      ARCHIVO,
                      "r",
                      encoding="utf-8"
                  ) as f:
                      datos = json.load(f)

              except Exception:
                  datos = {}

          else:
              datos = {}

          if isinstance(datos, list):

              noticias = datos
              estructura_lista = True

          else:

              noticias = datos.get(
                  "noticias",
                  []
              )

              estructura_lista = False

          if not isinstance(noticias, list):
              noticias = []

          mapa = {}

          for noticia in noticias:

              if not isinstance(
                  noticia,
                  dict
              ):
                  continue

              url = normalizar_texto(
                  noticia.get("url")
                  or noticia.get("link")
                  or ""
              )

              if url:
                  mapa[url] = noticia

          print(
              "Noticias existentes:",
              len(mapa)
          )

          # =================================================
          # IMAGENES YA UTILIZADAS
          # =================================================

          imagenes_usadas = set()
          hashes_imagenes = set()

          for noticia in mapa.values():

              imagen = noticia.get(
                  "imagen",
                  ""
              )

              if imagen_valida(imagen):

                  imagenes_usadas.add(
                      imagen
                  )

          print(
              "Imagenes existentes:",
              len(imagenes_usadas)
          )

          cambios = False

          # =================================================
          # REPARAR IMAGENES EXISTENTES
          # =================================================

          print("")
          print(
              "REVISION DE IMAGENES EXISTENTES"
          )
          print(
              "==================================="
          )

          for url, noticia in list(
              mapa.items()
          ):

              imagen_actual = noticia.get(
                  "imagen",
                  ""
              )

              # ---------------------------------------------
              # MUY IMPORTANTE:
              # Si la imagen existente es sospechosa,
              # TAMBIEN se repara.
              # ---------------------------------------------

              necesita_reparacion = (
                  not imagen_valida(
                      imagen_actual
                  )
              )

              if not necesita_reparacion:

                  # Comprobar también que la imagen
                  # realmente siga siendo una imagen.
                  if not comprobar_imagen_real(
                      imagen_actual
                  ):
                      necesita_reparacion = True

              if not necesita_reparacion:
                  continue

              print("")
              print(
                  "REPARANDO:",
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              imagen_nueva = extraer_imagen(
                  url
              )

              if (
                  imagen_nueva
                  and imagen_nueva
                  not in imagenes_usadas
              ):

                  noticia["imagen"] = (
                      imagen_nueva
                  )

                  imagenes_usadas.add(
                      imagen_nueva
                  )

                  cambios = True

                  print(
                      "NUEVA IMAGEN:",
                      imagen_nueva
                  )

              else:

                  # Si no encontramos una imagen real,
                  # dejamos el campo vacío.
                  # NO ponemos logo de Google.
                  if noticia.get(
                      "imagen",
                      ""
                  ) != "":

                      noticia["imagen"] = ""

                      cambios = True

                  print(
                      "No se encontro imagen real."
                  )

              time.sleep(0.3)

          # =================================================
          # NUEVAS NOTICIAS RSS
          # =================================================

          print("")
          print(
              "DESCARGANDO NUEVAS NOTICIAS"
          )
          print(
              "==================================="
          )

          limite_fecha = (
              ahora()
              - timedelta(
                  days=LIMITE_DIAS
              )
          )

          for categoria_fuente, feed_url in FUENTES:

              print("")
              print(
                  "RSS:",
                  feed_url
              )

              try:

                  feed = feedparser.parse(
                      feed_url
                  )

              except Exception as e:

                  print(
                      "Error RSS:",
                      e
                  )

                  continue

              contador = 0

              for entry in feed.entries:

                  if contador >= MAX_POR_FEED:
                      break

                  titulo = normalizar_texto(
                      entry.get(
                          "title",
                          ""
                      )
                  )

                  url = normalizar_texto(
                      entry.get(
                          "link",
                          ""
                      )
                  )

                  if not titulo or not url:
                      continue

                  fecha = fecha_item(
                      entry
                  )

                  if fecha < limite_fecha:
                      continue

                  if url in mapa:

                      contador += 1
                      continue

                  descripcion = normalizar_texto(
                      entry.get(
                          "summary",
                          ""
                      )
                      or entry.get(
                          "description",
                          ""
                      )
                  )

                  imagen = extraer_imagen(
                      url
                  )

                  noticia = {
                      "titulo": titulo,
                      "url": url,
                      "imagen": imagen,
                      "descripcion": descripcion,
                      "fuente": normalizar_texto(
                          entry.get(
                              "author",
                              ""
                          )
                          or categoria_fuente
                      ),
                      "categoria": categoria_general(
                          categoria_fuente
                      ),
                      "subcategoria": subcategoria(
                          categoria_fuente
                      ),
                      "fecha": fecha.isoformat(),
                  }

                  mapa[url] = noticia

                  if imagen_valida(
                      imagen
                  ):

                      imagenes_usadas.add(
                          imagen
                      )

                  cambios = True
                  contador += 1

                  print(
                      "Nueva noticia:",
                      titulo
                  )

          # =================================================
          # ORDENAR NOTICIAS
          # =================================================

          noticias_finales = list(
              mapa.values()
          )

          def obtener_fecha(noticia):

              valor = noticia.get(
                  "fecha",
                  ""
              )

              try:

                  return datetime.fromisoformat(
                      valor.replace(
                          "Z",
                          "+00:00"
                      )
                  )

              except Exception:

                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )

          noticias_finales.sort(
              key=obtener_fecha,
              reverse=True
          )

          noticias_finales = (
              noticias_finales[:MAX_TOTAL]
          )

          # =================================================
          # ESTADISTICAS
          # =================================================

          con_imagen = sum(
              1
              for n in noticias_finales
              if imagen_valida(
                  n.get(
                      "imagen",
                      ""
                  )
              )
          )

          sin_imagen = (
              len(noticias_finales)
              - con_imagen
          )

          actualizado = (
              ahora().isoformat()
          )

          # =================================================
          # GUARDAR
          # =================================================

          if estructura_lista:

              salida = noticias_finales

          else:

              salida = dict(
                  datos
              )

              salida["noticias"] = (
                  noticias_finales
              )

              salida["actualizado"] = (
                  actualizado
              )

              salida["total"] = (
                  len(noticias_finales)
              )

              salida["imagenes"] = {
                  "con_imagen": con_imagen,
                  "sin_imagen": sin_imagen
              }

          with open(
              ARCHIVO,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  salida,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "==================================="
          )
          print(
              "ACTUALIZACION TERMINADA"
          )
          print(
              "Noticias:",
              len(noticias_finales)
          )
          print(
              "Con imagen:",
              con_imagen
          )
          print(
              "Sin imagen:",
              sin_imagen
          )
          print(
              "Cambios:",
              cambios
          )
          print(
              "==================================="
          )
          PYTHON

          python actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
          else
            git commit -m "Reparar imagenes de noticias"
            git push
          fi
