          ]


          # ============================================================
          # PALABRAS DE TECNOLOGÍA
          # ============================================================

          TECNOLOGIA_FUERTE = [
              "inteligencia artificial",
              "ia generativa",
              "chatgpt",
              "openai",
              "google",
              "apple",
              "iphone",
              "android",
              "samsung",
              "microsoft",
              "meta",
              "facebook",
              "instagram",
              "whatsapp",
              "tiktok",
              "internet",
              "software",
              "aplicacion",
              "aplicaciones",
              "smartphone",
              "computadora",
              "robot",
              "robotica",
              "robotica",
              "ciberseguridad",
              "videojuego",
              "videojuegos",
              "nvidia",
              "chip",
              "chips",
              "procesador",
              "procesadores"
          ]


          # ============================================================
          # PALABRAS DE ENTRETENIMIENTO
          # ============================================================

          ENTRETENIMIENTO_FUERTE = [
              "actor",
              "actriz",
              "cantante",
              "cantantes",
              "celebridad",
              "celebridades",
              "famoso",
              "famosa",
              "artista",
              "artistas",
              "pelicula",
              "peliculas",
              "serie de television",
              "series de television",
              "netflix",
              "hollywood",
              "cine",
              "television",
              "musica",
              "album",
              "cancion",
              "concierto",
              "conciertos",
              "festival",
              "premios",
              "espectaculo",
              "espectaculos",
              "entretenimiento",
              "reality",
              "grammy",
              "oscar",
              "emmy"
          ]


          # ============================================================
          # PALABRAS DE TRÁMITES
          # ============================================================

          TRAMITES_FUERTE = [
              "tramite",
              "tramites",
              "cita",
              "documentos",
              "documentacion",
              "curp",
              "rfc",
              "ine",
              "pasaporte",
              "visa",
              "acta de nacimiento",
              "acta de matrimonio",
              "licencia de conducir",
              "licencia",
              "cartilla militar",
              "sat",
              "imss",
              "infonavit",
              "registro civil",
              "gobierno digital"
          ]


          # ============================================================
          # CLASIFICACIÓN
          #
          # ORDEN DE PRIORIDAD:
          #
          # 1. URL
          # 2. RSS
          # 3. SEÑALES FUERTES
          # 4. MÉXICO COMO ÚLTIMO RECURSO
          #
          # JAMÁS dejamos que una palabra débil de deportes
          # sobreescriba una sección económica o internacional.
          # ============================================================

          def clasificar_noticia(
              titulo,
              descripcion,
              enlace,
              categoria_fuente
          ):

              titulo_n = normalizar(
                  titulo
              )

              descripcion_n = normalizar(
                  descripcion
              )

              enlace_n = normalizar(
                  enlace
              )

              texto = (
                  titulo_n
                  + " "
                  + descripcion_n
              )


              # ========================================================
              # 1. LA URL MANDA
              # ========================================================

              seccion_url = obtener_seccion_url(
                  enlace
              )

              if seccion_url:

                  return seccion_url


              # ========================================================
              # 2. SI NO HAY SECCIÓN, CONFIAMOS EN EL RSS
              # ========================================================

              if categoria_fuente == "politica":
                  return "politica"

              if categoria_fuente == "mundo":
                  return "mundo"

              if categoria_fuente == "dinero":
                  return "dinero"

              if categoria_fuente == "tecnologia":
                  return "tecnologia"

              if categoria_fuente == "empresas":
                  return "dinero"


              # ========================================================
              # 3. TRÁMITES
              # ========================================================

              if contiene_alguno(
                  texto,
                  TRAMITES_FUERTE
              ):
                  return "tramites"


              # ========================================================
              # 4. DEPORTES
              # ========================================================

              if contiene_alguno(
                  texto,
                  FUTBOL_FUERTE
              ):
                  return "deportes"

              if contiene_alguno(
                  texto,
                  OTROS_DEPORTES_FUERTE
              ):
                  return "deportes"


              # ========================================================
              # 5. TECNOLOGÍA
              # ========================================================

              if contiene_alguno(
                  texto,
                  TECNOLOGIA_FUERTE
              ):
                  return "tecnologia"


              # ========================================================
              # 6. ENTRETENIMIENTO
              # ========================================================

              if contiene_alguno(
                  texto,
                  ENTRETENIMIENTO_FUERTE
              ):
                  return "entretenimiento"


              # ========================================================
              # 7. DINERO
              # ========================================================

              if contiene_alguno(
                  texto,
                  DINERO_FUERTE
              ):
                  return "dinero"


              # ========================================================
              # 8. MUNDO
              # ========================================================

              MUNDO_FUERTE = [
                  "estados unidos",
                  "eeuu",
                  "ee.uu",
                  "canada",
                  "espana",
                  "francia",
                  "alemania",
                  "italia",
                  "reino unido",
                  "inglaterra",
                  "rusia",
                  "ucrania",
                  "china",
                  "japon",
                  "india",
                  "brasil",
                  "argentina",
                  "colombia",
                  "chile",
                  "peru",
                  "venezuela",
                  "ecuador",
                  "bolivia",
                  "internacional",
                  "internacionales",
                  "onu",
                  "otan",
                  "casa blanca",
                  "guerra",
                  "conflicto",
                  "iran",
                  "irán",
                  "israel"
              ]

              if contiene_alguno(
                  texto,
                  MUNDO_FUERTE
              ):
                  return "mundo"


              # ========================================================
              # 9. TENDENCIAS
              # ========================================================

              if categoria_fuente == "tendencias":
                  return "tendencias"


              # ========================================================
              # 10. MÉXICO COMO ÚLTIMO RECURSO
              # ========================================================

              return "mexico"


          # ============================================================
          # DESCARGAR TODAS LAS NOTICIAS
          # ============================================================

          noticias = []


          for fuente_rss in FUENTES_RSS:

              rss_url = fuente_rss["url"]

              categoria_fuente = fuente_rss["categoria"]

              data = descargar_rss(
                  rss_url
              )

              if not data:
                  continue


              try:

                  root = ET.fromstring(
                      data
                  )

              except Exception as error:

                  print(
                      "ERROR XML:",
                      rss_url,
                      error
                  )

                  continue


              contador = 0


              for item in root.findall(
                  ".//item"
              ):

                  titulo = obtener_tag(
                      item,
                      "title"
                  )

                  enlace = obtener_tag(
                      item,
                      "link"
                  )

                  descripcion = obtener_tag(
                      item,
                      "description"
                  )

                  fecha = obtener_tag(
                      item,
                      "pubDate"
                  )


                  if not titulo or not enlace:
                      continue


                  titulo_limpio = limpiar_html(
                      titulo
                  )

                  descripcion_limpia = limpiar_html(
                      descripcion
                  )


                  imagen = obtener_imagen(
                      item,
                      rss_url
                  )


                  categoria = clasificar_noticia(
                      titulo_limpio,
                      descripcion_limpia,
                      enlace,
                      categoria_fuente
                  )


                  noticia = {

                      "titulo":
                          titulo_limpio,

                      "descripcion":
                          descripcion_limpia[:600],

                      "enlace":
                          enlace.strip(),

                      "fecha":
                          fecha.strip(),

                      "fuente":
                          "Expansión",

                      "categoria":
                          categoria,

                      "imagen":
                          imagen,

                      "rss":
                          categoria_fuente
                  }


                  noticias.append(
                      noticia
                  )

                  contador += 1


              print(
                  "Noticias obtenidas:",
                  contador
              )


          # ============================================================
          # ELIMINAR DUPLICADOS
          # ============================================================

          noticias_unicas = {}


          for noticia in noticias:

              enlace = noticia.get(
                  "enlace",
                  ""
              )

              if not enlace:
                  continue


              if enlace not in noticias_unicas:

                  noticias_unicas[
                      enlace
                  ] = noticia

              else:

                  existente = noticias_unicas[
                      enlace
                  ]

                  if (
                      not existente.get("imagen")
                      and noticia.get("imagen")
                  ):

                      noticias_unicas[
                          enlace
                      ] = noticia


          noticias = list(
              noticias_unicas.values()
          )


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          noticias.sort(
              key=lambda noticia:
                  noticia.get(
                      "fecha",
                      ""
                  ),
              reverse=True
          )


          # ============================================================
          # LIMITAR
          # ============================================================

          noticias = noticias[
              :MAX_NOTICIAS
          ]


          # ============================================================
          # CONTADORES
          # ============================================================

          conteo = {

              "mexico": 0,

              "politica": 0,

              "mundo": 0,

              "dinero": 0,

              "deportes": 0,

              "entretenimiento": 0,

              "tecnologia": 0,

              "tendencias": 0,

              "tramites": 0
          }


          imagenes = 0


          for noticia in noticias:

              categoria = noticia.get(
                  "categoria"
              )

              if categoria in conteo:

                  conteo[
                      categoria
                  ] += 1


              if noticia.get(
                  "imagen"
              ):

                  imagenes += 1


          # ============================================================
          # INFORME
          # ============================================================

          print("")
          print("======================================")
          print("       TENDENCIAS MX - RSS")
          print("======================================")
          print(
              "TOTAL:",
              len(noticias)
          )
          print(
              "MÉXICO:",
              conteo["mexico"]
          )
          print(
              "POLÍTICA:",
              conteo["politica"]
          )
          print(
              "MUNDO:",
              conteo["mundo"]
          )
          print(
              "DINERO:",
              conteo["dinero"]
          )
          print(
              "DEPORTES:",
              conteo["deportes"]
          )
          print(
              "ENTRETENIMIENTO:",
              conteo["entretenimiento"]
          )
          print(
              "TECNOLOGÍA:",
              conteo["tecnologia"]
          )
          print(
              "TENDENCIAS:",
              conteo["tendencias"]
          )
          print(
              "TRÁMITES:",
              conteo["tramites"]
          )
          print(
              "CON IMAGEN:",
              imagenes
          )
          print("======================================")
          print("")


