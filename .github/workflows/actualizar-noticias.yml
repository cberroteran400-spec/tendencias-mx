name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Crear noticias.json desde RSS
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          import html
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          RSS_URL = "https://expansion.mx/rss"

          MAX_NOTICIAS = 100


          # ============================================================
          # DESCARGAR RSS
          # ============================================================

          req = urllib.request.Request(
              RSS_URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(
              req,
              timeout=30
          ) as response:

              data = response.read()


          root = ET.fromstring(data)

          noticias = []


          # ============================================================
          # FUNCIONES
          # ============================================================

          def limpiar_html(texto):

              if not texto:
                  return ""

              texto = html.unescape(texto)

              texto = re.sub(
                  r"<script[^>]*>.*?</script>",
                  "",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<style[^>]*>.*?</style>",
                  "",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<[^>]+>",
                  "",
                  texto
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          def obtener_tag(item, nombre):

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  if tag.lower() == nombre.lower():

                      if elemento.text:
                          return elemento.text.strip()

              return ""


          # ============================================================
          # BUSCAR IMAGEN
          # ============================================================

          def obtener_imagen(item):

              # --------------------------------------------------------
              # 1. media:content
              # 2. media:thumbnail
              # 3. enclosure
              # 4. image
              # --------------------------------------------------------

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  tag = tag.lower()

                  if tag in [
                      "content",
                      "thumbnail",
                      "enclosure",
                      "image"
                  ]:

                      for atributo in [
                          "url",
                          "href",
                          "src"
                      ]:

                          url = elemento.attrib.get(
                              atributo,
                              ""
                          ).strip()

                          if url:

                              if url.startswith("//"):
                                  url = "https:" + url

                              return urljoin(
                                  RSS_URL,
                                  url
                              )


              # --------------------------------------------------------
              # Buscar imagen dentro de description
              # --------------------------------------------------------

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  tag = tag.lower()

                  if tag in [
                      "description",
                      "encoded",
                      "content"
                  ]:

                      contenido = elemento.text or ""

                      # src
                      resultado = re.search(
                          r'<img[^>]+src=["\']([^"\']+)["\']',
                          contenido,
                          re.I
                      )

                      if resultado:

                          url = html.unescape(
                              resultado.group(1)
                          ).strip()

                          if url.startswith("//"):
                              url = "https:" + url

                          return urljoin(
                              RSS_URL,
                              url
                          )


                      # data-src
                      resultado = re.search(
                          r'<img[^>]+data-src=["\']([^"\']+)["\']',
                          contenido,
                          re.I
                      )

                      if resultado:

                          url = html.unescape(
                              resultado.group(1)
                          ).strip()

                          if url.startswith("//"):
                              url = "https:" + url

                          return urljoin(
                              RSS_URL,
                              url
                          )


              return ""


          # ============================================================
          # DETERMINAR CATEGORÍA
          # ============================================================

          def obtener_categoria(titulo, enlace, categoria_rss):

              titulo = (titulo or "").lower()
              enlace = (enlace or "").lower()
              categoria_rss = (categoria_rss or "").lower()


              texto = (
                  titulo +
                  " " +
                  enlace +
                  " " +
                  categoria_rss
              )


              # --------------------------------------------------------
              # MUNDO
              # --------------------------------------------------------

              if (
                  "/mundo/" in enlace
                  or "mundo" in categoria_rss
                  or "internacional" in categoria_rss
              ):

                  return "mundo"


              # --------------------------------------------------------
              # TECNOLOGÍA
              # --------------------------------------------------------

              if (
                  "/tecnologia/" in enlace
                  or "tecnologia" in categoria_rss
                  or "tecnología" in categoria_rss
              ):

                  return "tecnologia"


              # --------------------------------------------------------
              # ECONOMÍA
              # --------------------------------------------------------

              if (
                  "/economia/" in enlace
                  or "/mercados/" in enlace
                  or "/finanzas-personales/" in enlace
                  or "economia" in categoria_rss
                  or "economía" in categoria_rss
                  or "mercados" in categoria_rss
              ):

                  return "economia"


              # --------------------------------------------------------
              # DEPORTES
              # --------------------------------------------------------

              palabras_deportes = [
                  "/deportes/",
                  "deportes",
                  "futbol",
                  "fútbol",
                  "liga mx",
                  "nba",
                  "nfl",
                  "mlb",
                  "tenis",
                  "boxeo",
                  "béisbol",
                  "beisbol",
                  "mundial de futbol",
                  "mundial de fútbol"
              ]

              if any(
                  palabra in texto
                  for palabra in palabras_deportes
              ):

                  return "deportes"


              # --------------------------------------------------------
              # ENTRETENIMIENTO
              # --------------------------------------------------------

              palabras_entretenimiento = [
                  "/entretenimiento/",
                  "/espectaculos/",
                  "/espectáculos/",
                  "/cine/",
                  "/musica/",
                  "/música/",
                  "entretenimiento",
                  "espectaculos",
                  "espectáculos",
                  "celebridad",
                  "famosos",
                  "cine",
                  "television",
                  "televisión"
              ]

              if any(
                  palabra in texto
                  for palabra in palabras_entretenimiento
              ):

                  return "entretenimiento"


              # --------------------------------------------------------
              # MÉXICO
              # --------------------------------------------------------

              palabras_mexico = [
                  "/mexico/",
                  "/méxico/",
                  "mexico",
                  "méxico",
                  "nacional",
                  "cdmx",
                  "estado de mexico",
                  "estado de méxico",
                  "ciudad de mexico",
                  "ciudad de méxico",
                  "presidencia",
                  "senado",
                  "diputados",
                  "gobierno federal",
                  "gobierno de mexico",
                  "gobierno de méxico"
              ]

              if any(
                  palabra in texto
                  for palabra in palabras_mexico
              ):

                  return "mexico"


              # --------------------------------------------------------
              # POR DEFECTO
              #
              # Las noticias de portada de Expansión que no tienen
              # una sección internacional se consideran México.
              # --------------------------------------------------------

              return "mexico"


          # ============================================================
          # LEER TODAS LAS NOTICIAS
          # ============================================================

          for item in root.findall(".//item"):

              titulo = obtener_tag(
                  item,
                  "title"
              )

              enlace = obtener_tag(
                  item,
                  "link"
              )

              descripcion = obtener_tag(
                  item,
                  "description"
              )

              fecha = obtener_tag(
                  item,
                  "pubDate"
              )

              categoria_rss = obtener_tag(
                  item,
                  "category"
              )


              if not titulo or not enlace:
                  continue


              descripcion_limpia = limpiar_html(
                  descripcion
              )


              imagen = obtener_imagen(
                  item
              )


              categoria = obtener_categoria(
                  titulo,
                  enlace,
                  categoria_rss
              )


              noticia = {

                  "titulo": titulo,

                  "descripcion":
                      descripcion_limpia[:500],

                  "enlace": enlace,

                  "fecha": fecha,

                  "fuente": "Expansión",

                  "categoria": categoria,

                  "imagen": imagen
              }


              noticias.append(
                  noticia
              )


          # ============================================================
          # ELIMINAR DUPLICADOS
          # ============================================================

          noticias_unicas = {}

          for noticia in noticias:

              enlace = noticia["enlace"]

              if enlace not in noticias_unicas:

                  noticias_unicas[enlace] = noticia


          noticias = list(
              noticias_unicas.values()
          )


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          def fecha_orden(noticia):

              return noticia.get(
                  "fecha",
                  ""
              )


          noticias.sort(
              key=fecha_orden,
              reverse=True
          )


          # ============================================================
          # LIMITAR
          # ============================================================

          noticias = noticias[
              :MAX_NOTICIAS
          ]


          # ============================================================
          # ESTADÍSTICAS
          # ============================================================

          conteo = {
              "mexico": 0,
              "mundo": 0,
              "economia": 0,
              "deportes": 0,
              "entretenimiento": 0,
              "tecnologia": 0
          }

          imagenes = 0


          for noticia in noticias:

              categoria = noticia.get(
                  "categoria"
              )

              if categoria in conteo:

                  conteo[categoria] += 1

              if noticia.get(
                  "imagen"
              ):

                  imagenes += 1


          print("")
          print("====================================")
          print("TENDENCIAS MX - RSS")
          print("====================================")
          print(
              "Total:",
              len(noticias)
          )
          print(
              "México:",
              conteo["mexico"]
          )
          print(
              "Mundo:",
              conteo["mundo"]
          )
          print(
              "Economía:",
              conteo["economia"]
          )
          print(
              "Deportes:",
              conteo["deportes"]
          )
          print(
              "Entretenimiento:",
              conteo["entretenimiento"]
          )
          print(
              "Tecnología:",
              conteo["tecnologia"]
          )
          print(
              "Con imagen:",
              imagenes
          )
          print("====================================")
          print("")


          # ============================================================
          # CREAR NOTICIAS.JSON
          # ============================================================

          resultado = {

              "actualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "fuente":
                  "Expansión",

              "noticias":
                  noticias
          }


          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  resultado,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "noticias.json actualizado correctamente."
          )

          PY


      - name: Guardar noticias actualizadas
        run: |
          git config user.name "Tendencias MX Bot"
          git config user.email "actions@github.com"

          git add noticias.json

          git diff --cached --quiet || git commit -m "Actualizar noticias RSS"

          git push
