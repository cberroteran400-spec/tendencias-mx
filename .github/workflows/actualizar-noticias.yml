name: Actualizar noticias RSS

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install feedparser requests

      - name: Crear noticias.json desde multiples RSS
        run: |
          python3 << 'PY'
          import feedparser, json, re
          from datetime import datetime, timezone

          RSS_FEEDS = {
              "https://www.mediotiempo.com/rss.xml": "deportes",
              "https://www.espn.com.mx/espn/rss/news/rss.xml": "deportes",
              "https://expansion.mx/rss/tecnologia": "tecnologia",
              "https://expansion.mx/rss/mundo": "mundo",
              "https://expansion.mx/rss/economia": "economia",
              "https://expansion.mx/rss/nacional": "mexico",
              "https://expansion.mx/rss": "general"
          }

          def get_imagen(entry):
              if 'media_content' in entry:
                  for m in entry.media_content:
                      if 'url' in m:
                          return m['url']
              if 'enclosures' in entry and len(entry.enclosures)>0:
                  return entry.enclosures[0].href
              desc = entry.get('description','')
              match = re.search(r'<img[^>]+src="([^"]+)"', desc)
              if match:
                  return match.group(1)
              return ""

          def get_categoria(entry, feed_cat):
              if feed_cat!= "general":
                  return feed_cat
              t = (entry.get('title','') + ' ' + entry.get('link','')).lower()
              if 'deport' in t or 'futbol' in t or 'fútbol' in t or 'nfl' in t or 'liga mx' in t:
                  return 'deportes'
              if 'tecnologia' in t: return 'tecnologia'
              if 'mundo' in t: return 'mundo'
              if 'economia' in t: return 'economia'
              return 'mexico'

          noticias = []
          for url, cat in RSS_FEEDS.items():
              try:
                  feed = feedparser.parse(url)
                  for e in feed.entries[:15]:
                      clean_desc = re.sub('<[^<]+?>', '', e.get('description',''))[:220]
                      noticias.append({
                          "titulo": e.get('title','').strip(),
                          "descripcion": clean_desc.strip(),
                          "link": e.get('link',''),
                          "fecha": e.get('published',''),
                          "fuente": "RSS",
                          "categoria": get_categoria(e, cat),
                          "imagen": get_imagen(e)
                      })
              except Exception as ex:
                  print(f"Error {url}: {ex}")

          unicos = list({n['link']: n for n in noticias if n['link']}.values())
          data = {
              "actualizado": datetime.now(timezone.utc).isoformat(),
              "total": len(unicos),
              "noticias": unicos[:120]
          }

          with open('noticias.json','w',encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print(f"OK {len(data['noticias'])} noticias generadas")
          PY

      - name: Guardar noticias actualizadas
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add noticias.json
          git diff --staged --quiet || git commit -m "Actualizar noticias RSS con deportes"
          git push