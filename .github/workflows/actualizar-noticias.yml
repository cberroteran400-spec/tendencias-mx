name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Actualizar noticias
        run: |
          cat > actualizar.py <<'PY'
          import os, re, json, hashlib, html, base64, unicodedata
          from datetime import datetime, timezone, timedelta
          from urllib.parse import quote_plus, urlparse, urljoin
          import feedparser, requests
          from bs4 import BeautifulSoup

          ARCHIVO = "noticias.json"
          MAX_TOTAL = 1200
          MAX_POR_GRUPO = 120
          MAX_TENDENCIAS = 25
          MAX_NOTICIAS_POR_TENDENCIA = 5
          MAX_POR_FEED = 30
          USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          HEADERS = {"User-Agent": USER_AGENT}
          AHORA = datetime.now(timezone.utc)
          LIMITE_DIAS = 14

          FUENTES_GENERALES = {"Expansión": [("Noticias", "https://expansion.mx/rss"),("Mundo", "https://expansion.mx/rss/internacional"),("Dinero", "https://expansion.mx/rss/economia"),("Tecnologia", "https://expansion.mx/rss/tecnologia"),("Tendencias", "https://expansion.mx/rss/tendencias"),("Empresas", "https://expansion.mx/rss/empresas"),("Politica", "https://expansion.mx/rss/politica")]}
          FUENTES_DEPORTIVAS = {"futbol": [("ESPN", "https://www.espn.com/espn/rss/soccer/news"),("Google News", "fútbol México Liga MX Selección Mexicana"),("Google News", "Champions League fútbol")],"tenis": [("ESPN", "https://www.espn.com/espn/rss/tennis/news"),("Google News", "tenis ATP WTA"),("Google News", "tenis México")],"beisbol": [("ESPN", "https://www.espn.com/espn/rss/mlb/news"),("Google News", "MLB béisbol"),("Google News", "béisbol México")],"nfl": [("ESPN", "https://www.espn.com/espn/rss/nfl/news"),("Google News", "NFL México")],"basquetbol": [("ESPN", "https://www.espn.com/espn/rss/nba/news"),("Google News", "NBA")],"boxeo": [("ESPN", "https://www.espn.com/espn/rss/boxing/news"),("Google News", "boxeo México"),("Google News", "Canelo boxeo")],"formula1": [("ESPN", "https://www.espn.com/espn/rss/rpm/news"),("Google News", "Fórmula 1 F1"),("Google News", "Checo Pérez Fórmula 1")],"otros": [("ESPN", "https://www.espn.com/espn/rss/golf/news"),("Google News", "golf"),("Google News", "atletismo")]}
          PALABRAS_DEPORTIVAS = {"futbol": ["fútbol","futbol","liga mx","selección mexicana","champions"],"tenis": ["tenis","atp","wta","grand slam","alcaraz","djokovic"],"beisbol": ["béisbol","beisbol","mlb"],"nfl": ["nfl","super bowl"],"basquetbol": ["nba","basquetbol"],"boxeo": ["boxeo","canelo","ufc","mma"],"formula1": ["fórmula 1","formula 1","f1","gran premio","checo pérez"]}

          def normalizar(t):
              if not t: return ""
              t=html.unescape(str(t)); t=unicodedata.normalize("NFKD",t); t="".join(c for c in t if not unicodedata.combining(c)); t=t.lower(); return re.sub(r"\s+"," ",t).strip()
          def limpiar_html(t):
              if not t: return ""
              soup=BeautifulSoup(str(t),"html.parser"); return re.sub(r"\s+"," ",html.unescape(soup.get_text(" ",strip=True))).strip()
          def fecha_entry(e):
              try:
                  if getattr(e,"published_parsed",None):
                      import calendar; return datetime.fromtimestamp(calendar.timegm(e.published_parsed),timezone.utc)
              except: pass
              return AHORA
          def fecha_iso(f): return f.astimezone(timezone.utc).isoformat()
          def hash_noticia(t,u): return hashlib.sha256((normalizar(t)[:500]+"|"+normalizar(u)).encode()).hexdigest()
          def url_valida(u):
              try: p=urlparse(u); return p.scheme in ("http","https") and bool(p.netloc)
              except: return False

          # --- FIX IMAGENES V4: SIN REQUESTS, ACEPTA googleusercontent ---
          def es_imagen_invalid(u):
              if not u: return True
              l=u.lower()
              return any(x in l for x in ["news.google.com/rss","gstatic.com/images/branding","logo_google","favicon","1x1"])

          def normalizar_imagen(u):
              if not u: return ""
              try:
                  u=html.unescape(str(u).strip())
                  if u.startswith("//"): u="https:"+u
                  if u.startswith("data:"): return ""
                  p=urlparse(u)
                  return (p.scheme.lower()+"://"+p.netloc.lower()+p.path).rstrip("/").lower()
              except: return ""

          def obtener_imagen_entry(entry):
              # 1) Busca <img> dentro de summary/description (Google News trae la foto ahi)
              for campo in ["summary","description"]:
                  html_text = entry.get(campo,"")
                  if html_text and "<img" in html_text:
                      soup=BeautifulSoup(str(html_text),"html.parser")
                      img=soup.find("img")
                      if img and img.get("src"):
                          src=img.get("src")
                          if src.startswith("//"): src="https:"+src
                          if url_valida(src) and not es_imagen_invalid(src):
                              return src
              # 2) media_content / enclosures
              for key in ["media_content","media_thumbnail"]:
                  for item in entry.get(key,[]):
                      if isinstance(item,dict) and item.get("url"):
                          u=item.get("url")
                          if url_valida(u) and not es_imagen_invalid(u):
                              return u
              for enc in entry.get("enclosures",[]):
                  if isinstance(enc,dict):
                      u=enc.get("href") or enc.get("url")
                      if u and url_valida(u) and not es_imagen_invalid(u):
                          return u
              return ""

          def obtener_candidatos_imagen_pagina(url_noticia):
              if "news.google.com" in url_noticia:
                  return [] # Evitar entrar a google news, ya tenemos imagen del RSS
              try:
                  resp=requests.get(url_noticia,headers=HEADERS,timeout=6)
                  if resp.status_code!=200: return []
                  soup=BeautifulSoup(resp.text,"html.parser")
                  cands=[]
                  for meta in soup.find_all("meta"):
                      prop=str(meta.get("property","")).lower()
                      if prop in ["og:image","og:image:url","twitter:image"]:
                          if meta.get("content"): cands.append(meta.get("content"))
                  for img in soup.find_all("img"):
                      s=img.get("src") or img.get("data-src")
                      if s and s.startswith("http"): cands.append(s)
                  out=[]
                  for c in cands:
                      if url_valida(c) and not es_imagen_invalid(c) and c not in out:
                          out.append(c)
                  return out[:3]
              except: return []

          def obtener_imagen_pagina(url):
              for c in obtener_candidatos_imagen_pagina(url):
                  if url_valida(c): return c
              return ""

          def obtener_fuente_entry(entry, default):
              try:
                  s=entry.get("source")
                  if isinstance(s,dict) and s.get("title"): return limpiar_html(s.get("title"))
              except: pass
              return default
          def clasificar_deporte(t,d="",c=""):
              tx=normalizar(f"{t} {d} {c}")
              for dep,pals in PALABRAS_DEPORTIVAS.items():
                  for p in pals:
                      if normalizar(p) in tx: return dep
              return None
          def limpiar_titulo(t): t=limpiar_html(t); t=re.sub(r"\s+\|\s+[^|]{2,60}$","",t); return t.strip()
          def construir_noticia(entry, fuente, categoria, subcat=None):
              titulo=limpiar_titulo(entry.get("title","")); url=entry.get("link") or entry.get("id") or ""
              if not titulo or not url_valida(url): return None
              desc=limpiar_html(entry.get("summary") or entry.get("description") or "")[:500]
              fecha=fecha_entry(entry)
              if AHORA-fecha>timedelta(days=LIMITE_DIAS): return None
              imagen=obtener_imagen_entry(entry)
              if not imagen: imagen=obtener_imagen_pagina(url)
              if subcat: cat_final="Deportes"; sub_final=subcat
              else: cat_final=categoria; sub_final=""
              if cat_final=="Deportes":
                  det=clasificar_deporte(titulo,desc,sub_final)
                  if det: sub_final=det
              return {"id":hash_noticia(titulo,url),"titulo":titulo,"descripcion":desc,"url":url,"imagen":imagen,"fecha":fecha_iso(fecha),"fuente":fuente,"categoria":cat_final,"subcategoria":sub_final}
          def descargar_feed(url):
              try:
                  r=requests.get(url,headers=HEADERS,timeout=20)
                  if r.status_code!=200: return None
                  return feedparser.parse(r.content)
              except: return None
          def construir_google_news_url(q): return f"https://news.google.com/rss/search?q={quote_plus(q)}&hl=es-419&gl=MX&ceid=MX:es-419"
          def cargar_json():
              if not os.path.exists(ARCHIVO): return {"actualizado":"","total":0,"imagenes":{},"noticias":[]}
              try:
                  with open(ARCHIVO,"r",encoding="utf-8") as f: d=json.load(f)
                  if isinstance(d,list): return {"actualizado":"","total":len(d),"imagenes":{},"noticias":d}
                  if not isinstance(d.get("noticias"),list): d["noticias"]=[]
                  return d
              except: return {"actualizado":"","total":0,"imagenes":{},"noticias":[]}

          datos=cargar_json(); mapa={}
          for n in datos.get("noticias",[]):
              nid=n.get("id") or hash_noticia(n.get("titulo",""),n.get("url",""))
              n["id"]=nid; mapa[nid]=n
          def ya_existe(e):
              t=limpiar_titulo(e.get("title","")); u=e.get("link") or e.get("id") or ""
              if not t or not url_valida(u): return True
              return hash_noticia(t,u) in mapa

          nuevas=0
          for fuente,feeds in FUENTES_GENERALES.items():
              for cat,url in feeds:
                  feed=descargar_feed(url)
                  if not feed: continue
                  for entry in feed.entries[:MAX_POR_FEED]:
                      if ya_existe(entry): continue
                      notic=construir_noticia(entry,fuente,cat)
                      if not notic: continue
                      mapa[notic["id"]]=notic; nuevas+=1
          for deporte,feeds in FUENTES_DEPORTIVAS.items():
              for fuente,ref in feeds:
                  url=construir_google_news_url(ref) if fuente=="Google News" else ref
                  feed=descargar_feed(url)
                  if not feed: continue
                  for entry in feed.entries[:MAX_POR_FEED]:
                      if ya_existe(entry): continue
                      notic=construir_noticia(entry,obtener_fuente_entry(entry,fuente),"Deportes",deporte)
                      if not notic: continue
                      mapa[notic["id"]]=notic; nuevas+=1

          noticias=list(mapa.values()); noticias.sort(key=lambda n:n.get("fecha",""),reverse=True)
          # Deduplicacion simple por URL
          vistos=set(); resultado=[]
          for n in noticias:
              u=n.get("url","").split("#")[0].lower()
              if u in vistos: continue
              vistos.add(u); resultado.append(n)
          resultado=resultado[:MAX_TOTAL]
          con=sum(1 for n in resultado if n.get("imagen"))
          sin=len(resultado)-con
          uniq=len(set(normalizar_imagen(n.get("imagen")) for n in resultado if n.get("imagen")))
          salida={"actualizado":datetime.now(timezone.utc).isoformat(),"total":len(resultado),"imagenes":{"con_imagen":con,"sin_imagen":sin,"imagenes_unicas":uniq},"noticias":resultado}
          with open(ARCHIVO,"w",encoding="utf-8") as f: json.dump(salida,f,ensure_ascii=False,indent=2)
          print(f"Nuevas:{nuevas} Final:{len(resultado)} ConImagen:{con} Sin:{sin} Unicas:{uniq}")
          PY
          python actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Fix imagenes reales - v4 sin validacion"
            git push
          fi