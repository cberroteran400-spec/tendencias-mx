          # ============================================================
          # DETECTAR SECCIÓN REAL DEL URL
          #
          # Esto sirve como segunda barrera contra errores del RSS.
          # ============================================================

          def seccion_url(enlace):

              url = normalizar(enlace)

              if "/deportes/" in url:
                  return "deportes"

              if "/futbol/" in url:
                  return "deportes"

              if "/economia/" in url:
                  return "dinero"

              if "/empresas/" in url:
                  return "dinero"

              if "/tecnologia/" in url:
                  return "tecnologia"

              if "/politica/" in url:
                  return "politica"

              if "/internacional/" in url:
                  return "mundo"

              if "/mundo/" in url:
                  return "mundo"

              if "/entretenimiento/" in url:
                  return "entretenimiento"

              if "/tendencias/" in url:
                  return "tendencias"

              return ""


          # ============================================================
          # VALIDAR DEPORTES
          #
          # Una noticia NO entra a deportes solamente porque:
          # - tenga la palabra América
          # - mencione Mercedes
          # - mencione un jugador empresarial
          # - venga con categoría incorrecta
          #
          # Debe existir una señal deportiva clara.
          # ============================================================

          def es_deporte_real(texto, enlace):

              texto_n = normalizar(texto)
              url_n = normalizar(enlace)

              # URL deportiva explícita
              if (
                  "/deportes/" in url_n
                  or "/futbol/" in url_n
              ):
                  return True

              # Fútbol específico
              if contiene_alguno(
                  texto_n,
                  FUTBOL_TERMS
              ):
                  return True

              # Otros deportes
              if contiene_alguno(
                  texto_n,
                  OTROS_DEPORTES_TERMS
              ):
                  return True

              return False


          # ============================================================
          # CLASIFICACIÓN PRINCIPAL
          # ============================================================

          def clasificar_noticia(
              titulo,
              descripcion,
              enlace,
              categoria_fuente
          ):

              titulo_n = normalizar(titulo)

              descripcion_n = normalizar(
                  descripcion
              )

              enlace_n = normalizar(
                  enlace
              )

              texto = (
                  titulo_n
                  + " "
                  + descripcion_n
              )

              seccion = seccion_url(
                  enlace_n
              )


              # --------------------------------------------------------
              # 1. DEPORTES
              #
              # Solo si hay evidencia deportiva real.
              # --------------------------------------------------------

              if es_deporte_real(
                  texto,
                  enlace_n
              ):

                  return "deportes"


              # --------------------------------------------------------
              # 2. TECNOLOGÍA
              # --------------------------------------------------------

              if (
                  categoria_fuente == "tecnologia"
                  or
                  seccion == "tecnologia"
              ):

                  return "tecnologia"


              # --------------------------------------------------------
              # 3. POLÍTICA
              # --------------------------------------------------------

              if (
                  categoria_fuente == "politica"
                  or
                  seccion == "politica"
              ):

                  return "politica"


              # --------------------------------------------------------
              # 4. DINERO
              #
              # Economía y Empresas van aquí.
              # --------------------------------------------------------

              if (
                  categoria_fuente == "dinero"
                  or
                  seccion == "dinero"
              ):

                  return "dinero"


              # --------------------------------------------------------
              # 5. ENTRETENIMIENTO
              # --------------------------------------------------------

              if (
                  categoria_fuente == "entretenimiento"
                  or
                  seccion == "entretenimiento"
              ):

                  return "entretenimiento"


              # --------------------------------------------------------
              # 6. MUNDO
              # --------------------------------------------------------

              if (
                  categoria_fuente == "mundo"
                  or
                  seccion == "mundo"
              ):

                  return "mundo"


              # --------------------------------------------------------
              # 7. TRÁMITES
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  TRAMITES_TERMS
              ):

                  return "tramites"


              # --------------------------------------------------------
              # 8. TECNOLOGÍA POR CONTENIDO
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  TECNOLOGIA_TERMS
              ):

                  return "tecnologia"


              # --------------------------------------------------------
              # 9. ENTRETENIMIENTO POR CONTENIDO
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  ENTRETENIMIENTO_TERMS
              ):

                  return "entretenimiento"


              # --------------------------------------------------------
              # 10. DINERO POR CONTENIDO
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  DINERO_TERMS
              ):

                  return "dinero"


              # --------------------------------------------------------
              # 11. POLÍTICA POR CONTENIDO
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  POLITICA_TERMS
              ):

                  return "politica"


              # --------------------------------------------------------
              # 12. MUNDO POR CONTENIDO
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  MUNDO_TERMS
              ):

                  return "mundo"


              # --------------------------------------------------------
              # 13. TENDENCIAS
              # --------------------------------------------------------

              if categoria_fuente == "tendencias":

                  return "tendencias"


              # --------------------------------------------------------
              # 14. GENERAL
              #
              # Para noticias generales de México.
              # --------------------------------------------------------

              return "mexico"


          # ============================================================
          # DESCARGAR TODAS LAS FUENTES
          # ============================================================

          noticias = []


          for fuente_rss in FUENTES_RSS:

              rss_url = fuente_rss["url"]

              categoria_fuente = \
                  fuente_rss["categoria"]


              data = descargar_rss(
                  rss_url
              )


              if not data:
                  continue


              try:

                  root = ET.fromstring(
                      data
                  )

              except Exception as error:

                  print(
                      "ERROR XML:",
                      rss_url,
                      error
                  )

                  continue


              contador = 0


              for item in root.findall(
                  ".//item"
              ):

                  titulo = obtener_tag(
                      item,
                      "title"
                  )

                  enlace = obtener_tag(
                      item,
                      "link"
                  )

                  descripcion = obtener_tag(
                      item,
                      "description"
                  )

                  fecha = obtener_tag(
                      item,
                      "pubDate"
                  )


                  if (
                      not titulo
                      or
                      not enlace
                  ):

                      continue


                  titulo_limpio = \
                      limpiar_html(
                          titulo
                      )

                  descripcion_limpia = \
                      limpiar_html(
                          descripcion
                      )


                  imagen = obtener_imagen(
                      item,
                      rss_url
                  )


                  categoria = \
                      clasificar_noticia(
                          titulo_limpio,
                          descripcion_limpia,
                          enlace,
                          categoria_fuente
                      )


                  noticia = {

                      "titulo":
                          titulo_limpio,

                      "descripcion":
                          descripcion_limpia[:600],

                      "enlace":
                          enlace.strip(),

                      "fecha":
                          fecha.strip(),

                      "fuente":
                          "Expansión",

                      "categoria":
                          categoria,

                      "imagen":
                          imagen,

                      "rss":
                          categoria_fuente

                  }


                  noticias.append(
                      noticia
                  )

                  contador += 1


              print(
                  "Noticias obtenidas:",
                  contador
              )


          # ============================================================
          # ELIMINAR DUPLICADOS
          # ============================================================

          noticias_unicas = {}


          for noticia in noticias:

              enlace = noticia.get(
                  "enlace",
                  ""
              )


              if not enlace:
                  continue


              if enlace not in noticias_unicas:

                  noticias_unicas[
                      enlace
                  ] = noticia

              else:

                  existente = \
                      noticias_unicas[
                          enlace
                      ]


                  # Preferimos la versión con imagen.

                  if (
                      not existente.get("imagen")
                      and
                      noticia.get("imagen")
                  ):

                      noticias_unicas[
                          enlace
                      ] = noticia


          noticias = list(
              noticias_unicas.values()
          )


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          noticias.sort(
              key=lambda noticia:
                  noticia.get(
                      "fecha",
                      ""
                  ),
              reverse=True
          )


          # ============================================================
          # LIMITAR A 150
          # ============================================================

          noticias = noticias[
              :MAX_NOTICIAS
          ]


          # ============================================================
          # CONTADORES
          # ============================================================

          categorias = {

              "mexico": 0,

              "politica": 0,

              "mundo": 0,

              "dinero": 0,

              "deportes": 0,

              "entretenimiento": 0,

              "tecnologia": 0,

              "tendencias": 0,

              "tramites": 0

          }


          imagenes = 0

          futbol_total = 0


          for noticia in noticias:

              categoria = noticia.get(
                  "categoria",
                  "mexico"
              )


              if categoria in categorias:

                  categorias[
                      categoria
                  ] += 1


              if noticia.get("imagen"):

                  imagenes += 1


              texto = normalizar(
                  noticia.get(
                      "titulo",
                      ""
                  )
                  + " "
                  +
                  noticia.get(
                      "descripcion",
                      ""
                  )
              )


              if (
                  categoria == "deportes"
                  and
                  contiene_alguno(
                      texto,
                      FUTBOL_TERMS
                  )
              ):

                  futbol_total += 1


          # ============================================================
          # INFORMACIÓN DEL WORKFLOW
          # ============================================================

          print("")
          print("======================================")
          print("       TENDENCIASMX - RSS")
          print("======================================")

          print(
              "TOTAL:",
              len(noticias)
          )

          print(
              "MÉXICO:",
              categorias["mexico"]
          )

          print(
              "POLÍTICA:",
              categorias["politica"]
          )

          print(
              "MUNDO:",
              categorias["mundo"]
          )

          print(
              "DINERO:",
              categorias["dinero"]
          )

          print(
              "DEPORTES:",
              categorias["deportes"]
          )

          print(
              "FÚTBOL:",
              futbol_total
          )

          print(
              "ENTRETENIMIENTO:",
              categorias["entretenimiento"]
          )

          print(
              "TECNOLOGÍA:",
              categorias["tecnologia"]
          )

          print(
              "TENDENCIAS:",
              categorias["tendencias"]
          )

          print(
              "TRÁMITES:",
              categorias["tramites"]
          )

          print(
              "CON IMAGEN:",
              imagenes
          )

          print("======================================")


          # ============================================================
          # CREAR noticias.json
          # ============================================================

          resultado = {

              "actualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "fuente":
                  "Expansión",

              "total":
                  len(noticias),

              "categorias":
                  categorias,

              "futbol":
                  futbol_total,

              "noticias":
                  noticias

          }


          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  resultado,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print(
              "noticias.json creado correctamente."
          )
          print("")


          PY


      # ================================================================
      # GUARDAR CAMBIOS
      # ================================================================

      - name: Guardar noticias actualizadas
        run: |

          git config user.name \
            "TendenciasMX Bot"

          git config user.email \
            "actions@github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit \
            -m "Actualizar noticias RSS"

          git push
