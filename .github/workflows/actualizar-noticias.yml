name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Actualizar noticias
        run: |
          cat > actualizar.py <<'PY'
          import os
          import re
          import json
          import time
          import hashlib
          import html
          import base64
          import unicodedata
          from datetime import datetime, timezone, timedelta
          from urllib.parse import quote_plus, urlparse, urljoin

          import feedparser
          import requests
          from bs4 import BeautifulSoup


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          ARCHIVO = "noticias.json"

          MAX_TOTAL = 1200
          MAX_POR_GRUPO = 120
          MAX_TENDENCIAS = 25
          MAX_NOTICIAS_POR_TENDENCIA = 5
          MAX_POR_FEED = 30

          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/124.0.0.0 Safari/537.36"
          )

          HEADERS = {
              "User-Agent": USER_AGENT,
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "es-MX,es;q=0.9,en-US;q=0.8,en;q=0.7"
          }

          AHORA = datetime.now(timezone.utc)
          LIMITE_DIAS = 14


          # ============================================================
          # FUENTES GENERALES
          # ============================================================

          FUENTES_GENERALES = {
              "Expansión": [
                  ("Noticias", "https://expansion.mx/rss"),
                  ("Mundo", "https://expansion.mx/rss/internacional"),
                  ("Dinero", "https://expansion.mx/rss/economia"),
                  ("Tecnologia", "https://expansion.mx/rss/tecnologia"),
                  ("Tendencias", "https://expansion.mx/rss/tendencias"),
                  ("Empresas", "https://expansion.mx/rss/empresas"),
                  ("Politica", "https://expansion.mx/rss/politica"),
              ]
          }


          # ============================================================
          # FUENTES DEPORTIVAS
          # ============================================================

          FUENTES_DEPORTIVAS = {
              "futbol": [
                  ("ESPN", "https://www.espn.com/espn/rss/soccer/news"),
                  ("Google News", "fútbol México Liga MX Selección Mexicana"),
                  ("Google News", "Champions League fútbol"),
                  ("Google News", "fútbol internacional"),
              ],

              "tenis": [
                  ("ESPN", "https://www.espn.com/espn/rss/tennis/news"),
                  ("Google News", "tenis ATP WTA"),
                  ("Google News", "Carlos Alcaraz Novak Djokovic Jannik Sinner"),
                  ("Google News", "tenis México"),
              ],

              "beisbol": [
                  ("ESPN", "https://www.espn.com/espn/rss/mlb/news"),
                  ("Google News", "MLB béisbol"),
                  ("Google News", "béisbol México Liga Mexicana"),
                  ("Google News", "Yankees Dodgers Padres Cubs"),
              ],

              "nfl": [
                  ("ESPN", "https://www.espn.com/espn/rss/nfl/news"),
                  ("Google News", "NFL"),
                  ("Google News", "NFL México"),
                  ("Google News", "Super Bowl NFL"),
              ],

              "basquetbol": [
                  ("ESPN", "https://www.espn.com/espn/rss/nba/news"),
                  ("Google News", "NBA"),
                  ("Google News", "WNBA"),
                  ("Google News", "basquetbol México"),
              ],

              "boxeo": [
                  ("ESPN", "https://www.espn.com/espn/rss/boxing/news"),
                  ("Google News", "boxeo México"),
                  ("Google News", "boxeo mundial"),
                  ("Google News", "Canelo boxeo"),
                  ("Google News", "UFC MMA"),
              ],

              "formula1": [
                  ("ESPN", "https://www.espn.com/espn/rss/rpm/news"),
                  ("Google News", "Fórmula 1 F1"),
                  ("Google News", "Gran Premio F1"),
                  ("Google News", "F1 México"),
                  ("Google News", "Checo Pérez Fórmula 1"),
              ],

              "otros": [
                  ("ESPN", "https://www.espn.com/espn/rss/golf/news"),
                  ("Google News", "golf"),
                  ("Google News", "ciclismo"),
                  ("Google News", "atletismo"),
                  ("Google News", "natación"),
                  ("Google News", "juegos olímpicos"),
              ]
          }


          # ============================================================
          # PALABRAS PARA CLASIFICACIÓN
          # ============================================================

          PALABRAS_DEPORTIVAS = {
              "futbol": [
                  "fútbol", "futbol", "liga mx", "selección mexicana",
                  "seleccion mexicana", "champions league", "mundial",
                  "premier league", "la liga", "real madrid", "barcelona",
                  "américa", "cruz azul", "chivas", "pumas", "tigres",
                  "monterrey", "necaxa", "toluca", "pachuca"
              ],

              "tenis": [
                  "tenis", "atp", "wta", "grand slam", "wimbledon",
                  "roland garros", "us open", "australian open",
                  "alcaraz", "djokovic", "sinner", "sabalenka",
                  "swiatek", "nadal"
              ],

              "beisbol": [
                  "béisbol", "beisbol", "mlb", "liga mexicana",
                  "yankees", "dodgers", "padres", "cubs", "red sox",
                  "braves", "phillies", "world series"
              ],

              "nfl": [
                  "nfl", "fútbol americano", "futbol americano",
                  "super bowl", "chiefs", "cowboys", "49ers",
                  "eagles", "ravens", "bills", "packers"
              ],

              "basquetbol": [
                  "nba", "wnba", "básquetbol", "basquetbol",
                  "basketball", "lakers", "warriors", "celtics",
                  "knicks", "bucks", "nuggets", "spurs"
              ],

              "boxeo": [
                  "boxeo", "box", "canelo", "usyk", "fury",
                  "crawford", "pacquiao", "mayweather", "peso",
                  "nocaut", "knockout", "ufc", "mma"
              ],

              "formula1": [
                  "fórmula 1", "formula 1", "f1", "gran premio",
                  "checo pérez", "checo perez", "verstappen",
                  "hamilton", "leclerc", "norris", "ferrari",
                  "red bull racing", "mclaren"
              ]
          }


          # ============================================================
          # FUNCIONES BASE
          # ============================================================

          def normalizar(texto):
              if not texto:
                  return ""

              texto = html.unescape(str(texto))
              texto = unicodedata.normalize("NFKD", texto)
              texto = "".join(
                  c for c in texto
                  if not unicodedata.combining(c)
              )
              texto = texto.lower()
              texto = re.sub(r"\s+", " ", texto).strip()

              return texto


          def limpiar_html(texto):
              if not texto:
                  return ""

              soup = BeautifulSoup(str(texto), "html.parser")
              texto = soup.get_text(" ", strip=True)
              texto = html.unescape(texto)
              texto = re.sub(r"\s+", " ", texto)

              return texto.strip()


          def fecha_entry(entry):
              try:
                  if getattr(entry, "published_parsed", None):
                      import calendar
                      timestamp = calendar.timegm(entry.published_parsed)
                      return datetime.fromtimestamp(
                          timestamp,
                          timezone.utc
                      )
              except Exception:
                  pass

              try:
                  if getattr(entry, "updated_parsed", None):
                      import calendar
                      timestamp = calendar.timegm(entry.updated_parsed)
                      return datetime.fromtimestamp(
                          timestamp,
                          timezone.utc
                      )
              except Exception:
                  pass

              return AHORA


          def fecha_iso(fecha):
              return fecha.astimezone(timezone.utc).isoformat()


          def hash_noticia(titulo, url):
              base = (
                  normalizar(titulo)[:500]
                  + "|"
                  + normalizar(url)
              )

              return hashlib.sha256(
                  base.encode("utf-8")
              ).hexdigest()


          def url_valida(url):
              if not url:
                  return False

              try:
                  p = urlparse(url)
                  return p.scheme in ("http", "https") and bool(p.netloc)
              except Exception:
                  return False


          # ============================================================
          # IMÁGENES REALES
          # ============================================================

          IMAGENES_USADAS = set()


          def normalizar_imagen(url):
              if not url:
                  return ""

              try:
                  url = html.unescape(str(url).strip())

                  if url.startswith("//"):
                      url = "https:" + url

                  partes = urlparse(url)

                  if partes.scheme not in ("http", "https"):
                      return ""

                  return (
                      partes.scheme.lower()
                      + "://"
                      + partes.netloc.lower()
                      + partes.path
                  ).rstrip("/")

              except Exception:
                  return ""


          def desocultar_url_google_news(url):
              if "news.google.com" not in url:
                  return url

              try:
                  parsed = urlparse(url)
                  parts = parsed.path.split("/")

                  if "articles" in parts:
                      art_idx = parts.index("articles")

                      if art_idx + 1 < len(parts):
                          encoded_str = parts[art_idx + 1]

                          pad = len(encoded_str) % 4

                          if pad:
                              encoded_str += "=" * (4 - pad)

                          decoded = base64.b64decode(
                              encoded_str
                          ).decode(
                              "latin1",
                              errors="ignore"
                          )

                          urls_encontradas = re.findall(
                              r'https?://[^\s<">]+',
                              decoded
                          )

                          for u in urls_encontradas:
                              if (
                                  "google.com" not in u
                                  and url_valida(u)
                              ):
                                  return u

              except Exception:
                  pass

              try:
                  resp = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=2,
                      allow_redirects=True
                  )

                  if (
                      resp.status_code == 200
                      and "google.com" not in resp.url
                  ):
                      return resp.url

              except Exception:
                  pass

              return url


          def es_imagen_invalid_google(url):
              if not url:
                  return True

              patrones = [
                  "googleusercontent.com",
                  "news.google.com",
                  "gstatic.com",
                  "lh3.google",
                  "lh4.google",
                  "lh5.google",
                  "logo_google",
                  "google.com/images"
              ]

              return any(
                  p in url.lower()
                  for p in patrones
              )


          def comprobar_imagen(url, permitir_repetida=False):
              if not url:
                  return ""

              if es_imagen_invalid_google(url):
                  return ""

              try:
                  url = html.unescape(
                      str(url).strip()
                  )

                  if url.startswith("//"):
                      url = "https:" + url

                  if not url_valida(url):
                      return ""

                  imagen_normalizada = normalizar_imagen(url)

                  if (
                      not permitir_repetida
                      and imagen_normalizada
                      and imagen_normalizada in IMAGENES_USADAS
                  ):
                      return ""

                  resp = requests.head(
                      url,
                      headers=HEADERS,
                      timeout=2,
                      allow_redirects=True
                  )

                  if resp.status_code != 200:
                      resp = requests.get(
                          url,
                          headers=HEADERS,
                          timeout=2,
                          stream=True,
                          allow_redirects=True
                      )

                  if resp.status_code == 200:

                      tipo = resp.headers.get(
                          "Content-Type",
                          ""
                      ).lower()

                      url_final = resp.url

                      if (
                          tipo.startswith("image/")
                          and not es_imagen_invalid_google(
                              url_final
                          )
                      ):

                          imagen_final_normalizada = (
                              normalizar_imagen(
                                  url_final
                              )
                          )

                          if (
                              permitir_repetida
                              or not imagen_final_normalizada
                              or imagen_final_normalizada
                              not in IMAGENES_USADAS
                          ):

                              if imagen_final_normalizada:
                                  IMAGENES_USADAS.add(
                                      imagen_final_normalizada
                                  )

                              return url_final

              except Exception:
                  pass

              return ""


          def obtener_candidatos_imagen_pagina(url_noticia):

              url_real = desocultar_url_google_news(
                  url_noticia
              )

              if not url_valida(url_real):
                  return []

              try:
                  resp = requests.get(
                      url_real,
                      headers=HEADERS,
                      timeout=3,
                      allow_redirects=True
                  )

                  if resp.status_code != 200:
                      return []

                  soup = BeautifulSoup(
                      resp.text,
                      "html.parser"
                  )

                  candidatos = []

                  for meta in soup.find_all("meta"):

                      prop = str(
                          meta.get("property", "")
                      ).lower()

                      name = str(
                          meta.get("name", "")
                      ).lower()

                      content = meta.get(
                          "content",
                          ""
                      )

                      if (
                          prop in [
                              "og:image",
                              "og:image:url",
                              "twitter:image",
                              "twitter:image:src"
                          ]
                          or
                          name in [
                              "og:image",
                              "og:image:url",
                              "twitter:image",
                              "twitter:image:src"
                          ]
                      ):

                          if content:
                              candidatos.append(
                                  urljoin(
                                      resp.url,
                                      content.strip()
                                  )
                              )

                  for link in soup.find_all("link"):

                      rel = link.get(
                          "rel",
                          []
                      )

                      href = link.get(
                          "href",
                          ""
                      )

                      if isinstance(rel, list):
                          rel_text = " ".join(rel).lower()
                      else:
                          rel_text = str(rel).lower()

                      if (
                          "image_src" in rel_text
                          and href
                      ):
                          candidatos.append(
                              urljoin(
                                  resp.url,
                                  href
                              )
                          )

                  for img in soup.find_all("img"):

                      atributos = [
                          "src",
                          "data-src",
                          "data-lazy-src",
                          "data-original",
                          "data-image",
                          "data-lazy"
                      ]

                      for atributo in atributos:

                          valor = img.get(
                              atributo
                          )

                          if valor:
                              candidatos.append(
                                  urljoin(
                                      resp.url,
                                      valor.strip()
                                  )
                              )

                      srcset = img.get(
                          "srcset"
                      )

                      if srcset:

                          for parte in srcset.split(","):

                              valor = parte.strip().split(" ")[0]

                              if valor:
                                  candidatos.append(
                                      urljoin(
                                          resp.url,
                                          valor
                                      )
                                  )

                  salida = []
                  vistos = set()

                  for candidato in candidatos:

                      normalizado = normalizar_imagen(
                          candidato
                      )

                      if not normalizado:
                          continue

                      if normalizado in vistos:
                          continue

                      vistos.add(
                          normalizado
                      )

                      salida.append(
                          candidato
                      )

                  return salida

              except Exception:
                  return []


          def obtener_imagen_pagina(url_noticia):

              candidatos = (
                  obtener_candidatos_imagen_pagina(
                      url_noticia
                  )
              )

              for candidato in candidatos:

                  img_valida = comprobar_imagen(
                      candidato,
                      permitir_repetida=False
                  )

                  if img_valida:
                      return img_valida

              for candidato in candidatos:

                  if es_imagen_invalid_google(
                      candidato
                  ):
                      continue

                  try:
                      candidato_normalizado = (
                          normalizar_imagen(
                              candidato
                          )
                      )

                      if (
                          candidato_normalizado
                          and candidato_normalizado
                          in IMAGENES_USADAS
                      ):
                          continue

                      img_valida = comprobar_imagen(
                          candidato,
                          permitir_repetida=False
                      )

                      if img_valida:
                          return img_valida

                  except Exception:
                      pass

              return ""


          def obtener_imagen_entry(entry):

              candidatos = []

              for key in [
                  "media_content",
                  "media_thumbnail"
              ]:

                  for item in entry.get(
                      key,
                      []
                  ):

                      if (
                          isinstance(
                              item,
                              dict
                          )
                          and item.get("url")
                      ):
                          candidatos.append(
                              item.get("url")
                          )

              for enclosure in entry.get(
                  "enclosures",
                  []
              ):

                  if isinstance(
                      enclosure,
                      dict
                  ):

                      u = (
                          enclosure.get("href")
                          or enclosure.get("url")
                      )

                      if u:
                          candidatos.append(u)

              for cand in candidatos:

                  img = comprobar_imagen(
                      cand,
                      permitir_repetida=False
                  )

                  if img:
                      return img

              return ""


          def obtener_fuente_entry(
              entry,
              fuente_default
          ):

              try:
                  source = entry.get(
                      "source"
                  )

                  if isinstance(
                      source,
                      dict
                  ):

                      nombre = source.get(
                          "title"
                      )

                      if nombre:
                          return limpiar_html(
                              nombre
                          )

              except Exception:
                  pass

              return fuente_default


          def clasificar_deporte(
              titulo,
              descripcion="",
              categoria=""
          ):

              texto = normalizar(
                  f"{titulo} {descripcion} {categoria}"
              )

              resultados = []

              for deporte, palabras in PALABRAS_DEPORTIVAS.items():

                  puntuacion = 0

                  for palabra in palabras:

                      p = normalizar(
                          palabra
                      )

                      if p and p in texto:

                          if len(p) >= 8:
                              puntuacion += 3
                          else:
                              puntuacion += 1

                  if puntuacion > 0:
                      resultados.append(
                          (
                              puntuacion,
                              deporte
                          )
                      )

              if not resultados:
                  return None

              resultados.sort(
                  key=lambda x: x[0],
                  reverse=True
              )

              return resultados[0][1]


          def limpiar_titulo(titulo):

              titulo = limpiar_html(
                  titulo
              )

              titulo = re.sub(
                  r"\s+\|\s+[^|]{2,60}$",
                  "",
                  titulo
              )

              titulo = re.sub(
                  r"\s+-\s+[^-]{2,60}$",
                  "",
                  titulo
              )

              return titulo.strip()


          def construir_noticia(
              entry,
              fuente,
              categoria,
              subcategoria=None
          ):

              titulo = limpiar_titulo(
                  entry.get(
                      "title",
                      ""
                  )
              )

              url = (
                  entry.get("link")
                  or entry.get("id")
                  or ""
              )

              if (
                  not titulo
                  or not url_valida(url)
              ):
                  return None

              descripcion = limpiar_html(
                  entry.get("summary")
                  or entry.get("description")
                  or ""
              )

              if len(descripcion) > 500:
                  descripcion = (
                      descripcion[:497]
                      + "..."
                  )

              fecha = fecha_entry(
                  entry
              )

              if (
                  AHORA - fecha
                  > timedelta(
                      days=LIMITE_DIAS
                  )
              ):
                  return None

              imagen = obtener_imagen_entry(
                  entry
              )

              if not imagen:
                  imagen = obtener_imagen_pagina(
                      url
                  )

              if subcategoria:

                  categoria_final = "Deportes"
                  subcategoria_final = subcategoria

              else:

                  categoria_final = categoria
                  subcategoria_final = ""

              if categoria_final == "Deportes":

                  detectada = clasificar_deporte(
                      titulo,
                      descripcion,
                      subcategoria_final
                  )

                  if detectada:
                      subcategoria_final = detectada

              return {
                  "id": hash_noticia(
                      titulo,
                      url
                  ),
                  "titulo": titulo,
                  "descripcion": descripcion,
                  "url": url,
                  "imagen": imagen,
                  "fecha": fecha_iso(
                      fecha
                  ),
                  "fuente": fuente,
                  "categoria": categoria_final,
                  "subcategoria": subcategoria_final
              }


          def descargar_feed(url):

              try:

                  respuesta = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=20
                  )

                  if respuesta.status_code != 200:

                      print(
                          f"Feed HTTP "
                          f"{respuesta.status_code}: "
                          f"{url}"
                      )

                      return None

                  return feedparser.parse(
                      respuesta.content
                  )

              except Exception as e:

                  print(
                      f"Error descargando feed "
                      f"{url}: {e}"
                  )

                  return None


          def construir_google_news_url(busqueda):

              return (
                  "https://news.google.com/rss/search?"
                  f"q={quote_plus(busqueda)}"
                  "&hl=es-419"
                  "&gl=MX"
                  "&ceid=MX:es-419"
              )


          def cargar_json():

              if not os.path.exists(
                  ARCHIVO
              ):

                  return {
                      "actualizado": "",
                      "total": 0,
                      "imagenes": {
                          "con_imagen": 0,
                          "sin_imagen": 0,
                          "imagenes_unicas": 0
                      },
                      "noticias": []
                  }

              try:

                  with open(
                      ARCHIVO,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      datos = json.load(
                          f
                      )

                  if isinstance(
                      datos,
                      list
                  ):

                      return {
                          "actualizado": "",
                          "total": len(datos),
                          "imagenes": {},
                          "noticias": datos
                      }

                  if not isinstance(
                      datos.get(
                          "noticias"
                      ),
                      list
                  ):

                      datos["noticias"] = []

                  return datos

              except Exception as e:

                  print(
                      f"No se pudo leer "
                      f"{ARCHIVO}: {e}"
                  )

                  return {
                      "actualizado": "",
                      "total": 0,
                      "imagenes": {},
                      "noticias": []
                  }


          # ============================================================
          # CARGAR NOTICIAS EXISTENTES
          # ============================================================

          datos = cargar_json()

          noticias_existentes = datos.get(
              "noticias",
              []
          )

          mapa = {}

          # Registrar las imágenes existentes.
          # NO se vuelven a descargar las imágenes antiguas.

          for noticia in noticias_existentes:

              imagen_existente = noticia.get(
                  "imagen",
                  ""
              )

              imagen_normalizada = (
                  normalizar_imagen(
                      imagen_existente
                  )
              )

              if (
                  imagen_normalizada
                  and not es_imagen_invalid_google(
                      imagen_existente
                  )
              ):
                  IMAGENES_USADAS.add(
                      imagen_normalizada
                  )


          imagenes_revisadas = set()

          for noticia in noticias_existentes:

              titulo = noticia.get(
                  "titulo",
                  ""
              )

              url = noticia.get(
                  "url",
                  ""
              )

              if not titulo or not url:
                  continue

              noticia_id = (
                  noticia.get("id")
                  or hash_noticia(
                      titulo,
                      url
                  )
              )

              noticia["id"] = noticia_id

              img_actual = noticia.get(
                  "imagen",
                  ""
              )

              img_normalizada = (
                  normalizar_imagen(
                      img_actual
                  )
              )

              # NO volver a descargar imágenes de noticias antiguas.
              # Las imágenes existentes se conservan tal como están.

              if img_normalizada:
                  imagenes_revisadas.add(
                      img_normalizada
                  )

              mapa[noticia_id] = noticia


          # ============================================================
          # CONTADORES
          # ============================================================

          nuevas = 0
          errores = 0


          # ============================================================
          # 1. RSS GENERALES
          # ============================================================

          print("\n=== FUENTES GENERALES ===")

          for fuente, feeds in FUENTES_GENERALES.items():

              for categoria, url in feeds:

                  print(
                      f"Procesando {fuente} / "
                      f"{categoria}"
                  )

                  feed = descargar_feed(
                      url
                  )

                  if not feed:

                      errores += 1
                      continue

                  entradas = feed.entries[
                      :MAX_POR_FEED
                  ]

                  for entry in entradas:

                      noticia = construir_noticia(
                          entry,
                          fuente,
                          categoria
                      )

                      if not noticia:
                          continue

                      if noticia["id"] not in mapa:

                          mapa[
                              noticia["id"]
                          ] = noticia

                          nuevas += 1


          # ============================================================
          # 2. FUENTES DEPORTIVAS
          # ============================================================

          print(
              "\n=== FUENTES DEPORTIVAS ==="
          )

          for deporte, feeds in FUENTES_DEPORTIVAS.items():

              print(
                  f"\n--- {deporte.upper()} ---"
              )

              for fuente, referencia in feeds:

                  if fuente == "Google News":

                      url = (
                          construir_google_news_url(
                              referencia
                          )
                      )

                  else:

                      url = referencia

                  print(
                      f"Procesando {fuente}: "
                      f"{referencia}"
                  )

                  feed = descargar_feed(
                      url
                  )

                  if not feed:

                      errores += 1
                      continue

                  entradas = feed.entries[
                      :MAX_POR_FEED
                  ]

                  for entry in entradas:

                      titulo = limpiar_titulo(
                          entry.get(
                              "title",
                              ""
                          )
                      )

                      descripcion = limpiar_html(
                          entry.get(
                              "summary"
                          )
                          or
                          entry.get(
                              "description"
                          )
                          or ""
                      )

                      noticia = construir_noticia(
                          entry,
                          obtener_fuente_entry(
                              entry,
                              fuente
                          ),
                          "Deportes",
                          deporte
                      )

                      if not noticia:
                          continue

                      if fuente == "Google News":

                          detectada = (
                              clasificar_deporte(
                                  titulo,
                                  descripcion,
                                  deporte
                              )
                          )

                          if (
                              detectada
                              and detectada != deporte
                          ):
                              continue

                      if noticia["id"] not in mapa:

                          mapa[
                              noticia["id"]
                          ] = noticia

                          nuevas += 1


          # ============================================================
          # 3. GOOGLE TRENDS MÉXICO
          # ============================================================

          print(
              "\n=== GOOGLE TRENDS MÉXICO ==="
          )

          tendencias = []

          URL_TRENDS = (
              "https://trends.google.com/"
              "trending/rss?geo=MX"
          )

          feed_trends = descargar_feed(
              URL_TRENDS
          )

          if feed_trends:

              for entry in feed_trends.entries[
                  :MAX_TENDENCIAS
              ]:

                  titulo_tendencia = limpiar_html(
                      entry.get(
                          "title",
                          ""
                      )
                  )

                  if not titulo_tendencia:
                      continue

                  tendencias.append(
                      titulo_tendencia
                  )

          if not tendencias:

              print(
                  "No se pudo leer Trends RSS; "
                  "se utilizará Google News como respaldo."
              )

              tendencias_respaldo = [
                  "México últimas noticias",
                  "México hoy",
                  "fútbol México",
                  "Liga MX",
                  "NFL",
                  "NBA",
                  "MLB",
                  "tenis",
                  "boxeo",
                  "Fórmula 1",
                  "economía México",
                  "tecnología",
                  "entretenimiento México",
                  "trámites México"
              ]

              tendencias = tendencias_respaldo

          vistas = set()
          tendencias_limpias = []

          for tendencia in tendencias:

              clave = normalizar(
                  tendencia
              )

              if clave in vistas:
                  continue

              vistas.add(
                  clave
              )

              tendencias_limpias.append(
                  tendencia
              )

          print(
              f"Tendencias detectadas: "
              f"{len(tendencias_limpias)}"
          )

          for tendencia in tendencias_limpias[
              :MAX_TENDENCIAS
          ]:

              if len(
                  normalizar(
                      tendencia
                  )
              ) < 3:
                  continue

              print(
                  f"\nBuscando noticias para "
                  f"tendencia: {tendencia}"
              )

              url = construir_google_news_url(
                  f'"{tendencia}" México'
              )

              feed = descargar_feed(
                  url
              )

              if not feed:
                  continue

              for entry in feed.entries[
                  :MAX_NOTICIAS_POR_TENDENCIA
              ]:

                  titulo = limpiar_titulo(
                      entry.get(
                          "title",
                          ""
                      )
                  )

                  descripcion = limpiar_html(
                      entry.get(
                          "summary"
                      )
                      or
                      entry.get(
                          "description"
                      )
                      or ""
                  )

                  texto = normalizar(
                      titulo
                      + " "
                      + descripcion
                  )

                  palabras_tendencia = [
                      p
                      for p in normalizar(
                          tendencia
                      ).split()
                      if len(p) >= 4
                  ]

                  coincidencias = sum(
                      1
                      for palabra in palabras_tendencia
                      if palabra in texto
                  )

                  if (
                      palabras_tendencia
                      and coincidencias == 0
                  ):
                      continue

                  deporte = clasificar_deporte(
                      titulo,
                      descripcion
                  )

                  if deporte:

                      categoria = "Deportes"
                      subcategoria = deporte

                  else:

                      if any(
                          palabra in texto
                          for palabra in [
                              "economía",
                              "economia",
                              "peso",
                              "dólar",
                              "dolar",
                              "inflación",
                              "inflacion",
                              "banco",
                              "empleo",
                              "dinero"
                          ]
                      ):

                          categoria = "Dinero"

                      elif any(
                          palabra in texto
                          for palabra in [
                              "iphone",
                              "android",
                              "google",
                              "apple",
                              "tecnología",
                              "tecnologia",
                              "inteligencia artificial",
                              "ia ",
                              "software"
                          ]
                      ):

                          categoria = "Tecnologia"

                      elif any(
                          palabra in texto
                          for palabra in [
                              "famoso",
                              "famosa",
                              "actor",
                              "actriz",
                              "cantante",
                              "serie",
                              "película",
                              "pelicula",
                              "televisión",
                              "television",
                              "música",
                              "musica"
                          ]
                      ):

                          categoria = "Tendencias"

                      elif any(
                          palabra in texto
                          for palabra in [
                              "gobierno",
                              "presidente",
                              "diputado",
                              "senador",
                              "ley",
                              "política",
                              "politica",
                              "elección",
                              "eleccion"
                          ]
                      ):

                          categoria = "Politica"

                      else:

                          categoria = "Noticias"

                      subcategoria = ""

                  noticia = construir_noticia(
                      entry,
                      obtener_fuente_entry(
                          entry,
                          "Google News"
                      ),
                      categoria,
                      subcategoria
                      if categoria == "Deportes"
                      else None
                  )

                  if not noticia:
                      continue

                  if noticia["id"] not in mapa:

                      mapa[
                          noticia["id"]
                      ] = noticia

                      nuevas += 1


          # ============================================================
          # 4. DEDUPLICACIÓN AVANZADA
          # ============================================================

          print(
              "\n=== DEDUPLICACIÓN ==="
          )

          noticias = list(
              mapa.values()
          )

          noticias.sort(
              key=lambda n: n.get(
                  "fecha",
                  ""
              ),
              reverse=True
          )

          resultado = []

          urls_vistas = set()
          titulos_vistos = set()
          claves_titulo = set()

          for noticia in noticias:

              url = noticia.get(
                  "url",
                  ""
              )

              titulo = noticia.get(
                  "titulo",
                  ""
              )

              if not url or not titulo:
                  continue

              url_normalizada = (
                  url.split("#")[0]
                  .rstrip("/")
                  .lower()
              )

              titulo_normalizado = normalizar(
                  titulo
              )

              palabras = [
                  p
                  for p in titulo_normalizado.split()
                  if len(p) >= 4
              ]

              clave_titulo = " ".join(
                  sorted(
                      set(palabras)
                  )
              )

              if url_normalizada in urls_vistas:
                  continue

              if titulo_normalizado in titulos_vistos:
                  continue

              if clave_titulo in claves_titulo:
                  continue

              urls_vistas.add(
                  url_normalizada
              )

              titulos_vistos.add(
                  titulo_normalizado
              )

              claves_titulo.add(
                  clave_titulo
              )

              resultado.append(
                  noticia
              )


          # ============================================================
          # 5. LIMITAR CONTENIDO
          # ============================================================

          print(
              "\n=== LIMITANDO CONTENIDO ==="
          )

          grupos = {}

          for noticia in resultado:

              if (
                  noticia.get(
                      "categoria"
                  )
                  == "Deportes"
              ):

                  grupo = (
                      "Deportes:"
                      + noticia.get(
                          "subcategoria",
                          "otros"
                      )
                  )

              else:

                  grupo = noticia.get(
                      "categoria",
                      "Noticias"
                  )

              grupos.setdefault(
                  grupo,
                  []
              )

              if (
                  len(
                      grupos[grupo]
                  )
                  < MAX_POR_GRUPO
              ):

                  grupos[grupo].append(
                      noticia
                  )


          resultado_final = []

          for grupo, lista in grupos.items():

              resultado_final.extend(
                  lista
              )


          resultado_final.sort(
              key=lambda n: n.get(
                  "fecha",
                  ""
              ),
              reverse=True
          )

          resultado_final = (
              resultado_final[
                  :MAX_TOTAL
              ]
          )


          # ============================================================
          # 6. ESTADÍSTICAS
          # ============================================================

          con_imagen = sum(
              1
              for n in resultado_final
              if n.get("imagen")
          )

          sin_imagen = (
              len(resultado_final)
              - con_imagen
          )

          imagenes_unicas = len(
              set(
                  normalizar_imagen(
                      n.get(
                          "imagen"
                      )
                  )
                  for n in resultado_final
                  if n.get("imagen")
              )
          )

          actualizado = datetime.now(
              timezone.utc
          ).isoformat()


          salida = {
              "actualizado": actualizado,
              "total": len(
                  resultado_final
              ),
              "imagenes": {
                  "con_imagen": con_imagen,
                  "sin_imagen": sin_imagen,
                  "imagenes_unicas": imagenes_unicas
              },
              "noticias": resultado_final
          }


          # ============================================================
          # 7. GUARDAR
          # ============================================================

          with open(
              ARCHIVO,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  salida,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "\n==================================="
          )

          print(
              "ACTUALIZACIÓN TERMINADA"
          )

          print(
              "==================================="
          )

          print(
              f"Noticias nuevas: {nuevas}"
          )

          print(
              f"Noticias finales: "
              f"{len(resultado_final)}"
          )

          print(
              f"Con imagen: {con_imagen}"
          )

          print(
              f"Sin imagen: {sin_imagen}"
          )

          print(
              f"Imágenes únicas: "
              f"{imagenes_unicas}"
          )

          print(
              f"Errores de feeds: {errores}"
          )

          print(
              f"Actualizado: {actualizado}"
          )

          print(
              "==================================="
          )
          PY

          python actualizar.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Reconstruir noticias.json con imagenes reales"
            git push
          fi
