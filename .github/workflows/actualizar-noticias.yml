name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Crear noticias.json desde múltiples RSS
        run: |
          python - <<'PY'

          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          import html
          import unicodedata

          from datetime import datetime, timezone
          from urllib.parse import urljoin, urlparse


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          MAX_NOTICIAS = 150

          FUENTES_RSS = [
              {
                  "url": "https://expansion.mx/rss",
                  "categoria": "general"
              },
              {
                  "url": "https://expansion.mx/rss/internacional",
                  "categoria": "mundo"
              },
              {
                  "url": "https://expansion.mx/rss/economia",
                  "categoria": "dinero"
              },
              {
                  "url": "https://expansion.mx/rss/tecnologia",
                  "categoria": "tecnologia"
              },
              {
                  "url": "https://expansion.mx/rss/tendencias",
                  "categoria": "tendencias"
              },
              {
                  "url": "https://expansion.mx/rss/empresas",
                  "categoria": "dinero"
              },
              {
                  "url": "https://expansion.mx/rss/politica",
                  "categoria": "politica"
              }
          ]


          # ============================================================
          # DESCARGAR RSS
          # ============================================================

          def descargar_rss(url):

              print("")
              print("======================================")
              print("Descargando RSS:")
              print(url)
              print("======================================")

              try:

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0 (compatible; TendenciasMX/1.0)"
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      return response.read()

              except Exception as error:

                  print("ERROR RSS:", url, error)

                  return None


          # ============================================================
          # LIMPIAR HTML
          # ============================================================

          def limpiar_html(texto):

              if not texto:
                  return ""

              texto = html.unescape(texto)

              texto = re.sub(
                  r"<script[^>]*>.*?</script>",
                  "",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<style[^>]*>.*?</style>",
                  "",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<[^>]+>",
                  "",
                  texto
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ============================================================
          # OBTENER TAG
          # ============================================================

          def obtener_tag(item, nombre):

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  if tag.lower() == nombre.lower():

                      if elemento.text:
                          return elemento.text.strip()

              return ""


          # ============================================================
          # OBTENER IMAGEN
          # ============================================================

          def obtener_imagen(item, rss_url):

              # Primero buscamos elementos multimedia.

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  tag = tag.lower()

                  if tag in [
                      "content",
                      "thumbnail",
                      "enclosure",
                      "image",
                      "media"
                  ]:

                      for atributo in [
                          "url",
                          "href",
                          "src"
                      ]:

                          url = elemento.attrib.get(
                              atributo,
                              ""
                          ).strip()

                          if url:

                              if url.startswith("//"):
                                  url = "https:" + url

                              return urljoin(
                                  rss_url,
                                  url
                              )

              # Después buscamos imágenes dentro de description.

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  tag = tag.lower()

                  if tag in [
                      "description",
                      "encoded",
                      "content"
                  ]:

                      contenido = elemento.text or ""

                      resultado = re.search(
                          r'<img[^>]+src=["\']([^"\']+)["\']',
                          contenido,
                          re.I
                      )

                      if resultado:

                          url = html.unescape(
                              resultado.group(1)
                          ).strip()

                          if url.startswith("//"):
                              url = "https:" + url

                          return urljoin(
                              rss_url,
                              url
                          )

                      resultado = re.search(
                          r'<img[^>]+data-src=["\']([^"\']+)["\']',
                          contenido,
                          re.I
                      )

                      if resultado:

                          url = html.unescape(
                              resultado.group(1)
                          ).strip()

                          if url.startswith("//"):
                              url = "https:" + url

                          return urljoin(
                              rss_url,
                              url
                          )

              return ""


          # ============================================================
          # NORMALIZAR TEXTO
          # ============================================================

          def normalizar(texto):

              texto = str(
                  texto or ""
              ).lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(
                  caracter
                  for caracter in texto
                  if unicodedata.category(caracter) != "Mn"
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ============================================================
          # COMPROBAR PALABRAS
          # ============================================================

          def contiene_alguno(texto, lista):

              return any(
                  termino in texto
                  for termino in lista
              )


          # ============================================================
          # SECCIÓN REAL DEL ENLACE
          #
          # ESTA FUNCIÓN TIENE PRIORIDAD SOBRE LAS PALABRAS.
          # ============================================================

          def obtener_seccion_url(enlace):

              try:

                  ruta = urlparse(
                      enlace
                  ).path.lower()

                  ruta = normalizar(
                      ruta
                  )

                  # ----------------------------------------
                  # DEPORTES
                  # ----------------------------------------

                  if any(
                      parte in ruta
                      for parte in [
                          "/deportes/",
                          "/deporte/",
                          "/futbol/",
                          "/futbol-mexicano/",
                          "/liga-mx/",
                          "/nfl/",
                          "/boxeo/",
                          "/tenis/",
                          "/formula-1/",
                          "/automovilismo/",
                          "/basquetbol/",
                          "/beisbol/",
                          "/nba/",
                          "/mlb/"
                      ]
                  ):
                      return "deportes"

                  # ----------------------------------------
                  # DINERO
                  # ----------------------------------------

                  if any(
                      parte in ruta
                      for parte in [
                          "/economia/",
                          "/economia",
                          "/empresas/",
                          "/empresas",
                          "/finanzas/",
                          "/finanzas/",
                          "/mercados/",
                          "/dinero/"
                      ]
                  ):
                      return "dinero"

                  # ----------------------------------------
                  # TECNOLOGÍA
                  # ----------------------------------------

                  if any(
                      parte in ruta
                      for parte in [
                          "/tecnologia/",
                          "/tecnologia",
                          "/tech/",
                          "/innovacion/",
                          "/ciencia/"
                      ]
                  ):
                      return "tecnologia"

                  # ----------------------------------------
                  # POLÍTICA
                  # ----------------------------------------

                  if any(
                      parte in ruta
                      for parte in [
                          "/politica/",
                          "/politica",
                          "/politics/"
                      ]
                  ):
                      return "politica"

                  # ----------------------------------------
                  # MUNDO
                  # ----------------------------------------

                  if any(
                      parte in ruta
                      for parte in [
                          "/internacional/",
                          "/internacional",
                          "/mundo/",
                          "/mundo"
                      ]
                  ):
                      return "mundo"

                  # ----------------------------------------
                  # ENTRETENIMIENTO
                  # ----------------------------------------

                  if any(
                      parte in ruta
                      for parte in [
                          "/entretenimiento/",
                          "/entretenimiento",
                          "/espectaculos/",
                          "/cine/",
                          "/musica/"
                      ]
                  ):
                      return "entretenimiento"

                  # ----------------------------------------
                  # TENDENCIAS
                  # ----------------------------------------

                  if any(
                      parte in ruta
                      for parte in [
                          "/tendencias/",
                          "/tendencias"
                      ]
                  ):
                      return "tendencias"

              except Exception:
                  pass

              return ""


          # ============================================================
          # PALABRAS FUERTES DE DEPORTES
          # ============================================================

          FUTBOL_FUERTE = [
              "liga mx",
              "liga bbva mx",
              "liga mexicana",
              "club america",
              "america vs",
              "america enfrenta",
