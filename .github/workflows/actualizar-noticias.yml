          # ============================================================
          # DESCARGAR RSS
          # ============================================================

          def descargar_rss(url):

              print("")
              print("======================================")
              print("Descargando RSS:")
              print(url)
              print("======================================")

              try:

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0 (compatible; TendenciasMX/2.0)"
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      return response.read()

              except Exception as error:

                  print("ERROR RSS:", url, error)
                  return None


          # ============================================================
          # LIMPIAR HTML
          # ============================================================

          def limpiar_html(texto):

              if not texto:
                  return ""

              texto = html.unescape(str(texto))

              texto = re.sub(
                  r"<script[^>]*>.*?</script>",
                  "",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<style[^>]*>.*?</style>",
                  "",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<[^>]+>",
                  " ",
                  texto
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ============================================================
          # OBTENER TAG XML
          # ============================================================

          def obtener_tag(item, nombre):

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  if tag.lower() == nombre.lower():

                      if elemento.text:
                          return elemento.text.strip()

              return ""


          # ============================================================
          # OBTENER IMAGEN
          # ============================================================

          def obtener_imagen(item, rss_url):

              # --------------------------------------------------------
              # 1. Atributos directos
              # --------------------------------------------------------

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  tag = tag.lower()

                  if tag in [
                      "content",
                      "thumbnail",
                      "enclosure",
                      "image",
                      "media"
                  ]:

                      for atributo in [
                          "url",
                          "href",
                          "src"
                      ]:

                          url = elemento.attrib.get(
                              atributo,
                              ""
                          ).strip()

                          if url:

                              if url.startswith("//"):
                                  url = "https:" + url

                              return urljoin(
                                  rss_url,
                                  url
                              )


              # --------------------------------------------------------
              # 2. Imágenes dentro del contenido
              # --------------------------------------------------------

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  tag = tag.lower()

                  if tag in [
                      "description",
                      "encoded",
                      "content"
                  ]:

                      contenido = elemento.text or ""

                      patrones = [
                          r'<img[^>]+src=["\']([^"\']+)["\']',
                          r'<img[^>]+data-src=["\']([^"\']+)["\']',
                          r'<img[^>]+data-original=["\']([^"\']+)["\']'
                      ]

                      for patron in patrones:

                          resultado = re.search(
                              patron,
                              contenido,
                              re.I
                          )

                          if resultado:

                              url = html.unescape(
                                  resultado.group(1)
                              ).strip()

                              if url.startswith("//"):
                                  url = "https:" + url

                              return urljoin(
                                  rss_url,
                                  url
                              )

              return ""


          # ============================================================
          # NORMALIZAR TEXTO
          # ============================================================

          def normalizar(texto):

              texto = str(texto or "").lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(
                  caracter
                  for caracter in texto
                  if unicodedata.category(caracter) != "Mn"
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ============================================================
          # COMPROBAR PALABRAS
          # ============================================================

          def contiene(texto, termino):

              return termino in texto


          def contiene_alguno(texto, lista):

              return any(
                  termino in texto
                  for termino in lista
              )


          # ============================================================
