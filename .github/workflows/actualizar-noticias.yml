name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 python-dateutil

      - name: Crear actualizador
        run: |

          cat > actualizar_noticias.py <<'PY'

          import json
          import re
          import hashlib
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urlparse, parse_qs, unquote, urljoin

          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from dateutil import parser as dateparser


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          MAX_NOTICIAS = 5000
          MAX_POR_FUENTE = 1000
          MAX_IMAGENES = 3000
          TIMEOUT = 20

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept-Language": "es-MX,es;q=0.9,en;q=0.8",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
          }


          # ============================================================
          # FUENTES GENERALES DE EXPANSIÓN
          # ============================================================

          FUENTES = [

              (
                  "Expansión - Portada",
                  "https://expansion.mx/rss",
                  "Noticias"
              ),

              (
                  "Expansión - Mundo",
                  "https://expansion.mx/rss/internacional",
                  "Mundo"
              ),

              (
                  "Expansión - Economía",
                  "https://expansion.mx/rss/economia",
                  "Dinero"
              ),

              (
                  "Expansión - Tecnología",
                  "https://expansion.mx/rss/tecnologia",
                  "Tecnología"
              ),

              (
                  "Expansión - Tendencias",
                  "https://expansion.mx/rss/tendencias",
                  "Tendencias"
              ),

              (
                  "Expansión - Empresas",
                  "https://expansion.mx/rss/empresas",
                  "Dinero"
              ),

              (
                  "Expansión - Política",
                  "https://expansion.mx/rss/politica",
                  "Política"
              )
          ]


          # ============================================================
          # DEPORTES
          #
          # Se usan búsquedas separadas para conseguir más variedad.
          # Google News solo se usa como descubridor.
          # La URL final se convierte a la URL ORIGINAL.
          # ============================================================

          DEPORTES = [

              (
                  "Fútbol",
                  'site:lifeandstyle.expansion.mx/deportes futbol'
              ),

              (
                  "Liga MX",
                  'site:lifeandstyle.expansion.mx/deportes "Liga MX"'
              ),

              (
                  "NFL",
                  'site:lifeandstyle.expansion.mx/deportes NFL'
              ),

              (
                  "NBA",
                  'site:lifeandstyle.expansion.mx/deportes NBA'
              ),

              (
                  "Básquetbol",
                  'site:lifeandstyle.expansion.mx/deportes basquetbol OR básquetbol'
              ),

              (
                  "Béisbol",
                  'site:lifeandstyle.expansion.mx/deportes beisbol OR béisbol MLB'
              ),

              (
                  "Tenis",
                  'site:lifeandstyle.expansion.mx/deportes tenis'
              ),

              (
                  "Boxeo",
                  'site:lifeandstyle.expansion.mx/deportes boxeo'
              ),

              (
                  "Fórmula 1",
                  'site:lifeandstyle.expansion.mx/deportes "Formula 1" OR "Fórmula 1"'
              ),

              (
                  "Motor",
                  'site:lifeandstyle.expansion.mx/deportes automovilismo OR MotoGP'
              )
          ]


          # ============================================================
          # ENTRETENIMIENTO
          # ============================================================

          ENTRETENIMIENTO = [

              (
                  "Entretenimiento",
                  'site:lifeandstyle.expansion.mx entretenimiento'
              ),

              (
                  "Cine",
                  'site:lifeandstyle.expansion.mx cine'
              ),

              (
                  "Series",
                  'site:lifeandstyle.expansion.mx series Netflix'
              ),

              (
                  "Música",
                  'site:lifeandstyle.expansion.mx musica'
              )
          ]


          # ============================================================
          # SESIÓN HTTP
          # ============================================================

          session = requests.Session()
          session.headers.update(HEADERS)


          # ============================================================
          # LIMPIAR TEXTO
          # ============================================================

          def limpiar_html(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              for tag in soup.find_all(
                  ["script", "style"]
              ):
                  tag.decompose()

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              return re.sub(
                  r"\s+",
                  " ",
                  texto
              ).strip()


          # ============================================================
          # URL ORIGINAL
          # ============================================================

          def obtener_url_original(url):

              if not url:
                  return ""

              url = str(url).strip()

              if "news.google.com" not in url:
                  return url

              try:

                  parsed = urlparse(url)

                  qs = parse_qs(
                      parsed.query
                  )

                  for clave in [
                      "url",
                      "u",
                      "q"
                  ]:

                      if clave in qs:

                          for valor in qs[clave]:

                              valor = unquote(
                                  valor
                              )

                              if valor.startswith(
                                  "http"
                              ):

                                  return valor

                  # Intentar encontrar URL
                  # dentro del enlace de Google.

                  encontrado = re.search(
                      r"https?://[^&]+",
                      url
                  )

                  if encontrado:

                      posible = unquote(
                          encontrado.group(0)
                      )

                      if posible.startswith(
                          "http"
                      ):
                          return posible

              except Exception:
                  pass

              return url


          # ============================================================
          # NORMALIZAR URL
          # ============================================================

          def normalizar_url(url):

              if not url:
                  return ""

              url = obtener_url_original(
                  url
              )

              try:

                  p = urlparse(url)

                  return (
                      p.scheme.lower()
                      + "://"
                      + p.netloc.lower()
                      + p.path.rstrip("/")
                  )

              except Exception:

                  return url.lower().strip()


          # ============================================================
          # IMAGEN DEL RSS
          # ============================================================

          def imagen_desde_feed(entry):

              candidatos = []

              for clave in [
                  "media_content",
                  "media_thumbnail",
                  "enclosures"
              ]:

                  datos = entry.get(
                      clave,
                      []
                  )

                  if isinstance(
                      datos,
                      dict
                  ):
                      datos = [datos]

                  if not isinstance(
                      datos,
                      list
                  ):
                      continue

                  for item in datos:

                      if not isinstance(
                          item,
                          dict
                      ):
                          continue

                      for campo in [
                          "url",
                          "href"
                      ]:

                          valor = item.get(
                              campo
                          )

                          if valor:
                              candidatos.append(
                                  valor
                              )

              html = (
                  entry.get("summary")
                  or
                  entry.get("description")
                  or
                  ""
              )

              soup = BeautifulSoup(
                  str(html),
                  "html.parser"
              )

              for img in soup.find_all(
                  "img"
              ):

                  for campo in [
                      "src",
                      "data-src",
                      "data-original",
                      "data-lazy-src"
                  ]:

                      valor = img.get(
                          campo
                      )

                      if valor:
                          candidatos.append(
                              valor
                          )

              for imagen in candidatos:

                  imagen = str(
                      imagen
                  ).strip()

                  if validar_imagen(
                      imagen
                  ):
                      return imagen

              return ""


          # ============================================================
          # VALIDAR IMAGEN
          # ============================================================

          def validar_imagen(url):

              if not url:
                  return False

              url = str(
                  url
              ).strip()

              if not url.startswith(
                  (
                      "http://",
                      "https://"
                  )
              ):
                  return False

              texto = url.lower()

              prohibidas = [
                  "favicon",
                  "logo",
                  "avatar",
                  "sprite",
                  "tracking",
                  "pixel",
                  "analytics",
                  "advert",
                  "icon"
              ]

              if any(
                  palabra in texto
                  for palabra in prohibidas
              ):
                  return False

              return True


          # ============================================================
          # CONVERTIR IMAGEN RELATIVA EN ABSOLUTA
          # ============================================================

          def imagen_absoluta(
              imagen,
              pagina
          ):

              if not imagen:
                  return ""

              imagen = str(
                  imagen
              ).strip()

              return urljoin(
                  pagina,
                  imagen
              )


          # ============================================================
          # IMAGEN REAL DEL ARTÍCULO
          # ============================================================

          def obtener_imagen_real(
              url
          ):

              if not url:
                  return ""

              try:

                  respuesta = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  if respuesta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      respuesta.text,
                      "html.parser"
                  )

                  pagina = respuesta.url


                  # ----------------------------------------------------
                  # OG IMAGE
                  # ----------------------------------------------------

                  for attrs in [

                      {
                          "property":
                          "og:image"
                      },

                      {
                          "property":
                          "og:image:url"
                      },

                      {
                          "name":
                          "twitter:image"
                      },

                      {
                          "name":
                          "twitter:image:src"
                      }

                  ]:

                      meta = soup.find(
                          "meta",
                          attrs=attrs
                      )

                      if not meta:
                          continue

                      imagen = meta.get(
                          "content"
                      )

                      imagen = imagen_absoluta(
                          imagen,
                          pagina
                      )

                      if validar_imagen(
                          imagen
                      ):
                          return imagen


                  # ----------------------------------------------------
                  # JSON-LD
                  # ----------------------------------------------------

                  scripts = soup.find_all(
                      "script",
                      type="application/ld+json"
                  )

                  for script in scripts:

                      try:

                          texto = (
                              script.string
                              or
                              script.get_text()
                          )

                          datos = json.loads(
                              texto
                          )

                      except Exception:

                          continue


                      objetos = []

                      if isinstance(
                          datos,
                          dict
                      ):

                          objetos.append(
                              datos
                          )

                      elif isinstance(
                          datos,
                          list
                      ):

                          objetos.extend(
                              datos
                          )


                      for obj in objetos:

                          if not isinstance(
                              obj,
                              dict
                          ):
                              continue

                          imagen = obj.get(
                              "image"
                          )

                          if isinstance(
                              imagen,
                              str
                          ):

                              imagen = imagen_absoluta(
                                  imagen,
                                  pagina
                              )

                              if validar_imagen(
                                  imagen
                              ):
                                  return imagen

                          elif isinstance(
                              imagen,
                              list
                          ):

                              for item in imagen:

                                  if isinstance(
                                      item,
                                      str
                                  ):

                                      item = imagen_absoluta(
                                          item,
                                          pagina
                                      )

                                      if validar_imagen(
                                          item
                                      ):
                                          return item

                                  elif isinstance(
                                      item,
                                      dict
                                  ):

                                      item = item.get(
                                          "url"
                                      )

                                      item = imagen_absoluta(
                                          item,
                                          pagina
                                      )

                                      if validar_imagen(
                                          item
                                      ):
                                          return item


                  # ----------------------------------------------------
                  # IMAGEN DE ARTICLE / MAIN
                  # ----------------------------------------------------

                  selectores = [

                      "article img",

                      "main img",

                      "[itemprop='image']",

                      ".article img",

                      ".article-content img",

                      ".content img"

                  ]

                  candidatos = []

                  for selector in selectores:

                      for img in soup.select(
                          selector
                      ):

                          src = (

                              img.get("src")
                              or
                              img.get("data-src")
                              or
                              img.get("data-original")
                              or
                              img.get("data-lazy-src")
                          )

                          if not src:
                              continue

                          src = imagen_absoluta(
                              src,
                              pagina
                          )

                          if not validar_imagen(
                              src
                          ):
                              continue

                          candidatos.append(
                              src
                          )


                  # Preferir imágenes
                  # que parezcan grandes.

                  for imagen in candidatos:

                      return imagen


                  return ""

              except Exception as error:

                  print(
                      "Error obteniendo imagen:",
                      error
                  )

                  return ""


          # ============================================================
          # FECHA
          # ============================================================

          def obtener_fecha(entry):

              for campo in [
                  "published",
                  "updated",
                  "created"
              ]:

                  valor = entry.get(
                      campo
                  )

                  if not valor:
                      continue

                  try:

                      fecha = dateparser.parse(
                          valor
                      )

                      if fecha.tzinfo is None:

                          fecha = fecha.replace(
                              tzinfo=timezone.utc
                          )

                      return fecha.isoformat()

                  except Exception:
                      pass

              return datetime.now(
                  timezone.utc
              ).isoformat()


          # ============================================================
          # LEER RSS
          # ============================================================

          def leer_fuente(
              nombre,
              url,
              categoria
          ):

              resultado = []

              print(
                  "RSS:",
                  nombre
              )

              try:

                  feed = feedparser.parse(
                      url
                  )

                  for entry in feed.entries:

                      titulo = limpiar_html(
                          entry.get(
                              "title",
                              ""
                          )
                      )

                      link = obtener_url_original(
                          entry.get(
                              "link",
                              ""
                          )
                      )

                      if not titulo or not link:
                          continue

                      descripcion = limpiar_html(
                          entry.get(
                              "summary",
                              ""
                          )
                          or
                          entry.get(
                              "description",
                              ""
                          )
                      )

                      imagen = imagen_desde_feed(
                          entry
                      )

                      resultado.append({

                          "titulo":
                              titulo,

                          "descripcion":
                              descripcion[:700],

                          "url":
                              link,

                          "imagen":
                              imagen,

                          "categoria":
                              categoria,

                          "subcategoria":
                              "",

                          "fuente":
                              nombre,

                          "fecha":
                              obtener_fecha(
                                  entry
                              )

                      })

              except Exception as error:

                  print(
                      "ERROR RSS:",
                      error
                  )

              return resultado[
                  :MAX_POR_FUENTE
              ]


          # ============================================================
          # RSS DE GOOGLE NEWS PARA DESCUBRIR ARTÍCULOS DE EXPANSIÓN
          # ============================================================

          def google_rss(
              consulta
          ):

              from urllib.parse import quote_plus

              url = (
                  "https://news.google.com/rss/search?"
                  "q="
                  + quote_plus(
                      consulta
                  )
                  + "&hl=es-419"
                  "&gl=MX"
                  "&ceid=MX:es-419"
              )

              return url


          # ============================================================
          # LEER DEPORTES
          # ============================================================

          def leer_deporte(
              subcategoria,
              consulta
          ):

              resultado = []

              url = google_rss(
                  consulta
              )

              print(
                  "DEPORTE:",
                  subcategoria
              )

              try:

                  feed = feedparser.parse(
                      url
                  )

                  for entry in feed.entries:

                      titulo = limpiar_html(
                          entry.get(
                              "title",
                              ""
                          )
                      )

                      link = obtener_url_original(
                          entry.get(
                              "link",
                              ""
                          )
                      )

                      if not titulo or not link:
                          continue


                      # ------------------------------------------------
                      # SOLO ARTÍCULOS DE EXPANSIÓN
                      # ------------------------------------------------

                      dominio = (
                          urlparse(
                              link
                          ).netloc.lower()
                      )

                      if (
                          "expansion.mx"
                          not in dominio
                      ):
                          continue


                      if (
                          "lifeandstyle.expansion.mx"
                          not in dominio
                      ):
                          continue


                      # Debe pertenecer
                      # al área de deportes.

                      ruta = (
                          urlparse(
                              link
                          ).path.lower()
                      )

                      if "/deportes" not in ruta:
                          continue


                      descripcion = limpiar_html(
                          entry.get(
                              "summary",
                              ""
                          )
                          or
                          entry.get(
                              "description",
                              ""
                          )
                      )


                      texto = (
                          titulo
                          + " "
                          + descripcion
                      ).lower()


                      # ------------------------------------------------
                      # FILTRO POR CATEGORÍA
                      # ------------------------------------------------

                      palabras = {

                          "Fútbol": [
                              "fútbol",
                              "futbol",
                              "soccer",
                              "champions",
                              "premier league",
                              "la liga"
                          ],

                          "Liga MX": [
                              "liga mx",
                              "américa",
                              "chivas",
                              "cruz azul",
                              "pumas",
                              "tigres",
                              "rayados",
                              "toluca",
                              "atlas",
                              "pachuca"
                          ],

                          "NFL": [
                              "nfl",
                              "super bowl",
                              "quarterback",
                              "touchdown",
                              "49ers",
                              "chiefs",
                              "cowboys",
                              "bills"
                          ],

                          "NBA": [
                              "nba",
                              "lakers",
                              "celtics",
                              "warriors",
                              "knicks",
                              "lebron",
                              "curry",
                              "wembanyama"
                          ],

                          "Básquetbol": [
                              "basquetbol",
                              "básquetbol",
                              "basketball",
                              "nba"
                          ],

                          "Béisbol": [
                              "beisbol",
                              "béisbol",
                              "mlb",
                              "yankees",
                              "dodgers",
                              "ohtani",
                              "jonrón",
                              "jonron"
                          ],

                          "Tenis": [
                              "tenis",
                              "alcaraz",
                              "sinner",
                              "djokovic",
                              "wimbledon",
                              "roland garros",
                              "us open",
                              "atp",
                              "wta"
                          ],

                          "Boxeo": [
                              "boxeo",
                              "boxeador",
                              "canelo",
                              "pitbull",
                              "knockout",
                              "ko"
                          ],

                          "Fórmula 1": [
                              "fórmula 1",
                              "formula 1",
                              "f1",
                              "gran premio",
                              "verstappen",
                              "leclerc",
                              "hamilton",
                              "alonso",
                              "checo pérez",
                              "checo perez"
                          ],

                          "Motor": [
                              "automovilismo",
                              "motogp",
                              "moto gp",
                              "nascar",
                              "rally"
                          ]

                      }


                      permitidas = palabras.get(
                          subcategoria,
                          []
                      )


                      if permitidas:

                          if not any(
                              palabra in texto
                              for palabra in permitidas
                          ):
                              continue


                      imagen = imagen_desde_feed(
                          entry
                      )


                      resultado.append({

                          "titulo":
                              titulo,

                          "descripcion":
                              descripcion[:700],

                          "url":
                              link,

                          "imagen":
                              imagen,

                          "categoria":
                              "Deportes",

                          "subcategoria":
                              subcategoria,

                          "fuente":
                              "Expansión - Deportes",

                          "fecha":
                              obtener_fecha(
                                  entry
                              )

                      })


              except Exception as error:

                  print(
                      "ERROR DEPORTE:",
                      error
                  )

              return resultado


          # ============================================================
          # LEER ENTRETENIMIENTO
          # ============================================================

          def leer_entretenimiento(
              subcategoria,
              consulta
          ):

              resultado = []

              try:

                  feed = feedparser.parse(
                      google_rss(
                          consulta
                      )
                  )

                  for entry in feed.entries:

                      titulo = limpiar_html(
                          entry.get(
                              "title",
                              ""
                          )
                      )

                      link = obtener_url_original(
                          entry.get(
                              "link",
                              ""
                          )
                      )

                      if not titulo or not link:
                          continue

                      dominio = (
                          urlparse(
                              link
                          ).netloc.lower()
                      )

                      if (
                          "lifeandstyle.expansion.mx"
                          not in dominio
                      ):
                          continue

                      descripcion = limpiar_html(
                          entry.get(
                              "summary",
                              ""
                          )
                          or
                          entry.get(
                              "description",
                              ""
                          )
                      )

                      imagen = imagen_desde_feed(
                          entry
                      )

                      resultado.append({

                          "titulo":
                              titulo,

                          "descripcion":
                              descripcion[:700],

                          "url":
                              link,

                          "imagen":
                              imagen,

                          "categoria":
                              "Entretenimiento",

                          "subcategoria":
                              subcategoria,

                          "fuente":
                              "Expansión - Life & Style",

                          "fecha":
                              obtener_fecha(
                                  entry
                              )

                      })

              except Exception as error:

                  print(
                      "ERROR ENTRETENIMIENTO:",
                      error
                  )

              return resultado


          # ============================================================
          # DESCARGAR NOTICIAS
          # ============================================================

          noticias = []


          # Generales

          for nombre, url, categoria in FUENTES:

              noticias.extend(
                  leer_fuente(
                      nombre,
                      url,
                      categoria
                  )
              )


          # Deportes

          for subcategoria, consulta in DEPORTES:

              noticias.extend(
                  leer_deporte(
                      subcategoria,
                      consulta
                  )
              )


          # Entretenimiento

          for subcategoria, consulta in ENTRETENIMIENTO:

              noticias.extend(
                  leer_entretenimiento(
                      subcategoria,
                      consulta
                  )
              )


          print(
              "Noticias descargadas:",
              len(noticias)
          )


          # ============================================================
          # DEDUPLICAR POR URL
          # ============================================================

          vistas = set()

          unicas = []


          for noticia in noticias:

              url = noticia.get(
                  "url",
                  ""
              )

              clave = normalizar_url(
                  url
              )

              if not clave:
                  continue

              if clave in vistas:
                  continue

              vistas.add(
                  clave
              )

              noticia["url"] = url.strip()

              unicas.append(
                  noticia
              )


          noticias = unicas


          # ============================================================
          # DEDUPLICAR POR TÍTULO
          # ============================================================

          vistos_titulos = set()

          unicas = []


          for noticia in noticias:

              titulo = re.sub(
                  r"\s+",
                  " ",
                  noticia.get(
                      "titulo",
                      ""
                  ).lower().strip()
              )

              if not titulo:
                  continue

              if titulo in vistos_titulos:
                  continue

              vistos_titulos.add(
                  titulo
              )

              unicas.append(
                  noticia
              )


          noticias = unicas


          # ============================================================
          # BUSCAR IMÁGENES REALES
          # ============================================================

          pendientes = [

              n

              for n in noticias

              if not n.get(
                  "imagen"
              )
          ]


          pendientes = pendientes[
              :MAX_IMAGENES
          ]


          print(
              "Artículos sin imagen:",
              len(pendientes)
          )


          def procesar_imagen(
              noticia
          ):

              return (
                  noticia["url"],
                  obtener_imagen_real(
                      noticia["url"]
                  )
              )


          with ThreadPoolExecutor(
              max_workers=12
          ) as executor:

              tareas = [

                  executor.submit(
                      procesar_imagen,
                      noticia
                  )

                  for noticia in pendientes
              ]


              for futuro in as_completed(
                  tareas
              ):

                  try:

                      url, imagen = (
                          futuro.result()
                      )

                      if not imagen:
                          continue

                      for noticia in noticias:

                          if (
                              normalizar_url(
                                  noticia["url"]
                              )
                              ==
                              normalizar_url(
                                  url
                              )
                          ):

                              noticia[
                                  "imagen"
                              ] = imagen

                              break

                  except Exception:
                      pass


          # ============================================================
          # IMPORTANTE:
          #
          # NO se borra una imagen simplemente porque
          # tenga la misma URL.
          #
          # Primero intentamos conseguir otra imagen
          # del artículo.
          # ============================================================

          imagenes_por_url = {}

          for noticia in noticias:

              imagen = noticia.get(
                  "imagen",
                  ""
              )

              if imagen:

                  imagen = imagen.strip()

                  if validar_imagen(
                      imagen
                  ):

                      noticia[
                          "imagen"
                      ] = imagen

                      imagenes_por_url[
                          normalizar_url(
                              imagen
                          )
                      ] = imagen


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          def fecha_segura(
              noticia
          ):

              try:

                  return dateparser.parse(
                      noticia.get(
                          "fecha",
                          ""
                      )
                  )

              except Exception:

                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )


          noticias.sort(
              key=fecha_segura,
              reverse=True
          )


          noticias = noticias[
              :MAX_NOTICIAS
          ]


          # ============================================================
          # ESTADÍSTICAS POR CATEGORÍA
          # ============================================================

          categorias = {}

          subcategorias = {}

          fuentes = {}

          imagenes = set()


          for noticia in noticias:

              categoria = noticia.get(
                  "categoria",
                  "Noticias"
              )

              subcategoria = noticia.get(
                  "subcategoria",
                  ""
              )

              fuente = noticia.get(
                  "fuente",
                  ""
              )


              categorias[categoria] = (
                  categorias.get(
                      categoria,
                      0
                  ) + 1
              )


              if subcategoria:

                  if subcategoria not in subcategorias:

                      subcategorias[
                          subcategoria
                      ] = 0

                  subcategorias[
                      subcategoria
                  ] += 1


              if fuente:

                  fuentes[fuente] = (
                      fuentes.get(
                          fuente,
                          0
                      ) + 1
                  )


              imagen = noticia.get(
                  "imagen",
                  ""
              )

              if imagen:

                  imagenes.add(
                      normalizar_url(
                          imagen
                      )
                  )


          # ============================================================
          # ESTADÍSTICAS DE IMÁGENES
          # ============================================================

          con_imagen = sum(

              1

              for n in noticias

              if n.get(
                  "imagen"
              )

          )


          sin_imagen = (
              len(noticias)
              -
              con_imagen
          )


          # ============================================================
          # JSON FINAL
          # ============================================================

          datos = {

              "actualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "fuente":
                  "Expansión + Life & Style",

              "total":
                  len(noticias),

              "imagenes": {

                  "con_imagen":
                      con_imagen,

                  "sin_imagen":
                      sin_imagen,

                  "imagenes_unicas":
                      len(imagenes)

              },

              "categorias":
                  categorias,

              "subcategorias":
                  subcategorias,

              "fuentes":
                  fuentes,

              "noticias":
                  noticias

          }


          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  datos,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # RESULTADO
          # ============================================================

          print("")
          print(
              "======================================"
          )
          print(
              " ACTUALIZACIÓN TERMINADA"
          )
          print(
              "======================================"
          )

          print(
              "TOTAL:",
              len(noticias)
          )

          print(
              "CON IMAGEN:",
              con_imagen
          )

          print(
              "SIN IMAGEN:",
              sin_imagen
          )

          print(
              "IMÁGENES ÚNICAS:",
              len(imagenes)
          )

          print(
              "CATEGORÍAS:",
              categorias
          )

          print(
              "SUBCATEGORÍAS:",
              subcategorias
          )

          print(
              "======================================"
          )

          PY


