name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install feedparser requests beautifulsoup4 python-dateutil

      - name: Crear generador de noticias
        run: |
          cat > actualizar_noticias.py <<'PY'
          import feedparser
          import requests
          import json
          import re
          import html
          import hashlib
          from datetime import datetime, timezone
          from urllib.parse import quote, urlparse, parse_qs, unquote

          OUTPUT = "noticias.json"

          # ============================================================
          # FUENTES OFICIALES DE EXPANSIÓN
          # ============================================================

          FUENTES = [

              # Expansión
              {
                  "nombre": "Expansión",
                  "categoria": "mexico",
                  "url": "https://expansion.mx/rss"
              },

              {
                  "nombre": "Expansión",
                  "categoria": "mundo",
                  "url": "https://expansion.mx/rss/internacional"
              },

              {
                  "nombre": "Expansión",
                  "categoria": "dinero",
                  "url": "https://expansion.mx/rss/economia"
              },

              {
                  "nombre": "Expansión",
                  "categoria": "tecnologia",
                  "url": "https://expansion.mx/rss/tecnologia"
              },

              {
                  "nombre": "Expansión",
                  "categoria": "tendencias",
                  "url": "https://expansion.mx/rss/tendencias"
              },

              {
                  "nombre": "Expansión",
                  "categoria": "dinero",
                  "url": "https://expansion.mx/rss/empresas"
              },

              {
                  "nombre": "Expansión",
                  "categoria": "politica",
                  "url": "https://expansion.mx/rss/politica"
              },

              # ========================================================
              # DEPORTES
              # Expansión no ofrece RSS oficial de Deportes,
              # por eso utilizamos Google News RSS apuntando
              # específicamente a la sección Deportes de Life & Style.
              # ========================================================

              {
                  "nombre": "Expansión Deportes",
                  "categoria": "deportes",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx%2Fdeportes+futbol"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Deportes",
                  "categoria": "deportes",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx%2Fdeportes+Liga+MX"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Deportes",
                  "categoria": "deportes",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx%2Fdeportes+NFL"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Deportes",
                  "categoria": "deportes",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx%2Fdeportes+Formula+1"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Deportes",
                  "categoria": "deportes",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx%2Fdeportes+tenis"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Deportes",
                  "categoria": "deportes",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx%2Fdeportes+boxeo"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Deportes",
                  "categoria": "deportes",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx%2Fdeportes+NBA"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Deportes",
                  "categoria": "deportes",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx%2Fdeportes+beisbol"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              # ========================================================
              # ENTRETENIMIENTO
              # ========================================================

              {
                  "nombre": "Expansión Entretenimiento",
                  "categoria": "entretenimiento",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx+entretenimiento"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Entretenimiento",
                  "categoria": "entretenimiento",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx+cine"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Entretenimiento",
                  "categoria": "entretenimiento",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx+series"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Entretenimiento",
                  "categoria": "entretenimiento",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx+Netflix"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              },

              {
                  "nombre": "Expansión Entretenimiento",
                  "categoria": "entretenimiento",
                  "url": "https://news.google.com/rss/search?q="
                        "site%3Alifeandstyle.expansion.mx+musica"
                        "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              }
          ]


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          # Ya NO existe el límite artificial de 150.
          # Este solamente funciona como protección extrema para evitar
          # que un feed defectuoso genere millones de registros.
          LIMITE_SEGURIDAD = 5000

          session = requests.Session()

          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (compatible; TendenciasMX/1.0; "
                  "+https://cberroteran400-spec.github.io/tendencias-mx/)"
              )
          })


          # ============================================================
          # FUNCIONES
          # ============================================================

          def limpiar_html(texto):
              if not texto:
                  return ""

              texto = html.unescape(str(texto))
              texto = re.sub(r"<[^>]+>", " ", texto)
              texto = re.sub(r"\s+", " ", texto)

              return texto.strip()


          def normalizar_url(url):
              if not url:
                  return ""

              url = html.unescape(str(url)).strip()

              # Google News puede devolver un enlace intermedio.
              # Intentamos encontrar la URL original.
              try:
                  parsed = urlparse(url)
                  query = parse_qs(parsed.query)

                  for clave in ["url", "u", "q"]:
                      if clave in query and query[clave]:
                          posible = unquote(query[clave][0])

                          if (
                              posible.startswith("http://")
                              or posible.startswith("https://")
                          ):
                              url = posible
                              break
              except Exception:
                  pass

              # Eliminar fragmentos
              url = url.split("#")[0]

              return url


          def fecha_entry(entry):
              try:
                  if getattr(entry, "published_parsed", None):
                      dt = datetime(
                          *entry.published_parsed[:6],
                          tzinfo=timezone.utc
                      )
                      return dt.isoformat()

                  if getattr(entry, "updated_parsed", None):
                      dt = datetime(
                          *entry.updated_parsed[:6],
                          tzinfo=timezone.utc
                      )
                      return dt.isoformat()

              except Exception:
                  pass

              return datetime.now(timezone.utc).isoformat()


          def extraer_imagen(entry):
              # media_content
              try:
                  media = entry.get("media_content")

                  if media:
                      for item in media:
                          url = item.get("url")

                          if url:
                              return url
              except Exception:
                  pass

              # media_thumbnail
              try:
                  thumb = entry.get("media_thumbnail")

                  if thumb:
                      for item in thumb:
                          url = item.get("url")

                          if url:
                              return url
              except Exception:
                  pass

              # enclosure
              try:
                  enclosures = entry.get("enclosures")

                  if enclosures:
                      for item in enclosures:
                          url = item.get("href") or item.get("url")

                          if url:
                              return url
              except Exception:
                  pass

              # Buscar imagen dentro del resumen
              try:
                  texto = str(entry.get("summary", ""))

                  match = re.search(
                      r'<img[^>]+src=["\']([^"\']+)["\']',
                      texto,
                      re.IGNORECASE
                  )

                  if match:
                      return html.unescape(match.group(1))
              except Exception:
                  pass

              return ""


          def descripcion_entry(entry):
              texto = ""

              if entry.get("summary"):
                  texto = entry.get("summary")

              elif entry.get("description"):
                  texto = entry.get("description")

              elif entry.get("content"):
                  try:
                      texto = entry.get("content")[0].get("value", "")
                  except Exception:
                      texto = ""

              texto = limpiar_html(texto)

              # Evitar descripciones exageradamente largas
              if len(texto) > 500:
                  texto = texto[:497] + "..."

              return texto


          def original_google_news_url(entry):
              """
              Intenta obtener el enlace original del artículo
              desde la información adicional de Google News.
              """

              posibles = [
                  "ht_news_item_url",
                  "news_item_url",
                  "original_url"
              ]

              for clave in posibles:
                  try:
                      valor = entry.get(clave)

                      if valor:
                          if isinstance(valor, list):
                              valor = valor[0]

                          valor = str(valor)

                          if (
                              valor.startswith("http://")
                              or valor.startswith("https://")
                          ):
                              return valor
                  except Exception:
                      pass

              return ""


          def categoria_segura(categoria):
              permitidas = {
                  "mexico",
                  "politica",
                  "mundo",
                  "dinero",
                  "deportes",
                  "entretenimiento",
                  "tecnologia",
                  "tendencias",
                  "tramites"
              }

              if categoria in permitidas:
                  return categoria

              return "tendencias"


          # ============================================================
          # DESCARGAR Y PROCESAR
          # ============================================================

          noticias = []


          for fuente in FUENTES:

              print("")
              print("=" * 70)
              print("FUENTE:", fuente["nombre"])
              print("CATEGORIA:", fuente["categoria"])
              print("URL:", fuente["url"])
              print("=" * 70)

              try:
                  respuesta = session.get(
                      fuente["url"],
                      timeout=30
                  )

                  respuesta.raise_for_status()

                  feed = feedparser.parse(respuesta.content)

              except Exception as error:
                  print("ERROR descargando fuente:", error)
                  continue

              print("Entradas encontradas:", len(feed.entries))

              for entry in feed.entries:

                  try:

                      titulo = limpiar_html(
                          entry.get("title", "")
                      )

                      if not titulo:
                          continue

                      # Primero intentamos encontrar el enlace original
                      url = original_google_news_url(entry)

                      if not url:
                          url = entry.get("link", "")

                      url = normalizar_url(url)

                      if not url:
                          continue

                      descripcion = descripcion_entry(entry)

                      imagen = extraer_imagen(entry)

                      fecha = fecha_entry(entry)

                      categoria = categoria_segura(
                          fuente["categoria"]
                      )

                      # ID estable
                      clave = (
                          url.lower().strip()
                          if url
                          else (
                              titulo.lower().strip()
                              + "|"
                              + fuente["nombre"].lower()
                          )
                      )

                      identificador = hashlib.sha1(
                          clave.encode("utf-8")
                      ).hexdigest()[:16]

                      noticia = {
                          "id": identificador,
                          "titulo": titulo,
                          "descripcion": descripcion,
                          "url": url,
                          "imagen": imagen,
                          "fecha": fecha,
                          "fuente": fuente["nombre"],
                          "categoria": categoria
                      }

                      noticias.append(noticia)

                  except Exception as error:
                      print(
                          "ERROR procesando noticia:",
                          error
                      )


          # ============================================================
          # DEDUPLICACIÓN
          # ============================================================

          unicas = {}
          titulos = {}

          for noticia in noticias:

              url = noticia.get("url", "").strip()

              titulo = re.sub(
                  r"\s+",
                  " ",
                  noticia.get("titulo", "").lower().strip()
              )

              # Preferimos URL como identificador.
              if url:
                  clave = url.lower()
              else:
                  clave = titulo

              # Si no hay URL útil, utilizamos título.
              if not clave:
                  continue

              if clave in unicas:
                  continue

              # Segunda protección contra títulos duplicados
              if titulo and titulo in titulos:
                  continue

              unicas[clave] = noticia

              if titulo:
                  titulos[titulo] = True


          noticias = list(unicas.values())


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          def timestamp(noticia):
              try:
                  return datetime.fromisoformat(
                      noticia["fecha"].replace("Z", "+00:00")
                  ).timestamp()
              except Exception:
                  return 0


          noticias.sort(
              key=timestamp,
              reverse=True
          )


          # ============================================================
          # LÍMITE DE SEGURIDAD
          # ============================================================

          if len(noticias) > LIMITE_SEGURIDAD:
              noticias = noticias[:LIMITE_SEGURIDAD]


          # ============================================================
          # CONTADORES
          # ============================================================

          categorias = {
              "mexico": 0,
              "politica": 0,
              "mundo": 0,
              "dinero": 0,
              "deportes": 0,
              "entretenimiento": 0,
              "tecnologia": 0,
              "tendencias": 0,
              "tramites": 0
          }

          for noticia in noticias:

              categoria = noticia.get("categoria")

              if categoria in categorias:
                  categorias[categoria] += 1


          # ============================================================
          # CONTADORES DE FUENTES
          # ============================================================

          fuentes = {}

          for noticia in noticias:

              nombre = noticia.get(
                  "fuente",
                  "Desconocida"
              )

              fuentes[nombre] = (
                  fuentes.get(nombre, 0) + 1
              )


          # ============================================================
          # GENERAR JSON
          # ============================================================

          resultado = {
              "actualizado": datetime.now(
                  timezone.utc
              ).isoformat(),

              "fuente": (
                  "Expansión + RSS complementarios"
              ),

              "total": len(noticias),

              "categorias": categorias,

              "fuentes": fuentes,

              "noticias": noticias
          }


          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  resultado,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # RESUMEN EN GITHUB ACTIONS
          # ============================================================

          print("")
          print("=" * 70)
          print("GENERACIÓN TERMINADA")
          print("=" * 70)

          print("TOTAL:", len(noticias))

          print("")
          print("CATEGORÍAS:")

          for categoria, cantidad in categorias.items():
              print(
                  f"  {categoria}: {cantidad}"
              )

          print("")
          print("FUENTES:")

          for nombre, cantidad in sorted(
              fuentes.items(),
              key=lambda x: x[1],
              reverse=True
          ):
              print(
                  f"  {nombre}: {cantidad}"
              )

          print("")
          print("Archivo generado:", OUTPUT)
          print("=" * 70)

          PY

      - name: Ejecutar generador
        run: |
          python actualizar_noticias.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "No hubo cambios nuevos."
          else
            git commit -m "Actualizar noticias"
            git push
          fi