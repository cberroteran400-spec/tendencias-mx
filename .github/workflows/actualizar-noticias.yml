name: Actualizar noticias
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser requests beautifulsoup4 lxml
      - run: |
          python3 << 'PY'
          import feedparser, json, requests
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone

          FUENTES = {
            "https://www.mediotiempo.com/rss.xml": "deportes",
            "https://www.record.com.mx/rss.xml": "deportes",
            "https://expansion.mx/rss/economia": "economia",
            "https://expansion.mx/rss/tecnologia": "tecnologia",
            "https://expansion.mx/rss/rss_mundo.xml": "mundo"
          }

          def get_imagen_real(link, rss_img):
              if rss_img and rss_img.startswith("http") and "google" not in rss_img:
                  return rss_img
              try:
                  r = requests.get(link, timeout=8, headers={"User-Agent":"Mozilla/5.0"})
                  soup = BeautifulSoup(r.text, "lxml")
                  og = soup.find("meta", property="og:image")
                  if og and og.get("content"):
                      return og["content"]
              except: pass
              return rss_img or f"https://picsum.photos/seed/{abs(hash(link))%99999}/600/400"

          todas=[]
          for url, cat in FUENTES.items():
              feed = feedparser.parse(url)
              for e in feed.entries[:15]:
                  img = ""
                  if 'media_content' in e: img = e.media_content[0].get('url','')
                  elif e.get('enclosures'): img = e.enclosures[0].href
                  link = e.get('link','')
                  todas.append({
                    "titulo": e.get('title',''),
                    "descripcion": BeautifulSoup(e.get('description',''), "lxml").get_text()[:200],
                    "link": link,
                    "categoria": cat,
                    "imagen": get_imagen_real(link, img),
                    "fecha": e.get('published','')
                  })
          data={"actualizado": datetime.now(timezone.utc).isoformat(), "noticias": list({n['link']:n for n in todas}.values())}
          with open('noticias.json','w',encoding='utf-8') as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
          print("Listo")
          PY
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add noticias.json
          git commit -m "fix imagenes" || true
          git push
