name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 lxml

      - name: Actualizar noticias
        run: |
          cat > reparar.py <<'PY'
          import json
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          ARCHIVO = "noticias.json"

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36"
          }

          def url_valida(url):
              if not url:
                  return False

              try:
                  p = urlparse(url)
                  return p.scheme in ("http", "https") and bool(p.netloc)
              except:
                  return False

          def imagen_valida(url):
              if not url_valida(url):
                  return False

              u = url.lower()

              if "news.google.com" in u:
                  return False

              if "favicon" in u:
                  return False

              if "data:image" in u:
                  return False

              return True

          def buscar_imagen(url):
              try:
                  r = requests.get(
                      url,
                      headers=HEADERS,
                      timeout=15,
                      allow_redirects=True
                  )

                  if r.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      r.text,
                      "html.parser"
                  )

                  # Open Graph
                  for meta in soup.find_all("meta"):
                      prop = str(meta.get("property", "")).lower()
                      name = str(meta.get("name", "")).lower()

                      if prop in (
                          "og:image",
                          "og:image:url",
                          "og:image:secure_url"
                      ) or name in (
                          "twitter:image",
                          "twitter:image:src"
                      ):
                          imagen = meta.get("content", "")

                          if imagen:
                              imagen = urljoin(
                                  r.url,
                                  imagen
                              )

                              if imagen_valida(imagen):
                                  return imagen

                  # Imágenes del artículo
                  selectores = [
                      "article img",
                      "main img",
                      "[role='main'] img",
                      ".article img",
                      ".article-body img",
                      ".article-content img",
                      ".story-body img"
                  ]

                  for selector in selectores:
                      for img in soup.select(selector):

                          candidatos = [
                              img.get("src"),
                              img.get("data-src"),
                              img.get("data-original"),
                              img.get("data-lazy-src")
                          ]

                          for imagen in candidatos:

                              if not imagen:
                                  continue

                              imagen = urljoin(
                                  r.url,
                                  imagen
                              )

                              if imagen_valida(imagen):
                                  return imagen

              except Exception as e:
                  print(
                      "Error buscando imagen:",
                      e
                  )

              return ""

          with open(
              ARCHIVO,
              "r",
              encoding="utf-8"
          ) as f:
              datos = json.load(f)

          noticias = datos.get(
              "noticias",
              []
          )

          reparadas = 0

          for noticia in noticias:

              imagen_actual = noticia.get(
                  "imagen",
                  ""
              )

              if imagen_valida(
                  imagen_actual
              ):
                  continue

              url = noticia.get(
                  "url",
                  ""
              )

              if not url_valida(url):
                  continue

              print(
                  "Buscando imagen:",
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              imagen = buscar_imagen(
                  url
              )

              if imagen:
                  noticia["imagen"] = imagen
                  reparadas += 1

                  print(
                      "Imagen encontrada:",
                      imagen
                  )

          # Actualizamos solamente los contadores de imágenes
          # y el campo imagen de las noticias que pudieron repararse.

          con_imagen = 0

          for noticia in noticias:
              if imagen_valida(
                  noticia.get(
                      "imagen",
                      ""
                  )
              ):
                  con_imagen += 1

          datos["total"] = len(noticias)

          datos["imagenes"] = {
              "con_imagen": con_imagen,
              "sin_imagen": len(noticias) - con_imagen
          }

          with open(
              ARCHIVO,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  datos,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              "================================="
          )
          print(
              "Imágenes reparadas:",
              reparadas
          )
          print(
              "Total noticias:",
              len(noticias)
          )
          print(
              "Con imagen:",
              con_imagen
          )
          print(
              "Sin imagen:",
              len(noticias) - con_imagen
          )
          print(
              "================================="
          )

          PY

          python reparar.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Reparar imagenes de noticias"
            git push
          fi
