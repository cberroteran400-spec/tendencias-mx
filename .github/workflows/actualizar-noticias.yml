name: Actualizar noticias TendenciasMX

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install feedparser requests beautifulsoup4 lxml

      - name: Crear script Python
        run: |
          cat > actualizar_noticias.py <<'PY'
          import feedparser
          import requests
          import re
          import json
          import time
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urlparse, unquote
          from bs4 import BeautifulSoup

          print("=== TendenciasMX - Iniciando recoleccion masiva ===")

          SESSION = requests.Session()
          SESSION.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "es-MX,es;q=0.9"
          })

          RSS_OFICIALES = [
              "https://expansion.mx/rss",
              "https://expansion.mx/rss/internacional",
              "https://expansion.mx/rss/economia",
              "https://expansion.mx/rss/tecnologia",
              "https://expansion.mx/rss/tendencias",
              "https://expansion.mx/rss/empresas",
              "https://expansion.mx/rss/politica",
              "https://lifeandstyle.expansion.mx/rss",
          ]

          SEARCH_QUERIES = [
              "futbol site:expansion.mx",
              "Liga MX site:expansion.mx",
              "Chivas site:expansion.mx",
              "America Liga MX site:expansion.mx",
              "Cruz Azul site:expansion.mx",
              "Champions League site:expansion.mx",
              "Mundial site:expansion.mx",
              "NFL site:expansion.mx",
              "Super Bowl site:expansion.mx",
              "Game Pass NFL site:expansion.mx",
              "49ers site:expansion.mx",
              "Chiefs site:expansion.mx",
              "Cowboys site:expansion.mx",
              "NBA site:expansion.mx",
              "Lakers site:expansion.mx",
              "Warriors site:expansion.mx",
              "MLB site:expansion.mx",
              "beisbol site:expansion.mx",
              "Yankees site:expansion.mx",
              "Dodgers site:expansion.mx",
              "tenis site:expansion.mx",
              "Alcaraz site:expansion.mx",
              "Sinner site:expansion.mx",
              "Djokovic site:expansion.mx",
              "boxeo site:expansion.mx",
              "Canelo site:expansion.mx",
              "Formula 1 site:expansion.mx",
              "Checo Perez site:expansion.mx",
              "Verstappen site:expansion.mx",
              "Hamilton site:expansion.mx",
              "MotoGP site:expansion.mx",
              "NASCAR site:expansion.mx",
              "entretenimiento site:expansion.mx",
              "celebridades site:expansion.mx",
              "cine site:expansion.mx",
              "series site:expansion.mx",
              "musica site:expansion.mx",
              "cultura site:expansion.mx",
              "estilo de vida site:expansion.mx",
          ]

          def is_expansion_url(url):
              if not url:
                  return False
              if "news.google.com" in url:
                  return False
              parsed = urlparse(url)
              host = parsed.netloc.lower()
              return "expansion.mx" in host

          def is_deportes_url(url):
              if not url:
                  return False
              u = url.lower()
              return "/deportes" in u or "/deporte/" in u

          def resolve_google_url(google_url, timeout=6):
              try:
                  if "news.google.com" not in google_url and "expansion.mx" in google_url:
                      return google_url.split("?utm")[0]
                  r = SESSION.get(google_url, timeout=timeout, allow_redirects=True)
                  final_url = r.url
                  if "expansion.mx" not in final_url:
                      m = re.search(r'https?://[^"\']*expansion\.mx[^"\'\s]*', r.text)
                      if m:
                          cand = m.group(0).replace("\\", "").replace("&amp;", "&")
                          cand = unquote(cand)
                          if "expansion.mx" in cand:
                              return cand.split("&")[0].split('"')[0].split("'")[0].split("?utm")[0]
                      return None
                  return final_url.split("?utm")[0].split("&utm")[0]
              except Exception:
                  return None

          def parse_rss(url, is_google=False):
              noticias = []
              try:
                  feed = feedparser.parse(url)
                  for e in feed.entries:
                      title = getattr(e, 'title', '').strip()
                      link = getattr(e, 'link', '').strip()
                      desc = getattr(e, 'summary', getattr(e, 'description', ''))[:500]
                      pub = getattr(e, 'published', '') or getattr(e, 'updated', '')
                      if not title or not link:
                          continue
                      if is_google:
                          real = resolve_google_url(link)
                          if not real or not is_expansion_url(real):
                              continue
                          link = real
                      else:
                          if not is_expansion_url(link):
                              continue
                      if "news.google.com" in link:
                          continue
                      noticias.append({
                          "titulo": title,
                          "descripcion": re.sub(r'<[^>]+>', '', desc).strip(),
                          "url": link,
                          "fecha_raw": pub,
                          "fuente": "Expansion"
                      })
              except Exception as ex:
                  print(f"RSS error {url}: {ex}")
              return noticias

          def clasificar_categoria(url, titulo, desc):
              u = url.lower()
              t = (titulo + " " + desc).lower()
              if is_deportes_url(url):
                  return "Deportes"
              if "/economia" in u or "/dinero" in u:
                  return "Dinero"
              if "/internacional" in u or "/mundo" in u:
                  return "Mundo"
              if "/tecnologia" in u:
                  return "Tecnologia"
              if "/tendencias" in u or "/lifeandstyle" in u or "/entretenimiento" in u or "/estilo" in u or "/cultura" in u:
                  return "Tendencias"
              if "/empresas" in u:
                  return "Empresas"
              if "/politica" in u:
                  return "Politica"
              if any(k in t for k in ["inflacion","banxico","peso mexicano","t-mec","gasolina","impuesto","banco","mercado","dolar"]):
                  return "Dinero"
              if any(k in t for k in ["trump","biden","sheinbaum","amlo","elecciones","senado","diputados","gobierno"]):
                  return "Politica"
              if any(k in t for k in ["iphone","android","ia ","inteligencia artificial","google","apple","microsoft","app "]):
                  return "Tecnologia"
              return "Noticias"

          def clasificar_subcategoria_deportes(titulo, desc, url):
              txt = (titulo + " " + desc + " " + url).lower()
              nfl_terms = ["nfl","super bowl","game pass","touchdown","quarterback","futbol americano","49ers","chiefs","cowboys","bills","patriots","packers","eagles","ravens","steelers","vikings","broncos","dolphins","nfl mexico","nfl mexico"]
              if any(k in txt for k in nfl_terms):
                  if not any(bad in txt for bad in ["inflacion","banxico","peso mexicano","t-mec","gasolina","impuesto"]):
                      return "NFL"
              ligamx_signals = ["liga mx","liga-mx","club america","america vs","chivas","cruz azul","pumas unam","tigres uanl","rayados","monterrey vs","toluca vs","atlas vs","santos laguna","necaxa","pachuca","club leon","queretaro","mazatlan fc","atletico san luis","juarez fc","xolos","tijuana vs"]
              if any(k in txt for k in ligamx_signals):
                  return "Liga MX"
              if any(k in txt for k in ["formula 1","formula 1","f1 ","checo perez","checo perez","verstappen","hamilton","leclerc","norris","alonso","sainz","piastri","russell","gran premio","gp de"]):
                  if "motogp" not in txt and "nascar" not in txt:
                      return "Formula 1"
              if any(k in txt for k in ["mlb","beisbol","béisbol","yankees","dodgers","ohtani","diablos rojos","sultanes","astros","red sox","home run","jonron"]):
                  return "Beisbol"
              if any(k in txt for k in ["nba","wnba","fiba","lakers","warriors","knicks","bulls","celtics","lebron","curry","wembanyama","capitanes"]):
                  return "Basquetbol"
              if any(k in txt for k in ["tenis","atp","wta","wimbledon","us open","roland garros","alcaraz","sinner","djokovic","nadal","gauff","sabalenka"]):
                  return "Tenis"
              if any(k in txt for k in ["boxeo","canelo","pitbull cruz","benavidez","bivol","ryan garcia","gervonta","knockout","ko ","campeon mundial box"]):
                  return "Boxeo"
              if any(k in txt for k in ["motogp","nascar","indycar","rally","wrc","motociclismo","automovilismo"]):
                  return "Motor"
              if any(k in txt for k in ["champions league","premier league","laliga","serie a","bundesliga","ligue 1","mundial","copa del mundo","mundial de clubes","seleccion mexicana","mls","inter miami","real madrid","barcelona","manchester","liverpool","arsenal","bayern","psg","messi","mbappe","cristiano ronaldo","haaland","futbol"]):
                  return "Futbol"
              return "Otros"

          def clasificar_subcategoria_general(cat, titulo, desc):
              if cat == "Deportes":
                  return clasificar_subcategoria_deportes(titulo, desc, "")
              txt = (titulo+" "+desc).lower()
              if cat == "Dinero":
                  if "inflacion" in txt: return "Inflacion"
                  if "banco" in txt or "banxico" in txt: return "Bancos"
                  return "Economia"
              if cat == "Tecnologia":
                  if "ia" in txt or "inteligencia" in txt: return "IA"
                  return "Tecnologia"
              if cat == "Tendencias":
                  if "cine" in txt: return "Cine"
                  if "musica" in txt or "musica" in txt: return "Musica"
                  if "serie" in txt: return "Series"
                  return "Entretenimiento"
              return cat

          todas = []
          print("Recopilando RSS oficiales...")
          for rss in RSS_OFICIALES:
              res = parse_rss(rss, is_google=False)
              print(f"{rss}: {len(res)}")
              todas.extend(res)

          print("Recopilando Google News searches...")
          for q in SEARCH_QUERIES:
              gurl = f"https://news.google.com/rss/search?q={requests.utils.quote(q)}&hl=es-419&gl=MX&ceid=MX:es-419"
              res = parse_rss(gurl, is_google=True)
              if res:
                  print(f" Search '{q}': {len(res)}")
                  todas.extend(res)
              time.sleep(0.2)

          print(f"Total bruto recolectado: {len(todas)}")

          seen_url = {}
          uniq = []
          for n in todas:
              url_norm = n["url"].split("?")[0].lower().rstrip("/")
              if url_norm in seen_url:
                  continue
              tit_norm = re.sub(r'\W+', '', n["titulo"].lower())[:80]
              if any(tit_norm == t for t in seen_url.values()):
                  continue
              seen_url[url_norm] = tit_norm
              uniq.append(n)

          print(f"Tras dedup: {len(uniq)}")

          filtradas = []
          for n in uniq:
              url = n["url"]
              cat = clasificar_categoria(url, n["titulo"], n["descripcion"])
              if cat == "Deportes" and not is_deportes_url(url):
                  continue
              if is_deportes_url(url):
                  cat = "Deportes"
              sub = clasificar_subcategoria_general(cat, n["titulo"], n["descripcion"])
              txt_low = (n["titulo"]+" "+n["descripcion"]).lower()
              if sub in ["NFL","Basquetbol","Liga MX","Futbol","Beisbol","Tenis","Boxeo","Formula 1","Motor"]:
                  if any(bad in txt_low for bad in ["inflacion superaria","banxico mantiene","peso mexicano","t-mec","gasolinas"]):
                      if not any(s in txt_low for s in ["nfl","nba","checo","canelo","f1","liga mx","futbol","beisbol","tenis"]):
                          continue
                  if sub == "NFL":
                      if not any(k in txt_low for k in ["nfl","super bowl","game pass","touchdown","quarterback","49ers","chiefs","cowboys","eagles","ravens","nfl mexico","futbol americano"]):
                          sub = "Otros"
              n["categoria"] = cat
              n["subcategoria"] = sub
              filtradas.append(n)

          print(f"Tras filtros: {len(filtradas)}")

          if len(filtradas) > 1500:
              dep = [x for x in filtradas if x["categoria"]=="Deportes"][:600]
              otros = [x for x in filtradas if x["categoria"]!="Deportes"][:900]
              filtradas = dep + otros
              print(f"Limitado a 1500: {len(filtradas)}")

          def extract_image(url):
              try:
                  r = SESSION.get(url, timeout=7, allow_redirects=True)
                  if r.status_code!= 200:
                      return ""
                  html = r.text
                  soup = BeautifulSoup(html, 'lxml')
                  og = soup.find("meta", property="og:image")
                  if og and og.get("content"):
                      img = og["content"].strip()
                      if img.startswith("http"):
                          if not any(x in img.lower() for x in ["logo-expansion","favicon","sprite","icon-expansion"]):
                              return img
                  tw = soup.find("meta", attrs={"name": "twitter:image"})
                  if not tw:
                      tw = soup.find("meta", attrs={"property": "twitter:image"})
                  if tw and tw.get("content"):
                      img = tw["content"].strip()
                      if img.startswith("http"):
                          return img
                  for script in soup.find_all("script", type="application/ld+json"):
                      try:
                          data = json.loads(script.string or "")
                          candidates = [data] if isinstance(data, dict) else data if isinstance(data, list) else []
                          for d in candidates:
                              if isinstance(d, dict):
                                  im = d.get("image")
                                  if isinstance(im, str) and im.startswith("http"):
                                      return im
                                  if isinstance(im, dict) and im.get("url"):
                                      return im["url"]
                                  if isinstance(im, list) and len(im)>0 and isinstance(im[0], str):
                                      return im[0]
                      except:
                          continue
                  for img_tag in soup.find_all("img"):
                      src = img_tag.get("src") or img_tag.get("data-src")
                      if src and src.startswith("http") and "logo" not in src.lower():
                          if any(ext in src.lower() for ext in [".jpg",".jpeg",".png",".webp"]):
                              if "expansion.mx" in src or "cloudfront" in src or "media" in src:
                                  return src
                  return ""
              except Exception:
                  return ""

          print("Extrayendo imagenes reales con 10 workers...")
          with ThreadPoolExecutor(max_workers=10) as executor:
              future_to_idx = {executor.submit(extract_image, n["url"]): i for i, n in enumerate(filtradas)}
              for fut in as_completed(future_to_idx):
                  i = future_to_idx[fut]
                  try:
                      img = fut.result()
                      filtradas[i]["imagen"] = img
                  except:
                      filtradas[i]["imagen"] = ""

          noticias_final = []
          for n in filtradas:
              fecha_iso = datetime.now(timezone.utc).isoformat()
              if n.get("fecha_raw"):
                  fecha_iso = n["fecha_raw"]
              noticias_final.append({
                  "titulo": n["titulo"].strip(),
                  "descripcion": n["descripcion"].strip()[:400],
                  "url": n["url"].split("?")[0],
                  "imagen": n.get("imagen","") or "",
                  "fecha": fecha_iso,
                  "fuente": "Expansion",
                  "categoria": n["categoria"],
                  "subcategoria": n["subcategoria"]
              })

          total = len(noticias_final)
          con_img = sum(1 for x in noticias_final if x["imagen"])
          sin_img = total - con_img
          unicas = len(set(x["imagen"] for x in noticias_final if x["imagen"]))
          dep_count = sum(1 for x in noticias_final if x["categoria"]=="Deportes")

          cats = {}
          subs = {}
          fuentes = {}
          for x in noticias_final:
              cats[x["categoria"]] = cats.get(x["categoria"],0)+1
              subs[x["subcategoria"]] = subs.get(x["subcategoria"],0)+1
              fuentes[x["fuente"]] = fuentes.get(x["fuente"],0)+1

          output = {
              "actualizado": datetime.now(timezone.utc).isoformat(),
              "fuente": "Expansion + Life & Style",
              "total": total,
              "imagenes": {
                  "con_imagen": con_img,
                  "sin_imagen": sin_img,
                  "imagenes_unicas": unicas
              },
              "categorias": cats,
              "subcategorias": subs,
              "fuentes": fuentes,
              "noticias": noticias_final
          }

          with open("noticias.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False,indent=2)

          print(f"TOTAL: {total} DEPORTES: {dep_count} CON_IMAGEN: {con_img} SIN: {sin_img} UNICAS: {unicas}")
          print(f"CATEGORIAS: {cats}")
          print(f"SUBCATS: {subs}")

          print("Verificando...")
          assert total>0, "No hay noticias"
          for n in noticias_final:
              assert "news.google.com" not in n["url"], f"URL Google detectada: {n['url']}"
              assert "google.com/url" not in n["url"], f"URL Google detectada: {n['url']}"
              assert is_expansion_url(n["url"]), f"URL no expansion: {n['url']}"
              if n["categoria"]=="Deportes":
                  assert is_deportes_url(n["url"]), f"Deporte sin URL /deportes/: {n['url']} -> {n['titulo']}"
          urls = [x["url"].split("?")[0].lower().rstrip("/") for x in noticias_final]
          assert len(urls)==len(set(urls)), "URLs duplicadas"
          tit_norms = [re.sub(r'\W+','',x["titulo"].lower())[:100] for x in noticias_final]
          assert len(tit_norms)==len(set(tit_norms)), "Titulos duplicados"
          for n in noticias_final:
              tl = (n["titulo"]+" "+n["descripcion"]).lower()
              if n["subcategoria"] in ["NFL","Basquetbol","Liga MX","Futbol"]:
                  if any(bad in tl for bad in ["inflacion superaria","banxico mantiene la tasa","peso mexicano se aprecia","t-mec","gasolinas"]):
                      if not any(k in tl for k in ["nfl","nba","touchdown","checo","canelo"]):
                          raise AssertionError(f"Economica clasificada como {n['subcategoria']}: {n['titulo']}")
          print("Verificaciones OK")
          PY

      - name: Ejecutar scraper
        run: |
          python actualizar_noticias.py

      - name: Verificar noticias.json existe
        run: |
          ls -lh noticias.json
          python -m json.tool noticias.json > /dev/null
          echo "JSON valido"

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git diff --staged --quiet || git commit -m "Actualizar noticias: $(date -u +'%Y-%m-%dT%H:%M:%SZ') - $(jq.total noticias.json) noticias, $(jq.imagenes.con_imagen noticias.json) con imagen"
          git push