name: Actualizar Noticias TendenciasMX
​on:
schedule:
- cron: '*/30 * * * *'
workflow_dispatch:
​permissions:
contents: write
​jobs:
build-and-update:
runs-on: ubuntu-latest
​steps:
- name: Checkout del repositorio
uses: actions/checkout@v4
​- name: Configurar Python
uses: actions/setup-python@v5
with:
python-version: '3.10'
​- name: Instalar dependencias
run: |
python -m pip install --upgrade pip
pip install requests beautifulsoup4 feedparser lxml
​- name: Crear script de actualización
run: |
cat > actualizar_noticias.py <<'PY'
import sys
import re
import json
import time
import urllib.parse
from datetime import datetime
from concurrent.futures import ThreadPoolExecutor, as_completed
import requests
import feedparser
from bs4 import BeautifulSoup
​# --- Configuración global de sesión HTTP ---
HEADERS = {
'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,/;q=0.8',
'Accept-Language': 'es-MX,es;q=0.9,en-US;q=0.8,en;q=0.7'
}
​SESSION = requests.Session()
SESSION.headers.update(HEADERS)
​# --- Fuentes RSS oficiales de Expansión ---
RSS_FEEDS = [
("Noticias", "https://expansion.mx/rss"),
("Mundo", "https://expansion.mx/rss/internacional"),
("Dinero", "https://expansion.mx/rss/economia"),
("Tecnologia", "https://expansion.mx/rss/tecnologia"),
("Tendencias", "https://expansion.mx/rss/tendencias"),
("Empresas", "https://expansion.mx/rss/empresas"),
("Politica", "https://expansion.mx/rss/politica")
]
​# --- Búsquedas avanzadas de Google News RSS para Expansión / Vida y Estilo ---
CONSULTAS_BUSQUEDA = [
# Deportes
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes fútbol",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Liga MX",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Chivas",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes América",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Cruz Azul",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Champions League",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Mundial",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes NFL",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Super Bowl",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Game Pass NFL",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes 49ers",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Chiefs",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes NBA",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Lakers",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes MLB",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes beisbol",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Yankees",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Dodgers",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes tenis",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Alcaraz",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Pecador",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes boxeo",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Canelo",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Fórmula 1",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Checo Pérez",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes Verstappen",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes MotoGP",
"site:expansion.mx/deportes OR site:lifeandstyle.expansion.mx/deportes NASCAR",
# Entretenimiento y Tendencias
"site:expansion.mx OR site:lifeandstyle.expansion.mx entretenimiento",
"site:expansion.mx OR site:lifeandstyle.expansion.mx celebridades",
"site:expansion.mx OR site:lifeandstyle.expansion.mx cine",
"site:expansion.mx OR site:lifeandstyle.expansion.mx series",
"site:expansion.mx OR site:lifeandstyle.expansion.mx música",
"site:expansion.mx OR site:lifeandstyle.expansion.mx cultura"
]
​def desentrañar_url_google(url_google):
"""Resuelve una URL de Google News a la URL original de Expansión."""
if "news.google.com" not in url_google:
return url_google
try:
resp = SESSION.head(url_google, allow_redirects=True, timeout=6)
final_url = resp.url
if "news.google.com" not in final_url:
return final_url
except Exception:
pass
try:
resp = SESSION.get(url_google, timeout=6)
soup = BeautifulSoup(resp.text, 'html.parser')
for a in soup.find_all('a', href=True):
href = a['href']
if "expansion.mx" in href and "news.google.com" not in href:
return href
except Exception:
pass
return None
​def extraer_imagen_articulo(url):
"""Extrae la mejor imagen disponible desde la URL de un artículo."""
if not url or "expansion.mx" not in url:
return ""
try:
res = SESSION.get(url, timeout=7)
if res.status_code != 200:
return ""
soup = BeautifulSoup(res.text, 'html.parser')
​# 1. OpenGraph image
og_img = soup.find('meta', property='og:image')
if og_img and og_img.get('content'):
img_url = og_img['content'].strip()
if img_url and not "logo" in img_url.lower():
return img_url
​# 2. Twitter image
tw_img = soup.find('meta', name='twitter:image')
if tw_img and tw_img.get('content'):
img_url = tw_img['content'].strip()
if img_url and not "logo" in img_url.lower():
return img_url
​# 3. JSON-LD
for script in soup.find_all('script', type='application/ld+json'):
try:
data = json.loads(script.string or '{}')
if isinstance(data, dict):
img = data.get('image')
if isinstance(img, str) and img:
return img
elif isinstance(img, dict) and img.get('url'):
return img['url']
elif isinstance(img, list) and len(img) > 0:
if isinstance(img[0], str):
return img[0]
elif isinstance(img[0], dict) and img[0].get('url'):
return img[0]['url']
except Exception:
continue
​# 4. Primera imagen significativa dentro del artículo
for img in soup.find_all('img', src=True):
src = img['src']
if ("cdn-3" in src or "media" in src or "uploads" in src) and not "logo" in src.lower():
return src
​except Exception:
pass
return ""
​def normalizar_texto(texto):
if not texto:
return ""
texto = texto.lower()
texto = re.sub(r'[^a-z0-9áéíóúñ\s]', '', texto)
return re.sub(r'\s+', ' ', texto).strip()
​def clasificar_deportes(titulo, descripcion, url):
texto = f"{titulo} {descripcion} {url}".lower()
​# NFL
patrones_nfl = [
r'\bnfl\b', r'super bowl', r'game pass', r'touchdown', r'quarterback',
r'futbol americano', r'fútbol americano', r'49ers', r'chiefs', r'cowboys',
r'bills', r'patriots', r'packers', r'eagles', r'ravens', r'steelers',
r'vikings', r'broncos', r'dolphins'
]
if any(re.search(p, texto) for p in patrones_nfl):
return "NFL"
​# Liga MX
patrones_ligamx = [
r'liga mx', r'club américa', r'américa vs', r'chivas', r'cruz azul',
r'pumas unam', r'pumas', r'tigres uanl', r'tigres', r'rayados',
r'monterrey fútbol', r'toluca fc', r'atlas fc', r'santos laguna',
r'necaxa', r'pachuca', r'club león', r'querétaro fc', r'mazatlán fc',
r'san luis', r'xolos', r'tijuana fútbol'
]
if any(re.search(p, texto) for p in patrones_ligamx):
return "Liga MX"
​# Fútbol Internacional
patrones_futbol_int = [
r'champions league', r'premier league', r'laliga', r'serie a', r'bundesliga',
r'ligue 1', r'mundial de clubes', r'copa del mundo', r'selección mexicana',
r'mls', r'inter miami', r'real madrid', r'barcelona', r'manchester city',
r'manchester united', r'liverpool', r'arsenal', r'bayern', r'psg',
r'messi', r'mbappé', r'ronaldo', r'haaland', r'\bfútbol\b', r'\bfutbol\b'
]
if any(re.search(p, texto) for p in patrones_futbol_int):
return "Fútbol"
​# Fórmula 1
if any(k in texto for k in ['fórmula 1', 'formula 1', 'f1', 'checo pérez', 'verstappen', 'hamilton', 'leclerc', 'norris', 'alonso']):
return "Fórmula 1"
​# Motor
if any(k in texto for k in ['motogp', 'nascar', 'indycar', 'rally', 'wrc', 'automovilismo', 'motociclismo']):
return "Motor"
​# Béisbol
if any(k in texto for k in ['mlb', 'béisbol', 'beisbol', 'yankees', 'dodgers', 'ohtani', 'diablos rojos']):
return "Béisbol"
​# Básquetbol
if any(k in texto for k in ['nba', 'wnba', 'fiba', 'lakers', 'warriors', 'celtics', 'básquetbol', 'basquetbol']):
return "Básquetbol"
​# Tenis
if any(k in texto for k in ['atp', 'wta', 'wimbledon', 'us open', 'alcaraz', 'sinner', 'djokovic', 'nadal', 'tenis']):
return "Tenis"
​# Boxeo
if any(k in texto for k in ['canelo', 'boxeo', 'pitbull cruz', 'ryan garcia', 'gervonta']):
return "Boxeo"
​return "Otros"
​def determinar_categoria(url, cat_rss):
url_lower = url.lower()
if "/deportes/" in url_lower:
return "Deportes"
if "/internacional/" in url_lower or cat_rss == "Mundo":
return "Mundo"
if "/economia/" in url_lower or "/dinero/" in url_lower or cat_rss == "Dinero":
return "Dinero"
if "/tecnologia/" in url_lower or cat_rss == "Tecnologia":
return "Tecnologia"
if "/tendencias/" in url_lower or "/entretenimiento/" in url_lower or cat_rss == "Tendencias":
return "Tendencias"
if "/empresas/" in url_lower or cat_rss == "Empresas":
return "Empresas"
if "/politica/" in url_lower or cat_rss == "Politica":
return "Politica"
return cat_rss if cat_rss else "Noticias"
​def recolectar_noticias():
noticias_raw = []
​# 1. Procesar Feeds RSS Oficiales
print("Recolectando desde Feeds RSS oficiales...")
for cat_nombre, feed_url in RSS_FEEDS:
try:
feed = feedparser.parse(feed_url)
for entry in feed.entries:
url = entry.get('link', '').strip()
if not url or "expansion.mx" not in url:
continue
​titulo = entry.get('title', '').strip()
desc = entry.get('summary', '').strip()
fecha = entry.get('published', datetime.now().isoformat())
​img = ""
if 'media_content' in entry and len(entry.media_content) > 0:
img = entry.media_content[0].get('url', '')
elif 'links' in entry:
for l in entry.links:
if l.get('type', '').startswith('image/'):
img = l.get('href', '')
break
​noticias_raw.append({
"titulo": titulo,
"descripcion": BeautifulSoup(desc, 'html.parser').get_text(),
"url": url,
"imagen": img,
"fecha": fecha,
"fuente_origen": cat_nombre
})
except Exception as e:
print(f"Error procesando feed {feed_url}: {e}")
​# 2. Búsquedas Google News RSS
print("Recolectando desde búsquedas avanzadas de Google News...")
for query in CONSULTAS_BUSQUEDA:
try:
encoded_query = urllib.parse.quote(query)
gn_url = f"https://news.google.com/rss/search?q={encoded_query}&hl=es-MX&gl=MX&ceid=MX:es-419"
feed = feedparser.parse(gn_url)
for entry in feed.entries:
g_url = entry.get('link', '').strip()
if not g_url:
continue
​titulo = entry.get('title', '').strip()
# Limpiar sufijo del título en Google News (ej: - Expansión)
if " - " in titulo:
titulo = " - ".join(titulo.split(" - ")[:-1])
​desc = entry.get('summary', '').strip()
fecha = entry.get('published', datetime.now().isoformat())
​noticias_raw.append({
"titulo": titulo,
"descripcion": BeautifulSoup(desc, 'html.parser').get_text(),
"url_google": g_url,
"url": "",
"imagen": "",
"fecha": fecha,
"fuente_origen": "GoogleNews"
})
except Exception as e:
print(f"Error en consulta {query}: {e}")
​print(f"Total bruto recolectado: {len(noticias_raw)} elementos.")
​# 3. Desenredar URLs de Google News
items_gn = [item for item in noticias_raw if item.get("url_google")]
print(f"Resolviendo {len(items_gn)} URLs de Google News...")
​with ThreadPoolExecutor(max_workers=10) as executor:
futures = {executor.submit(desentrañar_url_google, item["url_google"]): item for item in items_gn}
for future in as_completed(futures):
item = futures[future]
real_url = future.result()
if real_url and "expansion.mx" in real_url:
item["url"] = real_url
​# Eliminar ítems sin URL válida de Expansión
noticias_filtradas = [n for n in noticias_raw if n.get("url") and "expansion.mx" in n["url"] and "news.google.com" not in n["url"]]
​# 4. Deduplicación por URL y por Título Normalizado
urls_vistas = set()
titulos_vistos = set()
noticias_unicas = []
​for item in noticias_filtradas:
u = item["url"]
t_norm = normalizar_texto(item["titulo"])
​if u in urls_vistas or t_norm in titulos_vistos:
continue
​urls_vistas.add(u)
titulos_vistos.add(t_norm)
noticias_unicas.append(item)
​print(f"Total único procesable: {len(noticias_unicas)} noticias.")
​# 5. Obtener Imágenes faltantes vía Scraping concurrente
items_sin_img = [item for item in noticias_unicas if not item.get("imagen")]
print(f"Buscando imágenes reales para {len(items_sin_img)} noticias...")
​with ThreadPoolExecutor(max_workers=10) as executor:
futures = {executor.submit(extraer_imagen_articulo, item["url"]): item for item in items_sin_img}
for future in as_completed(futures):
item = futures[future]
img_encontrada = future.result()
if img_encontrada:
item["imagen"] = img_encontrada
​# 6. Clasificación Final y Estructuración
noticias_finales = []
stats_categorias = {}
stats_subcategorias = {}
​for item in noticias_unicas:
url = item["url"]
cat_rss = item.get("fuente_origen", "")
categoria = determinar_categoria(url, cat_rss)
​# REGLA ABSOLUTA PARA DEPORTES:
# Solo es Deportes si tiene /deportes/ en la URL real.
if "/deportes/" not in url.lower() and categoria == "Deportes":
categoria = "Noticias"
​subcategoria = ""
if categoria == "Deportes":
subcategoria = clasificar_deportes(item["titulo"], item["descripcion"], url)
​noticia_obj = {
"titulo": item["titulo"],
"descripcion": item["descripcion"],
"url": url,
"imagen": item.get("imagen", ""),
"fecha": item["fecha"],
"fuente": "Expansión",
"categoria": categoria,
"subcategoria": subcategoria
}
​noticias_finales.append(noticia_obj)
​# Métricas
stats_categorias[categoria] = stats_categorias.get(categoria, 0) + 1
if subcategoria:
stats_subcategorias[subcategoria] = stats_subcategorias.get(subcategoria, 0) + 1
​# Métricas de imágenes
con_imagen = sum(1 for n in noticias_finales if n["imagen"])
sin_imagen = len(noticias_finales) - con_imagen
imgs_unicas = len(set(n["imagen"] for n in noticias_finales if n["imagen"]))
​resultado_json = {
"actualizado": datetime.now().isoformat(),
"fuente": "Expansión + Life & Style",
"total": len(noticias_finales),
"imagenes": {
"con_imagen": con_imagen,
"sin_imagen": sin_imagen,
"imagenes_unicas": imgs_unicas
},
"categorias": stats_categorias,
"subcategorias": stats_subcategorias,
"fuentes": {"Expansión": len(noticias_finales)},
"noticias": noticias_finales
}
​return resultado_json
​def verificar_json(data):
"""Verificaciones automáticas estrictas pre-commit."""
print("\n--- Ejecutando Verificaciones Automáticas ---")
​if not isinstance(data, dict) or "noticias" not in data:
sys.exit("ERROR CRÍTICO: El JSON no tiene estructura válida.")
​noticias = data["noticias"]
if len(noticias) == 0:
sys.exit("ERROR CRÍTICO: No se recopilaron noticias.")
​urls = set()
titulos = set()
​for n in noticias:
u = n.get("url", "")
t = n.get("titulo", "")
cat = n.get("categoria", "")
​# 1. No URLs de Google News
if "news.google.com" in u:
sys.exit(f"ERROR CRÍTICO: URL de Google News detectada en JSON: {u}")
​# 2. Regla absoluta de Deportes
if cat == "Deportes" and "/deportes/" not in u.lower():
sys.exit(f"ERROR CRÍTICO: Noticia en Deportes sin URL deportiva: {u}")
​# 3. Sin URLs duplicadas
if u in urls:
sys.exit(f"ERROR CRÍTICO: URL duplicada detectada: {u}")
urls.add(u)
​# 4. Sin Títulos duplicados exactos
t_norm = normalizar_texto(t)
if t_norm in titulos:
sys.exit(f"ERROR CRÍTICO: Título duplicado detectado: {t}")
titulos.add(t_norm)
​print("¡Todas las verificaciones automáticas pasaron exitosamente!")
​if name == "main":
datos_json = recolectar_noticias()
verificar_json(datos_json)
​# Guardar archivo noticias.json
with open("noticias.json", "w", encoding="utf-8") as f:
json.dump(datos_json, f, ensure_ascii=False, indent=2)
​# Impresión de Estadísticas Finales
total = datos_json["total"]
deportes_cnt = datos_json["categorias"].get("Deportes", 0)
con_img = datos_json["imagenes"]["con_imagen"]
sin_img = datos_json["imagenes"]["sin_imagen"]
imgs_u = datos_json["imagenes"]["imagenes_unicas"]
​print("\n================ RESUMEN DE EJECUCIÓN ")
print(f"TOTAL NOTICIAS : {total}")
print(f"DEPORTES       : {deportes_cnt}")
print(f"CON IMAGEN     : {con_img}")
print(f"SIN IMAGEN     : {sin_img}")
print(f"IMÁGENES ÚNICAS: {imgs_u}")
print("======================================\n")
PY
​- name: Ejecutar script de actualización
run: python actualizar_noticias.py
​- name: Hacer Commit y Push
run: |
git config --global user.name "github-actions[bot]"
git config --global user.email "github-actions[bot]@users.noreply.github.com"
git add noticias.json
if git diff --staged --quiet; then
echo "No hay cambios en noticias.json."
else
git commit -m "bot: Actualización automática de noticias y deportes"
git push
fi
