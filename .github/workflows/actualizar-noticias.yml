name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 python-dateutil

      - name: Crear actualizador
        run: |
          cat > actualizar_noticias.py <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from urllib.parse import urlparse, parse_qs, unquote, urljoin, quote_plus
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from dateutil import parser as dateparser


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          ARCHIVO = "noticias.json"

          MAX_NOTICIAS = 5000
          MAX_POR_RSS = 1000
          MAX_RESULTADOS_BUSQUEDA = 100
          MAX_IMAGENES = 2500
          TIMEOUT = 20

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept-Language": "es-MX,es;q=0.9,en;q=0.8"
          }

          session = requests.Session()
          session.headers.update(HEADERS)


          # ============================================================
          # RSS OFICIALES DE EXPANSIÓN
          # ============================================================

          FUENTES = [
              (
                  "Expansión - Portada",
                  "https://expansion.mx/rss",
                  "Noticias"
              ),
              (
                  "Expansión - Mundo",
                  "https://expansion.mx/rss/internacional",
                  "Mundo"
              ),
              (
                  "Expansión - Economía",
                  "https://expansion.mx/rss/economia",
                  "Dinero"
              ),
              (
                  "Expansión - Tecnología",
                  "https://expansion.mx/rss/tecnologia",
                  "Tecnología"
              ),
              (
                  "Expansión - Tendencias",
                  "https://expansion.mx/rss/tendencias",
                  "Tendencias"
              ),
              (
                  "Expansión - Empresas",
                  "https://expansion.mx/rss/empresas",
                  "Dinero"
              ),
              (
                  "Expansión - Política",
                  "https://expansion.mx/rss/politica",
                  "Política"
              )
          ]


          # ============================================================
          # BÚSQUEDAS DEPORTIVAS
          # ============================================================

          BUSQUEDAS_DEPORTES = {
              "Fútbol": [
                  "futbol",
                  "fútbol",
                  "soccer",
                  "Champions League",
                  "Premier League",
                  "La Liga",
                  "Mundial 2026",
                  "Copa del Mundo",
                  "CONCACAF",
                  "MLS",
                  "selección mexicana",
                  "futbol mexicano"
              ],

              "Liga MX": [
                  "Liga MX",
                  "América",
                  "Chivas",
                  "Cruz Azul",
                  "Pumas",
                  "Tigres",
                  "Rayados",
                  "Monterrey",
                  "Toluca",
                  "Pachuca",
                  "Atlas",
                  "León",
                  "Necaxa",
                  "Santos Laguna",
                  "Tijuana",
                  "Puebla",
                  "Querétaro",
                  "Juárez"
              ],

              "NFL": [
                  "NFL",
                  "Super Bowl",
                  "touchdown",
                  "quarterback",
                  "futbol americano",
                  "49ers",
                  "Chiefs",
                  "Cowboys",
                  "Bills",
                  "Ravens",
                  "Eagles",
                  "Packers",
                  "Steelers",
                  "Dolphins",
                  "Broncos",
                  "Seahawks",
                  "Vikings",
                  "Patriots",
                  "Lions",
                  "Bengals",
                  "Jets",
                  "Bears",
                  "Chargers",
                  "Texans",
                  "Buccaneers"
              ],

              "Básquetbol": [
                  "NBA",
                  "WNBA",
                  "basquetbol",
                  "básquetbol",
                  "basketball",
                  "baloncesto",
                  "Lakers",
                  "Warriors",
                  "Celtics",
                  "Knicks",
                  "Bulls",
                  "Heat",
                  "Spurs",
                  "Suns",
                  "Nuggets",
                  "Bucks",
                  "Mavericks",
                  "Cavaliers",
                  "Clippers",
                  "Rockets",
                  "FIBA",
                  "EuroLeague"
              ],

              "Béisbol": [
                  "MLB",
                  "beisbol",
                  "béisbol",
                  "Yankees",
                  "Dodgers",
                  "Red Sox",
                  "Mets",
                  "Cubs",
                  "Astros",
                  "Padres",
                  "Phillies",
                  "Braves",
                  "Ohtani",
                  "jonrón",
                  "Liga Mexicana de Beisbol",
                  "Diablos Rojos",
                  "Sultanes",
                  "Tomateros",
                  "Charros de Jalisco"
              ],

              "Tenis": [
                  "tenis",
                  "ATP",
                  "WTA",
                  "Wimbledon",
                  "Roland Garros",
                  "US Open",
                  "Australian Open",
                  "Carlos Alcaraz",
                  "Jannik Sinner",
                  "Djokovic",
                  "Nadal",
                  "Swiatek",
                  "Sabalenka"
              ],

              "Boxeo": [
                  "boxeo",
                  "boxeador",
                  "Canelo",
                  "Saúl Canelo",
                  "Pitbull Cruz",
                  "Ryan Garcia",
                  "Gervonta Davis",
                  "Tyson Fury",
                  "Oleksandr Usyk",
                  "knockout",
                  "knock out"
              ],

              "Fórmula 1": [
                  "Fórmula 1",
                  "Formula 1",
                  "F1",
                  "Gran Premio",
                  "Checo Pérez",
                  "Checo Perez",
                  "Sergio Pérez",
                  "Sergio Perez",
                  "Verstappen",
                  "Max Verstappen",
                  "Lewis Hamilton",
                  "Charles Leclerc",
                  "Fernando Alonso",
                  "Lando Norris",
                  "George Russell",
                  "McLaren",
                  "Ferrari F1",
                  "Red Bull Racing",
                  "Mercedes F1"
              ],

              "Motor": [
                  "automovilismo",
                  "MotoGP",
                  "Moto GP",
                  "NASCAR",
                  "rally",
                  "motociclismo",
                  "IndyCar",
                  "WRC",
                  "carreras de autos"
              ]
          }


          # ============================================================
          # ENTRETENIMIENTO
          # ============================================================

          BUSQUEDAS_ENTRETENIMIENTO = {
              "Entretenimiento": [
                  "entretenimiento",
                  "famosos",
                  "celebridades"
              ],
              "Cine": [
                  "cine",
                  "películas",
                  "peliculas"
              ],
              "Series": [
                  "series",
                  "Netflix",
                  "Disney",
                  "HBO"
              ],
              "Música": [
                  "música",
                  "musica",
                  "conciertos",
                  "cantantes"
              ]
          }


          # ============================================================
          # UTILIDADES
          # ============================================================

          def limpiar(texto):
              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              for tag in soup.find_all(
                  ["script", "style"]
              ):
                  tag.decompose()

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              return re.sub(
                  r"\s+",
                  " ",
                  texto
              ).strip()


          def normalizar_texto(texto):
              return limpiar(texto).lower()


          def url_original(url):
              if not url:
                  return ""

              url = str(url).strip()

              if "news.google.com" not in url:
                  return url

              try:
                  parsed = urlparse(url)
                  qs = parse_qs(parsed.query)

                  for clave in ("url", "u", "q"):
                      valores = qs.get(clave, [])

                      for valor in valores:
                          valor = unquote(valor)

                          if valor.startswith("http"):
                              return valor

                  # Intentar resolver mediante redirección.
                  respuesta = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  final = respuesta.url

                  if (
                      final
                      and
                      "news.google.com" not in final
                  ):
                      return final

              except Exception:
                  pass

              return url


          def normalizar_url(url):
              url = url_original(url)

              if not url:
                  return ""

              try:
                  p = urlparse(url)

                  return (
                      p.scheme.lower()
                      + "://"
                      + p.netloc.lower()
                      + p.path.rstrip("/")
                  )

              except Exception:
                  return url.lower().strip()


          def es_expansion(url):
              try:
                  dominio = urlparse(url).netloc.lower()

                  return (
                      dominio == "expansion.mx"
                      or dominio.endswith(".expansion.mx")
                  )

              except Exception:
                  return False


          def es_deporte_url(url):
              if not es_expansion(url):
                  return False

              try:
                  p = urlparse(url)

                  return (
                      p.netloc.lower()
                      == "lifeandstyle.expansion.mx"
                      and
                      "/deportes/" in p.path.lower()
                  )

              except Exception:
                  return False


          def fecha_entry(entry):
              for campo in (
                  "published",
                  "updated",
                  "created"
              ):
                  valor = entry.get(campo)

                  if not valor:
                      continue

                  try:
                      fecha = dateparser.parse(valor)

                      if fecha.tzinfo is None:
                          fecha = fecha.replace(
                              tzinfo=timezone.utc
                          )

                      return fecha.isoformat()

                  except Exception:
                      pass

              return datetime.now(
                  timezone.utc
              ).isoformat()


          # ============================================================
          # IMÁGENES
          # ============================================================

          def imagen_valida(url):
              if not url:
                  return False

              url = str(url).strip()

              if not url.startswith(
                  ("http://", "https://")
              ):
                  return False

              bloqueadas = (
                  "favicon",
                  "tracking",
                  "pixel",
                  "analytics",
                  "sprite",
                  "avatar"
              )

              return not any(
                  palabra in url.lower()
                  for palabra in bloqueadas
              )


          def imagen_feed(entry):
              candidatos = []

              for campo in (
                  "media_content",
                  "media_thumbnail",
                  "enclosures"
              ):
                  datos = entry.get(campo, [])

                  if isinstance(datos, dict):
                      datos = [datos]

                  if not isinstance(datos, list):
                      continue

                  for item in datos:
                      if not isinstance(item, dict):
                          continue

                      for clave in ("url", "href"):
                          valor = item.get(clave)

                          if valor:
                              candidatos.append(valor)

              html = (
                  entry.get("summary", "")
                  or
                  entry.get("description", "")
              )

              soup = BeautifulSoup(
                  str(html),
                  "html.parser"
              )

              for img in soup.find_all("img"):
                  for clave in (
                      "src",
                      "data-src",
                      "data-original",
                      "data-lazy-src"
                  ):
                      valor = img.get(clave)

                      if valor:
                          candidatos.append(valor)

              for imagen in candidatos:
                  if imagen_valida(imagen):
                      return imagen.strip()

              return ""


          def imagen_articulo(url):
              try:
                  respuesta = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )

                  if respuesta.status_code != 200:
                      return ""

                  soup = BeautifulSoup(
                      respuesta.text,
                      "html.parser"
                  )

                  pagina = respuesta.url

                  # Primero OG/Twitter.
                  for attrs in (
                      {"property": "og:image"},
                      {"property": "og:image:url"},
                      {"name": "twitter:image"},
                      {"name": "twitter:image:src"}
                  ):
                      meta = soup.find(
                          "meta",
                          attrs=attrs
                      )

                      if not meta:
                          continue

                      imagen = meta.get("content", "")
                      imagen = urljoin(
                          pagina,
                          imagen
                      )

                      if imagen_valida(imagen):
                          return imagen

                  # Después JSON-LD.
                  scripts = soup.find_all(
                      "script",
                      type="application/ld+json"
                  )

                  for script in scripts:
                      try:
                          datos = json.loads(
                              script.string
                              or
                              script.get_text()
                          )
                      except Exception:
                          continue

                      objetos = []

                      if isinstance(datos, dict):
                          objetos.append(datos)

                      elif isinstance(datos, list):
                          objetos.extend(datos)

                      for obj in objetos:
                          if not isinstance(obj, dict):
                              continue

                          imagen = obj.get("image")

                          if isinstance(imagen, str):
                              imagen = urljoin(
                                  pagina,
                                  imagen
                              )

                              if imagen_valida(imagen):
                                  return imagen

                          elif isinstance(imagen, list):
                              for item in imagen:
                                  if isinstance(item, str):
                                      item = urljoin(
                                          pagina,
                                          item
                                      )

                                      if imagen_valida(item):
                                          return item

                                  if isinstance(item, dict):
                                      item = item.get("url", "")
                                      item = urljoin(
                                          pagina,
                                          item
                                      )

                                      if imagen_valida(item):
                                          return item

                  # Último intento: imágenes del artículo.
                  for selector in (
                      "article img",
                      "main img",
                      "[itemprop='image']",
                      ".article img",
                      ".article-content img"
                  ):
                      for img in soup.select(selector):
                          src = (
                              img.get("src")
                              or
                              img.get("data-src")
                              or
                              img.get("data-original")
                              or
                              img.get("data-lazy-src")
                          )

                          if not src:
                              continue

                          src = urljoin(
                              pagina,
                              src
                          )

                          if imagen_valida(src):
                              return src

              except Exception as error:
                  print(
                      "Error imagen:",
                      error
                  )

              return ""


          # ============================================================
          # CLASIFICACIÓN DEPORTIVA
          # ============================================================

          def clasificar_deporte(
              titulo,
              descripcion,
              sugerida=""
          ):
              texto = normalizar_texto(
                  titulo + " " + descripcion
              )

              # Primero categorías muy específicas.
              orden = [
                  "Liga MX",
                  "NFL",
                  "Básquetbol",
                  "Béisbol",
                  "Tenis",
                  "Boxeo",
                  "Fórmula 1",
                  "Motor",
                  "Fútbol"
              ]

              for categoria in orden:
                  for palabra in BUSQUEDAS_DEPORTES.get(
                      categoria,
                      []
                  ):
                      if normalizar_texto(palabra) in texto:
                          return categoria

              # Si viene de una búsqueda específica de Google
              # y está realmente en /deportes/, usamos la búsqueda.
              if sugerida in BUSQUEDAS_DEPORTES:
                  return sugerida

              return "Otros"


          # ============================================================
          # GOOGLE NEWS RSS
          # ============================================================

          def google_rss(consulta):
              consulta = (
                  "site:lifeandstyle.expansion.mx/deportes "
                  + consulta
              )

              return (
                  "https://news.google.com/rss/search?"
                  "q="
                  + quote_plus(consulta)
                  + "&hl=es-419"
                  "&gl=MX"
                  "&ceid=MX:es-419"
              )


          def google_rss_general(consulta):
              consulta = (
                  "site:lifeandstyle.expansion.mx "
                  + consulta
              )

              return (
                  "https://news.google.com/rss/search?"
                  "q="
                  + quote_plus(consulta)
                  + "&hl=es-419"
                  "&gl=MX"
                  "&ceid=MX:es-419"
              )


          # ============================================================
          # LEER RSS GENERAL
          # ============================================================

          def leer_rss(nombre, url, categoria):
              noticias = []

              print(
                  "RSS GENERAL:",
                  nombre
              )

              try:
                  feed = feedparser.parse(url)

                  for entry in feed.entries[
                      :MAX_POR_RSS
                  ]:
                      titulo = limpiar(
                          entry.get("title", "")
                      )

                      link = url_original(
                          entry.get("link", "")
                      )

                      if not titulo or not link:
                          continue

                      if not es_expansion(link):
                          continue

                      descripcion = limpiar(
                          entry.get("summary", "")
                          or
                          entry.get("description", "")
                      )

                      # Si el RSS general trae un artículo deportivo,
                      # se convierte correctamente en Deportes.
                      if es_deporte_url(link):
                          subcategoria = clasificar_deporte(
                              titulo,
                              descripcion
                          )

                          categoria_final = "Deportes"

                      else:
                          categoria_final = categoria
                          subcategoria = ""

                      noticias.append({
                          "titulo": titulo,
                          "descripcion": descripcion[:700],
                          "url": link,
                          "imagen": imagen_feed(entry),
                          "categoria": categoria_final,
                          "subcategoria": subcategoria,
                          "fuente": nombre,
                          "fecha": fecha_entry(entry)
                      })

              except Exception as error:
                  print(
                      "ERROR RSS:",
                      error
                  )

              return noticias


          # ============================================================
          # LEER DEPORTES
          # ============================================================

          def leer_deportes(categoria, consulta):
              noticias = []

              print(
                  "DEPORTE:",
                  categoria,
                  "-",
                  consulta
              )

              try:
                  feed = feedparser.parse(
                      google_rss(consulta)
                  )

                  for entry in feed.entries[
                      :MAX_RESULTADOS_BUSQUEDA
                  ]:
                      titulo = limpiar(
                          entry.get("title", "")
                      )

                      link = url_original(
                          entry.get("link", "")
                      )

                      if not titulo or not link:
                          continue

                      # ESTA ES LA REGLA PRINCIPAL:
                      # solamente artículos reales de Deportes.
                      if not es_deporte_url(link):
                          continue

                      descripcion = limpiar(
                          entry.get("summary", "")
                          or
                          entry.get("description", "")
                      )

                      categoria_real = clasificar_deporte(
                          titulo,
                          descripcion,
                          categoria
                      )

                      noticias.append({
                          "titulo": titulo,
                          "descripcion": descripcion[:700],
                          "url": link,
                          "imagen": imagen_feed(entry),
                          "categoria": "Deportes",
                          "subcategoria": categoria_real,
                          "fuente": "Expansión - Deportes",
                          "fecha": fecha_entry(entry)
                      })

              except Exception as error:
                  print(
                      "ERROR DEPORTE:",
                      error
                  )

              return noticias


          # ============================================================
          # LEER ENTRETENIMIENTO
          # ============================================================

          def leer_entretenimiento(
              categoria,
              consulta
          ):
              noticias = []

              try:
                  feed = feedparser.parse(
                      google_rss_general(consulta)
                  )

                  for entry in feed.entries[
                      :MAX_RESULTADOS_BUSQUEDA
                  ]:
                      titulo = limpiar(
                          entry.get("title", "")
                      )

                      link = url_original(
                          entry.get("link", "")
                      )

                      if not titulo or not link:
                          continue

                      if not es_expansion(link):
                          continue

                      # No permitir deportes aquí.
                      if es_deporte_url(link):
                          continue

                      descripcion = limpiar(
                          entry.get("summary", "")
                          or
                          entry.get("description", "")
                      )

                      noticias.append({
                          "titulo": titulo,
                          "descripcion": descripcion[:700],
                          "url": link,
                          "imagen": imagen_feed(entry),
                          "categoria": "Entretenimiento",
                          "subcategoria": categoria,
                          "fuente": "Expansión - Life & Style",
                          "fecha": fecha_entry(entry)
                      })

              except Exception as error:
                  print(
                      "ERROR ENTRETENIMIENTO:",
                      error
                  )

              return noticias


          # ============================================================
          # LEER JSON ANTERIOR
          # ============================================================

          anteriores = []

          try:
              with open(
                  ARCHIVO,
                  "r",
                  encoding="utf-8"
              ) as f:
                  datos_anteriores = json.load(f)

              if isinstance(
                  datos_anteriores,
                  dict
              ):
                  anteriores = datos_anteriores.get(
                      "noticias",
                      []
                  )

              elif isinstance(
                  datos_anteriores,
                  list
              ):
                  anteriores = datos_anteriores

          except Exception as error:
              print(
                  "No existe JSON anterior o no se pudo leer:",
                  error
              )

          if not isinstance(
              anteriores,
              list
          ):
              anteriores = []

          print(
              "NOTICIAS ANTERIORES:",
              len(anteriores)
          )


          # ============================================================
          # DESCARGAR NUEVAS
          # ============================================================

          nuevas = []

          for nombre, url, categoria in FUENTES:
              nuevas.extend(
                  leer_rss(
                      nombre,
                      url,
                      categoria
                  )
              )


          for categoria, consultas in BUSQUEDAS_DEPORTES.items():
              for consulta in consultas:
                  nuevas.extend(
                      leer_deportes(
                          categoria,
                          consulta
                      )
                  )


          for categoria, consultas in BUSQUEDAS_ENTRETENIMIENTO.items():
              for consulta in consultas:
                  nuevas.extend(
                      leer_entretenimiento(
                          categoria,
                          consulta
                      )
                  )


          print(
              "NOTICIAS NUEVAS:",
              len(nuevas)
          )


          # ============================================================
          # UNIR
          # ============================================================

          todas = anteriores + nuevas


          # ============================================================
          # LIMPIAR Y CORREGIR CATEGORÍAS
          # ============================================================

          limpias = []

          for noticia in todas:
              if not isinstance(noticia, dict):
                  continue

              titulo = limpiar(
                  noticia.get("titulo", "")
              )

              url = url_original(
                  noticia.get("url", "")
              )

              if not titulo or not url:
                  continue

              if not es_expansion(url):
                  continue

              descripcion = limpiar(
                  noticia.get("descripcion", "")
              )

              # --------------------------------------------------------
              # DEPORTES
              # --------------------------------------------------------

              if es_deporte_url(url):
                  categoria = "Deportes"

                  subcategoria = clasificar_deporte(
                      titulo,
                      descripcion,
                      noticia.get(
                          "subcategoria",
                          ""
                      )
                  )

              else:
                  categoria = noticia.get(
                      "categoria",
                      "Noticias"
                  )

                  subcategoria = ""

                  # Eliminar etiquetas deportivas viejas
                  # de artículos que NO son deportivos.
                  if categoria == "Deportes":
                      categoria = "Noticias"

              imagen = noticia.get(
                  "imagen",
                  ""
              )

              if not imagen_valida(imagen):
                  imagen = ""

              fecha = noticia.get(
                  "fecha",
                  ""
              )

              if not fecha:
                  fecha = datetime.now(
                      timezone.utc
                  ).isoformat()

              limpias.append({
                  "titulo": titulo,
                  "descripcion": descripcion[:700],
                  "url": url,
                  "imagen": imagen,
                  "categoria": categoria,
                  "subcategoria": subcategoria,
                  "fuente": noticia.get(
                      "fuente",
                      "Expansión"
                  ),
                  "fecha": fecha
              })


          # ============================================================
          # QUITAR DUPLICADOS POR URL
          # ============================================================

          vistos_urls = set()
          unicas = []

          for noticia in limpias:
              clave = normalizar_url(
                  noticia["url"]
              )

              if not clave:
                  continue

              if clave in vistos_urls:
                  continue

              vistos_urls.add(clave)
              unicas.append(noticia)

          noticias = unicas


          # ============================================================
          # QUITAR DUPLICADOS POR TÍTULO
          # ============================================================

          vistos_titulos = set()
          unicas = []

          for noticia in noticias:
              titulo = normalizar_texto(
                  noticia["titulo"]
              )

              if not titulo:
                  continue

              if titulo in vistos_titulos:
                  continue

              vistos_titulos.add(titulo)
              unicas.append(noticia)

          noticias = unicas


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          def fecha_segura(noticia):
              try:
                  fecha = dateparser.parse(
                      noticia.get(
                          "fecha",
                          ""
                      )
                  )

                  if fecha.tzinfo is None:
                      fecha = fecha.replace(
                          tzinfo=timezone.utc
                      )

                  return fecha

              except Exception:
                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )


          noticias.sort(
              key=fecha_segura,
              reverse=True
          )


          # ============================================================
          # BUSCAR IMÁGENES QUE FALTEN
          # ============================================================

          pendientes = [
              noticia
              for noticia in noticias
              if not imagen_valida(
                  noticia.get("imagen", "")
              )
          ]

          pendientes = pendientes[
              :MAX_IMAGENES
          ]

          print(
              "ARTÍCULOS SIN IMAGEN:",
              len(pendientes)
          )


          def buscar_imagen(noticia):
              return (
                  noticia["url"],
                  imagen_articulo(
                      noticia["url"]
                  )
              )


          with ThreadPoolExecutor(
              max_workers=15
          ) as executor:

              tareas = [
                  executor.submit(
                      buscar_imagen,
                      noticia
                  )
                  for noticia in pendientes
              ]

              for futuro in as_completed(tareas):
                  try:
                      url, imagen = futuro.result()

                      if not imagen:
                          continue

                      clave = normalizar_url(url)

                      for noticia in noticias:
                          if (
                              normalizar_url(
                                  noticia["url"]
                              )
                              == clave
                          ):
                              noticia["imagen"] = imagen
                              break

                  except Exception:
                      pass


          # ============================================================
          # LIMITE FINAL
          # ============================================================

          noticias = noticias[
              :MAX_NOTICIAS
          ]


          # ============================================================
          # ESTADÍSTICAS
          # ============================================================

          categorias = {}
          subcategorias = {}
          fuentes = {}

          imagenes = set()

          for noticia in noticias:
              categoria = noticia.get(
                  "categoria",
                  "Noticias"
              )

              subcategoria = noticia.get(
                  "subcategoria",
                  ""
              )

              fuente = noticia.get(
                  "fuente",
                  ""
              )

              categorias[categoria] = (
                  categorias.get(
                      categoria,
                      0
                  ) + 1
              )

              if subcategoria:
                  subcategorias[subcategoria] = (
                      subcategorias.get(
                          subcategoria,
                          0
                      ) + 1
                  )

              if fuente:
                  fuentes[fuente] = (
                      fuentes.get(
                          fuente,
                          0
                      ) + 1
                  )

              imagen = noticia.get(
                  "imagen",
                  ""
              )

              if imagen_valida(imagen):
                  imagenes.add(
                      normalizar_url(imagen)
                  )


          con_imagen = sum(
              1
              for noticia in noticias
              if imagen_valida(
                  noticia.get(
                      "imagen",
                      ""
                  )
              )
          )

          sin_imagen = (
              len(noticias)
              -
              con_imagen
          )


          # ============================================================
          # CREAR JSON
          # ============================================================

          resultado = {
              "actualizado": datetime.now(
                  timezone.utc
              ).isoformat(),

              "fuente": (
                  "Expansión + "
                  "Life & Style"
              ),

              "total": len(noticias),

              "imagenes": {
                  "con_imagen": con_imagen,
                  "sin_imagen": sin_imagen,
                  "imagenes_unicas": len(imagenes)
              },

              "categorias": categorias,

              "subcategorias": subcategorias,

              "fuentes": fuentes,

              "noticias": noticias
          }


          with open(
              ARCHIVO,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # MOSTRAR RESULTADO
          # ============================================================

          print("")
          print(
              "=========================================="
          )
          print(
              " ACTUALIZACIÓN TERMINADA"
          )
          print(
              "=========================================="
          )

          print(
              "TOTAL:",
              len(noticias)
          )

          print(
              "CON IMAGEN:",
              con_imagen
          )

          print(
              "SIN IMAGEN:",
              sin_imagen
          )

          print(
              "IMÁGENES ÚNICAS:",
              len(imagenes)
          )

          print(
              "CATEGORÍAS:",
              categorias
          )

          print(
              "SUBCATEGORÍAS:",
              subcategorias
          )

          print(
              "=========================================="
          )

          PY

      - name: Ejecutar actualizador
        run: |
          python actualizar_noticias.py

      - name: Verificar resultado
        run: |
          python - <<'PY'
          import json

          with open(
              "noticias.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          noticias = data.get(
              "noticias",
              []
          )

          print("")
          print("========== VERIFICACIÓN ==========")
          print("TOTAL:", len(noticias))
          print(
              "IMÁGENES:",
              data.get("imagenes")
          )
          print(
              "CATEGORÍAS:",
              data.get("categorias")
          )
          print(
              "SUBCATEGORÍAS:",
              data.get("subcategorias")
          )

          google = [
              n
              for n in noticias
              if "news.google.com"
              in n.get("url", "")
          ]

          print(
              "ENLACES GOOGLE NEWS:",
              len(google)
          )

          if google:
              raise SystemExit(
                  "ERROR: existen enlaces de Google News."
              )

          deportes_malos = []

          for noticia in noticias:
              if noticia.get(
                  "categoria"
              ) != "Deportes":
                  continue

              if "/deportes/" not in noticia.get(
                  "url",
                  ""
              ):
                  deportes_malos.append(
                      noticia
                  )

          print(
              "DEPORTES FUERA DE SECCIÓN:",
              len(deportes_malos)
          )

          if deportes_malos:
              raise SystemExit(
                  "ERROR: hay noticias marcadas como Deportes "
                  "que no pertenecen a /deportes/."
              )

          print("")
          print("OK: verificación completada.")
          print("=================================")
