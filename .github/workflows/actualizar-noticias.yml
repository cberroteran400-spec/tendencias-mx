name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Crear noticias.json desde múltiples RSS
        run: |
          python - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          import html
          from datetime import datetime, timezone
          from urllib.parse import urljoin

          FUENTES_RSS = [
              {
                  "url": "https://expansion.mx/rss",
                  "categoria": "general"
              },
              {
                  "url": "https://expansion.mx/rss/internacional",
                  "categoria": "mundo"
              },
              {
                  "url": "https://expansion.mx/rss/economia",
                  "categoria": "economia"
              },
              {
                  "url": "https://expansion.mx/rss/tecnologia",
                  "categoria": "tecnologia"
              },
              {
                  "url": "https://expansion.mx/rss/tendencias",
                  "categoria": "tendencias"
              },
              {
                  "url": "https://expansion.mx/rss/empresas",
                  "categoria": "mexico"
              },
              {
                  "url": "https://expansion.mx/rss/politica",
                  "categoria": "mexico"
              }
          ]

          MAX_NOTICIAS = 100

          def descargar_rss(url):
              print("")
              print("Descargando:")
              print(url)

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:
                      return response.read()

              except Exception as error:
                  print("ERROR RSS:", url, error)
                  return None

          def limpiar_html(texto):
              if not texto:
                  return ""

              texto = html.unescape(texto)

              texto = re.sub(
                  r"<script[^>]*>.*?</script>",
                  "",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<style[^>]*>.*?</style>",
                  "",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<[^>]+>",
                  "",
                  texto
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()

          def obtener_tag(item, nombre):
              for elemento in item.iter():
                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  if tag.lower() == nombre.lower():
                      if elemento.text:
                          return elemento.text.strip()

              return ""

          def obtener_imagen(item, rss_url):
              for elemento in item.iter():
                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  tag = tag.lower()

                  if tag in [
                      "content",
                      "thumbnail",
                      "enclosure",
                      "image",
                      "media"
                  ]:
                      for atributo in [
                          "url",
                          "href",
                          "src"
                      ]:
                          url = elemento.attrib.get(
                              atributo,
                              ""
                          ).strip()

                          if url:
                              if url.startswith("//"):
                                  url = "https:" + url

                              return urljoin(
                                  rss_url,
                                  url
                              )

              for elemento in item.iter():
                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  tag = tag.lower()

                  if tag in [
                      "description",
                      "encoded",
                      "content"
                  ]:
                      contenido = elemento.text or ""

                      resultado = re.search(
                          r'<img[^>]+src=["\']([^"\']+)["\']',
                          contenido,
                          re.I
                      )

                      if resultado:
                          url = html.unescape(
                              resultado.group(1)
                          ).strip()

                          if url.startswith("//"):
                              url = "https:" + url

                          return urljoin(
                              rss_url,
                              url
                          )

                      resultado = re.search(
                          r'<img[^>]+data-src=["\']([^"\']+)["\']',
                          contenido,
                          re.I
                      )

                      if resultado:
                          url = html.unescape(
                              resultado.group(1)
                          ).strip()

                          if url.startswith("//"):
                              url = "https:" + url

                          return urljoin(
                              rss_url,
                              url
                          )

              return ""

          def normalizar(texto):
              texto = (texto or "").lower()

              reemplazos = {
                  "á": "a",
                  "é": "e",
                  "í": "i",
                  "ó": "o",
                  "ú": "u",
                  "ü": "u"
              }

              for viejo, nuevo in reemplazos.items():
                  texto = texto.replace(viejo, nuevo)

              return texto

          def clasificar_noticia(
              titulo,
              descripcion,
              enlace,
              categoria_fuente
          ):
              titulo_n = normalizar(titulo)
              descripcion_n = normalizar(descripcion)
              enlace_n = normalizar(enlace)

              texto = (
                  titulo_n
                  + " "
                  + descripcion_n
                  + " "
                  + enlace_n
              )

              if categoria_fuente == "mundo":
                  return "mundo"

              if categoria_fuente == "economia":
                  return "economia"

              if categoria_fuente == "tecnologia":
                  return "tecnologia"

              deportes = [
                  "futbol",
                  "liga mx",
                  "seleccion mexicana",
                  "seleccion peruana",
                  "partido",
                  "partidos",
                  "gol",
                  "goles",
                  "jugador",
                  "jugadores",
                  "entrenador",
                  "champions",
                  "uefa",
                  "fifa",
                  "mundial de futbol",
                  "copa del mundo",
                  "nations league",
                  "premier league",
                  "la liga",
                  "bundesliga",
                  "serie a",
                  "mls",
                  "leagues cup",
                  "nba",
                  "nfl",
                  "mlb",
                  "nhl",
                  "tenis",
                  "boxeo",
                  "box",
                  "beisbol",
                  "basquetbol",
                  "baloncesto",
                  "formula 1",
                  "formula1",
                  "f1",
                  "gran premio",
                  "piloto",
                  "pilotos",
                  "red bull",
                  "ferrari",
                  "mercedes f1",
                  "aston martin",
                  "mclaren",
                  "checo perez",
                  "super bowl",
                  "olimpico",
                  "medalla",
                  "atleta",
                  "atletismo",
                  "lucha libre",
                  "wwe",
                  "ufc",
                  "deporte",
                  "deportes",
                  "mundialista",
                  "calendario de partidos",
                  "horario del partido",
                  "donde ver",
                  "dónde ver en vivo"
              ]

              if any(
                  palabra in texto
                  for palabra in deportes
              ):
                  return "deportes"

              entretenimiento = [
                  "actor",
                  "actriz",
                  "actores",
                  "actrices",
                  "cantante",
                  "cantantes",
                  "celebridad",
                  "celebridades",
                  "famoso",
                  "famosa",
                  "famosos",
                  "artista",
                  "artistas",
                  "pelicula",
                  "peliculas",
                  "serie",
                  "series",
                  "netflix",
                  "hollywood",
                  "cine",
                  "cine y tv",
                  "television",
                  "musica",
                  "album",
                  "cancion",
                  "concierto",
                  "conciertos",
                  "festival",
                  "premios",
                  "espectaculo",
                  "espectaculos",
                  "entretenimiento",
                  "reality",
                  "mtv",
                  "grammy",
                  "oscar",
                  "emmy"
              ]

              if any(
                  palabra in texto
                  for palabra in entretenimiento
              ):
                  return "entretenimiento"

              if categoria_fuente == "tendencias":
                  return "mexico"

              if categoria_fuente == "mexico":
                  return "mexico"

              tecnologia = [
                  "tecnologia",
                  "inteligencia artificial",
                  "ia generativa",
                  "chatgpt",
                  "openai",
                  "google",
                  "apple",
                  "iphone",
                  "android",
                  "samsung",
                  "microsoft",
                  "meta",
                  "facebook",
                  "instagram",
                  "whatsapp",
                  "tiktok",
                  "internet",
                  "software",
                  "aplicacion",
                  "smartphone",
                  "computadora",
                  "robot",
                  "robotica",
                  "ciberseguridad",
                  "videojuego",
                  "videojuegos",
                  "nvidia",
                  "chip",
                  "chips"
              ]

              if any(
                  palabra in texto
                  for palabra in tecnologia
              ):
                  return "tecnologia"

              economia = [
                  "economia",
                  "finanzas",
                  "financiero",
                  "financiera",
                  "dolar",
                  "peso mexicano",
                  "inflacion",
                  "banxico",
                  "banco de mexico",
                  "bolsa",
                  "acciones",
                  "mercado",
                  "mercados",
                  "empleo",
                  "desempleo",
                  "salario",
                  "salarios",
                  "impuesto",
                  "impuestos",
                  "negocio",
                  "negocios",
                  "empresa",
                  "empresas",
                  "petroleo",
                  "gasolina",
                  "inversion",
                  "creditos",
                  "hipoteca",
                  "tasas de interes"
              ]

              if any(
                  palabra in texto
                  for palabra in economia
              ):
                  return "economia"

              mundo = [
                  "estados unidos",
                  "eeuu",
                  "ee.uu",
                  "canada",
                  "espana",
                  "francia",
                  "alemania",
                  "italia",
                  "reino unido",
                  "inglaterra",
                  "rusia",
                  "ucrania",
                  "china",
                  "japon",
                  "india",
                  "brasil",
                  "argentina",
                  "colombia",
                  "chile",
                  "peru",
                  "venezuela",
                  "ecuador",
                  "bolivia",
                  "internacional",
                  "internacionales",
                  "onu",
                  "otan",
                  "casa blanca",
                  "presidente de estados unidos"
              ]

              if any(
                  palabra in texto
                  for palabra in mundo
              ):
                  return "mundo"

              return "mexico"

          noticias = []

          for fuente_rss in FUENTES_RSS:
              rss_url = fuente_rss["url"]
              categoria_fuente = fuente_rss["categoria"]

              data = descargar_rss(rss_url)

              if not data:
                  continue

              try:
                  root = ET.fromstring(data)

              except Exception as error:
                  print(
                      "ERROR XML:",
                      rss_url,
                      error
                  )
                  continue

              contador = 0

              for item in root.findall(".//item"):
                  titulo = obtener_tag(
                      item,
                      "title"
                  )

                  enlace = obtener_tag(
                      item,
                      "link"
                  )

                  descripcion = obtener_tag(
                      item,
                      "description"
                  )

                  fecha = obtener_tag(
                      item,
                      "pubDate"
                  )

                  if not titulo or not enlace:
                      continue

                  descripcion_limpia = limpiar_html(
                      descripcion
                  )

                  imagen = obtener_imagen(
                      item,
                      rss_url
                  )

                  categoria = clasificar_noticia(
                      titulo,
                      descripcion_limpia,
                      enlace,
                      categoria_fuente
                  )

                  noticia = {
                      "titulo": limpiar_html(titulo),
                      "descripcion": descripcion_limpia[:600],
                      "enlace": enlace.strip(),
                      "fecha": fecha.strip(),
                      "fuente": "Expansión",
                      "categoria": categoria,
                      "imagen": imagen,
                      "rss": categoria_fuente
                  }

                  noticias.append(noticia)
                  contador += 1

              print(
                  "Noticias obtenidas:",
                  contador
              )

          noticias_unicas = {}

          for noticia in noticias:
              enlace = noticia["enlace"]

              if not enlace:
                  continue

              if enlace not in noticias_unicas:
                  noticias_unicas[enlace] = noticia
              else:
                  existente = noticias_unicas[enlace]

                  if (
                      not existente.get("imagen")
                      and noticia.get("imagen")
                  ):
                      noticias_unicas[enlace] = noticia

          noticias = list(
              noticias_unicas.values()
          )

          noticias.sort(
              key=lambda noticia: noticia.get(
                  "fecha",
                  ""
              ),
              reverse=True
          )

          noticias = noticias[:MAX_NOTICIAS]

          conteo = {
              "mexico": 0,
              "mundo": 0,
              "economia": 0,
              "deportes": 0,
              "entretenimiento": 0,
              "tecnologia": 0
          }

          imagenes = 0

          for noticia in noticias:
              categoria = noticia.get(
                  "categoria"
              )

              if categoria in conteo:
                  conteo[categoria] += 1

              if noticia.get("imagen"):
                  imagenes += 1

          print("")
          print("======================================")
          print("       TENDENCIAS MX - RSS")
          print("======================================")
          print("TOTAL:", len(noticias))
          print("MÉXICO:", conteo["mexico"])
          print("MUNDO:", conteo["mundo"])
          print("ECONOMÍA:", conteo["economia"])
          print("DEPORTES:", conteo["deportes"])
          print("ENTRETENIMIENTO:", conteo["entretenimiento"])
          print("TECNOLOGÍA:", conteo["tecnologia"])
          print("CON IMAGEN:", imagenes)
          print("======================================")

          resultado = {
              "actualizado": datetime.now(
                  timezone.utc
              ).isoformat(),
              "fuente": "Expansión",
              "total": len(noticias),
              "categorias": conteo,
              "noticias": noticias
          }

          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as archivo:
              json.dump(
                  resultado,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )

          print("")
          print(
              "noticias.json creado correctamente."
          )
          print("")

          PY

      - name: Guardar noticias actualizadas
        run: |
          git config user.name "Tendencias MX Bot"
          git config user.email "actions@github.com"

          git add noticias.json

          git diff --cached --quiet || \
            git commit \
            -m "Actualizar noticias RSS"

          git push
