name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 python-dateutil

      - name: Crear actualizador
        run: |

          cat > actualizar_noticias.py <<'PY'

          import json
          import re
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urlparse, parse_qs, unquote, urljoin

          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from dateutil import parser as dateparser


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          MAX_NOTICIAS = 5000

          # Cuántas páginas se pueden visitar buscando imágenes
          MAX_BUSQUEDAS_IMAGEN = 2500

          TIMEOUT = 15

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept-Language": "es-MX,es;q=0.9,en;q=0.8"
          }


          # ============================================================
          # FUENTES EXPANSIÓN
          # ============================================================

          FUENTES = [

              (
                  "Expansión - Portada",
                  "https://expansion.mx/rss",
                  "Noticias"
              ),

              (
                  "Expansión - Mundo",
                  "https://expansion.mx/rss/internacional",
                  "Mundo"
              ),

              (
                  "Expansión - Economía",
                  "https://expansion.mx/rss/economia",
                  "Dinero"
              ),

              (
                  "Expansión - Tecnología",
                  "https://expansion.mx/rss/tecnologia",
                  "Tecnología"
              ),

              (
                  "Expansión - Tendencias",
                  "https://expansion.mx/rss/tendencias",
                  "Tendencias"
              ),

              (
                  "Expansión - Empresas",
                  "https://expansion.mx/rss/empresas",
                  "Dinero"
              ),

              (
                  "Expansión - Política",
                  "https://expansion.mx/rss/politica",
                  "Política"
              )
          ]


          # ============================================================
          # DEPORTES
          # ============================================================

          DEPORTES = [

              (
                  "Fútbol",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(futbol+OR+fútbol+OR+soccer)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Liga MX",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(%22Liga+MX%22+OR+LigaMX)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "NFL",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(NFL+OR+%22Super+Bowl%22+OR+%22futbol+americano%22)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Fórmula 1",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(%22Formula+1%22+OR+%22Fórmula+1%22+OR+F1+OR+"
                  "%22Gran+Premio%22+OR+%22Checo+Perez%22)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Boxeo",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(boxeo+OR+boxeador+OR+pelea+OR+%22peso+completo%22)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Tenis",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(tenis+OR+ATP+OR+WTA+OR+Wimbledon+OR+%22US+Open%22+"
                  "OR+%22Roland+Garros%22)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              # ========================================================
              # BÁSQUETBOL AMPLIADO
              # ========================================================

              (
                  "Básquetbol",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(NBA+OR+WNBA+OR+basquetbol+OR+básquetbol+OR+"
                  "baloncesto+OR+FIBA+OR+EuroLeague+OR+%22NBA+Mexico%22)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Básquetbol NBA",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(NBA+OR+%22Los+Angeles+Lakers%22+OR+%22Golden+State+Warriors%22+"
                  "OR+%22Boston+Celtics%22+OR+%22New+York+Knicks%22+"
                  "OR+%22Dallas+Mavericks%22)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Básquetbol México",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(%22basquetbol+mexicano%22+OR+%22básquetbol+mexicano%22+"
                  "OR+%22selección+mexicana%22+basquetbol+OR+%22NBA+Mexico%22)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Béisbol",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(beisbol+OR+béisbol+OR+MLB+OR+%22World+Series%22)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Motor",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+"
                  "(automovilismo+OR+MotoGP+OR+NASCAR+OR+motociclismo)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              )
          ]


          # ============================================================
          # ENTRETENIMIENTO
          # ============================================================

          ENTRETENIMIENTO = [

              (
                  "Entretenimiento",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx+entretenimiento"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Cine",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx+cine"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Series",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx+"
                  "(series+OR+Netflix+OR+Disney+OR+HBO)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),

              (
                  "Música",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx+"
                  "(musica+OR+música+OR+concierto+OR+cantante)"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              )
          ]


          # ============================================================
          # SESIÓN HTTP
          # ============================================================

          session = requests.Session()
          session.headers.update(HEADERS)


          # ============================================================
          # LIMPIAR HTML
          # ============================================================

          def limpiar_html(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              for tag in soup(["script", "style"]):
                  tag.decompose()

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ============================================================
          # URL ORIGINAL DE GOOGLE NEWS
          # ============================================================

          def obtener_url_original(url):

              if not url:
                  return ""

              url = str(url).strip()

              if "news.google.com" not in url:
                  return url

              try:

                  parsed = urlparse(url)

                  qs = parse_qs(
                      parsed.query
                  )

                  for clave in [
                      "url",
                      "u",
                      "q"
                  ]:

                      if (
                          clave in qs
                          and qs[clave]
                      ):

                          posible = unquote(
                              qs[clave][0]
                          )

                          if posible.startswith(
                              "http"
                          ):
                              return posible

              except:
                  pass

              return url


          # ============================================================
          # VALIDAR IMAGEN
          # ============================================================

          def validar_imagen(url):

              if not url:
                  return False

              url = str(url).strip()

              if not url.startswith(
                  ("http://", "https://")
              ):
                  return False

              texto = url.lower()

              prohibidas = [
                  "favicon",
                  "logo",
                  "icon",
                  "avatar",
                  "sprite",
                  "tracking",
                  "pixel",
                  "advert",
                  "adsystem"
              ]

              if any(
                  palabra in texto
                  for palabra in prohibidas
              ):
                  return False

              extensiones = [
                  ".jpg",
                  ".jpeg",
                  ".png",
                  ".webp",
                  ".avif",
                  ".gif"
              ]

              if any(
                  ext in texto
                  for ext in extensiones
              ):
                  return True

              dominios = [
                  "image",
                  "images",
                  "img",
                  "media",
                  "cdn",
                  "cloudfront",
                  "cloudinary",
                  "akamaized"
              ]

              return any(
                  x in texto
                  for x in dominios
              )


          # ============================================================
          # IMÁGENES DEL RSS
          # ============================================================

          def imagenes_desde_feed(entry):

              candidatos = []


              media = entry.get(
                  "media_content",
                  []
              )

              if isinstance(media, list):

                  for item in media:

                      if not isinstance(
                          item,
                          dict
                      ):
                          continue

                      for clave in [
                          "url",
                          "href"
                      ]:

                          valor = item.get(
                              clave
                          )

                          if valor:
                              candidatos.append(
                                  valor
                              )


              thumbnails = entry.get(
                  "media_thumbnail",
                  []
              )

              if isinstance(
                  thumbnails,
                  list
              ):

                  for item in thumbnails:

                      if isinstance(
                          item,
                          dict
                      ):

                          valor = item.get(
                              "url"
                          )

                          if valor:
                              candidatos.append(
                                  valor
                              )


              enclosures = entry.get(
                  "enclosures",
                  []
              )

              if isinstance(
                  enclosures,
                  list
              ):

                  for item in enclosures:

                      if isinstance(
                          item,
                          dict
                      ):

                          valor = (
                              item.get("href")
                              or
                              item.get("url")
                          )

                          if valor:
                              candidatos.append(
                                  valor
                              )


              html = (
                  entry.get("summary")
                  or
                  entry.get("description")
                  or
                  ""
              )


              if html:

                  soup = BeautifulSoup(
                      html,
                      "html.parser"
                  )

                  for img in soup.find_all(
                      "img"
                  ):

                      for atributo in [
                          "src",
                          "data-src",
                          "data-original",
                          "data-lazy-src"
                      ]:

                          valor = img.get(
                              atributo
                          )

                          if valor:
                              candidatos.append(
                                  valor
                              )


              resultado = []


              for imagen in candidatos:

                  if not imagen:
                      continue

                  imagen = str(
                      imagen
                  ).strip()


                  if imagen.startswith(
                      "//"
                  ):
                      imagen = (
                          "https:" +
                          imagen
                      )


                  if validar_imagen(
                      imagen
                  ):

                      if imagen not in resultado:
                          resultado.append(
                              imagen
                          )


              return resultado


          # ============================================================
          # OBTENER TODAS LAS IMÁGENES DE LA PÁGINA
          # ============================================================

          def obtener_imagenes_pagina(url):

              resultado = []

              if not url:
                  return resultado


              try:

                  respuesta = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True
                  )


                  if respuesta.status_code != 200:
                      return resultado


                  soup = BeautifulSoup(
                      respuesta.text,
                      "html.parser"
                  )


                  # ----------------------------------------------------
                  # OG IMAGE
                  # ----------------------------------------------------

                  metas = [

                      soup.find(
                          "meta",
                          attrs={
                              "property":
                              "og:image"
                          }
                      ),

                      soup.find(
                          "meta",
                          attrs={
                              "property":
                              "og:image:url"
                          }
                      ),

                      soup.find(
                          "meta",
                          attrs={
                              "name":
                              "twitter:image"
                          }
                      ),

                      soup.find(
                          "meta",
                          attrs={
                              "name":
                              "twitter:image:src"
                          }
                      )
                  ]


                  for meta in metas:

                      if not meta:
                          continue

                      imagen = meta.get(
                          "content"
                      )

                      if not imagen:
                          continue

                      imagen = urljoin(
                          respuesta.url,
                          imagen.strip()
                      )


                      if validar_imagen(
                          imagen
                      ):

                          if imagen not in resultado:
                              resultado.append(
                                  imagen
                              )


                  # ----------------------------------------------------
                  # JSON-LD
                  # ----------------------------------------------------

                  for script in soup.find_all(
                      "script",
                      type="application/ld+json"
                  ):

                      try:

                          texto = (
                              script.string
                              or
                              script.get_text()
                          )

                          datos = json.loads(
                              texto
                          )


                          objetos = []


                          if isinstance(
                              datos,
                              dict
                          ):
                              objetos = [
                                  datos
                              ]

                          elif isinstance(
                              datos,
                              list
                          ):
                              objetos = datos


                          for obj in objetos:

                              if not isinstance(
                                  obj,
                                  dict
                              ):
                                  continue


                              imagen = obj.get(
                                  "image"
                              )


                              if isinstance(
                                  imagen,
                                  str
                              ):

                                  imagen = urljoin(
                                      respuesta.url,
                                      imagen
                                  )


                                  if validar_imagen(
                                      imagen
                                  ):

                                      if imagen not in resultado:
                                          resultado.append(
                                              imagen
                                          )


                              elif isinstance(
                                  imagen,
                                  list
                              ):

                                  for item in imagen:

                                      if isinstance(
                                          item,
                                          str
                                      ):

                                          item = urljoin(
                                              respuesta.url,
                                              item
                                          )


                                          if validar_imagen(
                                              item
                                          ):

                                              if item not in resultado:
                                                  resultado.append(
                                                      item
                                                  )


                      except:
                          pass


                  # ----------------------------------------------------
                  # IMG DEL ARTÍCULO
                  # ----------------------------------------------------

                  for img in soup.find_all(
                      "img"
                  ):

                      atributos = [
                          "src",
                          "data-src",
                          "data-original",
                          "data-lazy-src"
                      ]


                      for atributo in atributos:

                          src = img.get(
                              atributo
                          )

                          if not src:
                              continue


                          src = urljoin(
                              respuesta.url,
                              src.strip()
                          )


                          if not validar_imagen(
                              src
                          ):
                              continue


                          try:

                              width = int(
                                  img.get(
                                      "width",
                                      0
                                  )
                              )

                          except:

                              width = 0


                          # Preferimos imágenes grandes
                          if width >= 500:

                              if src not in resultado:
                                  resultado.append(
                                      src
                                  )

                          elif len(resultado) < 10:

                              if src not in resultado:
                                  resultado.append(
                                      src
                                  )


                          break


              except Exception as error:

                  print(
                      "Error obteniendo imágenes:",
                      error
                  )


              return resultado


          # ============================================================
          # FECHA
          # ============================================================

          def obtener_fecha(entry):

              for campo in [
                  "published",
                  "updated",
                  "created"
              ]:

                  valor = entry.get(
                      campo
                  )

                  if valor:

                      try:

                          fecha = dateparser.parse(
                              valor
                          )


                          if fecha.tzinfo is None:

                              fecha = fecha.replace(
                                  tzinfo=timezone.utc
                              )


                          return fecha.isoformat()


                      except:
                          pass


              return datetime.now(
                  timezone.utc
              ).isoformat()


          # ============================================================
          # LEER FUENTE EXPANSIÓN
          # ============================================================

          def leer_fuente(
              nombre,
              url,
              categoria
          ):

              resultado = []

              print(
                  "RSS:",
                  nombre
              )


              try:

                  feed = feedparser.parse(
                      url
                  )


                  for entry in feed.entries:

                      titulo = limpiar_html(
                          entry.get(
                              "title",
                              ""
                          )
                      )


                      link = obtener_url_original(
                          entry.get(
                              "link",
                              ""
                          )
                      )


                      if not titulo or not link:
                          continue


                      descripcion = limpiar_html(
                          entry.get(
                              "summary",
                              ""
                          )
                          or
                          entry.get(
                              "description",
                              ""
                          )
                      )


                      imagenes = imagenes_desde_feed(
                          entry
                      )


                      resultado.append({

                          "titulo":
                              titulo,

                          "descripcion":
                              descripcion[:700],

                          "url":
                              link,

                          "imagen":
                              imagenes[0]
                              if imagenes
                              else "",

                          "imagenesAlternativas":
                              imagenes[1:],

                          "categoria":
                              categoria,

                          "subcategoria":
                              "",

                          "fuente":
                              nombre,

                          "fecha":
                              obtener_fecha(
                                  entry
                              )
                      })


              except Exception as error:

                  print(
                      "ERROR:",
                      error
                  )


              return resultado


          # ============================================================
          # LEER DEPORTES
          # ============================================================

          def leer_deportes(
              subcategoria,
              url
          ):

              resultado = []

              print(
                  "DEPORTE:",
                  subcategoria
              )


              try:

                  feed = feedparser.parse(
                      url
                  )


                  for entry in feed.entries:

                      titulo = limpiar_html(
                          entry.get(
                              "title",
                              ""
                          )
                      )


                      link = obtener_url_original(
                          entry.get(
                              "link",
                              ""
                          )
                      )


                      if not titulo or not link:
                          continue


                      descripcion = limpiar_html(
                          entry.get(
                              "summary",
                              ""
                          )
                          or
                          entry.get(
                              "description",
                              ""
                          )
                      )


                      texto = (
                          titulo +
                          " " +
                          descripcion +
                          " " +
                          link
                      ).lower()


                      # =================================================
                      # VALIDACIÓN ESPECÍFICA POR DEPORTE
                      # =================================================

                      palabras_por_deporte = {

                          "Fútbol": [
                              "futbol",
                              "fútbol",
                              "soccer",
                              "champions",
                              "premier league"
                          ],

                          "Liga MX": [
                              "liga mx",
                              "ligamx",
                              "club américa",
                              "américa",
                              "chivas",
                              "cruz azul",
                              "pumas",
                              "tigres",
                              "monterrey"
                          ],

                          "NFL": [
                              "nfl",
                              "super bowl",
                              "touchdown",
                              "quarterback",
                              "futbol americano"
                          ],

                          "Fórmula 1": [
                              "formula 1",
                              "fórmula 1",
                              "f1",
                              "gran premio",
                              "checo perez",
                              "checo pérez",
                              "aston martin",
                              "ferrari",
                              "mercedes"
                          ],

                          "Boxeo": [
                              "boxeo",
                              "boxeador",
                              "peleador",
                              "peso completo"
                          ],

                          "Tenis": [
                              "tenis",
                              "atp",
                              "wta",
                              "wimbledon",
                              "roland garros",
                              "us open"
                          ],

                          "Básquetbol": [
                              "nba",
                              "wnba",
                              "basquetbol",
                              "básquetbol",
                              "baloncesto",
                              "fiba",
                              "euroleague",
                              "basketball",
                              "nba mexico",
                              "nba méxico"
                          ],

                          "Básquetbol NBA": [
                              "nba",
                              "lakers",
                              "warriors",
                              "celtics",
                              "knicks",
                              "mavericks",
                              "bulls",
                              "heat",
                              "spurs",
                              "suns",
                              "nuggets",
                              "bucks"
                          ],

                          "Básquetbol México": [
                              "basquetbol mexicano",
                              "básquetbol mexicano",
                              "nba mexico",
                              "nba méxico",
                              "selección mexicana",
                              "baloncesto mexicano"
                          ],

                          "Béisbol": [
                              "beisbol",
                              "béisbol",
                              "mlb",
                              "world series",
                              "home run"
                          ],

                          "Motor": [
                              "automovilismo",
                              "motogp",
                              "nascar",
                              "motociclismo"
                          ]
                      }


                      palabras = palabras_por_deporte.get(
                          subcategoria,
                          []
                      )


                      if not any(
                          palabra in texto
                          for palabra in palabras
                      ):
                          continue


                      imagenes = imagenes_desde_feed(
                          entry
                      )


                      resultado.append({

                          "titulo":
                              titulo,

                          "descripcion":
                              descripcion[:700],

                          "url":
                              link,

                          "imagen":
                              imagenes[0]
                              if imagenes
                              else "",

                          "imagenesAlternativas":
                              imagenes[1:],

                          "categoria":
                              "Deportes",

                          "subcategoria":
                              subcategoria,

                          "fuente":
                              "Expansión - Deportes",

                          "fecha":
                              obtener_fecha(
                                  entry
                              )
                      })


              except Exception as error:

                  print(
                      "ERROR DEPORTES:",
                      error
                  )


              return resultado


          # ============================================================
          # ENTRETENIMIENTO
          # ============================================================

          def leer_entretenimiento(
              subcategoria,
              url
          ):

              resultado = []

              try:

                  feed = feedparser.parse(
                      url
                  )


                  for entry in feed.entries:

                      titulo = limpiar_html(
                          entry.get(
                              "title",
                              ""
                          )
                      )


                      link = obtener_url_original(
                          entry.get(
                              "link",
                              ""
                          )
                      )


                      if not titulo or not link:
                          continue


                      descripcion = limpiar_html(
                          entry.get(
                              "summary",
                              ""
                          )
                          or
                          entry.get(
                              "description",
                              ""
                          )
                      )


                      imagenes = imagenes_desde_feed(
                          entry
                      )


                      resultado.append({

                          "titulo":
                              titulo,

                          "descripcion":
                              descripcion[:700],

                          "url":
                              link,

                          "imagen":
                              imagenes[0]
                              if imagenes
                              else "",

                          "imagenesAlternativas":
                              imagenes[1:],

                          "categoria":
                              "Entretenimiento",

                          "subcategoria":
                              subcategoria,

                          "fuente":
                              "Expansión - Life & Style",

                          "fecha":
                              obtener_fecha(
                                  entry
                              )
                      })


              except Exception as error:

                  print(
                      "ERROR ENTRETENIMIENTO:",
                      error
                  )


              return resultado


          # ============================================================
          # DESCARGAR TODO
          # ============================================================

          noticias = []


          # Fuentes generales

          for nombre, url, categoria in FUENTES:

              noticias.extend(
                  leer_fuente(
                      nombre,
                      url,
                      categoria
                  )
              )


          # Deportes

          for subcategoria, url in DEPORTES:

              noticias.extend(
                  leer_deportes(
                      subcategoria,
                      url
                  )
              )


          # Entretenimiento

          for subcategoria, url in ENTRETENIMIENTO:

              noticias.extend(
                  leer_entretenimiento(
                      subcategoria,
                      url
                  )
              )


          print(
              "Noticias descargadas:",
              len(noticias)
          )


          # ============================================================
          # DEDUPLICAR NOTICIAS
          # ============================================================

          vistas_urls = set()
          vistas_titulos = set()

          limpias = []


          for noticia in noticias:

              url = noticia.get(
                  "url",
                  ""
              ).strip()


              titulo = (
                  noticia.get(
                      "titulo",
                      ""
                  )
                  .strip()
                  .lower()
              )


              if not url:
                  continue


              if url in vistas_urls:
                  continue


              if titulo in vistas_titulos:
                  continue


              vistas_urls.add(
                  url
              )

              vistas_titulos.add(
                  titulo
              )

              limpias.append(
                  noticia
              )


          noticias = limpias


          # ============================================================
          # BUSCAR IMÁGENES
          # ============================================================

          pendientes = [

              noticia

              for noticia in noticias

              if not noticia.get(
                  "imagen"
              )

          ]


          if len(pendientes) > MAX_BUSQUEDAS_IMAGEN:

              pendientes = pendientes[
                  :MAX_BUSQUEDAS_IMAGEN
              ]


          print(
              "Páginas a revisar para imágenes:",
              len(pendientes)
          )


          def buscar_imagen(noticia):

              imagenes = obtener_imagenes_pagina(
                  noticia["url"]
              )

              return (
                  noticia["url"],
                  imagenes
              )


          with ThreadPoolExecutor(
              max_workers=15
          ) as executor:

              tareas = [

                  executor.submit(
                      buscar_imagen,
                      noticia
                  )

                  for noticia in pendientes

              ]


              for futuro in as_completed(
                  tareas
              ):

                  try:

                      url, imagenes = (
                          futuro.result()
                      )


                      for noticia in noticias:

                          if (
                              noticia["url"]
                              ==
                              url
                          ):

                              if imagenes:

                                  noticia[
                                      "imagen"
                                  ] = imagenes[0]

                                  noticia[
                                      "imagenesAlternativas"
                                  ] = imagenes[1:]

                              break


                  except Exception as error:

                      print(
                          "Error:",
                          error
                      )


          # ============================================================
          # ELIMINAR IMÁGENES REPETIDAS
          # ============================================================

          imagenes_usadas = set()


          for noticia in noticias:

              imagen = (
                  noticia.get(
                      "imagen",
                      ""
                  )
                  or
                  ""
              ).strip()


              alternativas = noticia.get(
                  "imagenesAlternativas",
                  []
              )


              candidatos = []


              if imagen:
                  candidatos.append(
                      imagen
                  )


              if isinstance(
                  alternativas,
                  list
              ):

                  candidatos.extend(
                      alternativas
                  )


              imagen_final = ""


              for candidato in candidatos:

                  if not candidato:
                      continue


                  candidato = str(
                      candidato
                  ).strip()


                  base = candidato.split(
                      "?",
                      1
                  )[0].lower()


                  if not validar_imagen(
                      candidato
                  ):
                      continue


                  if base in imagenes_usadas:
                      continue


                  imagen_final = candidato

                  imagenes_usadas.add(
                      base
                  )

                  break


              noticia["imagen"] = (
                  imagen_final
              )


              # Ya no necesitamos mandar
              # las alternativas al navegador.

              noticia.pop(
                  "imagenesAlternativas",
                  None
              )


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          def fecha_segura(noticia):

              try:

                  return dateparser.parse(
                      noticia.get(
                          "fecha",
                          ""
                      )
                  )

              except:

                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )


          noticias.sort(
              key=fecha_segura,
              reverse=True
          )


          noticias = noticias[
              :MAX_NOTICIAS
          ]


          # ============================================================
          # ESTADÍSTICAS
          # ============================================================

          categorias = {}
          fuentes = {}
          deportes = {}

          con_imagen = 0
          sin_imagen = 0


          for noticia in noticias:

              categoria = noticia.get(
                  "categoria",
                  "Noticias"
              )


              fuente = noticia.get(
                  "fuente",
                  "Desconocida"
              )


              categorias[categoria] = (
                  categorias.get(
                      categoria,
                      0
                  ) + 1
              )


              fuentes[fuente] = (
                  fuentes.get(
                      fuente,
                      0
                  ) + 1
              )


              if categoria == "Deportes":

                  deporte = noticia.get(
                      "subcategoria",
                      "Otros"
                  )


                  deportes[deporte] = (
                      deportes.get(
                          deporte,
                          0
                      ) + 1
                  )


              if noticia.get(
                  "imagen"
              ):

                  con_imagen += 1

              else:

                  sin_imagen += 1


          # ============================================================
          # JSON FINAL
          # ============================================================

          datos = {

              "actualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "fuente":
                  "Expansión + Life & Style",

              "total":
                  len(noticias),

              "imagenes": {

                  "con_imagen":
                      con_imagen,

                  "sin_imagen":
                      sin_imagen
              },

              "categorias":
                  categorias,

              "deportes":
                  deportes,

              "fuentes":
                  fuentes,

              "noticias":
                  noticias
          }


          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  datos,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # RESULTADO
          # ============================================================

          print("")
          print("======================================")
          print(" ACTUALIZACIÓN TERMINADA")
          print("======================================")

          print(
              "Noticias:",
              len(noticias)
          )

          print(
              "Con imagen:",
              con_imagen
          )

          print(
              "Sin imagen:",
              sin_imagen
          )

          print(
              "Categorías:",
              categorias
          )

          print(
              "Deportes:",
              deportes
          )

          print("======================================")


          PY


      - name: Ejecutar actualizador
        run: |
          python actualizar_noticias.py


