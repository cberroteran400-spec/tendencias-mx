name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 python-dateutil

      - name: Crear actualizador de noticias
        run: |
          cat > actualizar_noticias.py <<'PY'
          import json
          import re
          import time
          from datetime import datetime, timezone
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urlparse, parse_qs, unquote

          import feedparser
          import requests
          from bs4 import BeautifulSoup
          from dateutil import parser as dateparser


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          MAX_NOTICIAS = 5000
          MAX_IMAGENES_A_BUSCAR = 1200
          TIMEOUT = 12

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Safari/537.36"
              ),
              "Accept-Language": "es-MX,es;q=0.9,en;q=0.8",
          }


          # ============================================================
          # FUENTES OFICIALES DE EXPANSIÓN
          # ============================================================

          FUENTES = [
              {
                  "nombre": "Expansión - Portada",
                  "url": "https://expansion.mx/rss",
                  "categoria": "Noticias",
              },
              {
                  "nombre": "Expansión - Mundo",
                  "url": "https://expansion.mx/rss/internacional",
                  "categoria": "Mundo",
              },
              {
                  "nombre": "Expansión - Economía",
                  "url": "https://expansion.mx/rss/economia",
                  "categoria": "Dinero",
              },
              {
                  "nombre": "Expansión - Tecnología",
                  "url": "https://expansion.mx/rss/tecnologia",
                  "categoria": "Tecnología",
              },
              {
                  "nombre": "Expansión - Tendencias",
                  "url": "https://expansion.mx/rss/tendencias",
                  "categoria": "Tendencias",
              },
              {
                  "nombre": "Expansión - Empresas",
                  "url": "https://expansion.mx/rss/empresas",
                  "categoria": "Dinero",
              },
              {
                  "nombre": "Expansión - Política",
                  "url": "https://expansion.mx/rss/politica",
                  "categoria": "Política",
              },
          ]


          # ============================================================
          # DEPORTES
          #
          # Life & Style tiene una sección real de Deportes.
          # Usamos Google News RSS para encontrar únicamente artículos
          # que apunten a esa sección.
          # ============================================================

          DEPORTES = [
              (
                  "Fútbol",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+futbol"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "Liga MX",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+%22Liga+MX%22"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "NFL",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+NFL"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "Fórmula 1",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+%22Formula+1%22"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "Boxeo",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+boxeo"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "Tenis",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+tenis"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "Básquetbol",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+basquetbol"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "Béisbol",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+beisbol"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "Motor",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx%2Fdeportes+automovilismo"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
          ]


          # ============================================================
          # ENTRETENIMIENTO
          # ============================================================

          ENTRETENIMIENTO = [
              (
                  "Entretenimiento",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx+entretenimiento"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "Cine",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx+cine"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "Series",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx+series+Netflix"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
              (
                  "Música",
                  "https://news.google.com/rss/search?"
                  "q=site%3Alifeandstyle.expansion.mx+musica"
                  "&hl=es-419&gl=MX&ceid=MX%3Aes-419"
              ),
          ]


          # ============================================================
          # SESIÓN HTTP
          # ============================================================

          session = requests.Session()
          session.headers.update(HEADERS)


          # ============================================================
          # FUNCIONES
          # ============================================================

          def limpiar_html(texto):
              if not texto:
                  return ""

              soup = BeautifulSoup(texto, "html.parser")

              for tag in soup(["script", "style"]):
                  tag.decompose()

              texto = soup.get_text(" ", strip=True)
              texto = re.sub(r"\s+", " ", texto)

              return texto.strip()


          def limpiar_url(url):
              if not url:
                  return ""

              url = url.strip()

              # Google News puede envolver la URL original
              if "news.google.com" in url:
                  parsed = urlparse(url)
                  qs = parse_qs(parsed.query)

                  for clave in ["url", "u", "q"]:
                      if clave in qs and qs[clave]:
                          posible = unquote(qs[clave][0])

                          if posible.startswith("http"):
                              return posible

              return url


          def extraer_imagen_feed(entry):
              posibles = []

              # media_content
              media_content = entry.get("media_content", [])

              if isinstance(media_content, list):
                  for item in media_content:
                      if isinstance(item, dict):
                          for clave in ["url", "href"]:
                              valor = item.get(clave)

                              if valor:
                                  posibles.append(valor)

              # media_thumbnail
              media_thumbnail = entry.get("media_thumbnail", [])

              if isinstance(media_thumbnail, list):
                  for item in media_thumbnail:
                      if isinstance(item, dict):
                          valor = item.get("url")

                          if valor:
                              posibles.append(valor)

              # enclosures
              enclosures = entry.get("enclosures", [])

              if isinstance(enclosures, list):
                  for item in enclosures:
                      if isinstance(item, dict):
                          valor = item.get("href") or item.get("url")

                          if valor:
                              posibles.append(valor)

              # campos personalizados
              for clave in [
                  "image",
                  "image_url",
                  "imagen",
                  "thumbnail",
                  "featured_image",
              ]:
                  valor = entry.get(clave)

                  if isinstance(valor, str) and valor:
                      posibles.append(valor)

              # HTML del resumen
              html = (
                  entry.get("summary")
                  or entry.get("description")
                  or ""
              )

              if html:
                  soup = BeautifulSoup(html, "html.parser")

                  img = soup.find("img")

                  if img:
                      src = (
                          img.get("src")
                          or img.get("data-src")
                          or img.get("data-original")
                      )

                      if src:
                          posibles.append(src)

              for url in posibles:
                  if es_imagen_valida(url):
                      return url.strip()

              return ""


          def es_imagen_valida(url):
              if not url:
                  return False

              url = str(url).strip()

              if not url.startswith(("http://", "https://")):
                  return False

              url_lower = url.lower()

              extensiones = [
                  ".jpg",
                  ".jpeg",
                  ".png",
                  ".webp",
                  ".gif",
                  ".avif",
              ]

              if any(ext in url_lower for ext in extensiones):
                  return True

              dominios_imagen = [
                  "image",
                  "images",
                  "img",
                  "media",
                  "photo",
                  "foto",
                  "cdn",
                  "cloudfront",
                  "cloudinary",
              ]

              return any(x in url_lower for x in dominios_imagen)


          def extraer_imagen_pagina(url):
              """
              Busca la imagen real de la noticia.

              Prioridad:
              1. og:image
              2. twitter:image
              3. meta image
              4. imagen principal del HTML
              """

              if not url:
                  return ""

              try:
                  respuesta = session.get(
                      url,
                      timeout=TIMEOUT,
                      allow_redirects=True,
                  )

                  if respuesta.status_code != 200:
                      return ""

                  contenido = respuesta.text

                  soup = BeautifulSoup(contenido, "html.parser")

                  # --------------------------------------------
                  # Open Graph
                  # --------------------------------------------

                  for selector in [
                      ("meta", {"property": "og:image"}),
                      ("meta", {"property": "og:image:url"}),
                      ("meta", {"name": "og:image"}),
                      ("meta", {"name": "twitter:image"}),
                      ("meta", {"name": "twitter:image:src"}),
                  ]:
                      meta = soup.find(*selector)

                      if meta:
                          imagen = meta.get("content")

                          if imagen:
                              imagen = imagen.strip()

                              if imagen.startswith("//"):
                                  imagen = "https:" + imagen

                              if imagen.startswith("/"):
                                  dominio = (
                                      f"{urlparse(respuesta.url).scheme}://"
                                      f"{urlparse(respuesta.url).netloc}"
                                  )

                                  imagen = dominio + imagen

                              if es_imagen_valida(imagen):
                                  return imagen

                  # --------------------------------------------
                  # Buscar imágenes principales
                  # --------------------------------------------

                  candidatos = []

                  for img in soup.find_all("img"):
                      src = (
                          img.get("src")
                          or img.get("data-src")
                          or img.get("data-lazy-src")
                          or img.get("data-original")
                      )

                      if not src:
                          continue

                      src = src.strip()

                      if src.startswith("//"):
                          src = "https:" + src

                      elif src.startswith("/"):
                          dominio = (
                              f"{urlparse(respuesta.url).scheme}://"
                              f"{urlparse(respuesta.url).netloc}"
                          )

                          src = dominio + src

                      if not src.startswith("http"):
                          continue

                      # Ignorar logos, iconos y sprites
                      src_lower = src.lower()

                      palabras_excluir = [
                          "logo",
                          "icon",
                          "favicon",
                          "sprite",
                          "avatar",
                          "ads",
                          "advert",
                          "pixel",
                          "tracking",
                      ]

                      if any(p in src_lower for p in palabras_excluir):
                          continue

                      ancho = img.get("width")

                      try:
                          ancho_num = int(ancho) if ancho else 0
                      except:
                          ancho_num = 0

                      # Priorizar imágenes grandes
                      if ancho_num >= 500:
                          return src

                      candidatos.append(src)

                  if candidatos:
                      return candidatos[0]

              except Exception:
                  return ""

              return ""


          def obtener_imagen(noticia):
              """
              Obtiene imagen real.
              Primero RSS.
              Después página original.
              """

              imagen = noticia.get("imagen", "")

              if imagen and es_imagen_valida(imagen):
                  return imagen

              url = noticia.get("url", "")

              if not url:
                  return ""

              return extraer_imagen_pagina(url)


          def fecha_noticia(entry):
              campos = [
                  "published",
                  "updated",
                  "created",
                  "date",
              ]

              for campo in campos:
                  valor = entry.get(campo)

                  if valor:
                      try:
                          fecha = dateparser.parse(valor)

                          if fecha.tzinfo is None:
                              fecha = fecha.replace(tzinfo=timezone.utc)

                          return fecha.isoformat()

                      except:
                          pass

              # Fechas RSS en formato struct_time
              for campo in ["published_parsed", "updated_parsed"]:
                  valor = entry.get(campo)

                  if valor:
                      try:
                          fecha = datetime(
                              *valor[:6],
                              tzinfo=timezone.utc
                          )

                          return fecha.isoformat()

                      except:
                          pass

              return datetime.now(timezone.utc).isoformat()


          def categoria_deporte(titulo, descripcion, categoria_base):
              """
              Clasifica únicamente dentro de Deportes.
              No cambia noticias generales.
              """

              texto = (
                  f"{titulo} {descripcion}"
              ).lower()

              reglas = [
                  (
                      "NFL",
                      [
                          "nfl",
                          "super bowl",
                          "superbowl",
                          "quarterback",
                          "touchdown",
                          "49ers",
                          "chiefs",
                          "seahawks",
                          "cowboys",
                          "patriots",
                          "eagles",
                      ],
                  ),
                  (
                      "Fórmula 1",
                      [
                          "fórmula 1",
                          "formula 1",
                          "f1",
                          "gran premio",
                          "gp de ",
                          "verstappen",
                          "checo pérez",
                          "checo perez",
                          "mclaren",
                          "ferrari",
                          "mercedes",
                          "aston martin",
                          "red bull racing",
                          "lando norris",
                          "george russell",
                      ],
                  ),
                  (
                      "Liga MX",
                      [
                          "liga mx",
                          "américa",
                          "club américa",
                          "chivas",
                          "cruz azul",
                          "pumas",
                          "tigres",
                          "monterrey",
                          "rayados",
                          "toluca",
                          "pachuca",
                          "santos laguna",
                          "necaxa",
                          "atlas",
                      ],
                  ),
                  (
                      "Boxeo",
                      [
                          "boxeo",
                          "boxeador",
                          "peleador",
                          "pelea",
                          "ring",
                          "canelo",
                          "peso ligero",
                          "peso welter",
                          "peso pesado",
                      ],
                  ),
                  (
                      "Tenis",
                      [
                          "tenis",
                          "wimbledon",
                          "us open",
                          "roland garros",
                          "australian open",
                          "atp",
                          "wta",
                          "alcaraz",
                          "djokovic",
                          "nadal",
                          "sinner",
                      ],
                  ),
                  (
                      "Básquetbol",
                      [
                          "básquetbol",
                          "basquetbol",
                          "nba",
                          "basketball",
                          "lakers",
                          "warriors",
                          "celtics",
                          "bulls",
                      ],
                  ),
                  (
                      "Béisbol",
                      [
                          "béisbol",
                          "beisbol",
                          "mlb",
                          "home run",
                          "jonrón",
                          "jonron",
                          "pitcher",
                          "diablos rojos",
                          "yankees",
                          "dodgers",
                      ],
                  ),
                  (
                      "Motor",
                      [
                          "automovilismo",
                          "nascar",
                          "indycar",
                          "rally",
                          "motociclismo",
                          "moto gp",
                          "motogp",
                      ],
                  ),
                  (
                      "Fútbol",
                      [
                          "fútbol",
                          "futbol",
                          "soccer",
                          "premier league",
                          "champions league",
                          "uefa",
                          "la liga",
                          "real madrid",
                          "barcelona",
                          "manchester city",
                          "manchester united",
                          "liverpool",
                          "arsenal",
                          "chelsea",
                      ],
                  ),
              ]

              for categoria, palabras in reglas:
                  for palabra in palabras:
                      if palabra in texto:
                          return categoria

              return categoria_base or "Deportes"


          def es_deportes_real(url, titulo, descripcion):
              """
              Evita que artículos generales terminen dentro de Deportes.
              """

              url = (url or "").lower()

              texto = (
                  f"{titulo} {descripcion}"
              ).lower()

              # La fuente ideal de deportes
              if "/deportes/" in url:
                  return True

              if "lifeandstyle.expansion.mx/deportes" in url:
                  return True

              # Si Google News perdió la URL original,
              # usamos palabras deportivas fuertes.
              palabras_fuertes = [
                  "nfl",
                  "super bowl",
                  "liga mx",
                  "fórmula 1",
                  "formula 1",
                  "gran premio",
                  "boxeo",
                  "tenis",
                  "nba",
                  "mlb",
                  "premier league",
                  "champions league",
                  "futbol",
                  "fútbol",
                  "checo pérez",
                  "checo perez",
              ]

              return any(p in texto for p in palabras_fuertes)


          def procesar_fuente_rss(fuente):
              noticias = []

              try:
                  feed = feedparser.parse(fuente["url"])

                  for entry in feed.entries:
                      titulo = limpiar_html(
                          entry.get("title", "")
                      )

                      if not titulo:
                          continue

                      url = limpiar_url(
                          entry.get("link", "")
                      )

                      if not url:
                          continue

                      descripcion = limpiar_html(
                          entry.get("summary", "")
                          or entry.get("description", "")
                      )

                      imagen = extraer_imagen_feed(entry)

                      noticia = {
                          "titulo": titulo,
                          "descripcion": descripcion[:600],
                          "url": url,
                          "imagen": imagen,
                          "categoria": fuente["categoria"],
                          "subcategoria": "",
                          "fuente": fuente["nombre"],
                          "fecha": fecha_noticia(entry),
                      }

                      noticias.append(noticia)

              except Exception as error:
                  print(
                      f"Error en {fuente['nombre']}: {error}"
                  )

              return noticias


          def procesar_google_news(nombre_categoria, rss_url):
              noticias = []

              try:
                  feed = feedparser.parse(rss_url)

                  for entry in feed.entries:
                      titulo = limpiar_html(
                          entry.get("title", "")
                      )

                      if not titulo:
                          continue

                      url = limpiar_url(
                          entry.get("link", "")
                      )

                      descripcion = limpiar_html(
                          entry.get("summary", "")
                          or entry.get("description", "")
                      )

                      # Google News puede dejar una URL intermedia.
                      if not es_deportes_real(
                          url,
                          titulo,
                          descripcion,
                      ):
                          continue

                      imagen = extraer_imagen_feed(entry)

                      noticia = {
                          "titulo": titulo,
                          "descripcion": descripcion[:600],
                          "url": url,
                          "imagen": imagen,
                          "categoria": "Deportes",
                          "subcategoria": nombre_categoria,
                          "fuente": "Expansión - Deportes",
                          "fecha": fecha_noticia(entry),
                      }

                      noticias.append(noticia)

              except Exception as error:
                  print(
                      f"Error deportes {nombre_categoria}: {error}"
                  )

              return noticias


          def procesar_entretenimiento(nombre_categoria, rss_url):
              noticias = []

              try:
                  feed = feedparser.parse(rss_url)

                  for entry in feed.entries:
                      titulo = limpiar_html(
                          entry.get("title", "")
                      )

                      if not titulo:
                          continue

                      url = limpiar_url(
                          entry.get("link", "")
                      )

                      if not url:
                          continue

                      descripcion = limpiar_html(
                          entry.get("summary", "")
                          or entry.get("description", "")
                      )

                      imagen = extraer_imagen_feed(entry)

                      noticia = {
                          "titulo": titulo,
                          "descripcion": descripcion[:600],
                          "url": url,
                          "imagen": imagen,
                          "categoria": "Entretenimiento",
                          "subcategoria": nombre_categoria,
                          "fuente": "Expansión - Life & Style",
                          "fecha": fecha_noticia(entry),
                      }

                      noticias.append(noticia)

              except Exception as error:
                  print(
                      f"Error entretenimiento "
                      f"{nombre_categoria}: {error}"
                  )

              return noticias


          # ============================================================
          # DESCARGAR TODAS LAS FUENTES
          # ============================================================

          todas = []

          print("==============================================")
          print("DESCARGANDO RSS DE EXPANSIÓN")
          print("==============================================")


          for fuente in FUENTES:
              print(
                  f"Procesando: {fuente['nombre']}"
              )

              resultado = procesar_fuente_rss(
                  fuente
              )

              todas.extend(resultado)

              print(
                  f"  -> {len(resultado)} noticias"
              )


          print("")
          print("==============================================")
          print("DESCARGANDO DEPORTES")
          print("==============================================")


          for nombre, url in DEPORTES:
              print(
                  f"Procesando Deportes: {nombre}"
              )

              resultado = procesar_google_news(
                  nombre,
                  url
              )

              todas.extend(resultado)

              print(
                  f"  -> {len(resultado)} noticias"
              )


          print("")
          print("==============================================")
          print("DESCARGANDO ENTRETENIMIENTO")
          print("==============================================")


          for nombre, url in ENTRETENIMIENTO:
              print(
                  f"Procesando Entretenimiento: {nombre}"
              )

              resultado = procesar_entretenimiento(
                  nombre,
                  url
              )

              todas.extend(resultado)

              print(
                  f"  -> {len(resultado)} noticias"
              )


          # ============================================================
          # ELIMINAR DUPLICADOS
          # ============================================================

          unicas = []
          urls_vistas = set()
          titulos_vistos = set()

          for noticia in todas:

              url = noticia.get("url", "").strip()
              titulo = noticia.get("titulo", "").strip().lower()

              if not url or not titulo:
                  continue

              if url in urls_vistas:
                  continue

              if titulo in titulos_vistos:
                  continue

              urls_vistas.add(url)
              titulos_vistos.add(titulo)

              unicas.append(noticia)


          print("")
          print(
              f"Noticias únicas antes de imágenes: "
              f"{len(unicas)}"
          )


          # ============================================================
          # DESCARGAR IMÁGENES REALES
          #
          # Solo entramos a la página cuando el RSS no trae imagen.
          # Se hace en paralelo para que GitHub Actions no tarde
          # demasiado.
          # ============================================================

          pendientes = [
              noticia
              for noticia in unicas
              if not noticia.get("imagen")
          ]

          print("")
          print(
              f"Noticias que necesitan buscar imagen: "
              f"{len(pendientes)}"
          )


          if len(pendientes) > MAX_IMAGENES_A_BUSCAR:
              pendientes = pendientes[
                  :MAX_IMAGENES_A_BUSCAR
              ]


          print(
              f"Se buscarán imágenes para: "
              f"{len(pendientes)} noticias"
          )


          def buscar_imagen_noticia(noticia):
              imagen = obtener_imagen(noticia)

              return (
                  noticia.get("url", ""),
                  imagen
              )


          if pendientes:

              with ThreadPoolExecutor(
                  max_workers=12
              ) as executor:

                  tareas = [
                      executor.submit(
                          buscar_imagen_noticia,
                          noticia
                      )
                      for noticia in pendientes
                  ]

                  completadas = 0

                  for futuro in as_completed(tareas):

                      try:
                          url, imagen = futuro.result()

                          if imagen:
                              for noticia in unicas:

                                  if noticia.get("url") == url:
                                      noticia["imagen"] = imagen
                                      break

                      except Exception:
                          pass

                      completadas += 1

                      if completadas % 50 == 0:
                          print(
                              f"Imágenes procesadas: "
                              f"{completadas}/"
                              f"{len(pendientes)}"
                          )


          # ============================================================
          # LIMPIAR IMÁGENES INVÁLIDAS
          # ============================================================

          for noticia in unicas:

              imagen = noticia.get("imagen", "")

              if imagen and not es_imagen_valida(imagen):
                  noticia["imagen"] = ""


          # ============================================================
          # EVITAR IMÁGENES REPETIDAS
          #
          # Si dos noticias terminan con EXACTAMENTE la misma imagen,
          # conservamos la primera y quitamos la repetida.
          #
          # Así deportes.html podrá mostrar su propio fallback
          # solamente en los casos donde realmente no haya otra imagen.
          # ============================================================

          imagenes_vistas = set()

          for noticia in unicas:

              imagen = noticia.get("imagen", "").strip()

              if not imagen:
                  continue

              imagen_normalizada = imagen.split("?")[0].lower()

              if imagen_normalizada in imagenes_vistas:

                  noticia["imagen"] = ""

              else:

                  imagenes_vistas.add(
                      imagen_normalizada
                  )


          # ============================================================
          # CORREGIR CATEGORÍAS DE DEPORTES
          # ============================================================

          for noticia in unicas:

              if noticia.get("categoria") == "Deportes":

                  noticia["subcategoria"] = (
                      categoria_deporte(
                          noticia.get("titulo", ""),
                          noticia.get("descripcion", ""),
                          noticia.get("subcategoria", "")
                      )
                  )


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          def fecha_sort(noticia):

              try:
                  return dateparser.parse(
                      noticia.get("fecha", "")
                  )
              except:
                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )


          unicas.sort(
              key=fecha_sort,
              reverse=True
          )


          # ============================================================
          # LIMITE DE SEGURIDAD
          # ============================================================

          unicas = unicas[:MAX_NOTICIAS]


          # ============================================================
          # ESTADÍSTICAS
          # ============================================================

          categorias = {}

          fuentes = {}

          imagenes_ok = 0
          imagenes_faltantes = 0

          for noticia in unicas:

              categoria = noticia.get(
                  "categoria",
                  "Noticias"
              )

              fuente = noticia.get(
                  "fuente",
                  "Desconocida"
              )

              categorias[categoria] = (
                  categorias.get(categoria, 0) + 1
              )

              fuentes[fuente] = (
                  fuentes.get(fuente, 0) + 1
              )

              if noticia.get("imagen"):
                  imagenes_ok += 1
              else:
                  imagenes_faltantes += 1


          # ============================================================
          # GENERAR JSON
          # ============================================================

          resultado = {
              "actualizado": datetime.now(
                  timezone.utc
              ).isoformat(),

              "fuente": (
                  "Expansión + Life & Style + "
                  "RSS complementarios"
              ),

              "total": len(unicas),

              "imagenes": {
                  "con_imagen": imagenes_ok,
                  "sin_imagen": imagenes_faltantes,
              },

              "categorias": categorias,

              "fuentes": fuentes,

              "noticias": unicas,
          }


          # ============================================================
          # GUARDAR
          # ============================================================

          with open(
              "noticias.json",
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  resultado,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          print("")
          print("==============================================")
          print("ACTUALIZACIÓN TERMINADA")
          print("==============================================")
          print(
              f"Total noticias: {len(unicas)}"
          )
          print(
              f"Con imagen real: {imagenes_ok}"
          )
          print(
              f"Sin imagen: {imagenes_faltantes}"
          )
          print("")
          print("CATEGORÍAS:")

          for categoria, cantidad in sorted(
              categorias.items()
          ):
              print(
                  f"  {categoria}: {cantidad}"
              )

          print("")
          print("==============================================")
          print("LISTO")
          print("==============================================")
          PY

      - name: Ejecutar actualizador
        run: |
          python actualizar_noticias.py

      - name: Revisar resultado
        run: |
          echo "===== RESUMEN noticias.json ====="
          python - <<'PY'
          import json

          with open(
              "noticias.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Total:",
              data.get("total")
          )

          print(
              "Imágenes:",
              data.get("imagenes")
          )

          print(
              "Categorías:",
              data.get("categorias")
          )
          PY

      - name: Guardar noticias actualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "No hubo cambios en noticias.json"
          else
            git commit -m "Actualizar noticias e imágenes"
            git push
          fi