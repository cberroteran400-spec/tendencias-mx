name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Crear noticias.json desde múltiples RSS
        run: |
          python - <<'PY'

          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          import html
          import unicodedata

          from datetime import datetime, timezone
          from urllib.parse import urljoin


          # ============================================================
          # FUENTES RSS
          # ============================================================

          FUENTES_RSS = [

              {
                  "url": "https://expansion.mx/rss",
                  "categoria": "general"
              },

              {
                  "url": "https://expansion.mx/rss/internacional",
                  "categoria": "mundo"
              },

              {
                  "url": "https://expansion.mx/rss/economia",
                  "categoria": "economia"
              },

              {
                  "url": "https://expansion.mx/rss/tecnologia",
                  "categoria": "tecnologia"
              },

              {
                  "url": "https://expansion.mx/rss/tendencias",
                  "categoria": "tendencias"
              },

              {
                  "url": "https://expansion.mx/rss/empresas",
                  "categoria": "empresas"
              },

              {
                  "url": "https://expansion.mx/rss/politica",
                  "categoria": "politica"
              }

          ]


          # ============================================================
          # CANTIDAD MÁXIMA
          #
          # Subimos de 100 a 150 para tener más variedad.
          # ============================================================

          MAX_NOTICIAS = 150


          # ============================================================
          # DESCARGAR RSS
          # ============================================================

          def descargar_rss(url):

              print("")
              print("======================================")
              print("Descargando RSS:")
              print(url)
              print("======================================")

              try:

                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                              "Mozilla/5.0 (compatible; TendenciaMX/1.0)"
                      }
                  )

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      return response.read()

              except Exception as error:

                  print(
                      "ERROR RSS:",
                      url,
                      error
                  )

                  return None


          # ============================================================
          # LIMPIAR HTML
          # ============================================================

          def limpiar_html(texto):

              if not texto:
                  return ""

              texto = html.unescape(texto)

              texto = re.sub(
                  r"<script[^>]*>.*?</script>",
                  "",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<style[^>]*>.*?</style>",
                  "",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<[^>]+>",
                  "",
                  texto
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ============================================================
          # OBTENER TAG XML
          # ============================================================

          def obtener_tag(item, nombre):

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  if tag.lower() == nombre.lower():

                      if elemento.text:
                          return elemento.text.strip()

              return ""


          # ============================================================
          # OBTENER IMAGEN
          # ============================================================

          def obtener_imagen(item, rss_url):

              # Primero buscamos atributos de imagen.

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  tag = tag.lower()

                  if tag in [
                      "content",
                      "thumbnail",
                      "enclosure",
                      "image",
                      "media"
                  ]:

                      for atributo in [
                          "url",
                          "href",
                          "src"
                      ]:

                          url = elemento.attrib.get(
                              atributo,
                              ""
                          ).strip()

                          if url:

                              if url.startswith("//"):
                                  url = "https:" + url

                              return urljoin(
                                  rss_url,
                                  url
                              )


              # Si no encontramos imagen,
              # buscamos <img> dentro de description/content.

              for elemento in item.iter():

                  tag = elemento.tag

                  if "}" in tag:
                      tag = tag.split("}", 1)[1]

                  tag = tag.lower()

                  if tag in [
                      "description",
                      "encoded",
                      "content"
                  ]:

                      contenido = elemento.text or ""


                      resultado = re.search(
                          r'<img[^>]+src=["\']([^"\']+)["\']',
                          contenido,
                          re.I
                      )

                      if resultado:

                          url = html.unescape(
                              resultado.group(1)
                          ).strip()

                          if url.startswith("//"):
                              url = "https:" + url

                          return urljoin(
                              rss_url,
                              url
                          )


                      resultado = re.search(
                          r'<img[^>]+data-src=["\']([^"\']+)["\']',
                          contenido,
                          re.I
                      )

                      if resultado:

                          url = html.unescape(
                              resultado.group(1)
                          ).strip()

                          if url.startswith("//"):
                              url = "https:" + url

                          return urljoin(
                              rss_url,
                              url
                          )


              return ""


          # ============================================================
          # NORMALIZAR TEXTO
          #
          # México -> mexico
          # Fútbol -> futbol
          # Selección -> seleccion
          # ============================================================

          def normalizar(texto):

              texto = str(texto or "").lower()

              texto = unicodedata.normalize(
                  "NFD",
                  texto
              )

              texto = "".join(
                  caracter
                  for caracter in texto
                  if unicodedata.category(caracter) != "Mn"
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          # ============================================================
          # PALABRAS DE FÚTBOL
          #
          # Se usan términos específicos.
          # Evitamos depender solamente de "partido".
          # ============================================================

          FUTBOL_TERMS = [

              "futbol",
              "futbolista",
              "futbolistas",
              "futbol mexicano",
              "futbol mexicano",

              "liga mx",
              "liga bbva mx",
              "liga mexicana",

              "america",
