              "pt",
              "pvem",
              "mc",

              "oposicion",

              "reforma",

              "ley",

              "decreto",

              "secretaria",
              "secretario",

              "candidato",
              "candidata",

              "campana",

              "partido politico",

              "sheinbaum",
              "claudia sheinbaum",

              "trump",
              "donald trump",

              "biden",
              "joe biden",

              "xi jinping",

              "putin",
              "vladimir putin",

              "zelensky",
              "zelenski",

              "macron",
              "emmanuel macron",

              "milei",
              "javier milei",

              "presidente de mexico",
              "presidenta de mexico",

              "presidente de estados unidos"

          ]


          # ============================================================
          # TECNOLOGÍA
          # ============================================================

          TECNOLOGIA_TERMS = [

              "tecnologia",
              "inteligencia artificial",
              "ia generativa",
              "chatgpt",
              "openai",

              "google",
              "apple",
              "iphone",
              "android",
              "samsung",
              "microsoft",

              "meta",
              "facebook",
              "instagram",
              "whatsapp",
              "tiktok",

              "internet",
              "software",

              "aplicacion",
              "aplicaciones",

              "smartphone",
              "computadora",

              "robot",
              "robotica",

              "ciberseguridad",

              "videojuego",
              "videojuegos",

              "nvidia",

              "chip",
              "chips"

          ]


          # ============================================================
          # ECONOMÍA
          # ============================================================

          ECONOMIA_TERMS = [

              "economia",

              "finanzas",
              "financiero",
              "financiera",

              "dolar",

              "peso mexicano",

              "inflacion",

              "banxico",

              "banco de mexico",

              "bolsa",

              "acciones",

              "mercado",
              "mercados",

              "empleo",
              "desempleo",

              "salario",
              "salarios",

              "impuesto",
              "impuestos",

              "negocio",
              "negocios",

              "empresa",
              "empresas",

              "petroleo",

              "gasolina",

              "inversion",
              "inversiones",

              "creditos",
              "credito",

              "hipoteca",

              "tasas de interes",

              "t-mec",
              "tmec"

          ]


          # ============================================================
          # ENTRETENIMIENTO
          # ============================================================

          ENTRETENIMIENTO_TERMS = [

              "actor",
              "actriz",

              "cantante",
              "cantantes",

              "celebridad",
              "celebridades",

              "famoso",
              "famosa",
              "famosos",

              "artista",
              "artistas",

              "pelicula",
              "peliculas",

              "serie",
              "series",

              "netflix",

              "hollywood",

              "cine",

              "television",

              "musica",

              "album",

              "cancion",

              "concierto",
              "conciertos",

              "festival",

              "premios",

              "espectaculo",
              "espectaculos",

              "entretenimiento",

              "reality",

              "mtv",

              "grammy",
              "oscar",
              "emmy"

          ]


          # ============================================================
          # FUNCIÓN AUXILIAR
          # ============================================================

          def contiene_alguno(texto, lista):

              return any(
                  termino in texto
                  for termino in lista
              )


          # ============================================================
          # CLASIFICACIÓN PRINCIPAL
          #
          # ORDEN IMPORTANTE:
          #
          # 1. Política
          # 2. Economía
          # 3. Tecnología
          # 4. Fútbol
          # 5. Otros deportes
          # 6. Entretenimiento
          # 7. Mundo
          # 8. México
          #
          # Así evitamos que una noticia política
          # termine accidentalmente como deportes.
          # ============================================================

          def clasificar_noticia(
              titulo,
              descripcion,
              enlace,
              categoria_fuente
          ):

              titulo_n = normalizar(titulo)

              descripcion_n = normalizar(
                  descripcion
              )

              enlace_n = normalizar(
                  enlace
              )

              texto = (
                  titulo_n
                  + " "
                  + descripcion_n
                  + " "
                  + enlace_n
              )


              # --------------------------------------------------------
              # POLÍTICA
              # --------------------------------------------------------

              if categoria_fuente == "politica":

                  return "politica"


              # --------------------------------------------------------
              # MUNDO
              # --------------------------------------------------------

              if categoria_fuente == "mundo":

                  # Si el artículo internacional es claramente
                  # una noticia de fútbol, lo dejamos como deportes.

                  if contiene_alguno(
                      texto,
                      FUTBOL_TERMS
                  ):
                      return "deportes"

                  if contiene_alguno(
                      texto,
                      OTROS_DEPORTES_TERMS
                  ):
                      return "deportes"

                  return "mundo"


              # --------------------------------------------------------
              # ECONOMÍA
              # --------------------------------------------------------

              if categoria_fuente == "economia":

                  return "economia"


              # --------------------------------------------------------
              # TECNOLOGÍA
              # --------------------------------------------------------

              if categoria_fuente == "tecnologia":

                  return "tecnologia"


              # --------------------------------------------------------
              # EMPRESAS
              # --------------------------------------------------------

              if categoria_fuente == "empresas":

                  # Empresas relacionadas con fútbol pueden ser
                  # noticias deportivas.

                  if contiene_alguno(
                      texto,
                      FUTBOL_TERMS
                  ):
                      return "deportes"

                  return "economia"


              # --------------------------------------------------------
              # FÚTBOL
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  FUTBOL_TERMS
              ):

                  return "deportes"


              # --------------------------------------------------------
              # OTROS DEPORTES
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  OTROS_DEPORTES_TERMS
              ):

                  return "deportes"


              # --------------------------------------------------------
              # ENTRETENIMIENTO
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  ENTRETENIMIENTO_TERMS
              ):

                  return "entretenimiento"


              # --------------------------------------------------------
              # TENDENCIAS
              #
              # Tendencias puede contener contenido variado.
              # Primero intentamos clasificarlo por contenido.
              # --------------------------------------------------------

              if categoria_fuente == "tendencias":

                  if contiene_alguno(
                      texto,
                      FUTBOL_TERMS
                  ):
                      return "deportes"

                  if contiene_alguno(
                      texto,
                      OTROS_DEPORTES_TERMS
                  ):
                      return "deportes"

                  if contiene_alguno(
                      texto,
                      ENTRETENIMIENTO_TERMS
                  ):
                      return "entretenimiento"

                  if contiene_alguno(
                      texto,
                      TECNOLOGIA_TERMS
                  ):
                      return "tecnologia"

                  if contiene_alguno(
                      texto,
                      ECONOMIA_TERMS
                  ):
                      return "economia"


              # --------------------------------------------------------
              # TECNOLOGÍA POR CONTENIDO
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  TECNOLOGIA_TERMS
              ):

                  return "tecnologia"


              # --------------------------------------------------------
              # ECONOMÍA POR CONTENIDO
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  ECONOMIA_TERMS
              ):

                  return "economia"


              # --------------------------------------------------------
              # POLÍTICA POR CONTENIDO
              # --------------------------------------------------------

              if contiene_alguno(
                  texto,
                  POLITICA_TERMS
              ):

                  # Si claramente habla de política mexicana,
                  # usamos política.

                  if (
                      "mexico" in texto
                      or
                      "sheinbaum" in texto
                      or
                      "gobierno mexicano" in texto
                  ):

                      return "politica"

                  # Presidentes y gobiernos extranjeros
                  # quedan en Mundo.

                  if (
                      "trump" in texto
                      or
                      "biden" in texto
                      or
                      "putin" in texto
                      or
                      "xi jinping" in texto
                      or
                      "zelensky" in texto
                      or
                      "macron" in texto
                      or
                      "milei" in texto
                  ):

                      return "mundo"


              # --------------------------------------------------------
              # MUNDO POR CONTENIDO
              # --------------------------------------------------------

              MUNDO_TERMS = [

                  "estados unidos",
                  "eeuu",
                  "ee.uu",

                  "canada",
                  "espana",
                  "francia",
                  "alemania",
                  "italia",

                  "reino unido",
                  "inglaterra",

                  "rusia",
                  "ucrania",
                  "china",
                  "japon",

                  "india",
                  "brasil",
                  "argentina",
                  "colombia",
                  "chile",
                  "peru",
                  "venezuela",
                  "ecuador",
                  "bolivia",

                  "internacional",
                  "internacionales",

                  "onu",
                  "otan",

                  "casa blanca",

                  "guerra",
                  "conflicto"

              ]

              if contiene_alguno(
                  texto,
                  MUNDO_TERMS
              ):

                  return "mundo"


              # --------------------------------------------------------
              # MÉXICO
              # --------------------------------------------------------

              return "mexico"


          # ============================================================
          # DESCARGAR TODAS LAS FUENTES
          # ============================================================

          noticias = []


          for fuente_rss in FUENTES_RSS:

              rss_url = fuente_rss["url"]

              categoria_fuente = \
                  fuente_rss["categoria"]


              data = descargar_rss(
                  rss_url
              )


              if not data:
                  continue


              try:

                  root = ET.fromstring(
                      data
                  )

              except Exception as error:

                  print(
                      "ERROR XML:",
                      rss_url,
                      error
                  )

                  continue


              contador = 0


              for item in root.findall(
                  ".//item"
              ):

                  titulo = obtener_tag(
                      item,
                      "title"
                  )

                  enlace = obtener_tag(
                      item,
                      "link"
                  )

                  descripcion = obtener_tag(
                      item,
                      "description"
                  )

                  fecha = obtener_tag(
                      item,
                      "pubDate"
                  )


                  if (
                      not titulo
                      or
                      not enlace
                  ):

                      continue


                  descripcion_limpia = \
                      limpiar_html(
                          descripcion
                      )


                  imagen = obtener_imagen(
                      item,
                      rss_url
                  )


                  categoria = \
                      clasificar_noticia(
                          titulo,
                          descripcion_limpia,
                          enlace,
                          categoria_fuente
                      )


                  noticia = {

                      "titulo":
                          limpiar_html(
                              titulo
                          ),

                      "descripcion":
                          descripcion_limpia[:600],

                      "enlace":
                          enlace.strip(),

                      "fecha":
                          fecha.strip(),

                      "fuente":
                          "Expansión",

                      "categoria":
                          categoria,

                      "imagen":
                          imagen,

                      "rss":
                          categoria_fuente

                  }


                  noticias.append(
                      noticia
                  )

                  contador += 1


              print(
                  "Noticias obtenidas:",
                  contador
              )


          # ============================================================
          # ELIMINAR DUPLICADOS
          # ============================================================

          noticias_unicas = {}


          for noticia in noticias:

              enlace = noticia.get(
                  "enlace",
                  ""
              )


              if not enlace:
                  continue


              if enlace not in noticias_unicas:

                  noticias_unicas[
                      enlace
                  ] = noticia

              else:

                  existente = \
                      noticias_unicas[
                          enlace
                      ]


                  # Si la versión existente no tiene imagen
                  # pero esta sí, conservamos esta.

                  if (
                      not existente.get(
                          "imagen"
                      )
                      and
                      noticia.get(
                          "imagen"
                      )
                  ):

                      noticias_unicas[
                          enlace
                      ] = noticia


          noticias = list(
              noticias_unicas.values()
          )


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          noticias.sort(
              key=lambda noticia:
                  noticia.get(
                      "fecha",
                      ""
                  ),
              reverse=True
          )


          # ============================================================
          # LIMITAR RESULTADOS
          # ============================================================

          noticias = noticias[
              :MAX_NOTICIAS
          ]


          # ============================================================
          # CONTADORES
          # ============================================================

          conteo = {

              "mexico": 0,

              "politica": 0,

              "mundo": 0,

              "economia": 0,

              "deportes": 0,

              "entretenimiento": 0,

              "tecnologia": 0

          }


          imagenes = 0


          futbol_total = 0


          for noticia in noticias:

              categoria = \
                  noticia.get(
                      "categoria"
                  )


              if categoria in conteo:

                  conteo[
                      categoria
                  ] += 1


              if noticia.get(
                  "imagen"
              ):

                  imagenes += 1


              # Contamos fútbol dentro de Deportes
              # usando nuevamente términos específicos.

              texto_futbol = normalizar(
                  (
                      noticia.get(
                          "titulo",
                          ""
                      )
                      + " "
                      +
                      noticia.get(
                          "descripcion",
                          ""
                      )
                  )
              )


              if (
                  categoria == "deportes"
                  and
                  contiene_alguno(
                      texto_futbol,
                      FUTBOL_TERMS
                  )
              ):

                  futbol_total += 1


          # ============================================================
          # INFORMACIÓN DEL WORKFLOW
          # ============================================================

          print("")
          print("======================================")
          print("       TENDENCIAMX - RSS")
          print("======================================")

          print(
              "TOTAL:",
              len(noticias)
          )

