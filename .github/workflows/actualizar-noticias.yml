name: Actualizar con fotos reales
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser requests beautifulsoup4 lxml
      - run: |
          python3 << 'PY'
          import feedparser, requests, json
          from bs4 import BeautifulSoup
          from datetime import datetime, timezone

          RSS = "https://lifeandstyle.expansion.mx/rss"
          
          def get_foto(link):
              try:
                  r = requests.get(link, timeout=10, headers={"User-Agent":"Mozilla/5.0"})
                  s = BeautifulSoup(r.text, "lxml")
                  og = s.find("meta", property="og:image")
                  if og: return og.get("content")
              except: pass
              return f"https://picsum.photos/seed/{abs(hash(link))%100000}/600/400"

          feed = feedparser.parse(RSS)
          noticias=[]
          for e in feed.entries[:50]:
              link = e.link
              noticias.append({
                "titulo": e.title,
                "descripcion": BeautifulSoup(e.description, "lxml").get_text()[:180],
                "link": link,
                "categoria": "deportes",
                "imagen": get_foto(link)
              })
          json.dump({"actualizado": datetime.now(timezone.utc).isoformat(), "noticias": noticias}, open('noticias.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
      - run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add noticias.json
          git commit -m "fotos reales" || true
          git push
