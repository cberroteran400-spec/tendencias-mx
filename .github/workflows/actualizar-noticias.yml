          def clasificar_deporte(
              titulo,
              descripcion,
              subcategoria_original=""
          ):

              texto = (
                  titulo
                  + " "
                  + descripcion
              ).lower()

              # Primero revisamos las reglas específicas.

              for categoria, palabras in REGLAS_DEPORTES:

                  for palabra in palabras:

                      if palabra in texto:

                          return categoria

              # Si Google nos dio una búsqueda
              # específica pero el texto no contiene
              # una palabra exacta, conservamos
              # la categoría solicitada.

              permitidas = [
                  "Fútbol",
                  "Liga MX",
                  "NFL",
                  "Básquetbol",
                  "Béisbol",
                  "Tenis",
                  "Boxeo",
                  "Fórmula 1",
                  "Motor"
              ]

              if subcategoria_original in permitidas:

                  return subcategoria_original

              return "Otros"


          # ============================================================
          # LEER DEPORTES
          # ============================================================

          def leer_deporte(
              subcategoria,
              consulta
          ):

              resultado = []

              print(
                  "BUSCANDO DEPORTE:",
                  subcategoria,
                  "|",
                  consulta
              )

              try:

                  feed = feedparser.parse(
                      google_rss(
                          consulta
                      )
                  )

                  for entry in feed.entries[
                      :MAX_RESULTADOS_POR_BUSQUEDA
                  ]:

                      titulo = limpiar_html(
                          entry.get(
                              "title",
                              ""
                          )
                      )

                      link = obtener_url_original(
                          entry.get(
                              "link",
                              ""
                          )
                      )

                      if not titulo or not link:
                          continue

                      # SOLO DEPORTES REALES

                      if not es_articulo_deportivo(
                          link
                      ):
                          continue

                      descripcion = limpiar_html(
                          entry.get(
                              "summary",
                              ""
                          )
                          or
                          entry.get(
                              "description",
                              ""
                          )
                      )

                      categoria = clasificar_deporte(
                          titulo,
                          descripcion,
                          subcategoria
                      )

                      # No usamos "NFL" solo porque
                      # la búsqueda haya sido NFL.
                      #
                      # El artículo tiene que demostrar
                      # que pertenece a esa categoría.

                      texto = (
                          titulo
                          + " "
                          + descripcion
                      ).lower()

                      # Evitar falsos positivos muy claros.

                      if categoria == "NFL":

                          if not any(
                              palabra in texto
                              for palabra in [
                                  "nfl",
                                  "super bowl",
                                  "touchdown",
                                  "quarterback",
                                  "49ers",
                                  "chiefs",
                                  "cowboys",
                                  "bills",
                                  "ravens",
                                  "eagles",
                                  "packers",
                                  "steelers",
                                  "dolphins",
                                  "broncos",
                                  "seahawks",
                                  "vikings",
                                  "patriots",
                                  "lions",
                                  "bengals",
                                  "jets",
                                  "bears",
                                  "chargers",
                                  "texans",
                                  "buccaneers",
                                  "futbol americano"
                              ]
                          ):

                              continue

                      imagen = imagen_desde_feed(
                          entry
                      )

                      resultado.append({

                          "titulo":
                              titulo,

                          "descripcion":
                              descripcion[:700],

                          "url":
                              link,

                          "imagen":
                              imagen,

                          "categoria":
                              "Deportes",

                          "subcategoria":
                              categoria,

                          "fuente":
                              "Expansión - Deportes",

                          "fecha":
                              obtener_fecha(
                                  entry
                              )

                      })

              except Exception as error:

                  print(
                      "ERROR DEPORTE:",
                      error
                  )

              return resultado


          # ============================================================
          # LEER ENTRETENIMIENTO
          # ============================================================

          def leer_entretenimiento(
              subcategoria,
              consulta
          ):

              resultado = []

              try:

                  consulta_final = (
                      "site:lifeandstyle.expansion.mx "
                      + consulta
                  )

                  url = (
                      "https://news.google.com/rss/search?"
                      "q="
                      + quote_plus(
                          consulta_final
                      )
                      + "&hl=es-419"
                      "&gl=MX"
                      "&ceid=MX:es-419"
                  )

                  feed = feedparser.parse(
                      url
                  )

                  for entry in feed.entries[
                      :MAX_RESULTADOS_POR_BUSQUEDA
                  ]:

                      titulo = limpiar_html(
                          entry.get(
                              "title",
                              ""
                          )
                      )

                      link = obtener_url_original(
                          entry.get(
                              "link",
                              ""
                          )
                      )

                      if not titulo or not link:
                          continue

                      if not es_expansion(
                          link
                      ):
                          continue

                      # No permitir que entretenimiento
                      # capture artículos deportivos.

                      if es_articulo_deportivo(
                          link
                      ):
                          continue

                      descripcion = limpiar_html(
                          entry.get(
                              "summary",
                              ""
                          )
                          or
                          entry.get(
                              "description",
                              ""
                          )
                      )

                      imagen = imagen_desde_feed(
                          entry
                      )

                      resultado.append({

                          "titulo":
                              titulo,

                          "descripcion":
                              descripcion[:700],

                          "url":
                              link,

                          "imagen":
                              imagen,

                          "categoria":
                              "Entretenimiento",

                          "subcategoria":
                              subcategoria,

                          "fuente":
                              "Expansión - Life & Style",

                          "fecha":
                              obtener_fecha(
                                  entry
                              )

                      )

              except Exception as error:

                  print(
                      "ERROR ENTRETENIMIENTO:",
                      error
                  )

              return resultado


          # ============================================================
          # LEER NOTICIAS EXISTENTES
          #
          # ESTA PARTE ES CLAVE.
          #
          # Antes cada actualización borraba las noticias anteriores.
          # Ahora las conservamos y agregamos las nuevas.
          # ============================================================

          noticias_existentes = []

          try:

              with open(
                  ARCHIVO_JSON,
                  encoding="utf-8"
              ) as archivo:

                  anterior = json.load(
                      archivo
                  )

                  if isinstance(
                      anterior,
                      dict
                  ):

                      noticias_existentes = anterior.get(
                          "noticias",
                          []
                      )

                  elif isinstance(
                      anterior,
                      list
                  ):

                      noticias_existentes = anterior

                  if not isinstance(
                      noticias_existentes,
                      list
                  ):
                      noticias_existentes = []

          except Exception as error:

              print(
                  "No se pudo leer JSON anterior:",
                  error
              )


          print(
              "Noticias existentes:",
              len(noticias_existentes)
          )


          # ============================================================
          # DESCARGAR NUEVAS
          # ============================================================

          nuevas = []


          # GENERALES

          for nombre, url, categoria in FUENTES:

              nuevas.extend(
                  leer_fuente(
                      nombre,
                      url,
                      categoria
                  )
              )


          # DEPORTES

          for subcategoria, consulta in BUSQUEDAS_DEPORTES:

              nuevas.extend(
                  leer_deporte(
                      subcategoria,
                      consulta
                  )
              )


          # ENTRETENIMIENTO

          for subcategoria, consulta in BUSQUEDAS_ENTRETENIMIENTO:

              nuevas.extend(
                  leer_entretenimiento(
                      subcategoria,
                      consulta
                  )
              )


          print(
              "Nuevas noticias:",
              len(nuevas)
          )


          # ============================================================
          # UNIR ANTIGUAS + NUEVAS
          # ============================================================

          todas = (
              noticias_existentes
              +
              nuevas
          )


          # ============================================================
          # LIMPIAR Y RECLASIFICAR
          # ============================================================

          limpias = []

          for noticia in todas:

              if not isinstance(
                  noticia,
                  dict
              ):
                  continue

              titulo = limpiar_html(
                  noticia.get(
                      "titulo",
                      ""
                  )
              )

              url = obtener_url_original(
                  noticia.get(
                      "url",
                      ""
                  )
              )

              if not titulo or not url:
                  continue

              if not es_expansion(
                  url
              ):
                  continue

              descripcion = limpiar_html(
                  noticia.get(
                      "descripcion",
                      ""
                  )
              )

              # --------------------------------------------------------
              # CORRECCIÓN AUTOMÁTICA DE DEPORTES
              #
              # Si la URL realmente es de deportes,
              # jamás puede quedarse como NFL dentro
              # de una categoría económica.
              # --------------------------------------------------------

              if es_articulo_deportivo(
                  url
              ):

                  categoria = "Deportes"

                  subcategoria = clasificar_deporte(
                      titulo,
                      descripcion,
                      noticia.get(
                          "subcategoria",
                          ""
                      )
                  )

              else:

                  categoria = noticia.get(
                      "categoria",
                      "Noticias"
                  )

                  subcategoria = noticia.get(
                      "subcategoria",
                      ""
                  )

                  # Evitar que noticias NO deportivas
                  # con etiquetas viejas como NFL/Básquetbol
                  # sigan apareciendo en Deportes.

                  if categoria != "Deportes":

                      if subcategoria in [
                          "NFL",
                          "NBA",
                          "Básquetbol",
                          "Fútbol",
                          "Liga MX",
                          "Béisbol",
                          "Tenis",
                          "Boxeo",
                          "Fórmula 1",
                          "Motor"
                      ]:

                          subcategoria = ""

              imagen = noticia.get(
                  "imagen",
                  ""
              )

              fecha = noticia.get(
                  "fecha",
                  ""
              )

              if not fecha:

                  fecha = datetime.now(
                      timezone.utc
                  ).isoformat()

              limpias.append({

                  "titulo":
                      titulo,

                  "descripcion":
                      descripcion[:700],

                  "url":
                      url,

                  "imagen":
                      imagen,

                  "categoria":
                      categoria,

                  "subcategoria":
                      subcategoria,

                  "fuente":
                      noticia.get(
                          "fuente",
                          "Expansión"
                      ),

                  "fecha":
                      fecha

              })


          noticias = limpias


          # ============================================================
          # DEDUPLICAR POR URL
          # ============================================================

          vistas = set()

          unicas = []

          for noticia in noticias:

              clave = normalizar_url(
                  noticia.get(
                      "url",
                      ""
                  )
              )

              if not clave:
                  continue

              if clave in vistas:
                  continue

              vistas.add(
                  clave
              )

              unicas.append(
                  noticia
              )


          noticias = unicas


          # ============================================================
          # DEDUPLICAR POR TÍTULO
          # ============================================================

          vistos_titulos = set()

          unicas = []

          for noticia in noticias:

              titulo = re.sub(
                  r"\s+",
                  " ",
                  noticia.get(
                      "titulo",
                      ""
                  ).lower().strip()
              )

              if not titulo:
                  continue

              if titulo in vistos_titulos:
                  continue

              vistos_titulos.add(
                  titulo
              )

              unicas.append(
                  noticia
              )


          noticias = unicas


          # ============================================================
          # BUSCAR IMÁGENES REALES
          # ============================================================

          pendientes = [

              n

              for n in noticias

              if not validar_imagen(
                  n.get(
                      "imagen",
                      ""
                  )
              )

          ]


          pendientes = pendientes[
              :MAX_IMAGENES
          ]


          print(
              "Artículos que necesitan imagen:",
              len(pendientes)
          )


          def procesar_imagen(
              noticia
          ):

              return (

                  noticia["url"],

                  obtener_imagen_real(
                      noticia["url"]
                  )

              )


          with ThreadPoolExecutor(
              max_workers=15
          ) as executor:

              tareas = [

                  executor.submit(
                      procesar_imagen,
                      noticia
                  )

                  for noticia in pendientes
              ]


              for futuro in as_completed(
                  tareas
              ):

                  try:

                      url, imagen = (
                          futuro.result()
                      )

                      if not imagen:
                          continue

                      clave = normalizar_url(
                          url
                      )

                      for noticia in noticias:

                          if (
                              normalizar_url(
                                  noticia["url"]
                              )
                              ==
                              clave
                          ):

                              noticia[
                                  "imagen"
                              ] = imagen

                              break

                  except Exception:

                      pass


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          def fecha_segura(
              noticia
          ):

              try:

                  fecha = dateparser.parse(
                      noticia.get(
                          "fecha",
                          ""
                      )
                  )

                  if fecha.tzinfo is None:

                      fecha = fecha.replace(
                          tzinfo=timezone.utc
                      )

                  return fecha

              except Exception:

                  return datetime.min.replace(
                      tzinfo=timezone.utc
                  )


          noticias.sort(
              key=fecha_segura,
              reverse=True
          )


          # ============================================================
          # MÁXIMO TOTAL
          # ============================================================

          noticias = noticias[
              :MAX_NOTICIAS
          ]


          # ============================================================
          # ESTADÍSTICAS
          # ============================================================

          categorias = {}
          subcategorias = {}
          fuentes = {}
          imagenes = set()


          for noticia in noticias:

              categoria = noticia.get(
                  "categoria",
                  "Noticias"
              )

              subcategoria = noticia.get(
                  "subcategoria",
                  ""
              )

              fuente = noticia.get(
                  "fuente",
                  ""
              )

              categorias[categoria] = (
                  categorias.get(
                      categoria,
                      0
                  )
                  + 1
              )

              if subcategoria:

                  subcategorias[
                      subcategoria
                  ] = (
                      subcategorias.get(
                          subcategoria,
                          0
                      )
                      + 1
                  )

              if fuente:

                  fuentes[fuente] = (
                      fuentes.get(
                          fuente,
                          0
                      )
                      + 1
                  )

              imagen = noticia.get(
                  "imagen",
                  ""
              )

              if validar_imagen(
                  imagen
              ):

                  imagenes.add(
                      normalizar_url(
                          imagen
                      )
                  )


          # ============================================================
          # IMÁGENES
          # ============================================================

          con_imagen = sum(

              1

              for n in noticias

              if validar_imagen(
                  n.get(
                      "imagen",
                      ""
                  )
              )

          )

          sin_imagen = (
              len(noticias)
              -
              con_imagen
          )


          # ============================================================
          # GUARDAR JSON
          # ============================================================

          datos = {

              "actualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "fuente":
                  "Expansión + Life & Style",

              "total":
                  len(noticias),

              "imagenes": {

                  "con_imagen":
                      con_imagen,

                  "sin_imagen":
                      sin_imagen,

                  "imagenes_unicas":
                      len(imagenes)

              },

              "categorias":
                  categorias,

              "subcategorias":
                  subcategorias,

              "fuentes":
                  fuentes,

              "noticias":
                  noticias

          }


          with open(
              ARCHIVO_JSON,
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  datos,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          # ============================================================
          # RESULTADO
          # ============================================================

          print("")
          print(
              "=============================================="
          )
          print(
              " ACTUALIZACIÓN TERMINADA"
          )
          print(
              "=============================================="
          )

          print(
              "TOTAL:",
              len(noticias)
          )

          print(
              "CON IMAGEN:",
              con_imagen
          )

          print(
              "SIN IMAGEN:",
              sin_imagen
          )

          print(
              "IMÁGENES ÚNICAS:",
              len(imagenes)
          )

          print(
              "CATEGORÍAS:",
              categorias
          )

          print(
              "SUBCATEGORÍAS:",
              subcategorias
          )

          print(
              "=============================================="
          )

          PY


