name: Actualizar noticias RSS

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4

      - name: Actualizar noticias
        env:
          PYTHONIOENCODING: utf-8
        run: |

          cat > actualizar.py <<'PYTHON'
          import json
          import os
          import re
          import hashlib
          import time
          from datetime import datetime, timezone
          from urllib.parse import quote_plus

          import feedparser
          import requests
          from bs4 import BeautifulSoup


          # ============================================================
          # CONFIGURACIÓN
          # ============================================================

          ARCHIVO = "noticias.json"

          # Máximo de noticias que se conservarán por categoría.
          MAX_POR_CATEGORIA = 100

          # Cantidad máxima de artículos que se tomarán de cada feed
          # durante una ejecución.
          MAX_POR_FEED = 20

          USER_AGENT = (
              "Mozilla/5.0 "
              "(X11; Linux x86_64) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/140 Safari/537.36"
          )


          # ============================================================
          # RSS OFICIALES DE EXPANSIÓN
          # ============================================================

          FUENTES_EXPANSION = {

              "Noticias":
                  "https://expansion.mx/rss",

              "Mundo":
                  "https://expansion.mx/rss/internacional",

              "Dinero":
                  "https://expansion.mx/rss/economia",

              "Tecnologia":
                  "https://expansion.mx/rss/tecnologia",

              "Tendencias":
                  "https://expansion.mx/rss/tendencias",

              "Empresas":
                  "https://expansion.mx/rss/empresas",

              "Politica":
                  "https://expansion.mx/rss/politica"

          }


          # ============================================================
          # BÚSQUEDAS DEPORTIVAS
          #
          # Cada grupo termina directamente en su categoría.
          # No se crean archivos separados.
          # Todo termina en noticias.json.
          # ============================================================

          BUSQUEDAS_DEPORTIVAS = {

              "futbol": [
                  "Liga MX",
                  "fútbol mexicano",
                  "Selección Mexicana fútbol",
                  "fútbol internacional",
                  "Champions League"
              ],

              "tenis": [
                  "tenis ATP",
                  "tenis WTA",
                  "tenis México",
                  "Grand Slam tenis"
              ],

              "beisbol": [
                  "MLB béisbol",
                  "béisbol México",
                  "Liga Mexicana de Béisbol",
                  "World Series béisbol"
              ],

              "nfl": [
                  "NFL",
                  "NFL México",
                  "fútbol americano",
                  "Super Bowl"
              ],

              "basquetbol": [
                  "NBA",
                  "básquetbol México",
                  "baloncesto México",
                  "WNBA"
              ],

              "boxeo": [
                  "boxeo México",
                  "boxeo mundial",
                  "Canelo boxeo",
                  "UFC MMA"
              ],

              "formula1": [
                  "Fórmula 1",
                  "F1 automovilismo",
                  "Gran Premio Fórmula 1",
                  "Formula 1 México"
              ],

              "otros": [
                  "golf México",
                  "atletismo México",
                  "ciclismo México",
                  "natación México",
                  "deportes olímpicos"
              ]
          }


          NOMBRES_CATEGORIA = {

              "futbol": "Fútbol",
              "tenis": "Tenis",
              "beisbol": "Béisbol",
              "nfl": "NFL",
              "basquetbol": "Básquetbol",
              "boxeo": "Boxeo",
              "formula1": "Fórmula 1",
              "otros": "Otros"

          }


          # ============================================================
          # SESIÓN HTTP
          # ============================================================

          session = requests.Session()

          session.headers.update({
              "User-Agent": USER_AGENT,
              "Accept-Language": "es-MX,es;q=0.9,en;q=0.8"
          })


          # ============================================================
          # UTILIDADES
          # ============================================================

          def limpiar_html(texto):

              if not texto:
                  return ""

              soup = BeautifulSoup(
                  str(texto),
                  "html.parser"
              )

              texto = soup.get_text(
                  " ",
                  strip=True
              )

              texto = re.sub(
                  r"\s+",
                  " ",
                  texto
              )

              return texto.strip()


          def normalizar(texto):

              if texto is None:
                  return ""

              texto = str(texto).lower().strip()

              reemplazos = {
                  "á": "a",
                  "é": "e",
                  "í": "i",
                  "ó": "o",
                  "ú": "u",
                  "ü": "u",
                  "ñ": "n"
              }

              for viejo, nuevo in reemplazos.items():
                  texto = texto.replace(
                      viejo,
                      nuevo
                  )

              return texto


          def obtener_fecha(entry):

              try:

                  if getattr(
                      entry,
                      "published_parsed",
                      None
                  ):

                      import calendar

                      timestamp = calendar.timegm(
                          entry.published_parsed
                      )

                      return datetime.fromtimestamp(
                          timestamp,
                          tz=timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              try:

                  if getattr(
                      entry,
                      "updated_parsed",
                      None
                  ):

                      import calendar

                      timestamp = calendar.timegm(
                          entry.updated_parsed
                      )

                      return datetime.fromtimestamp(
                          timestamp,
                          tz=timezone.utc
                      ).isoformat()

              except Exception:
                  pass


              return datetime.now(
                  timezone.utc
              ).isoformat()


          def obtener_url(entry):

              url = ""

              if getattr(
                  entry,
                  "link",
                  None
              ):

                  url = entry.link


              if not url:

                  for link in getattr(
                      entry,
                      "links",
                      []
                  ):

                      href = link.get("href")

                      if href:

                          url = href
                          break


              return str(url).strip()


          def obtener_imagen_del_feed(entry):

              # --------------------------------------------------------
              # media_content
              # --------------------------------------------------------

              for media in getattr(
                  entry,
                  "media_content",
                  []
              ) or []:

                  url = media.get("url")

                  if url:
                      return url


              # --------------------------------------------------------
              # media_thumbnail
              # --------------------------------------------------------

              for media in getattr(
                  entry,
                  "media_thumbnail",
                  []
              ) or []:

                  url = media.get("url")

                  if url:
                      return url


              # --------------------------------------------------------
              # enclosure
              # --------------------------------------------------------

              for enclosure in getattr(
                  entry,
                  "enclosures",
                  []
              ) or []:

                  url = (
                      enclosure.get("href")
                      or
                      enclosure.get("url")
                  )

                  if url:

                      tipo = (
                          enclosure.get(
                              "type",
                              ""
                          )
                          or
                          ""
                      ).lower()

                      if (
                          not tipo
                          or
                          "image" in tipo
                      ):

                          return url


              # --------------------------------------------------------
              # HTML DEL RESUMEN
              # --------------------------------------------------------

              bloques = []

              if getattr(
                  entry,
                  "summary",
                  None
              ):

                  bloques.append(
                      entry.summary
                  )


              if getattr(
                  entry,
                  "description",
                  None
              ):

                  bloques.append(
                      entry.description
                  )


              for contenido in getattr(
                  entry,
                  "content",
                  []
              ) or []:

                  if isinstance(
                      contenido,
                      dict
                  ):

                      valor = contenido.get(
                          "value"
                      )

                      if valor:
                          bloques.append(
                              valor
                          )


              for bloque in bloques:

                  soup = BeautifulSoup(
                      str(bloque),
                      "html.parser"
                  )

                  imagen = soup.find("img")

                  if imagen:

                      src = imagen.get("src")

                      if src:
                          return src


              return ""


          def obtener_imagen_de_pagina(url):

              if not url:
                  return ""


              try:

                  respuesta = session.get(
                      url,
                      timeout=12,
                      allow_redirects=True
                  )

                  if respuesta.status_code != 200:
                      return ""


                  soup = BeautifulSoup(
                      respuesta.text,
                      "html.parser"
                  )


                  # og:image
                  og = soup.find(
                      "meta",
                      property="og:image"
                  )

                  if og:

                      imagen = og.get(
                          "content"
                      )

                      if imagen:
                          return imagen.strip()


                  # twitter:image
                  twitter = soup.find(
                      "meta",
                      attrs={
                          "name": "twitter:image"
                      }
                  )

                  if twitter:

                      imagen = twitter.get(
                          "content"
                      )

                      if imagen:
                          return imagen.strip()


              except Exception:
                  pass


              return ""


          def obtener_imagen(entry, url):

              imagen = obtener_imagen_del_feed(
                  entry
              )

              if imagen:
                  return imagen


              return obtener_imagen_de_pagina(
                  url
              )


          def hash_noticia(titulo, url):

              base = (
                  normalizar(titulo)
                  + "|"
                  + str(url)
                      .strip()
                      .lower()
              )

              return hashlib.sha256(
                  base.encode("utf-8")
              ).hexdigest()


          def noticia_valida(noticia):

              if not isinstance(
                  noticia,
                  dict
              ):
                  return False


              titulo = str(
                  noticia.get(
                      "titulo",
                      ""
                  )
              ).strip()


              url = str(
                  noticia.get(
                      "url",
                      ""
                  )
              ).strip()


              if not titulo:
                  return False


              if not url:
                  return False


              if not url.startswith(
                  "http"
              ):
                  return False


              return True


          # ============================================================
          # CARGAR noticias.json EXISTENTE
          # ============================================================

          if os.path.exists(
              ARCHIVO
          ):

              try:

                  with open(
                      ARCHIVO,
                      "r",
                      encoding="utf-8"
                  ) as archivo:

                      datos = json.load(
                          archivo
                      )

              except Exception as error:

                  print(
                      "No se pudo leer noticias.json:"
                  )

                  print(error)

                  datos = {
                      "actualizado": "",
                      "total": 0,
                      "noticias": []
                  }

          else:

              datos = {
                  "actualizado": "",
                  "total": 0,
                  "noticias": []
              }


          if isinstance(
              datos,
              list
          ):

              noticias = datos

          elif isinstance(
              datos,
              dict
          ):

              noticias = datos.get(
                  "noticias",
                  []
              )

          else:

              noticias = []


          if not isinstance(
              noticias,
              list
          ):

              noticias = []


          # ============================================================
          # LIMPIAR NOTICIAS EXISTENTES
          # Y ELIMINAR DUPLICADOS
          # ============================================================

          noticias_unicas = {}

          for noticia in noticias:

              if not noticia_valida(
                  noticia
              ):
                  continue


              titulo = noticia.get(
                  "titulo",
                  ""
              )

              url = noticia.get(
                  "url",
                  ""
              )


              clave = hash_noticia(
                  titulo,
                  url
              )


              noticias_unicas[
                  clave
              ] = noticia


          noticias = list(
              noticias_unicas.values()
          )


          print(
              "Noticias existentes después "
              "de eliminar duplicados:",
              len(noticias)
          )


          # ============================================================
          # FUNCIÓN PARA AGREGAR UNA NOTICIA
          # ============================================================

          def agregar_noticia(
              titulo,
              descripcion,
              url,
              imagen,
              fecha,
              fuente,
              categoria,
              subcategoria
          ):

              titulo = limpiar_html(
                  titulo
              )

              descripcion = limpiar_html(
                  descripcion
              )

              url = str(
                  url or ""
              ).strip()


              if not titulo or not url:
                  return False


              clave = hash_noticia(
                  titulo,
                  url
              )


              if clave in noticias_unicas:

                  return False


              noticia = {

                  "titulo": titulo,

                  "descripcion":
                      descripcion[:600],

                  "url": url,

                  "imagen": imagen or "",

                  "fecha": fecha,

                  "fuente": fuente,

                  "categoria": categoria,

                  "subcategoria":
                      subcategoria

              }


              noticias_unicas[
                  clave
              ] = noticia


              return True


          # ============================================================
          # LEER RSS DE EXPANSIÓN
          # ============================================================

          def leer_rss_expansion(
              categoria,
              feed_url
          ):

              print(
                  "\n================================"
              )

              print(
                  "EXPANSIÓN:",
                  categoria
              )

              print(
                  "================================"
              )


              try:

                  respuesta = session.get(
                      feed_url,
                      timeout=30
                  )

                  respuesta.raise_for_status()


                  feed = feedparser.parse(
                      respuesta.content
                  )


              except Exception as error:

                  print(
                      "Error leyendo RSS:",
                      error
                  )

                  return


              agregadas = 0


              for entry in feed.entries[
                  :MAX_POR_FEED
              ]:

                  titulo = limpiar_html(
                      getattr(
                          entry,
                          "title",
                          ""
                      )
                  )


                  url = obtener_url(
                      entry
                  )


                  if not titulo or not url:
                      continue


                  descripcion = limpiar_html(

                      getattr(
                          entry,
                          "summary",
                          ""
                      )

                      or

                      getattr(
                          entry,
                          "description",
                          ""
                      )

                  )


                  fecha = obtener_fecha(
                      entry
                  )


                  imagen = obtener_imagen(
                      entry,
                      url
                  )


                  nueva = agregar_noticia(

                      titulo=titulo,

                      descripcion=descripcion,

                      url=url,

                      imagen=imagen,

                      fecha=fecha,

                      fuente="Expansión",

                      categoria=categoria,

                      subcategoria=categoria

                  )


                  if nueva:

                      agregadas += 1


              print(
                  "Nuevas:",
                  agregadas
              )


          # ============================================================
          # LEER GOOGLE NEWS RSS
          # ============================================================

          def url_google_news(
              consulta
          ):

              consulta = (
                  consulta
                  + " when:3d"
              )


              return (
                  "https://news.google.com/rss/search?"
                  "q="
                  + quote_plus(
                      consulta
                  )
                  + "&hl=es-419"
                  "&gl=MX"
                  "&ceid=MX:es-419"
              )


          def leer_rss_deportivo(
              categoria,
              consulta
          ):

              feed_url = url_google_news(
                  consulta
              )


              print(
                  "\n--------------------------------"
              )

              print(
                  "DEPORTE:",
                  NOMBRES_CATEGORIA[
                      categoria
                  ]
              )

              print(
                  "BÚSQUEDA:",
                  consulta
              )

              print(
                  "--------------------------------"
              )


              try:

                  respuesta = session.get(
                      feed_url,
                      timeout=30
                  )

                  respuesta.raise_for_status()


                  feed = feedparser.parse(
                      respuesta.content
                  )


              except Exception as error:

                  print(
                      "Error leyendo Google News:",
                      error
                  )

                  return


              agregadas = 0


              for entry in feed.entries[
                  :MAX_POR_FEED
              ]:

                  titulo = limpiar_html(
                      getattr(
                          entry,
                          "title",
                          ""
                      )
                  )


                  url = obtener_url(
                      entry
                  )


                  if not titulo or not url:
                      continue


                  descripcion = limpiar_html(

                      getattr(
                          entry,
                          "summary",
                          ""
                      )

                      or

                      getattr(
                          entry,
                          "description",
                          ""
                      )

                  )


                  fecha = obtener_fecha(
                      entry
                  )


                  imagen = obtener_imagen(
                      entry,
                      url
                  )


                  fuente = (
                      "Google News"
                  )


                  nueva = agregar_noticia(

                      titulo=titulo,

                      descripcion=descripcion,

                      url=url,

                      imagen=imagen,

                      fecha=fecha,

                      fuente=fuente,

                      categoria="Deportes",

                      subcategoria=
                          categoria

                  )


                  if nueva:

                      agregadas += 1


              print(
                  "Nuevas:",
                  agregadas
              )


          # ============================================================
          # ACTUALIZAR CATEGORÍAS GENERALES
          # ============================================================

          for categoria, feed_url in (
              FUENTES_EXPANSION.items()
          ):

              leer_rss_expansion(
                  categoria,
                  feed_url
              )


          # ============================================================
          # ACTUALIZAR DEPORTES
          # ============================================================

          for categoria, consultas in (
              BUSQUEDAS_DEPORTIVAS.items()
          ):

              for consulta in consultas:

                  leer_rss_deportivo(
                      categoria,
                      consulta
                  )


                  # Evita golpear demasiadas fuentes
                  # simultáneamente.

                  time.sleep(0.5)


          # ============================================================
          # ELIMINAR DUPLICADOS OTRA VEZ
          # ============================================================

          noticias = list(
              noticias_unicas.values()
          )


          # ============================================================
          # ORDENAR POR FECHA
          # ============================================================

          def timestamp_noticia(
              noticia
          ):

              try:

                  return datetime.fromisoformat(
                      noticia.get(
                          "fecha",
                          ""
                      ).replace(
                          "Z",
                          "+00:00"
                      )
                  ).timestamp()

              except Exception:

                  return 0


          noticias.sort(
              key=timestamp_noticia,
              reverse=True
          )


          # ============================================================
          # DEFINIR CATEGORÍA DE CONSERVACIÓN
          # ============================================================

          def grupo_conservacion(
              noticia
          ):

              categoria = normalizar(
                  noticia.get(
                      "categoria",
                      ""
                  )
              )

              subcategoria = normalizar(
                  noticia.get(
                      "subcategoria",
                      ""
                  )
              )


              # --------------------------------------------------------
              # DEPORTES
              # --------------------------------------------------------

              if categoria == "deportes":

                  if subcategoria in (
                      "futbol",
                      "tenis",
                      "beisbol",
                      "nfl",
                      "basquetbol",
                      "boxeo",
                      "formula1",
                      "otros"
                  ):

                      return (
                          "deportes_"
                          + subcategoria
                      )

                  return "deportes_otros"


              # --------------------------------------------------------
              # RESTO DE CATEGORÍAS
              # --------------------------------------------------------

              return categoria or "otros"


          # ============================================================
          # CONSERVAR LAS MÁS RECIENTES
          #
          # Cada grupo conserva como máximo 100.
          # ============================================================

          grupos = {}

          for noticia in noticias:

              grupo = grupo_conservacion(
                  noticia
              )


              if grupo not in grupos:

                  grupos[grupo] = []


              if len(
                  grupos[grupo]
              ) < MAX_POR_CATEGORIA:

                  grupos[grupo].append(
                      noticia
                  )


          # ============================================================
          # RECONSTRUIR LISTA FINAL
          # ============================================================

          noticias_finales = []

          for grupo, items in grupos.items():

              noticias_finales.extend(
                  items
              )


          # ============================================================
          # ORDEN FINAL
          # ============================================================

          noticias_finales.sort(
              key=timestamp_noticia,
              reverse=True
          )


          # ============================================================
          # ELIMINACIÓN FINAL DE DUPLICADOS
          # ============================================================

          finales_unicas = {}

          for noticia in noticias_finales:

              clave = hash_noticia(

                  noticia.get(
                      "titulo",
                      ""
                  ),

                  noticia.get(
                      "url",
                      ""
                  )

              )


              if clave not in finales_unicas:

                  finales_unicas[
                      clave
                  ] = noticia


          noticias_finales = list(
              finales_unicas.values()
          )


          noticias_finales.sort(
              key=timestamp_noticia,
              reverse=True
          )


          # ============================================================
          # ESTADÍSTICAS
          # ============================================================

          estadisticas = {}

          for noticia in noticias_finales:

              grupo = grupo_conservacion(
                  noticia
              )

              estadisticas[grupo] = (
                  estadisticas.get(
                      grupo,
                      0
                  )
                  + 1
              )


          print(
              "\n========================================"
          )

          print(
              "RESUMEN FINAL"
          )

          print(
              "========================================"
          )


          print(
              "Total:",
              len(noticias_finales)
          )


          for grupo in sorted(
              estadisticas
          ):

              print(
                  grupo,
                  ":",
                  estadisticas[grupo]
              )


          # ============================================================
          # GUARDAR noticias.json
          # ============================================================

          salida = {

              "actualizado":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "total":
                  len(noticias_finales),

              "noticias":
                  noticias_finales

          }


          with open(
              ARCHIVO,
              "w",
              encoding="utf-8"
          ) as archivo:

              json.dump(
                  salida,
                  archivo,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "\nnoticias.json actualizado correctamente."
          )

          PYTHON


          python actualizar.py


      - name: Comprobar cambios
        run: |
          git status --short


      - name: Guardar noticias actualizadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add noticias.json

          if git diff --cached --quiet; then
            echo "No hay noticias nuevas."
          else
            git commit -m "Actualizar noticias automáticamente"
            git push
          fi