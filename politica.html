<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Política | TendenciasMX</title>

<meta name="description" content="Noticias de política de México y el mundo: gobierno, Congreso, justicia y política nacional e internacional.">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1100px;
    margin:auto;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:25px;
    font-weight:800;
    white-space:nowrap;
}

.logo span{
    color:#22c55e;
}

nav{
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

nav a{
    color:#d1d5db;
    text-decoration:none;
    padding:9px 11px;
    border-radius:8px;
    font-size:14px;
    white-space:nowrap;
    transition:.2s;
}

nav a:hover{
    background:#1f2937;
    color:#22c55e;
}

main{
    max-width:1100px;
    margin:auto;
    padding:30px 20px 50px;
}

.hero{
    margin-bottom:25px;
}

.hero h1{
    font-size:36px;
    margin-bottom:8px;
}

.hero p{
    color:#6b7280;
    font-size:16px;
    line-height:1.5;
}

.filtros{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:5px 0 20px;
    scrollbar-width:none;
}

.filtros::-webkit-scrollbar{
    display:none;
}

.filtros button{
    border:1px solid #d1d5db;
    background:white;
    color:#374151;
    padding:10px 15px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
    font-size:14px;
    transition:.2s;
}

.filtros button:hover,
.filtros button.activo{
    background:#22c55e;
    color:white;
    border-color:#22c55e;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    transition:.25s;
    border:1px solid #e5e7eb;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 25px rgba(0,0,0,.13);
}

.card-link{
    display:block;
    color:inherit;
    text-decoration:none;
}

.card-img{
    height:180px;
    background:#111827;
    overflow:hidden;
}

.card-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.card-content{
    padding:17px;
}

.badge{
    display:inline-block;
    background:#dcfce7;
    color:#15803d;
    font-size:12px;
    font-weight:bold;
    padding:5px 9px;
    border-radius:999px;
    margin-bottom:10px;
}

.date{
    color:#9ca3af;
    font-size:12px;
    margin-bottom:9px;
}

.card h2{
    font-size:19px;
    line-height:1.3;
    margin-bottom:10px;
    color:#111827;
}

.card p{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
    margin-bottom:14px;
}

.leer{
    color:#16a34a;
    font-weight:bold;
    font-size:14px;
}

.empty{
    grid-column:1/-1;
    background:white;
    padding:40px;
    text-align:center;
    border-radius:15px;
    color:#6b7280;
}

footer{
    background:#111827;
    color:#9ca3af;
    text-align:center;
    padding:25px 20px;
    margin-top:30px;
    font-size:13px;
}

@media(max-width:850px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .header-inner{
        align-items:flex-start;
        flex-direction:column;
        gap:12px;
    }

    nav{
        width:100%;
    }
}

@media(max-width:600px){
    main{
        padding:25px 14px 40px;
    }

    .hero h1{
        font-size:29px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card-img{
        height:200px;
    }
}
</style>
</head>

function escapeHTML(text){
    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function mostrarFallback(img, emoji){

    const contenedor = img.parentElement;

    img.style.display="none";

    contenedor.style.display="flex";
    contenedor.style.alignItems="center";
    contenedor.style.justifyContent="center";
    contenedor.style.fontSize="55px";
    contenedor.textContent=emoji;

}

function mostrar(categoria, boton){

    const contenedor=document.getElementById("contenedor");

    document.querySelectorAll(".filtros button").forEach(b=>{
        b.classList.remove("activo");
    });

    if(boton){
        boton.classList.add("activo");
    }

    let filtradas;

    if(categoria==="todos"){
        filtradas=noticias;
    }else{
        filtradas=noticias.filter(
            noticia=>noticia.categoria===categoria
        );
    }

    if(filtradas.length===0){

        contenedor.innerHTML=`
            <div class="empty">
                No hay noticias disponibles en esta categoría.
            </div>
        `;

        return;
    }

    contenedor.innerHTML=filtradas.map(noticia=>`

        <article class="card">

            <a
                class="card-link"
                href="${escapeHTML(noticia.url)}"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="card-img">

                    <img
                        src="${escapeHTML(noticia.imagen)}"
                        alt="${escapeHTML(noticia.titulo)}"
                        loading="lazy"
                        onerror="mostrarFallback(this,'${escapeHTML(noticia.emoji)}')"
                    >

                </div>

                <div class="card-content">

                    <span class="badge">
                        ${escapeHTML(noticia.nombreCategoria)}
                    </span>

                    <div class="date">
                        ${escapeHTML(noticia.fecha)}
                    </div>

                    <h2>
                        ${escapeHTML(noticia.titulo)}
                    </h2>

                    <p>
                        ${escapeHTML(noticia.descripcion)}
                    </p>

                    <div class="leer">
                        Leer noticia completa →
                    </div>

                </div>

            </a>

        </article>

    `).join("");

}

mostrar(
