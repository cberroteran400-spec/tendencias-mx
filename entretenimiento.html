header{

.header-content{

}

}

}

.subtitle{

    color:#cbd5e1;
    margin-top:4px;
}

nav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-top:15px;
    padding-bottom:3px;
}

nav a{
    color:white;
    text-decoration:none;
    background:#1f2937;
    padding:9px 13px;
    border-radius:20px;
    font-size:13px;
    white-space:nowrap;
}

nav a:hover{
    background:#22c55e;
    color:#111827;
}

main{
    max-width:1100px;
    margin:auto;
    padding:25px 15px 50px;
}

h1{
    font-size:30px;
    margin-bottom:8px;
}

.descripcion{
    color:#64748b;
    margin-bottom:22px;
    line-height:1.5;
}

.filtros{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:25px;
    padding-bottom:5px;
}

.filtros button{
    border:none;
    background:#e2e8f0;
    color:#1e293b;
    padding:10px 15px;
    border-radius:22px;
    cursor:pointer;
    font-weight:700;
    white-space:nowrap;
}

.filtros button.activo,
.filtros button:hover{
    background:#22c55e;
    color:#07130b;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 22px rgba(0,0,0,.12);
}

.card-img{
    width:100%;
    height:180px;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

.card-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.fallback{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    background:linear-gradient(135deg,#111827,#334155);
}

.card-content{
    padding:17px;
}

.categoria{
    display:inline-block;
    font-size:11px;
    font-weight:800;
    color:#15803d;
    background:#dcfce7;
    padding:5px 9px;
    border-radius:15px;
    margin-bottom:10px;
    text-transform:uppercase;
}

.card h2{
    font-size:19px;
    line-height:1.3;
    margin-bottom:9px;
}

.card p{
    color:#64748b;
    font-size:14px;
    line-height:1.45;
}

.fecha{
    margin-top:12px;
    font-size:12px;
    color:#94a3b8;
}

.vacio{
    text-align:center;
    padding:50px 20px;
    color:#64748b;
    background:white;
    border-radius:15px;
}

footer{
    background:#111827;
    color:#94a3b8;
    text-align:center;
    padding:25px 15px;
    font-size:13px;
}

@media(max-width:600px){
    h1{
        font-size:25px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card-img{
        height:200px;
    }
}
</style>
</head>

/* =====================================
   MOSTRAR NOTICIAS
===================================== */

function mostrar(categoria, boton){

    const contenedor = document.getElementById("contenedor");

    if(boton){

        document
        .querySelectorAll(".filtros button")
        .forEach(btn => btn.classList.remove("activo"));

        boton.classList.add("activo");
    }

    let lista;

    if(categoria === "todos"){
        lista = noticias;
    }else{
        lista = noticias.filter(
            noticia => noticia.categoria === categoria
        );
    }

    if(lista.length === 0){

        contenedor.innerHTML = `
            <div class="vacio">
                <h2>No hay noticias disponibles</h2>
                <p>Pronto agregaremos más contenido.</p>
            </div>
        `;

        return;
    }

    contenedor.innerHTML = lista.map(noticia => `

        <article class="card">

            <div class="card-img">

                <img
                    src="${noticia.imagen}"
                    alt="${escapeHTML(noticia.titulo)}"
                    loading="lazy"
                    onerror="mostrarFallback(this,'${noticia.emoji}')"
                >

            </div>

            <div class="card-content">

                <span class="categoria">
                    ${nombreCategoria(noticia.categoria)}
                </span>

                <h2>
                    ${escapeHTML(noticia.titulo)}
                </h2>

                <p>
                    ${escapeHTML(noticia.descripcion)}
                </p>

                <div class="fecha">
                    ${escapeHTML(noticia.fecha)}
                </div>

            </div>

        </article>

    `).join("");
}


/* =====================================
   NOMBRE DE CATEGORÍA
===================================== */

function nombreCategoria(categoria){

    const nombres = {

        cine_tv:"Cine y TV",

        musica:"Música",

        famosos:"Famosos",

        videojuegos:"Videojuegos",

        tendencias:"Tendencias"

    };

    return nombres[categoria] || "Entretenimiento";
}


/* =====================================
   IMAGEN DE RESPALDO
===================================== */

function mostrarFallback(img, emoji){

    const contenedor = img.parentElement;

    img.remove();

    contenedor.innerHTML = `
        <div class="fallback">
            ${emoji || "📰"}
        </div>
    `;
}


/* =====================================
   SEGURIDAD PARA TEXTO
===================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================
   CARGAR AL INICIAR
===================================== */

mostrar("todos", document.querySelector(".filtros button"));
