<!DOCTYPE html><html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Entretenimiento | TendenciasMX</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 8px 0 0;
  color: #d1d5db;
}

.categories {
  padding: 18px 12px;
  background: white;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.categories button {
  border: 0;
  padding: 11px 15px;
  border-radius: 22px;
  background: #e5e7eb;
  color: #111827;
  font-weight: bold;
  white-space: nowrap;
  cursor: pointer;
}

.categories button.active {
  background: #7c3aed;
  color: white;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 25px 15px 50px;
}

#tituloCategoria {
  margin-bottom: 20px;
}

#noticias {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.card .icono {
  font-size: 35px;
  margin-bottom: 10px;
}

.card h3 {
  margin: 0 0 8px;
  font-size: 18px;
}

.card p {
  margin: 0;
  color: #6b7280;
  font-size: 14px;
}

.categoria {
  display: inline-block;
  margin-top: 14px;
  padding: 5px 9px;
  border-radius: 10px;
  background: #ede9fe;
  color: #6d28d9;
  font-size: 12px;
  font-weight: bold;
}

@media (max-width: 800px) {
  #noticias {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 550px) {
  #noticias {
    grid-template-columns: 1fr;
  }
}
</style></head><body><header>  <h1>🎬 Todo el mundo del entretenimiento</h1>  <p>
    Cine y TV, Música, Famosos, Videojuegos y Tendencias
  </p></header><div class="categories">  <button class="active" onclick="mostrar('todos', this)">
    🔥 Todos
  </button>  <button onclick="mostrar('cine_tv', this)">
    🎬 Cine y TV
  </button>  <button onclick="mostrar('musica', this)">
    🎵 Música
  </button>  <button onclick="mostrar('famosos', this)">
    ⭐ Famosos
  </button>  <button onclick="mostrar('videojuegos', this)">
    🎮 Videojuegos
  </button>  <button onclick="mostrar('tendencias', this)">
    🔥 Tendencias
  </button></div><main>  <h2 id="tituloCategoria">
    Todas las categorías
  </h2>  <div id="noticias"></div></main><script>

/*
==================================================
DATOS DE PRUEBA

POR AHORA NO HAY RSS.
POR AHORA NO HAY noticias.json.
POR AHORA NO HAY IMÁGENES.

SOLO ESTAMOS COMPROBANDO LA SEPARACIÓN.
==================================================
*/

const noticias = [

  {
    categoria: "cine_tv",
    icono: "🎬",
    titulo: "Noticia de prueba de Cine y TV",
    descripcion: "Esta noticia solamente pertenece a Cine y TV."
  },

  {
    categoria: "cine_tv",
    icono: "📺",
    titulo: "Nueva serie de prueba",
    descripcion: "Esta noticia solamente pertenece a Cine y TV."
  },


  {
    categoria: "musica",
    icono: "🎵",
    titulo: "Noticia de prueba de Música",
    descripcion: "Esta noticia solamente pertenece a Música."
  },

  {
    categoria: "musica",
    icono: "🎤",
    titulo: "Nuevo cantante de prueba",
    descripcion: "Esta noticia solamente pertenece a Música."
  },


  {
    categoria: "famosos",
    icono: "⭐",
    titulo: "Noticia de prueba de Famosos",
    descripcion: "Esta noticia solamente pertenece a Famosos."
  },

  {
    categoria: "famosos",
    icono: "🌟",
    titulo: "Celebridad de prueba",
    descripcion: "Esta noticia solamente pertenece a Famosos."
  },


  {
    categoria: "videojuegos",
    icono: "🎮",
    titulo: "Noticia de prueba de Videojuegos",
    descripcion: "Esta noticia solamente pertenece a Videojuegos."
  },

  {
    categoria: "videojuegos",
    icono: "🕹️",
    titulo: "Nuevo videojuego de prueba",
    descripcion: "Esta noticia solamente pertenece a Videojuegos."
  },


  {
    categoria: "tendencias",
    icono: "🔥",
    titulo: "Noticia de prueba de Tendencias",
    descripcion: "Esta noticia solamente pertenece a Tendencias."
  },

  {
    categoria: "tendencias",
    icono: "📱",
    titulo: "Tendencia viral de prueba",
    descripcion: "Esta noticia solamente pertenece a Tendencias."
  }

];


/*
==================================================
NOMBRES DE LAS CATEGORÍAS
==================================================
*/

const nombres = {

  todos: "Todas las categorías",

  cine_tv: "🎬 Cine y TV",

  musica: "🎵 Música",

  famosos: "⭐ Famosos",

  videojuegos: "🎮 Videojuegos",

  tendencias: "🔥 Tendencias"

};


/*
==================================================
MOSTRAR CATEGORÍA
==================================================
*/

function mostrar(categoria, boton) {

  /*
  Cambiar botón activo
  */

  document
    .querySelectorAll(".categories button")
    .forEach(btn => {

      btn.classList.remove("active");

    });

  boton.classList.add("active");


  /*
  Cambiar título
  */

  document.getElementById("tituloCategoria").textContent =
    nombres[categoria];


  /*
  Filtrar noticias
  */

  let resultado;


  if (categoria === "todos") {

    resultado = noticias;

  } else {

    resultado =
      noticias.filter(noticia => {

        return noticia.categoria === categoria;

      });

  }


  /*
  Mostrar
  */

  const contenedor =
    document.getElementById("noticias");


  contenedor.innerHTML = "";


  resultado.forEach(noticia => {

    contenedor.innerHTML += `

      <article class="card">

        <div class="icono">
          ${noticia.icono}
        </div>

        <h3>
          ${noticia.titulo}
        </h3>

        <p>
          ${noticia.descripcion}
        </p>

        <span class="categoria">
          ${nombres[noticia.categoria]}
        </span>

      </article>

    `;

  });

}


/*
==================================================
CARGAR AL ABRIR
==================================================
*/

mostrar(
  "todos",
  document.querySelector(".categories button")
);

</script></body>
</html>
