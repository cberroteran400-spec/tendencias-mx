/* ==========================================
   NOMBRES DE LAS CATEGORÍAS

const nombres = {

    todos:"Últimas noticias de entretenimiento",

    cine_tv:"Noticias de Cine y TV",

    musica:"Noticias de Música",

    famosos:"Noticias de Famosos",

    videojuegos:"Noticias de Videojuegos",

    tendencias:"Tendencias de entretenimiento"

};


/* ==========================================
   MOSTRAR NOTICIAS
   ========================================== */

function mostrar(categoria, boton){

    const contenedor = document.getElementById("noticias");

    const titulo = document.getElementById("titulo");

    const contador = document.getElementById("contador");


    let filtradas;

    if(categoria === "todos"){

        filtradas = noticias;

    }else{

        filtradas = noticias.filter(
            noticia => noticia.categoria === categoria
        );

    }


    titulo.textContent = nombres[categoria];

    contador.textContent =
        filtradas.length +
        (filtradas.length === 1 ? " noticia" : " noticias");


    contenedor.innerHTML = "";


    if(filtradas.length === 0){

        contenedor.innerHTML = `
            <div class="vacio">
                No hay noticias en esta categoría todavía.
            </div>
        `;

        return;
    }


    filtradas.forEach(noticia => {

        const tarjeta = document.createElement("article");

        tarjeta.className = "card";


        tarjeta.innerHTML = `

            <div class="card-img">
                <img
                    src="${noticia.imagen}"
                    alt="${noticia.titulo}"
                    loading="lazy"
                    onerror="this.style.display='none'; this.parentElement.innerHTML='📰';"
                >
            </div>

            <div class="card-contenido">

                <span class="categoria">
                    ${nombreCategoria(noticia.categoria)}
                </span>

                <h3>
                    ${noticia.titulo}
                </h3>

                <p>
                    ${noticia.descripcion}
                </p>

                <p style="font-size:12px;color:#73818e;">
                    ${noticia.fuente} · ${noticia.fecha}
                </p>

                <a
                    href="${noticia.url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Leer noticia
                </a>

            </div>

        `;


        contenedor.appendChild(tarjeta);

    });


    document
        .querySelectorAll(".menu button")
        .forEach(b => b.classList.remove("activo"));


    boton.classList.add("activo");

}


/* ==========================================
   NOMBRE VISIBLE DE CATEGORÍA
   ========================================== */

function nombreCategoria(categoria){

    const nombresCategorias = {

        cine_tv:"🎬 Cine y TV",

        musica:"🎵 Música",

        famosos:"⭐ Famosos",

        videojuegos:"🎮 Videojuegos",

        tendencias:"🔥 Tendencias"

    };

    return nombresCategorias[categoria] || "";

}


/* ==========================================
   CARGAR TODAS AL ENTRAR
